ep to the uncus, anterior to the inferior horn tip."],["The stria terminalis runs from the amygdala alongside the thalamostriate vein",1,"The stria terminalis runs in the groove between caudate and thalamus with the thalamostriate vein, to the septal area and hypothalamus."],["The hippocampus forms the floor of the inferior horn of the lateral ventricle",1,"It forms the floor (medial part) of the inferior horn."],["The mammillothalamic tract projects to the medial dorsal nucleus of the thalamus",0,"It projects to the anterior thalamic nucleus."]]},{"id":"cns-68780c53","r":"cns","t":"Meninges and spaces","y":2,"d":1,"s":"Regarding the subarachnoid cisterns:","o":[["The pontine cistern contains the vertebral arteries",0,"Last's: the pontine cistern contains the basilar artery and nerves V to XII. The vertebral arteries and PICA lie in the lateral part of the cisterna magna."],["The interpeduncular cistern contains the anterior communicating artery",0,"The anterior communicating artery lies in the chiasmatic cistern. The interpeduncular cistern holds the posterior circle, the pituitary stalk and nerves III and IV."],["The cisterna magna receives CSF from the lateral apertures",0,"It receives CSF from the median aperture. The lateral apertures open into the pontine cistern."],["The cerebellomedullary cistern can be entered by a needle passed through the posterior atlanto-occipital membrane",1,"Cisternal puncture, in the midline, through the membrane and spinal dura."]],"k":"D"},{"id":"cns-62401d92","r":"cns","t":"Cranial nerve nuclei","y":1,"d":1,"s":"Concerning the trigeminal nuclei:","o":[["The mesencephalic nucleus contains the cell bodies of primary proprioceptive neurones",1,"Unusually, these are primary sensory neurones lying within the CNS, carrying proprioception from the muscles of mastication and periodontal ligaments."],["The spinal nucleus extends down into the upper cervical cord",1,"It extends to about C2 or C3, continuous with the substantia gelatinosa."],["Pain and temperature from the face relay in the principal (chief) sensory nucleus",0,"Pain and temperature relay in the spinal nucleus (pars caudalis). The principal nucleus serves discriminative touch."],["The motor nucleus lies in the pons medial to the principal sensory nucleus",1,"The motor nucleus lies medial to the principal sensory nucleus in the mid pons."]]},{"id":"cns-86307f19","r":"cns","t":"Cranial nerve nuclei","y":2,"d":1,"s":"The nucleus ambiguus supplies motor fibres to the:","o":[["Stylopharyngeus via the glossopharyngeal nerve",1,"The cranial-most part of the nucleus ambiguus supplies stylopharyngeus via IX."],["Intrinsic muscles of the larynx via the vagus",1,"The intrinsic laryngeal muscles are supplied via the recurrent and external laryngeal nerves."],["Muscles of the soft palate except tensor veli palatini",1,"Via the pharyngeal plexus (vagus and cranial accessory)."],["Striated muscle of the upper oesophagus via the vagus",1,"Last's: the upper part of the nucleus serves the palate, the middle part the pharynx and oesophagus, the lowest part the larynx."]],"k":"E"},{"id":"cns-a57a3c87","r":"cns","t":"Cranial nerve nuclei","y":2,"d":1,"s":"The nucleus of the tractus solitarius receives:","o":[["Taste fibres from the anterior two-thirds of the tongue via the facial nerve",1,"Taste via chorda tympani, cell bodies in the geniculate ganglion."],["Taste fibres from the posterior third of the tongue via the glossopharyngeal nerve",1,"Cell bodies in the inferior ganglion of IX."],["Visceral afferents from the carotid sinus via the glossopharyngeal nerve",1,"Baroreceptor and chemoreceptor input via the carotid sinus nerve."],["Visceral afferents from the thoracic and abdominal viscera via the vagus",1,"General visceral afferents from the vagus end in the caudal part of the nucleus."]],"k":"E"},{"id":"cns-d4860c49","r":"cns","t":"Development of the nervous system","y":1,"d":1,"s":"Regarding myelination and development:","o":[["In the central nervous system, myelin is formed by oligodendrocytes",1,"One oligodendrocyte myelinates segments of many axons."],["In peripheral nerves, myelin is formed by satellite cells",0,"Peripheral myelin is formed by Schwann cells (neurolemmocytes). Satellite cells surround neurones in ganglia."],["The corticospinal tracts are fully myelinated at birth",0,"Corticospinal tracts are not fully myelinated at birth. Myelination continues during the first two years, which explains the extensor plantar response in infancy."],["Microglia are the phagocytic cells of the CNS",1,"Microglia are of mesodermal (monocyte) origin and act as CNS macrophages."]]},{"id":"cns-a8e2c534","r":"cns","t":"Pineal and epithalamus","y":2,"d":1,"s":"Concerning the epithalamus:","o":[["The pineal gland frequently calcifies in adults",1,"Last's: corpora amylacea calcify, and after about 40 years they normally cast a shadow on skull radiographs. A displaced pineal indicates a supratentorial mass."],["The habenular nuclei receive fibres through the stria medullaris thalami",1,"The stria medullaris thalami carries fibres from the septal area to the habenula."],["The habenulointerpeduncular tract (fasciculus retroflexus) projects to the interpeduncular nucleus",1,"It projects from the habenula to the interpeduncular nucleus of the midbrain."],["The pineal gland lies above the posterior commissure and below the splenium",1,"The pineal lies in the posterior wall of the third ventricle, below the splenium, with the posterior commissure in its lower lamina."]],"k":"E"},{"id":"gp-896670bd","r":"gp","t":"Tissues","y":1,"d":1,"s":"Concerning the basic tissues (Last's chapter 1):","o":[["Sweat glands are supplied by cholinergic fibres in sympathetic nerves",1,"Sudomotor fibres are sympathetic but cholinergic."],["Sweat glands are absent from the lip margins, nipples and glans penis",1,"Also from the tympanic membrane, inner prepuce and labia minora, where sebaceous glands are present instead."],["Elastic cartilage is found in the epiglottis and auditory tube",1,"And the external ear."],["Hyaline cartilage has a rich blood supply",0,"Last's: only fibrocartilage has a (sparse) blood supply. Hyaline and elastic cartilage rely on diffusion."]]},{"id":"gp-fbcfa0de","r":"gp","t":"Tissues","y":2,"d":1,"s":"The panniculus carnosus in man is represented by:","o":[["Platysma and the muscles of the scalp and face",1,"Last's."],["Palmaris brevis",1,"Last's."],["Dartos of the scrotum",1,"Also corrugator cutis ani and the subareolar muscle of the nipple."],["Corrugator cutis ani",1,"Last's list also includes the subareolar muscle of the nipple."]],"k":"E"},{"id":"gp-978bef2b","r":"gp","t":"Joints","y":1,"d":1,"s":"Regarding joints:","o":[["The spheno-occipital joint is a primary cartilaginous joint",1,"A synchondrosis that ossifies at about 25 years."],["Intervertebral discs are secondary cartilaginous joints",1,"Symphyses, typically midline."],["The first sternochondral joint is a synovial joint",0,"It is a primary cartilaginous joint."],["Articular discs are found in the sternoclavicular and temporomandibular joints",1,"Where congruity is low. Also the menisci of the knee."]]},{"id":"gp-8fb2dc29","r":"gp","t":"Joints","y":2,"d":1,"s":"Hilton's law states that the nerve to a muscle tends to supply:","o":[["The joint moved by that muscle",1,"Last's."],["The skin over the joint",1,"Last's."],["The muscle itself",1,"The motor nerve gives branches to the joint and overlying skin."],["The periosteum deep to the muscle",0,"Not part of Hilton's law as stated by Last's."]],"k":"C"},{"id":"gp-6c3b14a7","r":"gp","t":"Bone","y":1,"d":1,"s":"Concerning bone:","o":[["The periosteum does not cover articular surfaces of synovial joints",1,"Last's."],["Subcutaneous periosteum is supplied by the nerve of the overlying skin",1,"Deeper periosteum is supplied by nerves to nearby muscles."],["Secondary cartilage develops in the head of the mandible and ends of the clavicle",1,"Last's: in certain growing membrane bones. Not related to secondary cartilaginous joints."],["Sesamoid bones are constantly present in the tendon of flexor pollicis longus",0,"Last's: constant sesamoids are the patella and those in adductor pollicis, flexor pollicis brevis and flexor hallucis brevis."]]},{"id":"gp-75a3937d","r":"gp","t":"Blood vessels and lymphatics","y":2,"d":1,"s":"Veins without valves include the:","o":[["Superior and inferior venae cavae",1,"Last's list."],["Dural venous sinuses and veins of the head and neck",1,"Including the ophthalmic veins."],["Vertebral venous plexuses",1,"A route for metastatic spread."],["Portal vein and its tributaries",1,"Also hepatic, cardiac, pulmonary and pelvic veins."]],"k":"E"},{"id":"gp-49a2ac0e","r":"gp","t":"Peripheral nerves","y":1,"d":1,"s":"Regarding peripheral nerves:","o":[["In the sciatic nerve about 80% of the cross-section is connective tissue",1,"BSE notes after Last's."],["The median nerve has its own artery from the anterior interosseous artery",1,"And the sciatic from the inferior gluteal."],["Group C fibres are thinly myelinated preganglionic autonomic fibres",0,"Group B are preganglionic autonomic (myelinated). Group C are unmyelinated postganglionic autonomic and slow pain fibres."],["About 40% of the fibres in a nerve to a limb muscle are afferent",1,"Last's."]]},{"id":"gp-756732aa","r":"gp","t":"Spinal nerves and rami","y":2,"d":1,"s":"Concerning the posterior (dorsal) rami:","o":[["In the upper half of the body the medial branches reach the skin",1,"Down to about T6. Below this the lateral branches do."],["The posterior rami of C7, C8, L4 and L5 have no cutaneous branches",1,"Nor does C1."],["No posterior ramus supplies skin or muscle of a limb",1,"Last's."],["The cutaneous territory of posterior rami extends to the posterior axillary line",0,"Last's: it extends beyond the extensor muscles but does not reach the posterior axillary lines."]],"k":"C"},{"id":"gp-0f90e2f1","r":"gp","t":"Body wall nerves","y":1,"d":1,"s":"Regarding the general plan of body wall innervation:","o":[["Where a spinal nerve and segmental artery cross, the nerve lies nearer the skin",1,"Last's."],["The neurovascular plane lies between the middle and innermost muscle layers",1,"In both thorax and abdomen."],["The most caudal root of a limb plexus is distributed entirely to the extensor compartment",0,"It goes entirely to the flexor compartment (T1 in the brachial, S3 in the sacral plexus), showing the richer flexor supply."],["Limb buds grow out from the lateral strip supplied by lateral branches of anterior rami",1,"Their anterior divisions supply flexors, posterior divisions extensors."]]},{"id":"gp-c9faacf0","r":"gp","t":"Body wall nerves","y":2,"d":1,"s":"Muscles with double innervation because of migration between compartments include:","o":[["Deltoid (axillary and suprascapular)",0,"Deltoid is supplied by the axillary nerve alone."],["Brachialis (lateral part supplied by the radial nerve)",1,"Last's: the lateral part developed in the extensor compartment."],["Rectus femoris (femoral and obturator)",0,"Rectus femoris is supplied by the femoral nerve only."],["Short head of biceps femoris (common peroneal)",1,"Last's: it migrated from the extensor compartment, so its supply differs from the long head (tibial)."]],"k":"B"},{"id":"gp-a6edd7f2","r":"gp","t":"Dermatomes and segments","y":1,"d":1,"s":"Concerning Last's rules of segmental innervation of muscles:","o":[["Muscles sharing a primary action on a joint are supplied by the same segments",1,"Usually two."],["Their opponents are supplied by segments running in numerical sequence with these",1,"E.g. elbow flexion C5/6, extension C7/8."],["For a more distal joint the spinal centre lies one segment lower",1,"Last's."],["Most upper limb muscles are supplied equally by three segments",0,"Most muscles are supplied equally by two adjacent segments. Some upper limb muscles are predominantly unisegmental."]]},{"id":"gp-7f3099ac","r":"gp","t":"Reflexes","y":2,"d":1,"s":"Concerning reflexes:","o":[["The plantar reflex becomes flexor during the second year",1,"Under one year an extensor response is normal."],["Exaggerated tendon reflexes in upper motor neurone lesions reflect release of the fusimotor loop",1,"Loss of supraspinal (reticulospinal, vestibulospinal) control makes gamma motor neurones over-excitable."],["The abdominal reflexes are lost in upper motor neurone lesions",1,"Beevor's sign indicates weakness below the umbilicus."],["The anal reflex is a monosynaptic stretch reflex",0,"Last's: plantar, abdominal, anal and bulbocavernosus are multisynaptic cutaneous reflexes."]],"k":"C"},{"id":"gp-5b0d6632","r":"gp","t":"Pharyngeal arches","y":1,"d":1,"s":"Derivatives of the first pharyngeal arch include:","o":[["The malleus and incus",1,"From Meckel's cartilage."],["The sphenomandibular ligament and lingula",1,"The anterior ligament of the malleus too."],["The mandible, formed by ossification of Meckel's cartilage",0,"Last's: the mandible and maxilla ossify in membrane, not from Meckel's cartilage."],["Tensor tympani and tensor veli palatini",1,"Supplied by the mandibular nerve."]]},{"id":"gp-5f5826ab","r":"gp","t":"Pharyngeal arches","y":2,"d":1,"s":"Derivatives of the second pharyngeal arch include:","o":[["Stapes",1,"Second arch cartilage."],["Styloid process and stylohyoid ligament",1,"Their lengths vary inversely."],["Lesser horns and upper body of the hyoid",1,"Third arch: greater horns and lower body."],["Stapedius and posterior belly of digastric",1,"Supplied by the facial nerve."]],"k":"E"},{"id":"gp-17bbed9a","r":"gp","t":"Pharyngeal pouches","y":1,"d":1,"s":"Concerning the pharyngeal pouches:","o":[["The third pouch forms the inferior parathyroid and the thymus",1,"Hence the inferior parathyroid descends with the thymus and may be found in the mediastinum."],["The fourth pouch forms the superior parathyroid",1,"Last's."],["The fifth pouch forms the ultimobranchial body, giving the parafollicular cells",1,"Last's."],["The second pouch forms the auditory tube",0,"The first pouch forms the auditory tube, middle ear and mastoid antrum. The second pouch forms the tonsillar crypts and supratonsillar fossa."]]},{"id":"gp-5a08b8e0","r":"gp","t":"Aortic arches","y":2,"d":1,"s":"Regarding the aortic arch arteries:","o":[["The right fourth arch forms the proximal right subclavian artery",1,"The left fourth forms the arch of the aorta."],["The third arch forms part of the internal carotid artery",1,"So the carotid sinus is supplied by IX, the third arch nerve."],["The right recurrent laryngeal nerve hooks under the subclavian because the right fifth and dorsal sixth arches disappear",1,"Last's."],["The second arch artery persists as the stapedial artery in the adult",0,"Last's: the stapedial artery does not persist after birth."]],"k":"C"},{"id":"gp-13398c53","r":"gp","t":"Neural crest and early development","y":1,"d":1,"s":"Neural crest cells give rise to:","o":[["Posterior root ganglia",1,"Last's."],["Schwann cells",1,"Also satellite cells of ganglia."],["Chromaffin cells of the suprarenal medulla",1,"Last's."],["Oligodendrocytes",0,"Oligodendrocytes arise from the neural tube (neuroectoderm), not the neural crest."]]},{"id":"gp-a9c20e04","r":"gp","t":"Mesoderm","y":2,"d":1,"s":"Regarding the intraembryonic mesoderm:","o":[["Paraxial mesoderm forms somites giving sclerotome and myotome",1,"Sclerotome gives vertebrae and dura, myotome the body wall muscles."],["The intermediate cell mass gives the gonads and suprarenal cortex medially",1,"And the nephric systems laterally."],["Rathke's pouch arises from ectoderm cranial to the buccopharyngeal membrane",1,"It forms the adenohypophysis."],["The lateral plate is segmented",0,"Last's: the lateral plate remains unsegmented and gives the limb buds."]],"k":"C"},{"id":"gp-4840235b","r":"gp","t":"Septum transversum","y":1,"d":1,"s":"Concerning the septum transversum:","o":[["Its cranial part forms the pericardium and part of the diaphragm",1,"Last's."],["It is invaded by cervical myotomes, mainly the fourth",1,"Producing diaphragmatic muscle."],["Its caudal part is invaded by the developing liver",1,"Forming the ventral mesogastrium."],["It forms the oesophageal and vena caval openings",0,"Last's: the connective tissue around these openings comes from the oesophageal mesentery."]]},{"id":"gp-1fecf9ca","r":"gp","t":"Anatomy of the child","y":2,"d":1,"s":"In the newborn:","o":[["The foot is everted",0,"The foot is inverted at birth and gradually everts."],["The spinal cord ends at L1",0,"At birth it ends at L3, reaching L1/2 by about 20 years."],["The mastoid process is well developed",0,"It is absent at birth, leaving the emerging facial nerve unprotected."],["The internal ear, middle ear and mastoid antrum are fully developed",1,"Last's."]],"k":"D"},{"id":"gp-644977c0","r":"gp","t":"Anatomy of the child","y":1,"d":1,"s":"Concerning growth of the skull and face:","o":[["In the fetus the vertical height of the orbit equals that of the maxilla and mandible together",1,"In the adult it is a third, because of growth of the maxillary sinus and alveolar bone."],["The face elongates rapidly when the permanent teeth erupt from about 6 years",1,"Last's."],["In the newborn the mental foramen lies near the lower border of the mandible",1,"In the edentulous elderly it lies near the upper border."],["The two halves of the mandible are fused at birth",0,"They are separated by fibrous tissue at the symphysis and unite in the first year."]]},{"id":"gp-0cc70ca2","r":"gp","t":"Ossification","y":2,"d":1,"s":"Bones that ossify in membrane include the:","o":[["Clavicle",1,"Last's: skull vault, face and clavicle ossify in membrane."],["Bones of the skull vault",1,"Also the squamous and tympanic temporal."],["Tuberosity of each terminal phalanx",1,"Last's."],["Squamous and tympanic parts of the temporal bone",1,"Last's: the vault and these parts ossify in membrane, the petromastoid and styloid in cartilage."]],"k":"E"},{"id":"gp-e2c59b36","r":"gp","t":"Ossification","y":1,"d":1,"s":"Regarding ossification of the vertebrae:","o":[["Each vertebra ossifies from three primary centres, a centrum and two halves of the neural arch",1,"All are ossified by the eighth fetal week."],["The neurocentral junctions unite by about 7 years",1,"The laminae unite by about 2 years."],["The costal elements of cervical and lumbar vertebrae have separate primary centres",0,"Last's: they ossify by extension from the neural arch. An occasional centre in C7 or L1 gives a cervical or lumbar rib. Sacral costal elements do have centres."],["The tip of the dens has a secondary centre appearing at about 3 years and fusing at 12",1,"Last's."]]},{"id":"gp-9452aa16","r":"gp","t":"Ossification","y":1,"d":1,"s":"Concerning the axis:","o":[["It has five primary ossification centres",1,"Last's: lower part of the body, two for the halves of the arch and lateral parts, and two for the halves of the dens and upper body."],["It has no secondary ossification centres",0,"It has a secondary centre for the tip of the dens (appears about 3 years, fuses about 12) and an epiphyseal ring for the lower body (puberty, fuses about 25)."],["The dens and lateral parts unite with the body at about 3 years",1,"Last's."],["The dens transmits the weight of the skull to the axis",0,"Last's: the dens bears no weight. Weight passes through the superior articular facets beside it."]]},{"id":"hn-3f932e40","r":"hn","t":"Deep cervical fascia","y":1,"d":1,"s":"Concerning the prevertebral fascia:","o":[["It extends inferiorly to the body of T3, the lower limit of longus colli",1,"Last's: attached to the skull base in front of longus capitis and rectus capitis lateralis, it extends down to T3 and fades out laterally under trapezius."],["It is pierced by the four cutaneous branches of the cervical plexus",1,"Great auricular, lesser occipital, transverse cervical and supraclavicular nerves pierce it."],["The accessory nerve lies deep to it in the posterior triangle",0,"The accessory nerve, the posterior triangle lymph nodes, the subclavian and axillary veins and the cervical sympathetic trunk lie anterior to (superficial to) it."],["It is prolonged over the subclavian artery into the axilla as the axillary sheath",1,"The third part of the subclavian artery and the brachial plexus trunks lie behind it, so it is carried into the axilla. The subclavian vein lies in front and is free to dilate."]]},{"id":"hn-e6702c3c","r":"hn","t":"Deep cervical fascia","y":2,"d":1,"s":"The investing layer of deep cervical fascia:","o":[["Forms the floor of the posterior triangle",0,"It forms the roof. The floor is the prevertebral fascia over the muscles."],["Splits to enclose sternocleidomastoid and trapezius",1,"It also splits to form the parotid capsule and the suprasternal space."],["Is attached to the anterior tubercles of the cervical transverse processes",0,"That is the prevertebral fascia's attachment region. The investing layer attaches to the skull, mandible, hyoid, ligamentum nuchae and pectoral girdle."],["Is attached to the hyoid bone",1,"This draws sternocleidomastoid forward in a gentle convexity."]],"k":"B"},{"id":"hn-ddcfb5c3","r":"hn","t":"Pretracheal fascia and thyroid","y":1,"d":1,"s":"Regarding the pretracheal fascia and thyroid gland:","o":[["The pretracheal fascia is attached above to the hyoid bone and the oblique line of the thyroid cartilage",1,"It is limited by the infrahyoid strap muscles."],["The fascia is firmly attached to the thyroid gland only between the isthmus and the second to fourth tracheal rings",1,"Elsewhere the gland is loosely enclosed. This attachment makes the gland move with swallowing."],["Inferiorly the pretracheal fascia blends with the fibrous pericardium",1,"It passes behind the brachiocephalic veins to blend with the arch adventitia and fibrous pericardium."],["The sympathetic supply of the thyroid comes mainly from the inferior cervical ganglion",0,"Last's: sympathetic fibres reach the gland from the superior cervical ganglion (with the superior thyroid artery) and the middle cervical ganglion (with the inferior thyroid artery)."]]},{"id":"hn-03d0728b","r":"hn","t":"Carotid sheath","y":1,"d":1,"s":"Concerning the carotid sheath and its contents:","o":[["The vagus nerve lies between and behind the internal jugular vein and the carotid artery",1,"It remains in the gutter between artery and vein throughout the neck."],["The ansa cervicalis is embedded in the anterior wall of the sheath",1,"It lies in front of the internal jugular vein."],["The cervical sympathetic trunk lies within the sheath, medial to the vagus",0,"The sympathetic trunk lies behind the sheath, outside it, on the prevertebral fascia."],["The thoracic duct arches behind the left internal jugular vein at the level of C7",1,"It then descends to the junction of the internal jugular and subclavian veins."]]},{"id":"hn-b9c5aed4","r":"hn","t":"Internal jugular vein","y":2,"d":1,"s":"Tributaries of the internal jugular vein include the:","o":[["Inferior thyroid vein",0,"The inferior thyroid veins drain into the brachiocephalic veins."],["Facial vein",1,"Facial, lingual and superior thyroid veins usually join near the tip of the greater horn of the hyoid."],["Vertebral vein",0,"The vertebral vein drains into the brachiocephalic vein at the root of the neck."],["Inferior petrosal sinus",1,"Last's: it is the first (highest) tributary, joining just below the skull base."]],"k":"B"},{"id":"hn-b7e4dec7","r":"hn","t":"External carotid artery","y":1,"d":1,"s":"Regarding the external carotid artery:","o":[["It gives three branches from its front, two from behind and one from its medial side before entering the parotid",1,"Front: superior thyroid, lingual, facial. Behind: occipital, posterior auricular. Medial: ascending pharyngeal."],["It is separated from the internal carotid by the styloid process, stylopharyngeus and the glossopharyngeal nerve",1,"Also by the stylohyoid ligament, the pharyngeal branch of the vagus and the deep part of the parotid."],["The hypoglossal nerve crosses it deep to the internal jugular vein's facial tributary",1,"The hypoglossal nerve runs superficial to the arteries but deep to the veins (facial vein)."],["It ends behind the neck of the mandible by dividing into the maxillary and facial arteries",0,"It divides in the parotid behind the neck of the mandible into the maxillary and superficial temporal arteries."]]},{"id":"hn-63b0dfe9","r":"hn","t":"Internal carotid artery in the neck","y":2,"d":1,"s":"The internal carotid artery in the neck:","o":[["Has no branches",1,"It gives no branches in the neck."],["Lies lateral to the external carotid at its origin",1,"Last's: it is external (lateral) at its origin, then slopes back to a medial, deeper level."],["Is crossed superficially by the hypoglossal nerve and the occipital artery",1,"Also by the lingual and facial veins, and higher up by the posterior belly of digastric and stylohyoid."],["Has the superior laryngeal nerve passing superficial to it",0,"The superior laryngeal nerve crosses obliquely behind (deep to) the ICA to reach its medial side, where it divides."]],"k":"C"},{"id":"hn-3c7339fb","r":"hn","t":"Carotid sinus and body","y":1,"d":1,"s":"Concerning the carotid sinus and carotid body:","o":[["The carotid sinus is a dilatation at the origin of the internal carotid artery",1,"Its thin wall contains baroreceptors."],["The carotid sinus is supplied by the glossopharyngeal nerve",1,"Via the carotid sinus nerve to the nucleus of the tractus solitarius."],["The carotid body lies behind the bifurcation of the common carotid artery",1,"It contains chemoreceptor glomus cells and is supplied by IX and X."],["The carotid body responds mainly to changes in blood pressure",0,"It is a chemoreceptor concerned with respiratory reflexes. The sinus is the baroreceptor."]]},{"id":"hn-ef26c9a3","r":"hn","t":"Posterior triangle","y":1,"d":1,"s":"Concerning the posterior triangle of the neck:","o":[["Its floor includes splenius, levator scapulae and the scalene muscles",1,"From above down: semispinalis capitis, splenius, levator scapulae, scaleni posterior, medius and anterior, and the first digitation of serratus anterior."],["The trunks of the brachial plexus lie behind the prevertebral fascia in its lower part",1,"Together with the third part of the subclavian artery."],["The cervical plexus lies within the posterior triangle",0,"Last's: the cervical plexus lies on scalenus medius under cover of the upper SCM and does not actually lie in the posterior triangle. Only its cutaneous branches emerge into it."],["The external jugular vein crosses it to pierce the investing fascia above the clavicle",1,"It then drains into the subclavian vein."]]},{"id":"hn-5e4477f0","r":"hn","t":"Cervical plexus","y":2,"d":1,"s":"Cutaneous branches of the cervical plexus and their roots:","o":[["Lesser occipital nerve, C3 and C4",0,"The lesser occipital is C2 (anterior ramus). It hooks around the accessory nerve."],["Great auricular nerve, C4 and C5",0,"The great auricular is C2 and C3, mainly C2."],["Transverse cervical nerve, from the posterior ramus of C3",0,"The transverse cervical nerve is from the anterior rami of C2 and C3 (cervical plexus). The third occipital nerve is the posterior ramus of C3."],["Supraclavicular nerves, C3 and C4",1,"Mainly C4. Medial, intermediate and lateral groups supply skin down to the sternal angle and over the shoulder to the scapular spine."]],"k":"D"},{"id":"hn-8da99e89","r":"hn","t":"Ansa cervicalis and infrahyoid muscles","y":1,"d":1,"s":"Regarding the ansa cervicalis:","o":[["Its superior root consists of C1 fibres carried by the hypoglossal nerve",1,"Formerly called the descendens hypoglossi."],["Its inferior root is formed from C2 and C3",1,"Formerly the descendens cervicalis. It spirals around the lateral side of the IJV."],["It supplies thyrohyoid",0,"Thyrohyoid and geniohyoid are supplied by C1 fibres directly from the hypoglossal nerve, not via the ansa."],["It supplies sternohyoid, omohyoid and sternothyroid",1,"Segmentally: sternohyoid and omohyoid C1 to C3, sternothyroid C2 and C3."]]},{"id":"hn-7f3a0797","r":"hn","t":"Root of the neck","y":1,"d":1,"s":"Concerning scalenus anterior and its relations:","o":[["The phrenic nerve descends on its anterior surface deep to the prevertebral fascia",1,"It is plastered to the muscle and crosses its obliquity from lateral to medial."],["The subclavian vein passes behind it",0,"The subclavian vein lies in front of the muscle, anterior to the prevertebral fascia. The second part of the subclavian artery and the plexus roots are behind it."],["It arises from the anterior tubercles of C3 to C6 and inserts on the scalene tubercle of the first rib",1,"It is supplied by C4 to C6."],["The transverse cervical and suprascapular arteries cross in front of it",1,"They lie in front of the prevertebral fascia, between the muscle and the carotid sheath."]]},{"id":"hn-6cb3d067","r":"hn","t":"Root of the neck","y":2,"d":1,"s":"The pyramidal space between longus colli and scalenus anterior:","o":[["Has the carotid tubercle of C6 at its apex",1,"Chassaignac's tubercle."],["Contains the vertebral artery and vein",1,"And the inferior cervical or stellate ganglion."],["Has as its base the subclavian artery and neck of the first rib",1,"With the suprapleural membrane between them."],["Is roofed by the investing layer of deep cervical fascia",0,"Last's: there is no fascial roof across the pyramidal space."]],"k":"C"},{"id":"hn-bab2a540","r":"hn","t":"Cervical sympathetic trunk","y":1,"d":1,"s":"Regarding the cervical sympathetic ganglia:","o":[["The superior cervical ganglion lies in front of the lateral masses of the atlas and axis",1,"It lies behind the carotid sheath, medial to the vertebral artery."],["The superior ganglion gives grey rami to C1 to C4",1,"Middle gives grey rami to C5 and C6, inferior to C7 and C8."],["The middle cervical ganglion lies medial to the carotid tubercle of C6, in front of the vertebral artery",1,"Last's: it is small and inconstant. The ansa subclavia passes in front of the subclavian artery to link it with the inferior (stellate) ganglion."],["The stellate ganglion lies on the neck of the first rib",1,"It lies on the front of the neck of the first rib. Lateral to it, from medial to lateral, lie the supreme intercostal vein, the superior intercostal artery and the anterior ramus of T1."]]},{"id":"hn-fc6f43f3","r":"hn","t":"Parotid region","y":1,"d":1,"s":"Concerning the parotid gland:","o":[["From superficial to deep, the facial nerve, retromandibular vein and external carotid artery lie within it",1,"The nerve is immediately superficial to the vein, which is a surgical guide."],["Its secretomotor fibres relay in the otic ganglion",1,"Inferior salivary nucleus, IX, tympanic branch, tympanic plexus, lesser petrosal nerve, otic ganglion, auriculotemporal nerve."],["Its fascia receives sensory fibres from the great auricular nerve",1,"The gland itself receives sensory fibres from the auriculotemporal nerve."],["The parotid duct pierces masseter to open opposite the upper second premolar",0,"The duct crosses masseter, turns around its anterior border and pierces buccinator to open opposite the upper second molar."]]},{"id":"hn-113d3da2","r":"hn","t":"Infratemporal fossa","y":1,"d":1,"s":"Regarding the maxillary artery:","o":[["It passes forward between the neck of the mandible and the sphenomandibular ligament",1,"The auriculotemporal nerve lies above it and the maxillary vein below."],["Its first-part branches all enter bony foramina",1,"Inferior alveolar, middle meningeal, accessory meningeal, deep auricular and anterior tympanic."],["The accessory meningeal artery is an important supply to the trigeminal ganglion",1,"Last's: it enters through foramen ovale and runs up the mandibular division to the ganglion."],["None of its branches pass through the petrotympanic fissure",0,"The anterior tympanic artery passes through the petrotympanic fissure to the middle ear. The deep auricular passes through the squamotympanic fissure region to the meatus."]]},{"id":"hn-a0e8ad3d","r":"hn","t":"Infratemporal fossa","y":2,"d":1,"s":"The sphenomandibular ligament:","o":[["Is attached to the spine of the sphenoid and the lingula",1,"It attaches to the lingula and inferior margin of the mandibular foramen."],["Is derived from the perichondrium of Meckel's cartilage",1,"First arch derivative."],["Is pierced by the nerve to mylohyoid",1,"The mylohyoid vessels groove the mandible here."],["Has the auriculotemporal nerve and maxillary artery passing between it and the neck of the mandible",1,"The inferior alveolar nerve and vessels pass between the ligament and the ramus."]],"k":"E"},{"id":"hn-0c5261f7","r":"hn","t":"Muscles of mastication","y":1,"d":1,"s":"Concerning the muscles of mastication:","o":[["The posterior fibres of temporalis are the only fibres that retract the mandible",1,"Last's: no other muscle retracts the condyle."],["The masseteric nerve passes through the mandibular notch above the lateral pterygoid",1,"It also supplies the TMJ (Hilton's law)."],["The buccal nerve is the only branch to pass between the two heads of lateral pterygoid",1,"It is sensory to the cheek. A middle deep temporal nerve may accompany it."],["Medial pterygoid is supplied by the anterior division of the mandibular nerve",0,"Medial pterygoid is supplied from the main trunk, which also gives the motor branch for the tensors."]]},{"id":"hn-27d44f21","r":"hn","t":"Temporomandibular joint","y":1,"d":1,"s":"Regarding the temporomandibular joint:","o":[["It is supplied by the auriculotemporal nerve and the nerve to masseter",1,"The auriculotemporal gives the major sensory supply (Hilton's law for masseter)."],["Its articular surfaces are covered with hyaline cartilage",0,"They are covered with fibrocartilage, because the mandible and squamous temporal ossify in membrane."],["The temporomandibular ligament is attached to the lateral surface of the articular tubercle",1,"It lies deep to the parotid fascia."],["It receives sensory branches from the facial nerve",0,"The facial nerve is motor here. Sensory supply is from V3 (auriculotemporal and masseteric)."]]},{"id":"hn-7876cfbd","r":"hn","t":"Pterygopalatine ganglion branches","y":1,"d":1,"s":"Regarding branches distributed through the pterygopalatine ganglion:","o":[["The nasopalatine nerve supplies the posteroinferior part of the nasal septum and the gum behind the incisors",1,"It passes through the sphenopalatine foramen, along the septum and through the incisive canal."],["The greater palatine nerve supplies the whole hard palate except the incisor gum",1,"It also supplies the posteroinferior lateral nasal wall."],["The lesser palatine nerves supply the soft palate and tonsil",1,"They emerge through the lesser palatine foramina."],["The pharyngeal branch passes through the vomerovaginal canal",0,"Last's: the pharyngeal nerve passes through the palatovaginal canal. The vomerovaginal canal transmits only a minute pharyngeal branch of the sphenopalatine artery."]]},{"id":"hn-4c773c31","r":"hn","t":"Nose","y":2,"d":1,"s":"The nerve supply of the lateral wall of the nasal cavity includes the:","o":[["Anterior ethmoidal nerve to the anterosuperior part",1,"It enters through the slit beside the crista galli."],["Anterior superior alveolar nerve to the anteroinferior part",1,"Last's: it reaches the anteroinferior quadrant, including the nasolacrimal duct."],["Lateral posterior superior nasal nerves to the posterosuperior part",1,"From the pterygopalatine ganglion through the sphenopalatine foramen."],["Nasociliary branches of the facial nerve to the vestibule",0,"The vestibule is supplied by branches of the infraorbital nerve that have crept in from the face."]],"k":"C"},{"id":"hn-04bc9cb2","r":"hn","t":"Pharynx","y":1,"d":1,"s":"Concerning the wall of the pharynx:","o":[["The pharyngobasilar fascia is attached to the pharyngeal tubercle and the petrous temporal bone in front of the carotid canal",1,"Then to the cartilaginous auditory tube and the medial pterygoid plate."],["The cartilaginous auditory tube enters the nasopharynx above the upper border of the superior constrictor",1,"It passes through the gap between the skull base and superior constrictor, with levator palati."],["Stylopharyngeus enters the pharynx between the middle and inferior constrictors",0,"Stylopharyngeus, IX and the lingual nerve pass through the gap between the superior and middle constrictors."],["The recurrent laryngeal nerve enters the larynx deep to the lower border of the inferior constrictor",1,"It passes just behind the cricothyroid joint with the inferior laryngeal vessels."]]},{"id":"hn-23208535","r":"hn","t":"Pharynx","y":2,"d":1,"s":"Muscles supplied by the pharyngeal plexus include:","o":[["Salpingopharyngeus",1,"All pharyngeal muscles except stylopharyngeus."],["Palatopharyngeus",1,"Motor fibres arise in the nucleus ambiguus and reach the vagus via the cranial accessory root."],["Levator veli palatini",1,"All palatal muscles except tensor veli palatini."],["The superior, middle and inferior constrictors",1,"Last's: cricopharyngeus may also receive fibres from the recurrent or external laryngeal nerve."]],"k":"E"},{"id":"hn-6d315014","r":"hn","t":"Palate","y":1,"d":1,"s":"Regarding tensor veli palatini:","o":[["It arises from the scaphoid fossa, the spine of the sphenoid and the cartilaginous auditory tube",1,"So it arises outside the pharynx, from bone at front and back and cartilage between."],["Its tendon turns around the pterygoid hamulus",1,"It passes above the fibrous origin of buccinator to become the palatine aponeurosis."],["It opens the auditory tube during swallowing",1,"Levator palati assists."],["It elevates the soft palate",0,"It tenses the aponeurosis so that other muscles can elevate (levator palati) or depress it."]]},{"id":"hn-73025515","r":"hn","t":"Tongue","y":1,"d":1,"s":"Concerning the development and innervation of the tongue:","o":[["Its muscles are derived from occipital myotomes, which explains the course of the hypoglossal nerve",1,"Their migration passes outside the carotids but deep to the jugular vein."],["The mucosa in front of the sulcus terminalis develops from the first arch",1,"Tuberculum impar and lateral lingual swellings, supplied by the lingual nerve and chorda tympani."],["The second arch contributes most of the posterior third",0,"Last's: the second arch is not represented. The third arch overgrows it, so IX supplies the posterior third, with a small fourth-arch area supplied by the internal laryngeal nerve near the vallecula."],["The foramen caecum marks the origin of the thyroglossal duct",1,"It lies at the apex of the sulcus terminalis."]]},{"id":"hn-5a6c1ae9","r":"hn","t":"Tongue","y":2,"d":1,"s":"Structures on the superficial (lateral) surface of hyoglossus include the:","o":[["Lingual nerve",1,"From above down on hyoglossus: lingual nerve, submandibular duct, hypoglossal nerve."],["Lingual artery",0,"The lingual artery lies deep to hyoglossus, with IX and the stylohyoid ligament."],["Stylohyoid ligament",0,"Last's: the stylohyoid ligament lies deep to hyoglossus, with IX and the lingual artery."],["Glossopharyngeal nerve",0,"IX passes deep to hyoglossus, at its posterior border."]],"k":"A"},{"id":"hn-58682e37","r":"hn","t":"Submandibular region","y":1,"d":1,"s":"Regarding the submandibular gland and duct:","o":[["The superficial and deep parts are continuous around the posterior border of mylohyoid",1,"The deep part lies between mylohyoid and hyoglossus."],["The facial artery grooves the posterior part of the superficial part",1,"It grooves the lateral surface, then hooks over the mandible in front of masseter."],["The duct is about 5 cm long and opens beside the frenulum",1,"It runs between mylohyoid and hyoglossus, then between the sublingual gland and genioglossus."],["The facial vein passes deep to the gland",0,"The facial vein, cervical branch of VII and (if low) the marginal mandibular branch cross the inferior (superficial) surface."]]},{"id":"hn-50d04d68","r":"hn","t":"Larynx","y":1,"d":1,"s":"Concerning the larynx:","o":[["Its mucosa above the vocal folds is supplied by the internal laryngeal nerve",1,"Below the folds it is the recurrent laryngeal nerve. Cell bodies of both are in the inferior vagal ganglion."],["The superior laryngeal artery is a branch of the superior thyroid artery",1,"It enters with the internal laryngeal nerve through the thyrohyoid membrane."],["Posterior cricoarytenoid is the only abductor of the vocal folds",1,"Supplied by the recurrent laryngeal nerve."],["The laryngeal cartilages derive from the second and third arches",0,"They derive from the fourth and sixth arches. Cricothyroid is from the fourth."]]},{"id":"hn-aaa9e621","r":"hn","t":"Larynx","y":2,"d":1,"s":"The recurrent laryngeal nerve:","o":[["Supplies all intrinsic laryngeal muscles except cricothyroid",1,"Cricothyroid is supplied by the external laryngeal nerve."],["Lies immediately behind the cricothyroid joint",1,"Last's: this is the joint with a nerve related to it."],["May divide into two branches before entering the larynx",1,"Last's: it is often double by the time it enters, having divided at about the upper border of the thyroid isthmus."],["Is non-recurrent on the right when there is an aberrant right subclavian artery",1,"With a retro-oesophageal right subclavian (1 to 2%), the right nerve passes directly to the larynx, a thyroidectomy hazard."]],"k":"E"},{"id":"hn-51da96b8","r":"hn","t":"Orbit","y":1,"d":1,"s":"Regarding the extraocular muscles:","o":[["Inferior oblique is the only extraocular muscle not arising from the back of the orbit",1,"It arises from the orbital floor, beside the nasolacrimal canal."],["The nerve to inferior oblique is the longest muscular nerve in the orbit",1,"It carries the parasympathetic root to the ciliary ganglion."],["Superior oblique turns the eye down and out",1,"It also intorts."],["Lateral rectus is supplied by the abducent nerve entering its orbital surface",0,"Last's: the nerves to the recti (and VI) enter the ocular surface of their muscles. Only the trochlear nerve enters its muscle from the orbital surface."]]},{"id":"hn-d65bff6f","r":"hn","t":"Orbit","y":2,"d":1,"s":"The ciliary ganglion:","o":[["Contains synapses of sympathetic fibres to the dilator pupillae",0,"Sympathetic fibres pass through without synapse, and dilator fibres travel mainly in the long ciliary nerves."],["Receives its parasympathetic root from the superior division of the oculomotor nerve",0,"The parasympathetic root comes from the nerve to inferior oblique (inferior division)."],["Sends sensory fibres to the conjunctiva",0,"Last's: its sensory fibres supply the eye, cornea, iris and ciliary body, but not the conjunctiva, which is supplied by the nerves of the overlying lid."],["Receives its sensory root from the nasociliary nerve",1,"These fibres pass through without relay."]],"k":"D"},{"id":"hn-e8e0b3ae","r":"hn","t":"Orbit","y":1,"d":1,"s":"Concerning the ophthalmic artery and veins:","o":[["The central retinal artery is the first and smallest branch of the ophthalmic artery",1,"Last's: it is also the most important. It is an end artery entering the inferomedial part of the nerve."],["The ophthalmic artery crosses above the optic nerve from lateral to medial",1,"It crosses with the nasociliary nerve and superior ophthalmic vein."],["The superior ophthalmic vein drains directly into the cavernous sinus",1,"It begins above the medial palpebral ligament, communicating with the angular vein."],["The inferior ophthalmic vein drains only into the cavernous sinus",0,"It drains much of its blood through the inferior orbital fissure into the pterygoid plexus."]]},{"id":"hn-4cf2c28a","r":"hn","t":"Ear","y":1,"d":1,"s":"Regarding the tympanic membrane:","o":[["It is set at about 55 degrees to the meatus, facing laterally, downwards and forwards",1,"The umbo is produced by the tip of the handle of malleus."],["Its outer surface is supplied by the auriculotemporal nerve and the auricular branch of the vagus",1,"Facial nerve fibres via the tympanic plexus may also reach it."],["Its inner surface is supplied by the tympanic branch of the glossopharyngeal nerve",1,"Via the tympanic plexus."],["The chorda tympani crosses lateral to the neck of the malleus",0,"The chorda crosses medial to the neck of the malleus, over the pars flaccida, under the mucous membrane."]]},{"id":"hn-3ec621a9","r":"hn","t":"Ear","y":2,"d":1,"s":"Concerning the auditory tube:","o":[["Its bony part is longer than its cartilaginous part",0,"The bony part is about 1 cm and the cartilaginous part about 2 cm, the reverse of the external acoustic meatus."],["The isthmus lies posteromedial to the spine of the sphenoid",1,"It is the narrowest part, at the junction of the bony and cartilaginous parts."],["It is derived from the second pharyngeal pouch",0,"It derives from the first pouch, with the middle ear and mastoid antrum."],["Its cartilaginous part is supplied by the meningeal branch of the mandibular nerve",1,"Last's: nervus spinosus to the cartilaginous part, tympanic plexus (IX) to the bony part, and the pharyngeal branch of the pterygopalatine ganglion at the ostium."]],"k":"B"},{"id":"hn-40f93f84","r":"hn","t":"Ear","y":1,"d":1,"s":"Regarding the mastoid antrum and suprameatal triangle:","o":[["The antrum lies about 15 mm deep to the suprameatal triangle",1,"The triangle is bounded by the suprameatal spine and upper and posterior tangents of the meatus."],["The antrum is present at birth",1,"The mastoid process and air cells develop later. Aeration begins in the second year."],["The lateral semicircular canal bulges into the medial wall of the aditus",1,"Just above the ridge of the facial canal."],["The roof of the antrum is formed by the squamous temporal bone",0,"The tegmen tympani of the petrous bone roofs the middle ear, antrum and canal for tensor tympani."]]},{"id":"hn-2f038176","r":"hn","t":"Scalp and face","y":1,"d":1,"s":"Concerning the scalp:","o":[["Its vessels and nerves run in the dense connective tissue layer",1,"Arteries are attached to the deep dermis, so wounds bleed freely."],["Occipitalis arises from the highest nuchal line",1,"Only occipitalis has a bony attachment. Frontalis arises from orbicularis oculi and skin."],["The greater occipital nerve is a branch of the anterior ramus of C2",0,"The greater occipital nerve is the posterior ramus of C2. The lesser occipital is the anterior ramus of C2."],["The supratrochlear and supraorbital arteries are branches of the internal carotid system",1,"They arise from the ophthalmic artery."]]},{"id":"hn-867f2326","r":"hn","t":"Scalp and face","y":1,"d":1,"s":"Regarding the sensory supply of the face:","o":[["The skin over the angle of the mandible is supplied by the great auricular nerve",1,"Last's: this is the only facial skin not supplied by the trigeminal nerve."],["The zygomaticofacial nerve supplies the hairless skin of the temple",0,"That is the zygomaticotemporal nerve. The zygomaticofacial supplies the skin over the zygomatic bone."],["The infraorbital nerve supplies the upper lip and labial gum to include the second premolar",1,"Midline to second premolar."],["The lower eyelid is supplied by the infratrochlear nerve",0,"The lower eyelid and its conjunctiva are supplied by the palpebral branches of the infraorbital nerve."]]},{"id":"hn-9c6655c5","r":"hn","t":"Face veins","y":1,"d":1,"s":"Concerning venous connections of the face with the cavernous sinus:","o":[["The angular vein connects via the superior ophthalmic vein",1,"One of the two routes bounding Last's danger area."],["The deep facial vein connects via the pterygoid plexus and emissary veins through foramen ovale",1,"And through the foramen of Vesalius if present."],["The danger area lies below the level of the deep facial vein",0,"Last's: the danger area (upper lip, nose and medial cheek) lies above the level of the deep facial vein, between the two communications."],["Retrograde thrombosis of the inferior petrosal sinus and medullary veins is usually fatal",1,"Last's: the ophthalmoplegia itself is not dangerous."]]},{"id":"hn-75f47b32","r":"hn","t":"Facial nerve branches","y":2,"d":1,"s":"Concerning the branches of the facial nerve to the face:","o":[["Division of the zygomatic branches crossing the zygomatic arch can endanger vision",1,"Inability to close the lids leads to corneal desiccation and ulceration."],["The marginal mandibular branch lies below the angle of the mandible in about 20%",1,"Relevant to submandibular incisions."],["The buccal branches supply buccinator",1,"Paralysis prevents emptying of the cheek pouch."],["The cervical branch supplies the posterior belly of digastric",0,"The cervical branch supplies platysma. The posterior belly of digastric is supplied by a branch given off just below the stylomastoid foramen."]],"k":"C"},{"id":"ll-9b432a06","r":"ll","t":"Lumbar plexus","y":1,"d":1,"s":"Concerning the lumbar plexus:","o":[["It forms within the substance of psoas major",1,"Most branches emerge laterally. The genitofemoral emerges anteriorly, and the obturator and lumbosacral trunk medially."],["The femoral nerve is formed from the posterior divisions of L2, L3 and L4",1,"The obturator nerve is from the anterior divisions."],["The accessory obturator nerve, when present, supplies pectineus",1,"Last's: from the posterior divisions of L3 and L4, present in about a third. It would better be called an accessory femoral nerve."],["The genitofemoral nerve emerges from the lateral border of psoas",0,"It emerges from the anterior surface of psoas and runs down on it, deep to the psoas fascia."]]},{"id":"ll-43cc75d2","r":"ll","t":"Lumbar plexus","y":2,"d":1,"s":"Regarding the genitofemoral nerve:","o":[["Its genital branch supplies cremaster",1,"It enters the coverings of the spermatic cord through the deep ring region."],["Its femoral branch supplies skin below the middle of the inguinal ligament",1,"It enters the femoral sheath in front of the femoral artery."],["It is crossed by the ureter and gonadal vessels",1,"On the left also by the left colic vessels and inferior mesenteric vein."],["It is motor to sartorius",0,"The femoral branch has no motor fibres. Sartorius is supplied by the femoral nerve."]],"k":"C"},{"id":"ll-ebeee22b","r":"ll","t":"Lateral femoral cutaneous nerve","y":1,"d":1,"s":"The lateral femoral cutaneous nerve:","o":[["Arises from the posterior divisions of L2 and L3 or from the femoral nerve",1,"Last's gives both possible origins."],["Enters the thigh about 1 cm medial to the anterior superior iliac spine",1,"In a tunnel behind or through the inguinal ligament."],["May be compressed to cause meralgia paraesthetica",1,"Also traction from transversus fibres arising from the iliac fascia."],["Supplies the skin of the medial thigh",0,"It supplies the anterolateral and lateral thigh."]]},{"id":"ll-da96e69e","r":"ll","t":"Femoral nerve","y":1,"d":1,"s":"Concerning the femoral nerve:","o":[["It enters the thigh lateral to the femoral sheath",1,"It lies in the gutter between psoas and iliacus, outside the sheath."],["It supplies iliacus within the abdomen",1,"By two or three branches."],["Its nerve to vastus medialis travels in the adductor canal and supplies the knee",1,"Hilton's law."],["The saphenous nerve crosses the femoral artery from medial to lateral in the adductor canal",0,"The saphenous nerve crosses the artery anteriorly from lateral to medial."]]},{"id":"ll-99602846","r":"ll","t":"Femoral triangle and adductor canal","y":2,"d":1,"s":"The adductor (subsartorial) canal contains the:","o":[["Femoral artery",1,"The artery always lies between the saphenous nerve and the femoral vein."],["Saphenous nerve",1,"It leaves the canal between sartorius and gracilis."],["Nerve to vastus medialis in its upper part",1,"Last's."],["Femoral vein",1,"Last's: the vein spirals from medial to the artery in the femoral triangle to lateral at the adductor hiatus."]],"k":"E"},{"id":"ll-0e3024a1","r":"ll","t":"Obturator nerve","y":1,"d":1,"s":"Regarding the obturator nerve:","o":[["It emerges from the medial border of psoas",1,"It crosses the pelvic brim medial to the sacroiliac joint."],["Its anterior division supplies adductor longus, brevis and gracilis",1,"And sometimes pectineus. It also supplies the hip joint."],["Its posterior division supplies the knee joint",1,"This explains referred knee pain in hip disease."],["Its posterior division supplies the ischial part of adductor magnus",0,"The posterior division supplies obturator externus and the adductor (pubic) part of adductor magnus. The ischial (hamstring) part is supplied by the tibial part of the sciatic nerve."]]},{"id":"ll-66e68740","r":"ll","t":"Sacral plexus","y":2,"d":1,"s":"Branches of the sacral plexus from posterior divisions include the:","o":[["Superior gluteal nerve",1,"L4, L5, S1."],["Nerve to quadratus femoris",0,"Last's: the nerve to quadratus femoris (L4, L5, S1) is from anterior divisions."],["Tibial part of the sciatic nerve",0,"The tibial part (L4 to S3) comes from anterior divisions."],["Pudendal nerve",0,"The pudendal nerve (S2 to S4) is from the anterior rami before division."]],"k":"A"},{"id":"ll-039b361e","r":"ll","t":"Gluteal region","y":1,"d":1,"s":"Concerning nerves of the gluteal region:","o":[["The superior gluteal nerve leaves the pelvis above piriformis",1,"It runs between gluteus medius and minimus and ends in tensor fasciae latae."],["The inferior gluteal nerve is L5, S1 and S2",1,"It supplies gluteus maximus."],["The nerve to obturator internus hooks around the base of the ischial spine",1,"Lateral to the pudendal vessels. It also supplies superior gemellus."],["The posterior femoral cutaneous nerve lies deep to the sciatic nerve",0,"Last's: the posterior femoral cutaneous nerve is superficial to the sciatic, and the nerve to quadratus femoris is deep to it."]]},{"id":"ll-6cd0fc91","r":"ll","t":"Sciatic nerve","y":1,"d":1,"s":"Regarding the sciatic nerve:","o":[["It emerges below piriformis, lateral to the inferior gluteal and pudendal bundles",1,"It lies on the ischium over the posterior part of the acetabulum."],["Its blood supply includes a branch of the inferior gluteal artery, a remnant of the axial artery",1,"Last's."],["The short head of biceps femoris is supplied by its tibial part",0,"The short head of biceps is supplied by the common peroneal part. All other hamstrings and the ischial part of adductor magnus are supplied by the tibial part."],["It may divide high, with the peroneal part piercing piriformis",1,"In this case the tibial part runs normally below the muscle."]]},{"id":"ll-a2f28210","r":"ll","t":"Common peroneal nerve","y":2,"d":1,"s":"The common peroneal nerve:","o":[["Divides behind the lateral femoral condyle",0,"It divides in the substance of peroneus longus, around the neck of the fibula."],["Gives rise to the sural nerve",0,"The sural nerve arises from the tibial nerve. The common peroneal gives the peroneal communicating nerve, which joins it."],["Supplies tibialis posterior",0,"Tibialis posterior is supplied by the tibial nerve."],["Gives the lateral cutaneous nerve of the calf",1,"It pierces the roof of the popliteal fossa over the lateral head of gastrocnemius."]],"k":"D"},{"id":"ll-b03a77c9","r":"ll","t":"Peroneal nerves","y":1,"d":1,"s":"Concerning the peroneal nerves:","o":[["The superficial peroneal nerve supplies peroneus longus and brevis",1,"It then perforates the deep fascia halfway down the leg."],["The deep peroneal nerve supplies extensor digitorum brevis",1,"And the skin of the first cleft."],["The deep peroneal nerve lies medial to the anterior tibial artery throughout the leg",0,"Last's: the deep peroneal nerve runs lateral to the anterior tibial vessels and lies lateral to dorsalis pedis on the foot."],["The superficial peroneal nerve supplies most of the dorsum of the foot",1,"Except the first cleft (deep peroneal) and the lateral border (sural)."]]},{"id":"ll-4663b88c","r":"ll","t":"Tibial nerve","y":1,"d":1,"s":"Regarding the tibial nerve:","o":[["It is the most superficial of the main structures in the popliteal fossa",1,"The popliteal vein always lies between the artery and the nerve."],["It supplies all the muscles arising in the popliteal fossa",1,"Including gastrocnemius, plantaris, soleus and popliteus."],["It divides into the medial and lateral plantar nerves deep to the flexor retinaculum",1,"Behind the medial malleolus."],["The medial calcanean nerve supplies the skin of the lateral border of the foot",0,"It supplies the weight-bearing skin of the heel. The sural nerve supplies the lateral border."]]},{"id":"ll-56bf0505","r":"ll","t":"Plantar nerves","y":2,"d":1,"s":"The medial plantar nerve supplies:","o":[["Adductor hallucis",0,"Adductor hallucis is supplied by the deep branch of the lateral plantar nerve."],["Flexor hallucis brevis",1,"Medial plantar: FDB, abductor hallucis, FHB and first lumbrical, like the median nerve in the hand."],["Flexor digiti minimi brevis",0,"Supplied by the superficial branch of the lateral plantar nerve."],["The first lumbrical",1,"The lateral three lumbricals are supplied by the deep branch of the lateral plantar nerve."]],"k":"B"},{"id":"ll-bcf39b50","r":"ll","t":"Popliteal fossa","y":2,"d":1,"s":"Structures piercing the roof of the popliteal fossa include the:","o":[["Tibial nerve",0,"The tibial nerve lies within the fossa, the most superficial of its main contents."],["Popliteal artery",0,"The artery is the deepest of the main contents, lying on the floor."],["Common peroneal nerve",0,"The common peroneal nerve runs along the lateral boundary medial to biceps. Its branches (lateral cutaneous nerve of the calf and peroneal communicating nerve) pierce the roof."],["Small saphenous vein",1,"Last's lists four structures piercing the roof: small saphenous vein, posterior femoral cutaneous nerve, peroneal communicating nerve and lateral cutaneous nerve of the calf."]],"k":"D"},{"id":"ll-58c42211","r":"ll","t":"Sural nerve","y":1,"d":1,"s":"The sural nerve:","o":[["Arises from the tibial nerve in the popliteal fossa",1,"It lies in the groove between the heads of gastrocnemius."],["Pierces the deep fascia halfway down the leg",1,"There it is joined by the peroneal communicating nerve."],["Lies medial to the small saphenous vein behind the medial malleolus",0,"It runs lateral to the small saphenous vein behind the lateral malleolus."],["Ends on the lateral side of the little toe",1,"It supplies the lateral border of the foot."]]},{"id":"ll-52e07ef4","r":"ll","t":"Lower limb myotomes","y":1,"d":1,"s":"Regarding the segmental supply of lower limb movements:","o":[["Hip flexion and adduction are L2 and L3",1,"Hip extension and abduction are L4 and L5."],["Knee extension is L3 and L4",1,"Knee flexion is L5 and S1."],["Ankle plantarflexion is S1 and S2",1,"Dorsiflexion is L4 and L5."],["Inversion of the foot is S1",0,"Inversion (tibialis anterior and posterior) is L4. Eversion is L5 and S1."]]},{"id":"ll-6fbc32db","r":"ll","t":"Lower limb myotomes","y":2,"d":1,"s":"Concerning nerve supply anomalies noted by Last:","o":[["Tibialis posterior is supplied by L4 although it is a plantarflexor",1,"It matches its inverting partner, tibialis anterior."],["Gluteus maximus and obturator internus are L5, S1 and S2",1,"Other buttock muscles are L4, L5 and S1."],["The short head of biceps femoris is supplied by the common peroneal part of the sciatic nerve",1,"It migrated from the extensor compartment."],["Pectineus may receive supply from both femoral and obturator nerves",1,"Pectineus, adductor magnus and biceps femoris all have dual supply."]],"k":"E"},{"id":"ll-b1975c74","r":"ll","t":"Lower limb dermatomes","y":1,"d":1,"s":"Regarding dermatomes of the lower limb:","o":[["L1 supplies the inguinal region and anterior scrotum",1,"Last's."],["L5 supplies the dorsum of the foot and great toe",1,"Also the lateral leg."],["S1 supplies the lateral border of the foot and sole",1,"And the lateral malleolus."],["S3 supplies the posterior thigh",0,"S2 supplies the posterior thigh and leg. S3 supplies the sitting area of the buttock and posterior scrotum."]]},{"id":"ll-ce556f1f","r":"ll","t":"Hip joint","y":1,"d":1,"s":"Concerning the hip joint:","o":[["The main blood supply to the femoral head in adults is from retinacular branches of the medial circumflex femoral artery",1,"The artery of the ligamentum teres is minor in adults."],["The iliofemoral ligament resists extension",1,"It is the strongest ligament in the body."],["It is supplied by the femoral, obturator and sciatic nerves",1,"Including the nerve to quadratus femoris."],["The neck of the femur ossifies from a separate epiphysis",0,"Last's: the neck is the upper end of the shaft and ossifies as part of it."]]},{"id":"ll-c4491357","r":"ll","t":"Knee joint","y":2,"d":1,"s":"The knee joint receives nerve supply from the:","o":[["Femoral nerve via the nerve to vastus medialis",1,"Last's (Hilton's law)."],["Genicular branches of the tibial and common peroneal nerves",1,"From the sciatic nerve."],["Posterior division of the obturator nerve",1,"Running with the femoral artery through the adductor hiatus."],["Saphenous nerve via its infrapatellar branch",1,"It supplies the front of the knee and patellar plexus."]],"k":"E"},{"id":"ll-78f83af9","r":"ll","t":"Ossification lower limb","y":1,"d":1,"s":"Regarding ossification in the lower limb:","o":[["The centre for the lower end of the femur appears at birth and is medicolegal evidence of maturity",1,"Last's."],["The fibula is exceptional in that its upper (growing) end ossifies later than its lower end",1,"Head at 4 years, lower end at 1 year."],["The cuboid ossifies at about 9 months of fetal life",1,"Its presence is also evidence of maturity."],["Most growth in length of the lower limb occurs at the hip",0,"Growth proceeds more rapidly at the knee than at the hip or ankle."]]},{"id":"ll-bdb6fe07","r":"ll","t":"Pelvic and lower limb vessels","y":2,"d":1,"s":"Concerning veins of the lower limb:","o":[["The great saphenous vein marks the preaxial border of the limb",1,"The small saphenous marks the postaxial border."],["The great saphenous vein passes in front of the medial malleolus with the saphenous nerve",1,"A site for venous cutdown."],["The femoral vein lies lateral to the femoral artery at the adductor hiatus",1,"Last's: it spirals from medial (in the triangle) to lateral (at the hiatus)."],["The small saphenous vein drains into the femoral vein",0,"It pierces the roof of the popliteal fossa to drain into the popliteal vein."]],"k":"C"},{"id":"sk-13e5a05c","r":"sk","t":"NSA sample question","y":1,"d":1,"src":"NSA sample","s":"The foramen rotundum","o":[["opens into the pterygopalatine fossa",1,"The maxillary nerve passes forward through it into the upper part of the pterygopalatine fossa."],["transmits the accessory meningeal artery",0,"The accessory meningeal artery enters through foramen ovale (Last's: its chief supply goes to the trigeminal ganglion)."],["transmits the maxillary division of the trigeminal nerve",1,"Its only significant content."],["lies medial to the anterior clinoid process",0,"It lies in the root of the greater wing below the medial end of the superior orbital fissure, inferolateral to the anterior clinoid process. Last's: the lateral wall of the cavernous sinus attaches at its lateral margin, so it lies outside the line of the sinus and clinoid. The optic canal is the opening medial to the clinoid."]]},{"id":"sk-5fb29587","r":"sk","t":"NSA sample question","y":1,"d":1,"src":"NSA sample","s":"The zygomatic bone articulates with the","o":[["frontal bone",1,"At the frontozygomatic suture, a palpable landmark."],["temporal bone",1,"Its temporal process meets the zygomatic process of the temporal bone in the arch."],["maxilla",1,"Via the zygomatic process of the maxilla, the anterior pillar of the arch."],["greater wing of the sphenoid",1,"In the lateral wall of the orbit. The zygomatic bone articulates with these four bones only."]]},{"id":"sk-b1a9a706","r":"sk","t":"Foramina of the middle cranial fossa","y":1,"d":1,"s":"Concerning the foramen rotundum:","o":[["It lies in the greater wing of the sphenoid, below the medial end of the superior orbital fissure",1,"Foramen rotundum pierces the root of the greater wing just below the medial end of the superior orbital fissure."],["It opens anteriorly into the pterygopalatine fossa",1,"The maxillary nerve passes forward through it into the upper part of the pterygopalatine fossa."],["It transmits the maxillary nerve and the middle meningeal artery",0,"Only the maxillary nerve (with small emissary veins). The middle meningeal artery passes through foramen spinosum."],["It transmits the nerve of the pterygoid canal",0,"The nerve of the pterygoid canal runs in the pterygoid canal, which lies below and medial to foramen rotundum."]]},{"id":"sk-f8109249","r":"sk","t":"Foramina of the middle cranial fossa","y":1,"d":1,"s":"Structures passing through the foramen ovale include the:","o":[["Lesser petrosal nerve",1,"The lesser petrosal nerve usually leaves through foramen ovale (sometimes through the small canaliculus innominatus) to reach the otic ganglion."],["Accessory meningeal artery",1,"The accessory meningeal artery, from the maxillary artery or middle meningeal artery, enters the skull through foramen ovale."],["Nervus spinosus",0,"The meningeal branch of the mandibular nerve arises below the skull and re-enters through foramen spinosum with the middle meningeal artery."],["Emissary vein connecting the cavernous sinus to the pterygoid plexus",1,"Emissary veins through foramen ovale connect the cavernous sinus with the pterygoid venous plexus."]]},{"id":"sk-c46b0060","r":"sk","t":"Foramina of the middle cranial fossa","y":2,"d":1,"s":"Regarding the foramen spinosum:","o":[["It lies posterolateral to the foramen ovale",1,"Foramen spinosum lies just posterolateral to foramen ovale, anteromedial to the spine of the sphenoid."],["It transmits the middle meningeal artery",1,"The middle meningeal artery, from the first part of the maxillary artery, enters the middle cranial fossa here."],["It transmits the meningeal branch of the mandibular nerve",1,"The nervus spinosus accompanies the artery back into the skull."],["It lies anteromedial to the spine of the sphenoid",1,"The spine of the sphenoid lies posterolateral to the foramen and gives attachment to the sphenomandibular ligament."]],"k":"E"},{"id":"sk-b3eb74da","r":"sk","t":"Zygomatic bone","y":1,"d":1,"s":"The zygomatic bone:","o":[["Articulates with the greater wing of the sphenoid",1,"Its frontal process articulates with the frontal bone and its orbital surface with the greater wing of the sphenoid, forming the lateral orbital wall."],["Articulates with the lacrimal bone",0,"The zygomatic bone articulates with four bones: frontal, sphenoid, temporal and maxilla. The lacrimal does not reach it."],["Transmits branches of the maxillary nerve through the zygomaticofacial and zygomaticotemporal foramina",1,"The zygomatic nerve, a branch of the maxillary nerve, divides into zygomaticofacial and zygomaticotemporal branches that pierce the bone."],["Gives attachment to the masseter muscle",1,"The superficial part of masseter arises from the zygomatic process of the maxilla and the lower border of the zygomatic arch."]]},{"id":"sk-6fb25346","r":"sk","t":"Jugular foramen","y":1,"d":1,"s":"Concerning the jugular foramen:","o":[["It lies between the petrous temporal bone and the occipital bone",1,"It lies at the posterior end of the petro-occipital fissure, between the jugular notches of the two bones."],["The inferior petrosal sinus passes through its anterior part",1,"The inferior petrosal sinus occupies the anterior compartment and joins the internal jugular vein just below the skull."],["The glossopharyngeal nerve passes through its posterior part with the sigmoid sinus",0,"Last's: two dural septa divide the foramen into three compartments. IX shares the anterior compartment with the inferior petrosal sinus (IX lies lateral to the sinus). X and XI occupy the middle compartment, and the large posterior compartment holds the jugular bulb (end of the sigmoid sinus)."],["The hypoglossal nerve passes through it",0,"The hypoglossal nerve leaves through its own hypoglossal canal, above the anterior part of the occipital condyle."]]},{"id":"sk-2fd8a4ac","r":"sk","t":"Internal acoustic meatus","y":1,"d":1,"s":"Regarding the internal acoustic meatus:","o":[["It transmits the facial nerve, the nervus intermedius and the vestibulocochlear nerve",1,"These three, together with the labyrinthine artery, enter the meatus."],["The facial nerve lies in the anterosuperior quadrant of the fundus",1,"At the fundus the transverse crest separates the upper facial and superior vestibular areas from the lower cochlear and inferior vestibular areas. The facial nerve is anterosuperior."],["The cochlear nerve lies in the posterosuperior quadrant",0,"The cochlear nerve is anteroinferior. The superior vestibular nerve is posterosuperior."],["The labyrinthine artery is most commonly a branch of the posterior inferior cerebellar artery",0,"Last's gives the labyrinthine artery as a branch of the basilar artery or of AICA, never of PICA."]]},{"id":"sk-9145c678","r":"sk","t":"Superior orbital fissure","y":2,"d":1,"s":"Structures passing through the superior orbital fissure within the common tendinous ring include the:","o":[["Nasociliary nerve",1,"The nasociliary nerve passes within the ring, between the two divisions of the oculomotor nerve."],["Abducent nerve",1,"The abducent nerve passes within the ring, inferolateral to the nasociliary nerve."],["Superior and inferior divisions of the oculomotor nerve",1,"Both divisions of III pass within the ring."],["Trochlear nerve",0,"The trochlear nerve passes above the ring with the frontal and lacrimal nerves, so it is not within it."]],"k":"C"},{"id":"sk-a7a279d8","r":"sk","t":"Optic canal","y":1,"d":1,"s":"The optic canal:","o":[["Lies between the two roots of the lesser wing of the sphenoid",1,"The canal is bounded by the body of the sphenoid medially and the two roots of the lesser wing."],["Transmits the ophthalmic artery, which lies above and medial to the optic nerve",0,"In the canal the ophthalmic artery lies below and lateral to the nerve, within the dural sheath."],["Transmits postganglionic sympathetic fibres",1,"Sympathetic fibres from the internal carotid plexus accompany the ophthalmic artery."],["Is separated from the sphenoidal sinus by bone that may be very thin",1,"The canal is related medially to the sphenoidal (and sometimes posterior ethmoidal) sinus, and the bony wall may be deficient."]]},{"id":"sk-b04bce0e","r":"sk","t":"Pterygopalatine fossa","y":1,"d":1,"s":"The pterygopalatine fossa communicates directly with the:","o":[["Nasal cavity through the sphenopalatine foramen",1,"The sphenopalatine foramen, in its medial wall, opens into the nasal cavity behind the middle meatus."],["Orbit through the inferior orbital fissure",1,"The apex of the inferior orbital fissure opens into the fossa."],["Oral cavity through the greater palatine canal",1,"The greater and lesser palatine canals lead down from the fossa to the palate."],["Posterior cranial fossa through the pterygoid canal",0,"The pterygoid canal opens posteriorly at the anterior wall of foramen lacerum in the middle cranial fossa, not the posterior cranial fossa."]]},{"id":"sk-e6ed0f58","r":"sk","t":"Pterion and surface anatomy","y":1,"d":1,"s":"Concerning the pterion:","o":[["It is the H-shaped junction of the frontal, parietal, squamous temporal bones and greater wing of the sphenoid",1,"These four bones meet at the pterion in the temporal fossa."],["It overlies the anterior branch of the middle meningeal artery",1,"The anterior (frontal) branch grooves, or tunnels through, the inner surface here, making it vulnerable to fracture and extradural haematoma."],["Its burr-hole site lies about 3 cm above the midpoint of the zygomatic arch, behind and above the frontozygomatic suture",1,"This is Last's surface marking for exposing the frontal branch of the middle meningeal artery (many other texts quote 4 cm). The frontozygomatic suture is the palpable landmark."],["It overlies the junction of the transverse and sigmoid sinuses",0,"That is the asterion, where the parietal, occipital and mastoid temporal bones meet."]]},{"id":"sk-c70db090","r":"sk","t":"Foramen magnum","y":2,"d":1,"s":"Structures passing through the foramen magnum include the:","o":[["Hypoglossal nerves",0,"The hypoglossal nerves leave through the hypoglossal canals."],["Vertebral arteries",1,"They pierce the posterior atlanto-occipital membrane and dura to enter the skull."],["Internal jugular veins",0,"The sigmoid sinus becomes the internal jugular vein at the jugular foramen."],["Spinal roots of the accessory nerves",1,"Last's: with the lower medulla, the spinal arteries and veins and the vertebral arteries."]],"k":"B"},{"id":"sk-826a1d33","r":"sk","t":"Petrous temporal bone","y":1,"d":1,"s":"On the anterior (cerebral) surface of the petrous temporal bone:","o":[["The arcuate eminence is produced by the superior semicircular canal",1,"The arcuate eminence is raised by the underlying superior (anterior) semicircular canal."],["The tegmen tympani forms the roof of the middle ear and mastoid antrum",1,"The thin tegmen tympani roofs the tympanic cavity and antrum and continues backward over the auditory tube canal."],["The hiatus for the greater petrosal nerve lies lateral to the hiatus for the lesser petrosal nerve",0,"The greater petrosal hiatus lies medial to (and in front of) the smaller hiatus for the lesser petrosal nerve."],["The trigeminal impression lies near the apex",1,"The trigeminal ganglion lies in a depression near the apex, within the trigeminal (Meckel's) cave."]]},{"id":"sk-79850ec7","r":"sk","t":"Foramen lacerum","y":1,"d":1,"s":"Regarding the foramen lacerum:","o":[["In life it is closed by dense fibrous tissue and transmits no major structure",1,"Last's: apart from minute emissary veins, no structure passes through the foramen lacerum from the cranial cavity to the exterior."],["The internal carotid artery passes vertically through it from the neck",0,"The internal carotid artery enters via the carotid canal and crosses the upper part of the foramen lacerum horizontally, then turns up into the cavernous sinus. It does not traverse the foramen from below."],["The greater and deep petrosal nerves unite here to form the nerve of the pterygoid canal",1,"They join in the foramen lacerum and enter the pterygoid canal in its anterior wall."],["Lies between the apex of the petrous temporal bone and the body and greater wing of the sphenoid",1,"These bones bound the foramen, with the basiocciput medially."]]},{"id":"sk-b0d96508","r":"sk","t":"Mandible","y":1,"d":1,"s":"Concerning the mandible:","o":[["The sphenomandibular ligament attaches to the lingula",1,"The lingula projects over the mandibular foramen and gives attachment to the sphenomandibular ligament, a remnant of Meckel's cartilage."],["The superior mental (genial) spines give origin to geniohyoid",0,"The superior genial tubercles give origin to genioglossus. Geniohyoid arises from the inferior tubercles."],["The lateral pterygoid inserts into the pterygoid fovea on the front of the neck of the mandible",1,"Last's: the two heads lie edge to edge and form a thick tendon into the pterygoid fovea, drawing the condyle and disc forward down the articular tubercle."],["In the adult the mental foramen lies midway between the upper and lower borders below the second premolar",1,"In the dentate adult it lies midway between the borders. In infants it is near the lower border, and in edentulous elderly near the upper border, after the alveolar margin is absorbed."]]},{"id":"sk-8ea0f799","r":"sk","t":"Hyoid bone","y":1,"d":1,"s":"The hyoid bone:","o":[["Gives attachment to the middle constrictor along the greater horn and lesser horn",1,"The middle constrictor arises from the upper border of the greater horn, the lesser horn and the lower part of the stylohyoid ligament."],["Has its lesser horns derived from the third pharyngeal arch",0,"The lesser horns and upper body come from the second arch. The greater horns and lower body come from the third."],["Is separated from the thyrohyoid membrane by a bursa",1,"The thyrohyoid membrane attaches to the upper border of the posterior body, and a bursa lies between membrane and the back of the body."],["Gives attachment to the stylohyoid ligament at the tip of the greater horn",0,"The stylohyoid ligament attaches to the lesser horn."]]},{"id":"sk-ad0225ea","r":"sk","t":"Neonatal skull","y":1,"d":1,"s":"In the skull of the newborn:","o":[["The mastoid process is absent and the facial nerve is relatively unprotected as it emerges from the stylomastoid foramen",1,"The mastoid process develops after the second year, so the emerging facial nerve lies superficially, covered only by fibres of sternocleidomastoid."],["The mastoid antrum is absent",0,"The internal ear, middle ear and mastoid antrum are fully developed at birth."],["The vault contains no cancellous diploe",1,"At birth the vault bones are a single layer of compact bone. The diploe develops later."],["The anterior fontanelle closes at about 18 months",1,"Last's: the anterior fontanelle closes at about 18 months and the posterior fontanelle by the end of the first year."]]},{"id":"sk-795c278b","r":"sk","t":"Neonatal skull","y":1,"d":1,"s":"Concerning the skull at birth:","o":[["The tympanic membrane is almost of adult size",1,"The tympanic membrane is nearly adult size but faces more downward."],["The mandibular fossa is deep and faces directly forward",0,"The fossa is shallow at birth and faces slightly laterally. It deepens and turns forward with development."],["The maxillary sinus is a narrow slit in the medial wall of the maxilla",1,"The sinus enlarges rapidly after the permanent teeth begin to erupt, at about 6 years."],["The two halves of the frontal bone are united by a fused metopic suture",0,"The frontal bone is in two halves at birth. Last's: the metopic suture usually unites in the second year, though it may persist."]]},{"id":"sk-a74bf5dc","r":"sk","t":"Anterior cranial fossa","y":1,"d":1,"s":"Regarding the anterior cranial fossa:","o":[["The falx cerebri attaches to the crista galli",1,"The anterior end of the falx attaches to the crista galli of the ethmoid."],["The anterior ethmoidal nerve crosses the cribriform plate before entering the nasal cavity beside the crista galli",1,"It enters the cranial cavity from the orbit through the anterior ethmoidal foramen, runs extradurally on the cribriform plate, then descends through a slit beside the crista galli."],["The foramen caecum may transmit an emissary vein from the nose to the superior sagittal sinus",1,"Last's: the foramen caecum is usually a blind pit plugged by the falx (a huge Sharpey's fibre). Only in about 1% does a patent vein connect nasal veins with the superior sagittal sinus."],["Its floor is formed entirely by the orbital plates of the frontal bone",0,"The floor is formed by the orbital plates of the frontal bone, the cribriform plate of the ethmoid, and the lesser wings and anterior body (jugum) of the sphenoid."]]},{"id":"sk-7fe9ce15","r":"sk","t":"Sphenoid and sella","y":1,"d":1,"s":"Concerning the sphenoid bone and sella turcica:","o":[["The tentorium cerebelli's free border attaches to the anterior clinoid process",1,"The free margin runs forward to the anterior clinoid process. The attached margin ends at the posterior clinoid process, so the two cross."],["The pituitary gland is separated from the sphenoidal sinus by the floor of the hypophysial fossa",1,"This relatio
