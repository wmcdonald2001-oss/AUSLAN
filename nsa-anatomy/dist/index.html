e pterygopalatine ganglion",1,"Taste, sympathetic and maxillary sensory fibres pass straight through. (Last's page pg 635-6)"],["Lacrimal fibres reach the gland via the nasociliary nerve",0,"Via the zygomatic nerve and then the lacrimal nerve. (Last's page pg 635-6)"],["The deep petrosal nerve joins the greater petrosal at the foramen ovale",0,"At foramen lacerum. (Last's page pg 635-6)"]]},{"id":"cn-45d4378a","r":"cn","t":"Facial nerve","y":1,"d":1,"src":"Last's text","s":"Branches of the facial nerve in the temporal bone:","o":[["Tympanic branches have their cell bodies in the geniculate ganglion",1,"Hence herpes vesicles may appear in the external meatus and tympanic membrane. (Last's page pg 636)"],["The chorda tympani leaves the facial nerve 6 mm below the stylomastoid foramen",0,"6 mm above the foramen, in the facial canal. (Last's page pg 636)"],["The chorda passes over the pars flaccida and neck of malleus",1,"Draped by mucous membrane. (Last's page pg 636)"],["The chorda tympani enters the middle ear through its anterior wall",0,"It enters through the posterior wall and leaves through the anterior wall. (Last's page pg 636)"]]},{"id":"cn-6db89620","r":"cn","t":"Facial nerve","y":1,"d":1,"src":"Last's text","s":"The chorda tympani:","o":[["Emerges at the medial end of the petrotympanic fissure",1,"Last's. (Last's page pg 636)"],["Grooves the medial side of the spine of the sphenoid",1,"Last's. (Last's page pg 636)"],["Joins the lingual nerve below the lower border of lateral pterygoid",0,"Just above the lower border, about 2 cm beneath the skull. (Last's page pg 636)"],["Contains fibres from both the motor root and the nervus intermedius",0,"All its fibres belong to the nervus intermedius. (Last's page pg 636)"]]},{"id":"cn-bc2ba04a","r":"cn","t":"Facial nerve","y":2,"d":1,"src":"Last's text","s":"Extracranial branches of the facial nerve include the nerve(s) to:","o":[["The occipital belly of occipitofrontalis",1,"The posterior auricular nerve. (Last's page pg 636)"],["The posterior belly of digastric",1,"Last's. (Last's page pg 636)"],["Stylohyoid",1,"Last's. (Last's page pg 636)"],["Platysma",1,"Via the five groups of terminal branches. (Last's page pg 636)"]],"k":"E"},{"id":"cn-d1fbb654","r":"cn","t":"Vestibulocochlear nerve","y":1,"d":1,"src":"Last's text","s":"The cochlear nerve:","o":[["Its first neuron is bipolar with its cell body at the base of the bony spiral lamina",1,"The spiral (cochlear) ganglion. (Last's page pg 636-7)"],["It pierces the dura at the anterosuperior quadrant of the internal meatus",0,"Anteroinferior quadrant. (Last's page pg 636-7)"],["The eighth nerve enters the inferior cerebellar peduncle at the lower border of the pons",1,"Last's. (Last's page pg 636-7)"],["The facial nerve lies behind the eighth nerve in the pontine cistern",0,"The nervus intermedius and facial nerve lie in front. (Last's page pg 636-7)"]]},{"id":"cn-4e8cf437","r":"cn","t":"Vestibulocochlear nerve","y":1,"d":1,"src":"Last's text","s":"Central cochlear pathways (Last's):","o":[["About 30 000 cochlear fibres relay in the dorsal and ventral cochlear nuclei",1,"In the inferior cerebellar peduncle. (Last's page pg 637)"],["Crossing fibres in the lower pons form the trapezoid body",1,"Then ascend as the lateral lemniscus. (Last's page pg 637)"],["Cochlear representation is largely contralateral",0,"It is largely bilateral. (Last's page pg 637)"],["The auditory radiation passes through the retrolentiform internal capsule",0,"It passes through the sublentiform part. (Last's page pg 637)"]]},{"id":"cn-47abac26","r":"cn","t":"Vestibulocochlear nerve","y":1,"d":1,"src":"Last's text","s":"Concerning the auditory pathway:","o":[["The inferior colliculus relays for reflex effects of sound",1,"Through tectobulbar and tectospinal tracts. (Last's page pg 637)"],["The medial geniculate body is a displaced hypothalamic nucleus",0,"It is a displaced thalamic nucleus, though anatomically in the midbrain. (Last's page pg 637)"],["The auditory cortex lies below and within the lateral sulcus",1,"Last's. (Last's page pg 637)"],["The pathway always has exactly three neurons",0,"There may be more, since the trapezoid body and lateral lemniscus contain cell bodies where fibres relay. (Last's page pg 637)"]]},{"id":"cn-3d57c2a6","r":"cn","t":"Vestibulocochlear nerve","y":1,"d":1,"src":"Last's text","s":"The vestibular nerve:","o":[["The maculae of utricle and saccule serve static balance",1,"The ampullae serve kinetic balance. (Last's page pg 637)"],["The nerve from the saccule emerges through the posterosuperior quadrant of the fundus",0,"The posteroinferior quadrant; the posterosuperior carries the utricle, anterior and lateral ducts. (Last's page pg 637)"],["The posterior ampullary nerve passes through the foramen singulare",1,"Last's. (Last's page pg 637)"],["The vestibular nerve contains about 30 000 fibres",0,"About 18 000; the cochlear has about 30 000. (Last's page pg 637)"]]},{"id":"cn-5068ccf6","r":"cn","t":"Vestibulocochlear nerve","y":1,"d":1,"src":"Last's text","s":"Vestibular connections (Last's):","o":[["The vestibular nuclei lie in the lateral angle of the fourth ventricle",1,"In both pons and medulla. (Last's page pg 637)"],["They connect with the archaeocerebellum",1,"Last's. (Last's page pg 637)"],["The vestibulospinal tract arises from the medial vestibular nucleus",0,"From the lateral vestibular nucleus. (Last's page pg 637)"],["Cortical connections relay through the lateral geniculate body",0,"Through the medial geniculate body (bilateral thalamic relay) to the auditory region. (Last's page pg 637)"]]},{"id":"cn-cb5984b7","r":"cn","t":"Glossopharyngeal nerve","y":1,"d":1,"src":"Last's text","s":"The glossopharyngeal nerve (Last's):","o":[["Is the nerve of the third branchial arch",1,"Last's. (Last's page pg 637)"],["Its branchial motor fibres supply only stylopharyngeus",1,"From the nucleus ambiguus. (Last's page pg 637)"],["Its secretomotor fibres arise from the superior salivary nucleus",0,"The inferior salivary nucleus, rostral to the dorsal nucleus of the vagus. (Last's page pg 637)"],["Ordinary sensation from the tongue and pharynx enters the nucleus of the tractus solitarius",0,"These enter the trigeminal sensory nuclei; taste and carotid afferents enter the tractus solitarius. (Last's page pg 637)"]]},{"id":"cn-20185c5a","r":"cn","t":"Glossopharyngeal nerve","y":1,"d":1,"src":"Last's text","s":"At the jugular foramen the glossopharyngeal nerve:","o":[["Enters the anterior compartment",1,"Last's. (Last's page pg 637)"],["Lies medial to the inferior petrosal sinus",0,"It lies lateral to the sinus. (Last's page pg 637)"],["Is separated from the vagus and accessory by a fibrous dural septum",1,"Last's. (Last's page pg 637)"],["Notches the inferior border of the petrous bone above the internal acoustic meatus",0,"Just below the meatus. (Last's page pg 637)"]]},{"id":"cn-658f2b9e","r":"cn","t":"Glossopharyngeal nerve","y":1,"d":1,"src":"Last's text","s":"Branches of the glossopharyngeal nerve:","o":[["The tympanic branch passes through the tympanic canaliculus",1,"To form the tympanic plexus. (Last's page pg 637-8)"],["The lesser petrosal nerve may leave through the petrosal foramen",1,"Or foramen ovale. (Last's page pg 637-8)"],["Its pharyngeal branches are motor to the constrictors",0,"They are afferent, not motor. (Last's page pg 637-8)"],["It has two muscular branches",0,"The nerve to stylopharyngeus is the only muscular branch. (Last's page pg 637-8)"]]},{"id":"cn-cd67d696","r":"cn","t":"Vagus nerve","y":1,"d":1,"src":"Last's text","s":"Nuclei of the vagus (Last's):","o":[["The nucleus ambiguus supplies all the skeletal muscle supplied by the vagus",1,"Pharynx, upper oesophagus, larynx and palate. (Last's page pg 638)"],["The dorsal motor nucleus lies beneath the hypoglossal trigone",0,"It lies below the vagal trigone. (Last's page pg 638)"],["The dorsal motor nucleus supplies cardiac and smooth muscle",1,"Of bronchi and gut. (Last's page pg 638)"],["The nucleus of the tractus solitarius receives the auricular branch fibres",0,"The auricular branch skin fibres go to the trigeminal sensory nuclei. (Last's page pg 638)"]]},{"id":"cn-42e95489","r":"cn","t":"Vagus nerve","y":1,"d":1,"src":"Last's text","s":"The vagus at the skull base:","o":[["Its rootlets lie between the olive and inferior cerebellar peduncle",1,"Below those of the glossopharyngeal. (Last's page pg 638)"],["It lies lateral to the accessory nerve in the jugular foramen",0,"It lies medial to the accessory. (Last's page pg 638)"],["It passes behind the jugular tubercle",1,"On the basiocciput. (Last's page pg 638)"],["The superior ganglion lodges cell bodies of the laryngeal sensory fibres",0,"The inferior ganglion holds all the other sensory fibres; the superior ganglion holds only meningeal and auricular. (Last's page pg 638)"]]},{"id":"cn-6d809b6d","r":"cn","t":"Vagus nerve","y":1,"d":1,"src":"Last's text","s":"Cervical branches of the vagus:","o":[["The pharyngeal branch passes between the internal and external carotid arteries",1,"It carries both motor and sensory fibres. (Last's page pg 638)"],["The superior laryngeal nerve passes superficial to the carotids",0,"It runs deep to the carotids. (Last's page pg 638)"],["The internal laryngeal nerve pierces the thyrohyoid membrane",1,"Last's. (Last's page pg 638)"],["The internal laryngeal nerve supplies cricothyroid",0,"The external laryngeal nerve supplies cricothyroid; the internal laryngeal is sensory to pharyngeal and laryngeal mucosa. (Last's page pg 638)"]]},{"id":"cn-54db98bd","r":"cn","t":"Vagus nerve","y":1,"d":1,"src":"Last's text","s":"The recurrent laryngeal nerves (Last's):","o":[["The right hooks under the subclavian artery",1,"Last's. (Last's page pg 638)"],["The left hooks round the ligamentum arteriosum",1,"Last's. (Last's page pg 638)"],["They pass under the inferior constrictor just in front of the cricothyroid joint",0,"Just behind the joint. (Last's page pg 638)"],["They supply laryngeal mucosa above the vocal folds",0,"Below the vocal folds. (Last's page pg 638)"]]},{"id":"cn-101af6ce","r":"cn","t":"Vagus nerve","y":1,"d":1,"src":"Last's text","s":"Vagal sensory and motor supply of the viscera:","o":[["Vagal branches to the gut do not carry pain fibres",1,"Pain fibres run with sympathetic fibres. (Last's page pg 638)"],["The vagus carries no pain from any viscera",0,"Last's: it is sensory to the thoracic viscera (oesophagus, trachea and lungs). (Last's page pg 638)"],["The vagal trunks enter the abdomen through the oesophageal opening",1,"Last's. (Last's page pg 638)"],["The vagal trunks supply the stomach from branches in the greater omentum",0,"From branches that arise in the lesser omentum. (Last's page pg 638)"]]},{"id":"cn-3f15f3a7","r":"cn","t":"Accessory nerve","y":1,"d":1,"src":"Last's text","s":"The accessory nerve (Last's):","o":[["The cranial root gives all its fibres to the vagus",1,"From the nucleus ambiguus. (Last's page pg 639)"],["The spinal root arises from the anterior horn of the upper two segments only",0,"From the upper five or six segments (mainly 2, 3 and 4). (Last's page pg 639)"],["Spinal accessory rootlets emerge behind the denticulate ligament",1,"From the lateral surface of the cord. (Last's page pg 639)"],["The spinal root passes under the upper tooth of the denticulate ligament",0,"It passes over the upper tooth. (Last's page pg 639)"]]},{"id":"cn-ecaf5cc1","r":"cn","t":"Accessory nerve","y":1,"d":1,"src":"Last's text","s":"The accessory nerve in the jugular foramen and neck:","o":[["It passes through the lateral part of the middle compartment",1,"Last's. (Last's page pg 639)"],["It lies just behind the jugular bulb",0,"The vagus and accessory lie just in front of the jugular bulb. (Last's page pg 639)"],["It lies on the internal jugular vein over the lateral mass of the atlas",1,"Last's. (Last's page pg 639)"],["In the posterior triangle it descends over scalenus medius",0,"It descends over levator scapulae. (Last's page pg 639)"]]},{"id":"cn-bccb2a6b","r":"cn","t":"Accessory nerve","y":2,"d":1,"src":"Last's text","s":"The cranial root of the accessory nerve:","o":[["Joins the spinal root in the posterior triangle",0,"They join hands only to pass through the jugular foramen. (Last's page pg 639)"],["Is effectively the motor root of the vagus",1,"To striated muscle only. (Last's page pg 639)"],["Supplies sternocleidomastoid",0,"The spinal root supplies sternocleidomastoid and trapezius. (Last's page pg 639)"],["Is analogous to the motor root of the trigeminal nerve",1,"Last's. (Last's page pg 639)"]],"k":"B"},{"id":"cn-181c7f52","r":"cn","t":"Hypoglossal nerve","y":1,"d":1,"src":"Last's text","s":"The hypoglossal nerve (Last's):","o":[["Its nucleus lies against the midline in the hypoglossal trigone",1,"Motor and somatic. (Last's page pg 639-40)"],["Its rootlets emerge between the olive and inferior cerebellar peduncle",0,"Between pyramid and olive. (Last's page pg 639-40)"],["It forms two roots in the canal, separated by a flange of dura that may ossify",1,"Last's. (Last's page pg 639-40)"],["It passes below the atlanto-occipital joint in the canal",0,"It passes forward above the joint. (Last's page pg 639-40)"]]},{"id":"cn-42a22189","r":"cn","t":"Hypoglossal nerve","y":1,"d":1,"src":"Last's text","s":"The extracranial hypoglossal nerve:","o":[["Spirals behind the inferior ganglion of the vagus",1,"Then behind and around the carotid arteries. (Last's page pg 639-40)"],["Lies on the occipital, internal carotid and lingual arteries below digastric",0,"On the occipital, external carotid and lingual arteries. (Last's page pg 639-40)"],["Is covered only by the facial vein beneath the investing fascia here",1,"Very near the skin. (Last's page pg 639-40)"],["Passes forward on hyoglossus superficial to mylohyoid",0,"It passes deep to mylohyoid, in the mouth. (Last's page pg 639-40)"]]},{"id":"cn-8b32b4b1","r":"cn","t":"Hypoglossal nerve","y":1,"d":1,"src":"Last's text","s":"Branches of the hypoglossal nerve:","o":[["Branches before the tongue are all from C1 fibres",1,"Joining at its exit from the skull. (Last's page pg 639-40)"],["The meningeal branch supplies dura of the anterior cranial fossa",0,"A ring of dura in the posterior fossa beyond the foramen magnum. (Last's page pg 639-40)"],["The nerve to thyrohyoid arises as the nerve lies on the lingual artery",1,"Last's. (Last's page pg 639-40)"],["The nerve to geniohyoid arises below mylohyoid",0,"Given off in the mouth above mylohyoid. (Last's page pg 639-40)"]]},{"id":"cn-fd0299c6","r":"cn","t":"Hypoglossal nerve","y":1,"d":1,"src":"Last's text","s":"The ansa cervicalis:","o":[["Its upper root branches off as the hypoglossal curves between the ICA and IJV",1,"Formerly the descendens hypoglossi. (Last's page pg 639-40)"],["Its lower root comes from C3 and C4",0,"From C2 and C3. (Last's page pg 639-40)"],["It lies in the anterior wall of the carotid sheath",1,"On the IJV under sternocleidomastoid. (Last's page pg 639-40)"],["Sternothyroid receives C1, C2 and C3",0,"Sternothyroid is C2, 3; sternohyoid and omohyoid C1, 2, 3. (Last's page pg 639-40)"]]},{"id":"cn-8b050ca3","r":"cn","t":"Oculomotor nerve","y":1,"d":1,"s":"Concerning the oculomotor nerve:","o":[["Its fibres pass through the red nucleus before emerging into the interpeduncular fossa",1,"Fibres run ventrally through the tegmentum and red nucleus, emerging on the medial side of the cerebral peduncle."],["Parasympathetic fibres reach the ciliary ganglion via the nerve to inferior oblique",1,"Preganglionic fibres from the Edinger-Westphal nucleus leave the inferior division in the branch to inferior oblique."],["It passes through the superior orbital fissure outside the common tendinous ring",0,"Both divisions pass within the tendinous ring."],["Pupillary fibres lie superficially in the nerve, so compression often dilates the pupil early",1,"Last's: pupillary fibres lie on the outer part of the nerve (first dorsal, then medial, then inferior). They are supplied by vessels of the nerve sheath, so they are affected by external pressure (PComm aneurysm) but spared by infarction of the trunk (diabetes)."]]},{"id":"cn-8dc9d463","r":"cn","t":"Oculomotor nerve","y":2,"d":1,"s":"A complete right oculomotor nerve palsy produces:","o":[["Loss of the corneal reflex on the right",0,"The corneal reflex depends on V1 (afferent) and VII (efferent), not III."],["Ptosis of the right upper eyelid",1,"Levator palpebrae superioris is paralysed. The superior tarsal muscle (sympathetic) partially compensates."],["Paralysis of the right lateral rectus",0,"Lateral rectus is supplied by VI. Unopposed lateral rectus and superior oblique leave the eye down and out."],["A dilated right pupil unreactive to light",1,"Loss of sphincter pupillae, with unopposed sympathetic dilator."]],"k":"B"},{"id":"cn-7e4ce59f","r":"cn","t":"Trochlear nerve","y":1,"d":1,"s":"The trochlear nerve:","o":[["Decussates in the superior medullary velum before emerging",1,"All its fibres cross dorsal to the aqueduct, so each nucleus supplies the contralateral superior oblique."],["Has the longest intracranial course of any cranial nerve",1,"Its long, slender course around the midbrain makes it vulnerable in head injury."],["Enters the orbit through the superior orbital fissure within the tendinous ring",0,"It passes above (outside) the ring, medial to the frontal nerve, and supplies superior oblique from above."],["When paralysed causes diplopia worst on looking down and medially",1,"Superior oblique is the principal depressor of the adducted eye. Patients have trouble reading and descending stairs and tilt the head to the opposite side."]]},{"id":"cn-cd8f3133","r":"cn","t":"Abducent nerve","y":2,"d":1,"s":"Concerning the abducent nerve:","o":[["Its nucleus lies deep to the facial colliculus in the pons",1,"The facial nerve fibres loop over it to form the colliculus."],["It passes beneath the petrosphenoidal ligament over the apex of the petrous temporal bone",1,"It runs through Dorello's canal, where it is vulnerable to raised intracranial pressure and petrous apex infection."],["It runs within the cavernous sinus lateral to the internal carotid artery",1,"Last's: it enters the back of the sinus from the inferior petrosal sinus beneath the petroclinoid ligament, runs lateral to and then below the ICA, and enters the tendinous ring below the inferior division of III."],["A lesion of its nucleus causes isolated paralysis of lateral rectus",0,"A nuclear lesion causes a horizontal gaze palsy to the side of the lesion, because the nucleus contains interneurones projecting via the MLF to the contralateral medial rectus subnucleus. A nuclear lesion often also involves the looping facial fibres."]],"k":"C"},{"id":"cn-3aa4a42d","r":"cn","t":"Ophthalmic nerve","y":1,"d":1,"s":"Branches of the nasociliary nerve include the:","o":[["Long ciliary nerves",1,"Long ciliary nerves carry sensation from the cornea, and sympathetic fibres to dilator pupillae."],["Posterior ethmoidal nerve",1,"It supplies the sphenoidal and posterior ethmoidal sinuses."],["Supratrochlear nerve",0,"The supratrochlear is a branch of the frontal nerve. The nasociliary gives the infratrochlear."],["External nasal nerve, the terminal part of the anterior ethmoidal",1,"The external nasal nerve supplies the skin of the nasal tip. Herpes zoster here (Hutchinson's sign) predicts eye involvement."]]},{"id":"cn-9312e5ed","r":"cn","t":"Maxillary nerve","y":1,"d":1,"s":"Concerning the maxillary nerve and its branches:","o":[["It lies in the lateral wall of the cavernous sinus below the ophthalmic nerve",1,"It runs in the lowest part of the lateral wall before leaving through foramen rotundum."],["The posterior superior alveolar nerve arises in the pterygopalatine fossa",1,"It descends on the posterior surface of the maxilla to supply the molar teeth and sinus."],["The nasopalatine nerve supplies the mucosa behind the upper incisors",1,"Via the incisive canal, communicating with the greater palatine nerve."],["The infraorbital nerve supplies the skin of the upper eyelid",0,"The infraorbital nerve supplies the lower eyelid, side of the nose, cheek and upper lip. The upper eyelid is supplied by V1."]]},{"id":"cn-4e2184cc","r":"cn","t":"Mandibular nerve","y":1,"d":1,"s":"Regarding the mandibular nerve:","o":[["The nerve to medial pterygoid supplies tensor tympani and tensor veli palatini",1,"Fibres pass through the otic ganglion without synapse."],["The anterior division is mainly motor but gives one sensory branch, the buccal nerve",1,"The buccal nerve passes between the heads of lateral pterygoid and supplies the cheek skin and mucosa. Buccinator itself is supplied by VII."],["The auriculotemporal nerve usually splits around the middle meningeal artery",1,"Its two roots encircle the middle meningeal artery."],["The mylohyoid nerve is a branch of the lingual nerve",0,"The nerve to mylohyoid arises from the inferior alveolar nerve just before it enters the mandibular foramen. It supplies mylohyoid and the anterior belly of digastric."]]},{"id":"cn-66145640","r":"cn","t":"Mandibular nerve","y":2,"d":1,"s":"The lingual nerve:","o":[["Carries secretomotor fibres to the parotid gland",0,"Parotid fibres travel IX, lesser petrosal, otic ganglion, auriculotemporal. The lingual nerve carries chorda fibres for the submandibular ganglion."],["Is joined by the chorda tympani about 2 cm below the skull base",1,"Last's: just above the lower border of the lateral pterygoid."],["Supplies taste to the posterior third of the tongue",0,"The posterior third (including the vallate papillae) is supplied by IX. The lingual nerve carries chorda tympani taste fibres to the anterior two-thirds."],["Lies in contact with the periosteum below and behind the third molar",1,"It may groove the bone here, at risk in third molar surgery."]],"k":"B"},{"id":"cn-344fdbce","r":"cn","t":"Facial nerve","y":1,"d":1,"s":"Concerning the intrapetrous course of the facial nerve:","o":[["The labyrinthine segment is the narrowest part of the facial canal",1,"This is relevant to oedema in Bell's palsy."],["The geniculate ganglion contains the cell bodies of taste fibres",1,"Pseudounipolar cell bodies for taste (anterior two-thirds of tongue and palate) are in the geniculate ganglion."],["The nerve to stapedius arises in the tympanic (horizontal) segment",0,"The nerve to stapedius arises from the mastoid (vertical) segment in the posterior wall."],["The chorda tympani leaves the skull through the petrotympanic fissure",1,"After crossing the tympanic membrane medial to the handle of malleus, it exits through the petrotympanic fissure."]]},{"id":"cn-9aa062ed","r":"cn","t":"Facial nerve","y":2,"d":1,"s":"A lesion of the facial nerve within the facial canal distal to the geniculate ganglion but proximal to the nerve to stapedius would cause:","o":[["Ipsilateral paralysis of the muscles of facial expression",1,"The lesion is proximal to all motor branches to facial muscles."],["Loss of lacrimation on the affected side",0,"The greater petrosal nerve arises at the geniculate ganglion, proximal to the lesion, so lacrimation is preserved."],["Normal hearing with no hyperacusis",0,"The lesion is proximal to the nerve to stapedius, so stapedius is paralysed and hyperacusis results."],["Normal taste over the anterior two-thirds of the tongue",0,"The chorda tympani arises distal to the nerve to stapedius, so taste is lost."]],"k":"A"},{"id":"cn-33f1682a","r":"cn","t":"Facial nerve","y":1,"d":1,"s":"Regarding the extracranial facial nerve:","o":[["It gives branches to the posterior belly of digastric and to stylohyoid",1,"These arise just after it exits the stylomastoid foramen, together with the posterior auricular nerve."],["In the parotid it lies superficial to the retromandibular vein",1,"From superficial to deep: facial nerve, retromandibular vein, external carotid artery."],["The marginal mandibular branch may loop below the lower border of the mandible",1,"It may run up to 2 cm below the mandible behind the facial artery, which matters for submandibular incisions."],["It supplies the buccinator through the buccal branch of the mandibular nerve",0,"Buccinator is supplied by the buccal branch of the facial nerve. The buccal branch of V3 is sensory."]]},{"id":"cn-d68d1d7a","r":"cn","t":"Facial nerve","y":2,"d":1,"s":"With a unilateral upper motor neurone lesion of the facial pathway (for example capsular infarct):","o":[["The forehead is relatively spared",1,"The part of the facial nucleus supplying the upper face receives bilateral corticonuclear input."],["The lower face on the side opposite the lesion is paralysed",1,"The lower facial nucleus receives mainly crossed input."],["Emotional facial movement may be preserved",1,"Emotional (limbic) pathways to the facial nucleus are separate from the voluntary corticonuclear pathway."],["Taste is lost on the anterior two-thirds of the tongue",0,"Taste is unaffected by an upper motor neurone lesion of the corticonuclear pathway."]],"k":"C"},{"id":"cn-9afc93bb","r":"cn","t":"Glossopharyngeal nerve","y":1,"d":1,"s":"Concerning the glossopharyngeal nerve:","o":[["It supplies only one muscle, stylopharyngeus",1,"It is the nerve of the third arch."],["It provides general and taste sensation to the posterior third of the tongue including the vallate papillae",1,"The vallate papillae lie in front of the sulcus terminalis but are supplied by IX."],["Its tympanic branch carries preganglionic parasympathetic fibres destined for the parotid gland",1,"Tympanic branch (Jacobson's), tympanic plexus, lesser petrosal, otic ganglion, auriculotemporal."],["It passes between the internal jugular vein and internal carotid artery deep to the styloid process to reach the tongue",0,"It passes forward between the internal and external carotid arteries, winding around the lateral side of stylopharyngeus, to enter the pharynx between the superior and middle constrictors."]]},{"id":"cn-020dda3d","r":"cn","t":"Vagus nerve","y":1,"d":1,"s":"Regarding the laryngeal branches of the vagus:","o":[["The internal laryngeal nerve pierces the thyrohyoid membrane",1,"It pierces the membrane with the superior laryngeal artery and supplies mucosa above the vocal folds."],["The external laryngeal nerve supplies cricothyroid and is closely related to the superior thyroid artery",1,"It is at risk when ligating the superior thyroid pedicle, so the artery is ligated close to the gland."],["The left recurrent laryngeal nerve hooks under the left subclavian artery",0,"The right nerve hooks under the right subclavian artery. The left hooks under the arch of the aorta beside the ligamentum arteriosum, a sixth-arch derivative."],["The recurrent laryngeal nerve supplies sensation below the vocal folds",1,"Mucosa below the folds is supplied by the recurrent laryngeal nerve."]]},{"id":"cn-a089af74","r":"cn","t":"Vagus nerve","y":2,"d":1,"s":"The pharyngeal branch of the vagus supplies:","o":[["Palatoglossus",1,"Palatoglossus is the only tongue muscle not supplied by the hypoglossal nerve."],["Tensor veli palatini",0,"Tensor veli palatini is supplied by the mandibular nerve (nerve to medial pterygoid)."],["Styloglossus",0,"Styloglossus is supplied by the hypoglossal nerve."],["Stylopharyngeus",0,"Stylopharyngeus is supplied by IX."]],"k":"A"},{"id":"cn-0b757ab8","r":"cn","t":"Vagus nerve","y":1,"d":1,"s":"Concerning the vagus nerve in the neck and thorax:","o":[["It lies in the carotid sheath posterior to and between the internal jugular vein and carotid artery",1,"It lies posteriorly in the groove between vein and artery."],["Its auricular branch supplies part of the external acoustic meatus",1,"Arnold's nerve supplies the posterior wall of the meatus and the tympanic membrane. Stimulation may provoke coughing."],["The right vagus passes anterior to the root of the right lung",0,"Both vagi pass behind the lung roots, forming the posterior pulmonary plexuses. The phrenic nerves pass in front."],["The left vagus crosses the arch of the aorta deep to the left phrenic nerve",1,"On the arch the phrenic nerve is anterior, the vagus posterior, with the left superior intercostal vein crossing between them."]]},{"id":"cn-6b7d3b7c","r":"cn","t":"Accessory nerve","y":1,"d":1,"s":"The spinal accessory nerve:","o":[["Arises from the anterior grey horn cells of the upper five cervical segments",1,"The spinal nucleus extends from C1 to about C5."],["Leaves the skull through the jugular foramen",1,"It shares the dural sheath of the vagus."],["Crosses the posterior triangle deep to the prevertebral fascia",0,"It crosses the posterior triangle superficially, embedded in or just deep to the investing layer of deep fascia, on levator scapulae. This explains its vulnerability to superficial surgery."],["Supplies sternocleidomastoid and then emerges about halfway down its posterior border",1,"Last's: it passes into SCM (between cleidomastoid and the rest of the muscle), emerges halfway down the posterior border, then crosses levator scapulae within the fascia of the roof of the posterior triangle. The lesser occipital nerve hooks around it."]]},{"id":"cn-7d61a3dd","r":"cn","t":"Hypoglossal nerve","y":2,"d":1,"s":"The hypoglossal nerve:","o":[["Hooks around the occipital artery as it descends",1,"It winds forward around the origin of the sternocleidomastoid branch of the occipital artery."],["Crosses lateral to the internal and external carotid arteries and the loop of the lingual artery",1,"It crosses all three superficially."],["Lies on the lateral surface of hyoglossus below the submandibular duct",1,"On hyoglossus, from above down: lingual nerve, submandibular duct, hypoglossal nerve. The lingual artery lies deep to hyoglossus."],["Carries fibres of C1 that form the superior root of the ansa cervicalis and supply thyrohyoid and geniohyoid",1,"These C1 fibres hitch-hike on XII. They do not belong to the hypoglossal nucleus."]],"k":"E"},{"id":"cn-961a15f0","r":"cn","t":"Hypoglossal nerve","y":1,"d":1,"s":"Following a right lower motor neurone hypoglossal nerve lesion:","o":[["The protruded tongue deviates to the right",1,"The left genioglossus is unopposed and pushes the tongue toward the paralysed side."],["The right side of the tongue becomes wasted and fasciculates",1,"Lower motor neurone signs."],["Taste over the right anterior two-thirds is lost",0,"XII is purely motor (to the tongue). Taste is via VII and IX."],["Palatoglossus is paralysed",0,"Palatoglossus is supplied by the pharyngeal plexus (vagus)."]]},{"id":"cn-cdcff422","r":"cn","t":"Cranial parasympathetic ganglia","y":1,"d":1,"s":"Regarding the cranial parasympathetic ganglia:","o":[["The otic ganglion receives preganglionic fibres from the inferior salivary nucleus",1,"Via IX, the tympanic branch and the lesser petrosal nerve."],["The pterygopalatine ganglion receives preganglionic fibres via the greater petrosal nerve",1,"From the superior salivary nucleus via the nervus intermedius and greater petrosal nerve, then the nerve of the pterygoid canal."],["The submandibular ganglion sends postganglionic fibres to the parotid gland",0,"It supplies the submandibular and sublingual glands."],["Sympathetic fibres synapse in the ciliary ganglion",0,"Sympathetic and sensory fibres pass through without synapse. Only parasympathetic fibres synapse."]]},{"id":"cn-3d166498","r":"cn","t":"Cranial parasympathetic ganglia","y":2,"d":1,"s":"Concerning the otic ganglion:","o":[["It lies just below the foramen ovale, medial to the mandibular nerve",1,"It lies on the medial side of the mandibular nerve, lateral to tensor veli palatini."],["Its sympathetic root comes from the plexus on the middle meningeal artery",1,"Postganglionic sympathetic fibres from the superior cervical ganglion."],["Its sensory root is from the auriculotemporal nerve",1,"Its secretomotor fibres leave via the auriculotemporal nerve."],["It has a motor root from the nerve to medial pterygoid",1,"Unlike the other three ganglia, it has a somatic motor root. These fibres pass through without synapse to tensor tympani and tensor veli palatini."]],"k":"E"},{"id":"cn-2c1b4427","r":"cn","t":"Pterygopalatine ganglion","y":1,"d":1,"s":"The pterygopalatine ganglion:","o":[["Sends secretomotor fibres to the lacrimal gland via the zygomatic and lacrimal nerves",1,"Postganglionic fibres travel in the zygomatic nerve, then a communicating branch to the lacrimal nerve."],["Receives sympathetic fibres via the deep petrosal nerve",1,"The deep petrosal nerve comes from the internal carotid plexus and joins the greater petrosal to form the nerve of the pterygoid canal."],["Is suspended from the maxillary nerve in the pterygopalatine fossa",1,"It hangs by two ganglionic branches from the maxillary nerve."],["Contains the cell bodies of taste fibres from the palate",0,"Palatal taste fibres pass through it without synapse. Their cell bodies are in the geniculate ganglion of the facial nerve."]]},{"id":"cn-4b2acfb0","r":"cn","t":"Olfactory and optic nerves","y":1,"d":1,"s":"Concerning the optic nerve:","o":[["It is surrounded by dura, arachnoid and pia, with an extension of the subarachnoid space",1,"Raised intracranial pressure is transmitted along the sheath, causing papilloedema."],["The central retinal artery enters the nerve on its inferomedial aspect about 1 cm behind the globe",1,"It pierces the dural sheath inferiorly and runs in the nerve to the optic disc."],["Its intraorbital part is shorter than the distance from the optic canal to the back of the globe",0,"The intraorbital part (about 25 mm) is longer than that distance, so it follows a sinuous course allowing eye movement."],["Its fibres are axons of the retinal ganglion cells",1,"It is a CNS tract myelinated by oligodendrocytes, so it does not regenerate."]]},{"id":"cn-7a67f5a6","r":"cn","t":"Olfactory and optic nerves","y":1,"d":1,"s":"Regarding the olfactory pathway:","o":[["The olfactory nerves pass through the cribriform plate to the olfactory bulb",1,"About 20 bundles pass through the cribriform plate, with sleeves of meninges."],["Olfactory impulses relay in the thalamus before reaching the primary olfactory cortex",0,"Olfaction is the only sensation whose primary cortex (piriform and periamygdaloid) is reached without a thalamic relay."],["The lateral olfactory stria passes to the uncus and amygdala",1,"The lateral stria ends in the piriform cortex, the uncus and the amygdala."],["The olfactory receptor cells are not replaced in adult life",0,"Olfactory receptor neurones are unusual in being continually replaced from basal cells throughout life."]]},{"id":"cn-c5943c8d","r":"cn","t":"Vestibulocochlear nerve","y":1,"d":1,"s":"Concerning the vestibulocochlear nerve and pathways:","o":[["The cochlear nuclei lie on the inferior cerebellar peduncle",1,"The dorsal and ventral cochlear nuclei lie on the lateral and dorsal aspects of the inferior cerebellar peduncle."],["The lateral lemniscus ascends to the inferior colliculus",1,"From there fibres pass via the inferior brachium to the medial geniculate body."],["A unilateral lesion of the lateral lemniscus causes total deafness in the contralateral ear",0,"The auditory pathway has extensive bilateral representation, so a central lesion above the cochlear nuclei does not cause unilateral deafness."],["The spiral ganglion lies in the modiolus of the cochlea",1,"The bipolar cell bodies of the cochlear nerve lie in the spiral canal of the modiolus."]]},{"id":"cn-0d83568b","r":"cn","t":"Corneal and other reflexes","y":2,"d":1,"s":"Regarding brainstem reflexes:","o":[["The afferent limb of the corneal reflex is the ophthalmic nerve",1,"Via the long ciliary branches of the nasociliary nerve."],["The efferent limb of the jaw jerk is the facial nerve",0,"Both limbs of the jaw jerk are in the trigeminal nerve: afferent via the mesencephalic nucleus, efferent via the motor nucleus to masseter."],["The efferent limb of the gag reflex is the hypoglossal nerve",0,"The efferent limb is the vagus via the nucleus ambiguus."],["The efferent limb of the pupillary light reflex is the trochlear nerve",0,"It is the oculomotor nerve, via the Edinger-Westphal nucleus and ciliary ganglion."]],"k":"A"},{"id":"cn-7f4eb6e3","r":"cn","t":"Cranial nerves at the skull base","y":2,"d":1,"s":"Which nerves lie in the lateral wall of the cavernous sinus?","o":[["Abducent nerve",0,"VI runs through the sinus, beside the internal carotid artery."],["Oculomotor nerve",1,"The highest nerve in the lateral wall."],["Greater petrosal nerve",0,"The greater petrosal runs under the trigeminal ganglion to foramen lacerum, not in the cavernous sinus wall."],["Maxillary nerve",1,"It lies in the lowest part of the lateral wall."]],"k":"B"},{"id":"cn-9356a205","r":"cn","t":"Cranial nerves in the posterior fossa","y":1,"d":1,"s":"At the cerebellopontine angle:","o":[["The facial nerve lies anterosuperior to the vestibulocochlear nerve",1,"The facial nerve and nervus intermedius lie anterosuperior to VIII as they pass to the internal acoustic meatus."],["The anterior inferior cerebellar artery often loops near the internal acoustic meatus",1,"Last's: AICA runs on the inferior cerebellar surface. The labyrinthine artery arises from AICA or directly from the basilar."],["A vestibular schwannoma may compress the trigeminal nerve and cause loss of the corneal reflex",1,"Loss of the corneal reflex is an early sign of a large tumour, because the trigeminal root is just above."],["The glossopharyngeal nerve lies above the trigeminal nerve",0,"The lower cranial nerves (IX, X, XI) lie below VII/VIII at the jugular foramen. The trigeminal is above."]]},{"id":"cns-fcdcd80c","r":"cns","t":"Thalamic nuclei","y":1,"d":2,"s":"Concerning thalamic relay nuclei:","o":[["The ventral anterior and ventral lateral nuclei receive the main output of the globus pallidus internus",1,"Pallidal output reaches VA and VL by the ansa lenticularis and lenticular fasciculus, joined as the thalamic fasciculus (H1)."],["The ventral posterior inferior nucleus receives vestibulothalamic fibres",1,"VPI is the principal thalamic vestibular relay."],["The centromedian and parafascicular nuclei project chiefly to the cingulate gyrus",0,"The intralaminar centromedian and parafascicular nuclei project heavily to the striatum. The anterior and lateral dorsal nuclei project to the cingulate gyrus."],["The lateral dorsal nucleus receives fibres from the mammillothalamic tract",1,"Along with the anterior nucleus. Both project to the cingulate gyrus."]]},{"id":"cns-9e945aa9","r":"cns","t":"Thalamic nuclei","y":2,"d":2,"s":"The ventral lateral nucleus of the thalamus:","o":[["Receives dentatothalamic fibres from the contralateral cerebellum",1,"They cross in the decussation of the superior cerebellar peduncles."],["Receives inputs from the globus pallidus internus and substantia nigra pars reticulata",1,"Basal ganglia output to the motor thalamus."],["Projects to the primary motor and supplementary motor cortex",1,"Areas 4 and 6."],["Is the thalamic target for deep brain stimulation for essential tremor because it receives the medial lemniscus",0,"Its ventral intermediate (Vim) part is the tremor target because it receives cerebellar input. The medial lemniscus ends in VPL."]],"k":"C"},{"id":"cns-d9776cb6","r":"cns","t":"Thalamic nuclei","y":2,"d":2,"s":"Regarding the pulvinar and medial dorsal nuclei:","o":[["The pulvinar has association connections with parietal, temporal and occipital cortex",1,"It integrates visual attention and higher-order sensory processing."],["The pulvinar is the main relay for the medial lemniscus",0,"The medial lemniscus relays in VPL."],["The medial dorsal nucleus projects mainly to the occipital lobe",0,"It projects to the prefrontal cortex and has reciprocal connections with the frontal lobe."],["The medial geniculate body receives the lateral lemniscus via the inferior brachium",0,"The lateral lemniscus ends in the inferior colliculus. The inferior colliculus then projects through the inferior brachium to the medial geniculate body."]],"k":"A"},{"id":"cns-12bb2694","r":"cns","t":"Thalamic nuclei","y":1,"d":2,"s":"Immediately lateral to the ventral intermediate nucleus of the thalamus lies the:","o":[["Posterior limb of the internal capsule",1,"Relevant to capsular side effects (dysarthria, contraction) in thalamic DBS."],["Globus pallidus externus, without intervening white matter",0,"The internal capsule separates the thalamus from the lentiform nucleus."],["Third ventricle",0,"The third ventricle lies medial to the thalamus."],["Ventral posterior nucleus, which lies anterior to it",0,"The ventral posterior nucleus lies posterior to the ventral intermediate nucleus."]]},{"id":"cns-599219c9","r":"cns","t":"Basal ganglia circuits","y":1,"d":2,"s":"Concerning basal ganglia connections:","o":[["The globus pallidus externus sends GABAergic inhibitory fibres to the subthalamic nucleus",1,"Part of the indirect pathway."],["The subthalamic nucleus sends glutamatergic excitatory fibres to the globus pallidus internus and substantia nigra pars reticulata",1,"It is the only excitatory nucleus within the basal ganglia circuitry."],["The globus pallidus internus excites the thalamus",0,"GPi and SNr outputs are GABAergic and tonically inhibit VA and VL."],["Nigrostriatal dopamine acting on D1 receptors facilitates the direct pathway",1,"D2 receptors inhibit the indirect pathway. Both effects promote movement."]]},{"id":"cns-4c32c452","r":"cns","t":"Basal ganglia circuits","y":1,"d":2,"s":"The fields of Forel:","o":[["The lenticular fasciculus (H2) passes through the internal capsule from the globus pallidus internus",1,"It runs dorsal to the subthalamic nucleus."],["The ansa lenticularis pierces the posterior limb of the internal capsule",0,"The ansa lenticularis loops around the medial (ventral) edge of the internal capsule. It is the lenticular fasciculus that passes through the capsule."],["The ansa lenticularis and lenticular fasciculus join to form the thalamic fasciculus (H1)",1,"Which enters VA and VL."],["The zona incerta lies between the lenticular fasciculus (H2) and the thalamic fasciculus (H1)",1,"H1 lies dorsal to the zona incerta and H2 ventral to it."]]},{"id":"cns-d01078b5","r":"cns","t":"Basal ganglia circuits","y":2,"d":2,"s":"Regarding dopaminergic and other monoaminergic nuclei:","o":[["The ventral tegmental area supplies dopamine to the ventral striatum and limbic cortex",1,"The mesolimbic and mesocortical pathways."],["The locus coeruleus is the main noradrenergic nucleus of the brain",1,"It lies in the upper floor of the fourth ventricle (superior fovea) and is involved in arousal and fear responses."],["The raphe nuclei are the main source of serotonin",1,"In the midline brainstem."],["The tuberoinfundibular dopamine pathway from the arcuate nucleus stimulates prolactin release",0,"Dopamine from the arcuate nucleus inhibits prolactin release. Pituitary stalk compression therefore raises prolactin."]],"k":"C"},{"id":"cns-2781344d","r":"cns","t":"Cerebellar connections","y":1,"d":2,"s":"Concerning cerebellar corticonuclear projections and lesions:","o":[["Purkinje cells of the vermis project to the fastigial nucleus",1,"Vermis (spinocerebellum) to fastigial, intermediate zone to globose and emboliform, lateral hemisphere to dentate."],["Purkinje cells of the lateral hemisphere project to the dentate nucleus",1,"The cerebrocerebellum."],["A flocculonodular lesion characteristically produces ipsilateral limb dysmetria",0,"Flocculonodular lesions produce nystagmus and truncal imbalance. Lateral hemisphere lesions cause ipsilateral limb ataxia."],["A midline vermis lesion produces truncal ataxia",1,"A broad-based gait, as in alcoholic anterior vermis degeneration."]]},{"id":"cns-c77e8cd0","r":"cns","t":"Cerebellar connections","y":2,"d":2,"s":"Fibres entering the cerebellum through the inferior cerebellar peduncle include:","o":[["Olivocerebellar fibres",1,"Climbing fibres from the contralateral inferior olive."],["Cuneocerebellar fibres from the accessory cuneate nucleus",1,"Upper limb unconscious proprioception (posterior external arcuate fibres)."],["Posterior spinocerebellar tract",1,"From Clarke's column (T1 to L2)."],["Anterior spinocerebellar tract",0,"It enters by the superior cerebellar peduncle after ascending to the midbrain."]],"k":"C"},{"id":"cns-ce975580","r":"cns","t":"Hypothalamus","y":1,"d":2,"s":"Regarding hypothalamic nuclei and function:","o":[["The anterior hypothalamic area promotes heat loss",1,"Lesions cause hyperthermia."],["The posterior hypothalamus promotes heat conservation",1,"Lesions cause poikilothermia."],["The ventromedial nucleus is a feeding centre whose destruction causes anorexia",0,"The ventromedial nucleus is the satiety centre. Its destruction causes hyperphagia and obesity. Lateral hypothalamic lesions cause aphagia."],["The suprachiasmatic nucleus is the circadian pacemaker",1,"It receives the retinohypothalamic tract."]]},{"id":"cns-8beb18fd","r":"cns","t":"Hypothalamus","y":2,"d":2,"s":"Concerning neuroendocrine control:","o":[["Thyrotropin-releasing hormone stimulates both TSH and prolactin release",1,"Hence hyperprolactinaemia in primary hypothyroidism."],["Atrial natriuretic peptide inhibits antidiuretic hormone release",1,"ANP opposes ADH, promoting natriuresis and diuresis."],["Oxytocin is produced mainly in the paraventricular nucleus",1,"Last's: oxytocin mainly paraventricular, vasopressin mainly supraoptic."],["Releasing hormones reach the anterior pituitary in the hypothalamohypophysial tract",0,"They reach it via the hypophysial portal veins from the median eminence."]],"k":"C"},{"id":"cns-cf93bb1a","r":"cns","t":"Auditory pathway","y":1,"d":2,"s":"Regarding the central auditory pathway:","o":[["Auditory information is first represented bilaterally at the superior olivary complex",1,"Hence unilateral deafness implies a lesion of the cochlear nucleus, nerve or ear."],["The anteroventral cochlear nucleus projects to both superior olivary complexes",1,"Fibres crossing in the trapezoid body."],["The dorsal cochlear nucleus projects through the lateral lemniscus directly to the inferior colliculus",1,"Bypassing the superior olive."],["The primary auditory cortex lies in the posterior transverse temporal gyrus",0,"Last's: it lies mainly in the anterior transverse temporal gyrus of Heschl (areas 41 and 42)."]]},{"id":"cns-7d5d9e52","r":"cns","t":"Vestibular pathways","y":2,"d":2,"s":"The lateral vestibulospinal tract:","o":[["Arises from the lateral vestibular nucleus (of Deiters)",1,"Last's."],["Descends ipsilaterally to all levels of the spinal cord",1,"It facilitates extensor (antigravity) motor neurones."],["Is important for posture and balance",1,"Last's: it acts mainly on trunk and limb girdle muscles."],["Descends mainly to the cervical cord to control head position",0,"That describes the medial vestibulospinal tract, from the medial vestibular nucleus, via the MLF."]],"k":"C"},{"id":"cns-1e3a6eb4","r":"cns","t":"Olfactory system","y":1,"d":2,"s":"Concerning the olfactory bulb and cortex:","o":[["The glomerulus is the basic odorant processing unit of the olfactory bulb",1,"Receptor axons synapse with mitral, tufted and periglomerular cells."],["Periglomerular cells receive direct input from primary olfactory neurones",1,"They are inhibitory interneurones."],["The piriform cortex includes the uncus and anterior parahippocampal gyrus",1,"With the cortical amygdala. It mediates perception of smell."],["Mitral cell axons relay in the medial dorsal thalamic nucleus before reaching the piriform cortex",0,"Olfaction reaches primary cortex without a thalamic relay. The thalamic route is a secondary pathway to orbitofrontal cortex."]]},{"id":"cns-08110eb7","r":"cns","t":"Limbic system","y":2,"d":2,"s":"In the Papez circuit:","o":[["The circuit begins at the subiculum of the hippocampal formation",1,"Output travels by the fornix."],["The fornix projects to the medial mammillary nucleus",1,"Most postcommissural fibres."],["The mammillothalamic tract projects to the anterior thalamic nucleus",1,"Which projects to the cingulate gyrus."],["The cingulum returns impulses to the entorhinal cortex and hippocampus",1,"Completing the circuit."]],"k":"E"},{"id":"cns-b9382eaa","r":"cns","t":"Association fibres","y":1,"d":2,"s":"Regarding association and commissural tracts:","o":[["The uncinate fasciculus connects the orbitofrontal cortex with the anterior temporal lobe",1,"It hooks around the stem of the lateral sulcus."],["The arcuate fasciculus connects Wernicke's area with Broca's area",1,"Lesions cause conduction aphasia."],["The hippocampal commissure connects the two fornices",1,"Beneath the splenium."],["The posterior commissure contains no fibres related to eye movements",0,"It carries fibres of the pretectal nuclei, interstitial nucleus of Cajal and nucleus of Darkschewitsch, involved in vertical gaze and the consensual light reflex."]]},{"id":"cns-6f7c1462","r":"cns","t":"Gaze control","y":2,"d":2,"s":"A lesion of the right medial longitudinal fasciculus in the pons (internuclear ophthalmoplegia) produces:","o":[["Failure of adduction of the right eye on attempted gaze to the left",1,"Interruption of fibres from the left abducent nucleus interneurones to the right medial rectus subnucleus."],["Failure of abduction of the left eye on gaze to the left",0,"Abduction is intact because the left abducent nucleus and nerve are spared. The abducting left eye typically shows nystagmus."],["Loss of convergence in all cases",0,"Convergence is usually preserved in a pontine MLF lesion, because it does not depend on the MLF."],["Paralysis of right lateral rectus",0,"The abducent nucleus and nerve are intact."]],"k":"A"},{"id":"cns-f9dc1b08","r":"cns","t":"Gaze control","y":1,"d":2,"s":"Concerning horizontal and vertical gaze centres:","o":[["The paramedian pontine reticular formation drives the ipsilateral abducent nucleus for horizontal saccades",1,"Last's calls it the para-abducent nucleus."],["The rostral interstitial nucleus of the MLF lies in the midbrain and generates vertical saccades",1,"With the interstitial nucleus of Cajal."],["The frontal eye field drives saccades to the same side",0,"The frontal eye field drives conjugate gaze to the opposite side. An acute destructive lesion deviates the eyes towards the lesion."],["Parinaud's syndrome from a pineal tumour includes upgaze palsy and light-near dissociation",1,"Dorsal midbrain (pretectal) compression."]]},{"id":"cns-230b81b2","r":"cns","t":"Brainstem syndromes","y":2,"d":2,"s":"Match the brainstem vascular syndromes:","o":[["Weber's syndrome: ipsilateral oculomotor palsy with contralateral hemiplegia",1,"Ventral midbrain: III fascicles and the cerebral peduncle."],["Benedikt's syndrome: ipsilateral oculomotor palsy with contralateral tremor or ataxia",1,"Tegmental midbrain lesion involving the red nucleus."],["Millard-Gubler syndrome: ipsilateral abducent and facial palsy with contralateral hemiplegia",1,"Ventral caudal pons."],["AICA occlusion: ipsilateral deafness and facial weakness with Horner's syndrome",1,"Lateral inferior pontine syndrome. The labyrinthine artery usually arises from AICA."]],"k":"E"},{"id":"cns-dd4a683a","r":"cns","t":"Brainstem syndromes","y":1,"d":2,"s":"Occlusion of a single artery of Percheron causes:","o":[["Bilateral paramedian thalamic infarction",1,"A single trunk from one P1 segment supplies both paramedian thalami."],["Altered consciousness and vertical gaze palsy",1,"With rostral midbrain involvement."],["A characteristic dense contralateral hemiplegia as the main sign",0,"Motor weakness is not the main feature. Somnolence, memory and vertical gaze disturbance dominate."],["Infarction in a territory supplied from the P1 segment of the posterior cerebral artery",1,"Thalamoperforating arteries arise from P1."]]},{"id":"cns-998ef9dd","r":"cns","t":"Trigeminal system","y":1,"d":2,"s":"Regarding the trigeminal sensory system:","o":[["The spinal nucleus has subnuclei oralis, interpolaris and caudalis",1,"Caudalis serves pain and temperature, oralis fine orofacial touch, interpolaris touch and dental pain."],["Pain from the face follows an onion-skin pattern in the spinal nucleus",1,"Last's: perioral areas rostral, peripheral face caudal."],["Second-order fibres from the main sensory nucleus project to the contralateral VPM",1,"Via the trigeminal lemniscus, with some uncrossed dorsal fibres."],["The mesencephalic nucleus projects mainly to the ipsilateral VPL",0,"Mesencephalic neurones are primary afferents mediating the jaw jerk via the motor nucleus. Facial sensation relays in VPM, not VPL."]]},{"id":"cns-3c35ad30","r":"cns","t":"Choroidal fissure and ventricles","y":2,"d":2,"s":"Concerning the choroidal fissure of the lateral ventricle:","o":[["It lies between the fornix and the thalamus",1,"In the body of the ventricle; in the temporal horn between fimbria and stria terminalis."],["Its anterior limit is the interventricular foramen",1,"Last's."],["The anterior choroidal artery enters its inferior end at the temporal horn",1,"Just above the uncus (the inferior choroidal point)."],["The septal vein runs through it to the vein of Galen",0,"Septal veins run on the septum pellucidum to the internal cerebral vein near the interventricular foramen; they do not run through the fissure."]],"k":"C"},{"id":"cns-52460100","r":"cns","t":"Cerebral vessels","y":1,"d":2,"s":"Regarding the anterior choroidal artery territory (neurosurgical texts):","o":[["It includes the posterior limb of the internal capsule",1,"The lower part."],["It includes the medial globus pallidus",1,"Listed by Rhoton-based sources."],["It includes the lateral geniculate body and optic tract",1,"Infarction gives contralateral hemianopia."],["Its usual origin is the cavernous internal carotid artery",0,"It arises from the supraclinoid (communicating) segment of the ICA, distal to the posterior communicating artery."]]},{"id":"cns-46708147","r":"cns","t":"Spinal cord","y":1,"d":2,"s":"Concerning spinal cord lamination and syndromes:","o":[["In the anterolateral tract sacral fibres lie most superficially",1,"Last's: so intramedullary lesions may spare sacral sensation."],["In the posterior columns cervical fibres lie most medially",0,"Sacral fibres lie most medially; cervical fibres are added laterally."],["Central cord syndrome affects the upper limbs more than the lower limbs",1,"Last's: lumbar and sacral corticospinal fibres lie more laterally."],["The anterior spinal artery syndrome abolishes vibration sense",0,"The posterior columns are spared, so vibration and proprioception remain."]]},{"id":"cns-75658011","r":"cns","t":"Internal capsule","y":1,"d":1,"s":"Concerning the internal capsule:","o":[["The anterior limb lies between the head of the caudate nucleus and the lentiform nucleus",1,"The anterior limb separates the caudate head medially from the lentiform nucleus laterally. The posterior limb lies between thalamus and lentiform nucleus."],["Corticobulbar (corticonuclear) fibres occupy the genu",1,"Corticonuclear fibres to the motor cranial nerve nuclei lie in the genu."],["In the posterior limb, corticospinal fibres for the lower limb lie anterior to those for the upper limb",0,"In the posterior limb the arrangement runs face/arm (anterior) to leg (posterior)."],["The optic radiation passes through the retrolentiform part",1,"The optic radiation (geniculocalcarine) passes in the retrolentiform part. The auditory radiation passes in the sublentiform part."]]},{"id":"cns-f0bdb2dc","r":"cns","t":"Internal capsule","y":2,"d":1,"s":"Arteries supplying the internal capsule include the:","o":[["Lateral striate (lenticulostriate) branches of the middle cerebral artery",1,"These supply most of the upper parts of both limbs. Their rupture is the classic cause of capsular haemorrhage."],["Anterior inferior cerebellar artery",0,"AICA supplies the lower pons, the inferolateral cerebellum and usually gives the labyrinthine artery. It does not reach the capsule."],["Superior cerebellar artery",0,"It supplies the upper surface of the cerebellum and parts of the midbrain, not the internal capsule."],["Posterior inferior cerebellar artery",0,"PICA supplies the lateral medulla and inferior cerebellum, not the capsule."]],"k":"A"},{"id":"cns-482f6881","r":"cns","t":"Thalamus","y":1,"d":1,"s":"Regarding the thalamic nuclei:","o":[["The ventral posteromedial nucleus receives the trigeminal lemniscus and taste fibres",1,"VPM relays sensation from the face (trigeminothalamic fibres) and taste (from the solitary nucleus) to the postcentral gyrus and insula."],["The ventral lateral nucleus receives fibres from the dentate nucleus of the contralateral cerebellum",1,"Dentatothalamic fibres cross in the superior cerebellar peduncle decussation and relay in VL to the motor cortex."],["The anterior nucleus receives the mammillothalamic tract",1,"The anterior nucleus is part of the Papez circuit and projects to the cingulate gyrus."],["The reticular nucleus projects mainly to the cerebral cortex",0,"The reticular nucleus lies outside the external medullary lamina. Its GABAergic neurones project back to other thalamic nuclei, not to the cortex."]]},{"id":"cns-eda28fd2","r":"cns","t":"Thalamus","y":1,"d":1,"s":"The lateral geniculate body:","o":[["Receives fibres from the temporal retina of the ipsilateral eye",1,"Uncrossed temporal fibres reach the ipsilateral LGB."],["Relays auditory impulses to the transverse temporal gyri",0,"That is the medial geniculate body."],["Has six layers, with crossed fibres ending in layers 1, 4 and 6",1,"Contralateral (crossed nasal) fibres end in layers 1, 4 and 6. Ipsilateral fibres end in 2, 3 and 5."],["Projects to the superior colliculus through the brachium of the superior colliculus",0,"Fibres from the optic tract bypass the LGB to reach the superior colliculus and pretectum through the superior brachium. The LGB projects to the calcarine cortex."]]},{"id":"cns-36d61dca","r":"cns","t":"Basal ganglia","y":1,"d":1,"s":"Concerning the basal nuclei:","o":[["The lentiform nucleus consists of the putamen and globus pallidus",1,"The lentiform (lenticular) nucleus is the putamen laterally plus the globus pallidus medially."],["The corpus striatum includes the caudate nucleus and the lentiform nucleus",1,"Corpus striatum = caudate + lentiform. The striatum (neostriatum) = caudate + putamen."],["The claustrum lies between the external capsule and the extreme capsule",1,"The claustrum is a thin sheet of grey matter between the external capsule (medially) and extreme capsule (laterally), deep to the insula."],["The tail of the caudate nucleus lies in the floor of the inferior horn of the lateral ventricle",0,"The tail of the caudate lies in the roof of the inferior horn. The hippocampus forms the floor."]]},{"id":"cns-ca4dc875","r":"cns","t":"Cerebellum","y":1,"d":1,"s":"Regarding the cerebellar peduncles:","o":[["The inferior cerebellar peduncle carries olivocerebellar fibres",1,"Olivocerebellar (climbing) fibres from the contralateral inferior olive enter through the inferior peduncle."],["The middle cerebellar peduncle carries only afferent pontocerebellar fibres",1,"The middle peduncle is composed of crossed pontocerebellar fibres from the pontine nuclei."],["The superior cerebellar peduncle carries the dorsal spinocerebellar tract",0,"The dorsal spinocerebellar tract enters through the inferior peduncle. The ventral spinocerebellar tract enters through the superior peduncle."],["Efferent fibres from the dentate nucleus decussate in the midbrain at the level of the inferior colliculus",1,"The decussation of the superior cerebellar peduncles is in the caudal midbrain at the level of the inferior colliculi."]]},{"id":"cns-23fe1e2a","r":"cns","t":"Cerebellum","y":2,"d":1,"s":"Concerning the cerebellar cortex and nuclei:","o":[["Granule cells are the only output neurones of the cerebellar cortex",0,"Purkinje cell axons are the sole output of the cortex. Granule cell axons form the parallel fibres within the cortex."],["Purkinje cells are inhibitory (GABAergic)",1,"Purkinje cells inhibit the deep cerebellar and vestibular nuclei."],["The deep nuclei from medial to lateral are dentate, emboliform, globose and fastigial",0,"From medial to lateral the order is fastigial, globose, emboliform, dentate. The dentate is the most lateral."],["Mossy fibres synapse with granule cells in the cerebellar glomeruli",1,"Mossy fibres (pontocerebellar, spinocerebellar, vestibular and others) end on granule cell dendrites in the glomeruli. Climbing fibres from the inferior olive end on Purkinje cells."]],"k":"B"},{"id":"cns-30fcbc8b","r":"cns","t":"Cerebellum","y":1,"d":1,"s":"The flocculonodular lobe:","o":[["Is separated from the body of the cerebellum by the posterolateral fissure",1,"The posterolateral fissure is the first fissure to appear and separates the flocculonodular lobe."],["Is phylogenetically the oldest part (archicerebellum)",1,"It is the vestibulocerebellum."],["Has major connections with the vestibular nuclei",1,"It receives primary and secondary vestibular fibres and projects to the vestibular nuclei, directly and through the fastigial nucleus."],["Is separated from the anterior lobe by the primary fissure",0,"The primary fissure separates the anterior lobe from the posterior (middle) lobe."]]},{"id":"cns-6afabb84","r":"cns","t":"Ventricular system","y":1,"d":1,"s":"Regarding the choroid plexus:","o":[["It is present in the body and inferior horn of the lateral ventricle",1,"The plexus runs along the choroid fissure from the interventricular foramen through the body, atrium (glomus) and inferior horn."],["It is present in the anterior horn of the lateral ventricle",0,"There is no choroid plexus in the anterior (frontal) or posterior (occipital) horns."],["It is present in the roof of the third ventricle",1,"Two strands hang from the tela choroidea in the roof of the third ventricle."],["It is present in the cerebral aqueduct",0,"The aqueduct contains no choroid plexus."]]},{"id":"cns-caf6f858","r":"cns","t":"Ventricular system","y":2,"d":1,"s":"The fourth ventricle:","o":[["Has the facial colliculus in the floor of its medullary part",0,"The facial colliculus is in the pontine part of the floor. The hypoglossal and vagal trigones are in the medullary part."],["Communicates with the subarachnoid space through the median aperture",1,"The foramen of Magendie in the lower roof opens into the cerebellomedullary cistern."],["Communicates directly with the third ventricle through the interventricular foramina",0,"It communicates with the third ventricle through the cerebral aqueduct. The interventricular foramina join the lateral and third ventricles."],["Communicates with the pontine cistern through the lateral apertures",1,"Last's: the lateral apertures (foramina of Luschka) open just behind VIII into the pontine cistern."]],"k":"B"},{"id":"cns-ced606a8","r":"cns","t":"Ventricular system","y":1,"d":1,"s":"Concerning the third ventricle:","o":[["The interventricular foramina lie between the fornix and the anterior pole of the thalamus",1,"Last's: the anterior columns of the fornix form the anterior margins of the interventricular foramina, with the anterior pole of the thalamus behind."],["The optic and infundibular recesses lie in its anterior inferior wall",1,"The optic recess lies above the chiasma, the infundibular recess in the stalk."],["Its lateral walls are formed entirely by the thalamus",0,"The upper lateral wall is thalamus. Below the hypothalamic sulcus it is hypothalamus."],["The pineal recess lies in its posterior wall",1,"The posterior wall has the suprapineal and pineal recesses, with the posterior commissure below and the habenular commissure above the pineal stalk."]]},{"id":"cns-5cd4c126","r":"cns","t":"Hypothalamus and pituitary","y":1,"d":1,"s":"Regarding the hypothalamus:","o":[["The supraoptic and paraventricular nuclei produce vasopressin and oxytocin",1,"Their magnocellular neurones produce ADH and oxytocin, transported down the hypothalamohypophysial tract to the posterior pituitary."],["The suprachiasmatic nucleus receives direct retinal input",1,"The retinohypothalamic tract to the suprachiasmatic nucleus regulates circadian rhythms."],["The fornix ends mainly in the mammillary body",1,"Most postcommissural fornix fibres end in the mammillary body."],["Releasing hormones reach the anterior pituitary via the hypothalamohypophysial nerve tract",0,"Releasing hormones from the arcuate (infundibular) and other nuclei reach the anterior lobe via the hypophysial portal veins, not by axons."]]},{"id":"cns-6e4be541","r":"cns","t":"Cerebral cortex areas","y":1,"d":1,"s":"Concerning functional areas of the cerebral cortex:","o":[["The primary auditory cortex is in the transverse temporal gyri",1,"Heschl's gyri (areas 41 and 42) on the upper surface of the superior temporal gyrus."],["The motor speech area of Broca lies in the inferior frontal gyrus of the dominant hemisphere",1,"The pars opercularis and triangularis (areas 44 and 45)."],["The frontal eye field lies in the precentral gyrus",0,"The frontal eye field (area 8) lies in the posterior part of the middle frontal gyrus, in front of the precentral gyrus."],["The primary visual cortex lies on the walls of the calcarine sulcus",1,"Area 17, marked by the stria of Gennari."]]},{"id":"cns-3e572f83","r":"cns","t":"Commissures","y":1,"d":1,"s":"Regarding the commissural fibres:","o":[["The anterior commissure interconnects the temporal lobes and olfactory structures",1,"It crosses in the lamina terminalis, linking olfactory regions and the middle and inferior temporal gyri."],["The forceps minor passes through the splenium of the corpus callosum",0,"The forceps minor passes through the genu to the frontal lobes. The forceps major passes through the splenium to the occipital lobes."],["The posterior commissure carries fibres concerned with the consensual light reflex",1,"Pretectal fibres to the contralateral Edinger-Westphal nucleus cross in the posterior commissure."],["The anterior commissure crosses in the posterior wall of the third ventricle",0,"The anterior commissure crosses in the lamina terminalis, in the anterior wall. The posterior and habenular commissures are in the posterior wall."]]},{"id":"cns-587f725a","r":"cns","t":"Circle of Willis","y":1,"d":1,"s":"Concerning the arteries at the base of the brain:","o":[["The oculomotor nerve passes between the posterior cerebral and superior cerebellar arteries",1,"The nerve emerges between these two arteries close to the basilar bifurcation."],["The anterior cerebral artery passes above the optic nerve",1,"The A1 segment runs forward and medially above the optic nerve or chiasma to the longitudinal fissure."],["The recurrent artery of Heubner usually arises from the middle cerebral artery",0,"Heubner's artery arises from the anterior cerebral artery. Last's describes it as the largest medial striate branch, supplying the more posterior part of the capsule including the leg area (absent in 3%). Many neurosurgical texts emphasise the head of caudate and anterior limb, so know both."],["The posterior communicating artery is closely related to the oculomotor nerve",1,"The oculomotor nerve runs alongside the posterior communicating artery. An aneurysm at its origin compresses the nerve, and the pupil is often affected first."]]},{"id":"cns-50395fda","r":"cns","t":"Cerebral arteries","y":1,"d":1,"s":"The anterior choroidal artery:","o":[["Arises from the internal carotid artery",1,"Last's: it arises from the termination of the ICA or its near neighbours (MCA or posterior communicating). It is the fourth artery to the cerebrum and does not supply cortex."],["Supplies the choroid plexus of the inferior horn of the lateral ventricle",1,"It enters the choroid fissure to supply the inferior horn plexus."],["Supplies the optic tract and lateral geniculate body",1,"Last's: it supplies the optic chiasma and tract, lateral geniculate body, choroid plexus (entering the choroid fissure at the tip of the inferior horn) and the posterior part of the internal capsule. Occlusion gives contralateral hemiplegia, hemianaesthesia and hemianopia."],["Supplies the head of the caudate nucleus",0,"The head of the caudate is supplied mainly by the recurrent artery of Heubner and lateral striate arteries. The anterior choroidal supplies hippocampus, amygdala, posterior limb, optic tract and LGB."]]},{"id":"cns-979cc6a6","r":"cns","t":"Cerebral arteries","y":2,"d":1,"s":"Occlusion of the cortical branches of the middle cerebral artery (beyond the origin of its striate branches) would be expected to produce:","o":[["Contralateral hemiplegia affecting the face and arm more than the leg",1,"Cortical MCA territory includes the face and arm motor areas. The leg area is on the medial surface (ACA). Last's notes that occlusion of the stem, including the striate arteries, gives complete contralateral hemiplegia."],["Contralateral sensory loss over the face and arm",1,"The face and arm areas of the postcentral gyrus lie on the lateral surface in MCA territory."],["Aphasia if the dominant hemisphere is affected",1,"Broca's and Wernicke's areas are both in MCA territory."],["Contralateral loss of sensation in the leg predominating",0,"Leg sensory cortex is on the medial surface (paracentral lobule), supplied by the ACA."]],"k":"C"},{"id":"cns-9aa9fae2","r":"cns","t":"Cerebral veins","y":1,"d":1,"s":"Concerning the cerebral veins:","o":[["The great cerebral vein is formed by the union of the two internal cerebral veins",1,"They unite beneath the splenium to form the great cerebral vein (of Galen)."],["The internal cerebral vein is formed at the interventricular foramen by the thalamostriate and choroidal veins",1,"The thalamostriate and choroidal veins (with septal veins) unite behind the column of the fornix."],["The superior anastomotic vein connects the superficial middle cerebral vein with the transverse sinus",0,"The superior anastomotic vein (Trolard) drains to the superior sagittal sinus. The inferior anastomotic vein (Labbe) drains to the transverse sinus."],["Cerebral veins have no valves",1,"The cerebral veins and dural sinuses are valveless."]]},{"id":"cns-f99d2670","r":"cns","t":"Spinal cord","y":1,"d":1,"s":"Regarding the spinal cord:","o":[["In the adult it usually ends at the level of the L1/L2 intervertebral disc",1,"The conus medullaris usually ends at L1/2. At birth it ends at L3."],["The denticulate ligaments are attached between the anterior and posterior nerve roots",1,"The pia mater forms about 21 pairs of denticulate ligaments, attached to the dura between the roots."],["The filum terminale is attached to the back of the first coccygeal segment",1,"The filum pierces the dural sac at S2 and attaches to the dorsum of the coccyx."],["The lateral grey horn is present from C1 to C8",0,"Last's: a lateral horn of preganglionic sympathetic cells is present from T1 to L2, and a similar small lateral horn of parasympathetic cells lies in S2 to S4."]]},{"id":"cns-6983072a","r":"cns","t":"Spinal cord tracts","y":1,"d":1,"s":"Concerning the ascending tracts of the spinal cord:","o":[["The fasciculus cuneatus is present only above about the T6 segment",1,"The fasciculus cuneatus carries upper limb and upper trunk fibres, entering above about T6."],["In the posterior columns, sacral fibres lie most medially",1,"Fibres are added laterally as they ascend, so sacral fibres lie most medially in the fasciculus gracilis."],["Spinothalamic fibres cross in the posterior white commissure",0,"They cross in front of the central canal (anterior white commissure). Last's: crossing is transverse in the lowest cord but increasingly oblique higher up, taking 4 to 5 segments in the cervical region."],["The dorsal spinocerebellar tract arises from the nucleus dorsalis (Clarke's column)",1,"Last's: the thoracic nucleus (Clarke's column, lamina VII) occupies all the thoracic and first two lumbar segments (T1 to L2). Cervical proprioception reaches the cerebellum by the accessory cuneate nucleus and cuneocerebellar tract instead."]]},{"id":"cns-f7ff7184","r":"cns","t":"Spinal cord tracts","y":2,"d":1,"s":"A hemisection of the spinal cord at T10 (Brown-Sequard) would produce below the lesion:","o":[["Ipsilateral upper motor neurone paralysis",1,"The lateral corticospinal tract has already crossed in the medulla."],["Contralateral loss of proprioception",0,"The dorsal columns are uncrossed in the cord, so proprioception and vibration loss are ipsilateral."],["Ipsilateral loss of pain and temperature below the lesion",0,"Pain and temperature loss is contralateral, because the anterolateral tract has already crossed."],["Bilateral complete loss of light touch",0,"Light touch is partly carried in both dorsal columns and anterior spinothalamic tracts, so it is usually relatively preserved."]],"k":"A"},{"id":"cns-943945a1","r":"cns","t":"Spinal cord tracts","y":1,"d":1,"s":"Regarding the lateral corticospinal tract:","o":[["About 85 percent of corticospinal fibres decussate in the lower medulla",1,"Most fibres cross in the pyramidal decussation. The rest descend uncrossed as the anterior corticospinal tract."],["Fibres for the lower limb lie most laterally in the tract",1,"In the lateral corticospinal tract, cervical fibres are medial and sacral fibres lateral."],["It lies anterior to the lateral spinothalamic tract",0,"The lateral corticospinal tract lies in the posterior part of the lateral funiculus, in front of the posterior horn. The spinothalamic tract lies anterolaterally."],["Many fibres arise from cells in the postcentral gyrus",1,"Only about a third of corticospinal fibres arise from area 4. Others come from premotor and parietal cortex, including the postcentral gyrus."]]},{"id":"cns-3810a2ee","r":"cns","t":"Spinal cord blood supply","y":1,"d":1,"s":"Concerning the blood supply of the spinal cord:","o":[["The anterior spinal artery is formed by branches of both vertebral arteries",1,"A branch from each vertebral artery unites in front of the medulla to form the single anterior spinal artery."],["The anterior spinal artery supplies about the anterior two-thirds of the cord",1,"Last's: it supplies the whole cord anterior to the posterior grey columns. Anterior spinal artery syndrome spares the posterior columns, and pial vessels may spare the superficial sacral fibres (sacral sparing)."],["The arteria radicularis magna (of Adamkiewicz) usually enters on the right side",0,"Last's: it is slightly commoner on the left and at T10 or T11, but may be anywhere from T7 to L4, so it cannot be relied on to accompany a low thoracic root."],["The posterior spinal arteries usually arise from the posterior inferior cerebellar arteries or vertebral arteries",1,"Last's: each arises from PICA or the vertebral artery at the foramen magnum, is usually double, and runs through and behind the posterior rootlets. Each supplies the posterior grey and white columns of its own side."]]},{"id":"cns-6c103634","r":"cns","t":"Medulla","y":2,"d":1,"s":"The lateral medullary syndrome (PICA or vertebral artery occlusion) typically includes:","o":[["Contralateral loss of pain and temperature sensation in the face",0,"Facial loss is ipsilateral, because the spinal tract and nucleus of V are uncrossed. Body loss is contralateral, from the crossed spinothalamic tract."],["Ipsilateral paralysis of the tongue",0,"The hypoglossal nucleus and nerve are medial. Tongue paralysis belongs to the medial medullary syndrome."],["Contralateral hemiplegia",0,"The pyramid is medial (anterior spinal artery territory), so hemiplegia is not a feature."],["Ipsilateral paralysis of the palate, pharynx and vocal cord",1,"Involvement of the nucleus ambiguus causes dysphagia and dysphonia. Ipsilateral Horner's, vertigo, nystagmus and ataxia also occur."]],"k":"D"},{"id":"cns-a9e059a3","r":"cns","t":"Medulla","y":1,"d":1,"s":"In the medial medullary syndrome:","o":[["The tongue deviates towards the side of the lesion on protrusion",1,"Ipsilateral hypoglossal paralysis: the intact genioglossus pushes the tongue toward the paralysed side."],["There is contralateral hemiplegia",1,"The pyramid is involved above the decussation."],["There is contralateral loss of touch and proprioception",1,"The medial lemniscus is involved after it has crossed."],["There is ipsilateral loss of pain and temperature on the face",0,"That is a feature of the lateral medullary syndrome (spinal tract of V)."]]},{"id":"cns-3ca195d4","r":"cns","t":"Brainstem surface","y":1,"d":1,"s":"Regarding the superficial attachments of the cranial nerves to the brainstem:","o":[["The hypoglossal nerve emerges between the pyramid and the olive",1,"Its rootlets emerge in the preolivary (anterolateral) sulcus."],["The abducent nerve emerges at the junction of the pons and pyramid",1,"It emerges at the lower border of the pons, above the pyramid."],["The trochlear nerve emerges from the ventral surface of the midbrain",0,"The trochlear is the only cranial nerve to emerge from the dorsal surface, just below the inferior colliculus. It then crosses in the superior medullary velum."],["The glossopharyngeal, vagus and cranial accessory nerves emerge posterior to the olive",1,"They emerge in the postolivary sulcus, between the olive and the inferior cerebellar peduncle."]]},{"id":"cns-f3b268b7","r":"cns","t":"Floor of fourth ventricle","y":2,"d":1,"s":"Concerning features of the floor of the fourth ventricle:","o":[["The facial colliculus overlies the abducent nucleus",1,"The colliculus is formed by facial motor fibres looping (internal genu) around the abducent nucleus."],["The area postrema lies outside the blood-brain barrier",1,"It is a circumventricular organ concerned with vomiting."],["The vagal trigone overlies the dorsal motor nucleus of the vagus",1,"The hypoglossal trigone lies medially, the vagal trigone laterally."],["The striae medullares cross the floor at the level of the pontomedullary junction",1,"Last's: the medullary striae cross the floor at its widest part, between the pontine and medullary parts. They are aberrant fibres from pontine nuclei passing to the cerebellum by the inferior peduncle."]],"k":"E"},{"id":"cns-707ecb03","r":"cns","t":"Midbrain","y":1,"d":1,"s":"At the level of the superior colliculus, the midbrain contains the:","o":[["Oculomotor nucleus",1,"The oculomotor complex lies in front of the aqueduct at this level."],["Red nucleus",1,"The red nucleus lies in the tegmentum at the superior colliculus level and is traversed by the oculomotor fibres."],["Trochlear nucleus",0,"The trochlear nucleus is at the level of the inferior colliculus."],["Decussation of the superior cerebellar peduncles",0,"This is at the level of the inferior colliculus."]]},{"id":"cns-d4402a8d","r":"cns","t":"Visual pathway","y":1,"d":1,"s":"Concerning the visual pathways:","o":[["A lesion of the optic chiasma typically causes bitemporal hemianopia",1,"Crossing nasal fibres serve the temporal fields."],["Fibres of Meyer's loop serving the contralateral upper quadrant pass through the temporal lobe",1,"Inferior retinal fibres loop around the inferior horn. A temporal lesion produces a contralateral superior quadrantanopia."],["The pupillary light reflex is relayed through the lateral geniculate body",0,"Light reflex fibres leave the optic tract before the LGB to reach the pretectal nuclei."],["A lesion of the optic tract produces contralateral homonymous hemianopia",1,"Each tract carries fibres from the ipsilateral temporal and contralateral nasal retina."]]},{"id":"cns-d792d20b","r":"cns","t":"Limbic system","y":1,"d":1,"s":"Regarding the limbic system:","o":[["The amygdala lies in the temporal lobe in front of the tip of the inferior horn",1,"The amygdaloid body lies de
