<title>NSA Anatomy Bank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: a single study column (max 46rem) under a sticky tab bar; panels swap in place. */
:root {
  --bg: #eef1f3;
  --surface: #ffffff;
  --sunk: #e4e9ec;
  --ink: #18212b;
  --muted: #56626e;
  --line: #d3dae0;
  --accent: #1d5c9e;
  --accent-ink: #ffffff;
  --true: #1b7543;
  --true-bg: #e2f2e8;
  --false: #b1271d;
  --false-bg: #f8e3e1;
  --flag: #a8660f;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1318; --surface: #161d24; --sunk: #1d252e; --ink: #e5e9ed; --muted: #9ba6b2; --line: #2b3540;
    --accent: #6ea8f0; --accent-ink: #0b1622; --true: #5cc98d; --true-bg: #143223; --false: #ff8578; --false-bg: #3a1916; --flag: #e5ae4c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1318; --surface: #161d24; --sunk: #1d252e; --ink: #e5e9ed; --muted: #9ba6b2; --line: #2b3540;
  --accent: #6ea8f0; --accent-ink: #0b1622; --true: #5cc98d; --true-bg: #143223; --false: #ff8578; --false-bg: #3a1916; --flag: #e5ae4c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 46rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { padding-block: 14px 10px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 1.45rem; margin: 0; letter-spacing: 0.005em; text-wrap: balance; }
.meta { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.sync { margin-left: auto; font-size: 0.78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.on i { background: var(--true); }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
nav.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { flex: 1 0 auto; background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 8px 9px; font: inherit; font-size: 0.95rem; color: var(--muted); cursor: pointer; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }
@media (max-width: 420px) { nav.tabs button { padding-inline: 5px; font-size: 0.88rem; } }
main .wrap { padding-block: 16px 64px; display: flex; flex-direction: column; gap: 14px; }
section[hidden] { display: none !important; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--sunk); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 0.88rem; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; }
.chip small { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] small { color: inherit; opacity: 0.85; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.grow { flex: 1 1 auto; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 10px 16px; font: inherit; font-weight: 700; cursor: pointer; min-height: 44px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.small { padding: 6px 12px; min-height: 36px; font-size: 0.88rem; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
select, input[type="number"] { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-height: 44px; }
.count { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
details.filters summary { cursor: pointer; font-weight: 700; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
details.filters summary::-webkit-details-marker { display: none; }
details.filters summary::after { content: "Filters ▾"; font-weight: 400; color: var(--muted); font-size: 0.9rem; }
details.filters[open] summary::after { content: "Hide ▴"; }
.filter-body { display: flex; flex-direction: column; gap: 14px; margin-top: 12px; }

.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.q-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 0.82rem; color: var(--muted); }
.tag { border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; font-weight: 700; color: var(--ink); background: var(--sunk); }
.q-head .flagged { color: var(--flag); font-weight: 700; }
.tag.hard { color: var(--false); border-color: currentColor; background: transparent; }
.tag.sample { color: var(--true); border-color: currentColor; background: transparent; }
.report-q { padding: 10px 0; border-top: 1px solid var(--line); }
.report-q:first-of-type { border-top: 0; }
.report-q ul { margin: 6px 0 0; padding-left: 1.1rem; }
.report-q li { margin: 4px 0; }
textarea.copy { width: 100%; min-height: 8rem; font: inherit; font-size: 0.85rem; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); color: var(--ink); padding: 8px; }
.stem { padding: 14px 16px 4px; font-size: 1.08rem; font-weight: 700; text-wrap: pretty; }
ol.opts { list-style: none; margin: 0; padding: 6px 0 4px; }
ol.opts li { padding: 10px 16px; border-top: 1px solid transparent; }
ol.opts li + li { border-top-color: var(--line); }
.opt-row { display: flex; gap: 12px; align-items: flex-start; }
.opt-n { flex: 0 0 auto; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 1px; }
.opt-text { flex: 1 1 auto; min-width: 0; }
.tf { display: flex; gap: 6px; flex: 0 0 auto; }
.tf button { min-width: 3rem; min-height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; }
.tf button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.tf button:disabled { cursor: default; }
li.ok { background: var(--true-bg); }
li.bad { background: var(--false-bg); }
.verdict { margin-top: 6px; font-size: 0.92rem; }
.verdict b.t { color: var(--true); }
.verdict b.f { color: var(--false); }
.expl { color: var(--ink); opacity: 0.88; font-size: 0.93rem; margin-top: 4px; }
.key { margin: 4px 16px 12px; padding: 10px 12px; background: var(--sunk); border-radius: 8px; font-size: 0.88rem; }
.key table { border-collapse: collapse; width: 100%; }
.key td { padding: 2px 6px; vertical-align: top; }
.key td:first-child { font-weight: 700; width: 1.5rem; }
.letters { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 4px 16px 14px; }
.letters button { min-height: 48px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-weight: 700; font-size: 1.1rem; cursor: pointer; }
.letters button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.letters button.right { background: var(--true); color: var(--surface); border-color: var(--true); }
.letters button.wrong { background: var(--false); color: var(--surface); border-color: var(--false); }
.q-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--sunk); }
.score { font-weight: 700; font-variant-numeric: tabular-nums; }
.score.full { color: var(--true); }
.score.part { color: var(--flag); }
.score.none { color: var(--false); }
.empty { text-align: center; color: var(--muted); padding: 28px 16px; }
.empty b { color: var(--ink); display: block; font-size: 1.05rem; margin-bottom: 4px; }

.timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.1rem; }
.timer.low { color: var(--false); }
.bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); }
.grid-nav { display: grid; grid-template-columns: repeat(auto-fill, minmax(2.4rem, 1fr)); gap: 4px; }
.grid-nav button { min-height: 36px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--muted); font: inherit; font-size: 0.82rem; font-variant-numeric: tabular-nums; cursor: pointer; }
.grid-nav button.done { background: var(--sunk); color: var(--ink); font-weight: 700; }
.grid-nav button.cur { outline: 2px solid var(--accent); outline-offset: -2px; color: var(--ink); }
.grid-nav button.ok { background: var(--true-bg); color: var(--true); }
.grid-nav button.bad { background: var(--false-bg); color: var(--false); }
.big { font-family: var(--font-display); font-size: 2.6rem; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.pass { color: var(--true); font-weight: 700; }
.fail { color: var(--false); font-weight: 700; }
table.stats { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
table.stats th { text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; padding: 6px 4px; border-bottom: 1px solid var(--line); }
table.stats td { padding: 8px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; font-variant-numeric: tabular-nums; }
table.stats td.num { text-align: right; white-space: nowrap; }
table.stats td.meter { width: 32%; }
.meterbar { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; display: flex; }
.meterbar span { display: block; height: 100%; }
.meterbar .m-ok { background: var(--true); }
.meterbar .m-bad { background: var(--false); opacity: 0.75; }
.table-scroll { overflow-x: auto; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-height: 14rem; display: flex; flex-direction: column; }
.card-face { padding: 18px 16px; font-size: 1.02rem; overflow-wrap: anywhere; }
.card-face.back { border-top: 1px dashed var(--line); background: var(--sunk); }
.cloze { color: var(--accent); font-weight: 700; }
.cloze-a { color: var(--accent); font-weight: 700; background: color-mix(in srgb, var(--accent) 14%, transparent); border-radius: 3px; padding: 0 2px; }
.fig { color: var(--muted); font-style: italic; font-size: 0.85em; }
.card hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.prose p { margin: 0 0 10px; }
.prose p:last-child { margin-bottom: 0; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border: 1px solid var(--false); border-radius: 8px; background: var(--false-bg); }
@media (max-width: 420px) {
  body { font-size: 16px; }
  .opt-row { flex-wrap: wrap; }
  .tf { width: 100%; justify-content: flex-end; }
  .tf button { flex: 0 0 4.2rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="wrap">
    <h1>NSA Anatomy Bank</h1>
    <span class="meta" id="meta"></span>
    <span class="sync" id="sync" title="Where your progress is saved"><i></i><span>Saved on this device</span></span>
  </div>
</header>
<nav class="tabs" aria-label="Sections">
  <div class="wrap" role="tablist">
    <button role="tab" id="tab-practice" aria-selected="true" data-view="practice">Practice</button>
    <button role="tab" id="tab-exam" aria-selected="false" data-view="exam">Exam</button>
    <button role="tab" id="tab-cards" aria-selected="false" data-view="cards">Cards</button>
    <button role="tab" id="tab-today" aria-selected="false" data-view="today">Today</button>
    <button role="tab" id="tab-progress" aria-selected="false" data-view="progress">Progress</button>
    <button role="tab" id="tab-format" aria-selected="false" data-view="format">Help</button>
  </div>
</nav>

<main>
  <div class="wrap">
    <section id="view-practice">
      <details class="filters panel" id="practice-filters" open>
        <summary><span>Choose questions <span class="count" id="practice-count"></span></span></summary>
        <div class="filter-body">
          <div><p class="label">Region</p><div class="chips" id="practice-regions"></div></div>
          <div><p class="label">Question type</p><div class="chips" id="practice-types"></div></div>
          <div><p class="label">Difficulty</p><div class="chips" id="practice-diff"></div></div>
          <div><p class="label">Show</p><div class="chips" id="practice-status"></div></div>
          <div class="row"><button class="btn primary" id="practice-start">Start practice</button><span class="count" id="practice-hint"></span></div>
        </div>
      </details>
      <div id="practice-area"></div>
    </section>

    <section id="view-exam" hidden>
      <div id="exam-area"></div>
    </section>

    <section id="view-cards" hidden>
      <div class="panel">
        <p class="label">Region</p>
        <div class="chips" id="card-regions"></div>
        <p class="count" id="card-count" style="margin:10px 0 0"></p>
      </div>
      <div id="card-area"></div>
    </section>

    <section id="view-today" hidden>
      <div id="today-area"></div>
    </section>

    <section id="view-progress" hidden>
      <div id="progress-area"></div>
    </section>

    <section id="view-format" hidden>
      <div class="panel prose" id="format-area"></div>
    </section>
  </div>
</main>

<script>
const DATA = {"regions":[{"code":"sk","name":"Skull & cranial cavity"},{"code":"cns","name":"Brain & spinal cord"},{"code":"cn","name":"Cranial nerves"},{"code":"sp","name":"Vertebral column & back"},{"code":"hn","name":"Head & neck"},{"code":"ul","name":"Upper limb"},{"code":"ll","name":"Lower limb"},{"code":"th","name":"Thorax"},{"code":"ab","name":"Abdomen & pelvis"},{"code":"au","name":"Autonomic nervous system"},{"code":"gp","name":"General principles & embryology"}],"questions":[{"id":"ab-19d24bf4","r":"ab","t":"Anterior abdominal wall nerves","y":1,"d":1,"s":"Concerning the nerves of the anterior abdominal wall:","o":[["The lower six thoracic nerves run between internal oblique and transversus abdominis",1,"This is the neurovascular plane of the abdominal wall."],["T10 supplies the skin of the umbilicus",1,"T7 the subcostal angle, T8 the rib margin."],["The iliohypogastric nerve pierces the external oblique aponeurosis about 2.5 cm above the superficial ring",1,"Last's."],["The ilioinguinal nerve enters the inguinal canal through the deep ring",0,"Last's: it enters the canal from the side by piercing internal oblique, not through the deep ring, and emerges through the superficial ring."]]},{"id":"ab-381782ba","r":"ab","t":"Inguinal canal","y":2,"d":1,"s":"Damage to the ilioinguinal nerve within the inguinal canal would cause:","o":[["Weakness of the conjoint tendon",0,"Last's: within the canal the nerve is sensory only. Its motor branch has already been given off."],["Sensory loss over the root of the penis and anterior scrotum",1,"Its cutaneous territory is L1."],["Loss of the cremasteric reflex",0,"The efferent limb is the genital branch of the genitofemoral nerve."],["Sensory loss over the upper medial thigh",1,"Below the medial end of the inguinal ligament."]],"k":"B"},{"id":"ab-18ea2935","r":"ab","t":"Inguinal canal","y":1,"d":1,"s":"Regarding the inguinal canal and spermatic cord:","o":[["The genital branch of the genitofemoral nerve is a content of the spermatic cord",1,"It supplies cremaster."],["The ilioinguinal nerve is a content of the spermatic cord",0,"It lies in the canal but outside the coverings of the cord."],["The lacunar ligament forms the medial margin of the femoral ring",1,"Its crescentic free edge."],["The conjoint tendon is formed by internal oblique and transversus abdominis aponeuroses",1,"It is attached to the pectineal line."]]},{"id":"ab-9984645a","r":"ab","t":"Testis innervation","y":2,"d":1,"s":"Regarding the innervation of the testis:","o":[["It receives no parasympathetic supply",1,"Gonads and suprarenals receive only sympathetic fibres."],["Its sympathetic supply is mainly from the T10 segment",1,"Last's."],["Testicular pain afferents run with the testicular artery and splanchnic nerves to the T10 dorsal root ganglion",1,"So testicular pain may be referred to the umbilical region."],["Its preganglionic sympathetic fibres relay in the coeliac ganglion region before running with the testicular artery",1,"Last's: fibres from about T10 reach the coeliac ganglion via the greater or lesser splanchnic nerves, and postganglionic fibres follow the testicular artery."]],"k":"E"},{"id":"ab-95b87cd0","r":"ab","t":"Posterior abdominal wall","y":1,"d":1,"s":"Concerning psoas major:","o":[["It arises from the discs and the fibrous arches over the bodies of T12 to L5, and the transverse processes",1,"The lumbar arteries, veins and sympathetic rami pass beneath the arches."],["It is supplied by L1 to L3, mainly L2",1,"Last's."],["Its fascia forms the medial arcuate ligament",1,"From the body of L1 (or L2) to the L1 transverse process."],["Its fascia is part of the thoracolumbar (lumbar) fascia",0,"Last's: the psoas fascia is not part of the lumbar fascia, though its lateral edge blends with the anterior layer."]]},{"id":"ab-872ccbed","r":"ab","t":"Posterior abdominal wall","y":2,"d":1,"s":"The quadratus lumborum:","o":[["Lies in the anterior compartment of the lumbar fascia",1,"Erector spinae lies in the posterior compartment."],["Arises from the iliolumbar ligament and iliac crest",1,"And from the L5 transverse process."],["Inserts into the medial half of the twelfth rib",1,"And the L1 to L4 transverse processes."],["Is supplied by the obturator nerve",0,"It is supplied by T12 to L3 anterior rami."]],"k":"C"},{"id":"ab-d8ae9231","r":"ab","t":"Lumbar sympathetic trunk","y":1,"d":1,"s":"Regarding the lumbar sympathetic trunk:","o":[["The right trunk lies behind the inferior vena cava",1,"The left lies along the left margin of the aorta."],["It lies in front of the lumbar vessels",1,"Although some lumbar veins may pass in front."],["The common iliac vessels lie behind the trunks at the pelvic brim",0,"Last's: the common iliac vessels always lie in front of the trunks."],["Lumbar splanchnic nerves join the coeliac, aortic and superior hypogastric plexuses",1,"Last's."]]},{"id":"ab-ce6b5d16","r":"ab","t":"Pelvic autonomic nerves","y":2,"d":1,"s":"The pelvic splanchnic nerves:","o":[["Arise from S2, S3 and S4",1,"The sacral parasympathetic outflow."],["Are motor to the detrusor muscle",1,"They are the main motor supply to the bladder."],["Supply the colon from the splenic flexure distally",1,"Some fibres run up behind the peritoneum, some via the inferior mesenteric artery."],["Synapse in the inferior hypogastric plexus",0,"Last's: none of the parasympathetic fibres synapse in the plexus. They relay in the walls of the viscera. About half the sympathetic fibres relay there."]],"k":"C"},{"id":"ab-4bfbdc99","r":"ab","t":"Pelvic autonomic nerves","y":1,"d":1,"s":"Concerning the sympathetic supply of the pelvic viscera:","o":[["It is motor to the internal urethral sphincter in the male",1,"Preventing reflux during ejaculation."],["It is motor to the ductus deferens, seminal vesicles and prostate",1,"Emission is sympathetic (L1 and L2)."],["Pain from the body of the uterus travels with the sympathetic nerves to T10 to L1",1,"Pain from the lower cervix travels with the parasympathetics."],["It carries the sensation of distension of the bladder",0,"Distension of bladder and rectum is carried by the pelvic splanchnic (parasympathetic) nerves."]]},{"id":"ab-b14c574d","r":"ab","t":"Micturition","y":2,"d":1,"s":"After complete spinal cord transection above S2:","o":[["Afferent impulses of bladder distension cannot reach consciousness",1,"Last's."],["The bladder may empty reflexly when distended",1,"The sacral centre is intact, as in the infant."],["Cortical inhibition of the sacral reflex is lost",1,"The cortical inhibitory centre is on the medial frontal surface."],["The detrusor is permanently paralysed",0,"Detrusor paralysis with overflow incontinence follows destruction of the sacral segments themselves."]],"k":"C"},{"id":"ab-7709968c","r":"ab","t":"Pudendal nerve","y":1,"d":1,"s":"The pudendal nerve:","o":[["Arises from S2, S3 and S4",1,"From the anterior surfaces of the roots."],["Crosses the sacrospinous ligament medial to the pudendal vessels",1,"It enters the gluteal region briefly then the pudendal canal."],["Gives the inferior rectal nerve to the external anal sphincter",1,"Its perineal branch supplies the external urethral sphincter."],["Supplies the skin of the dorsum of the root of the penis",0,"Last's: the dorsal nerve supplies the whole penis except the dorsum at its root, which is supplied by the ilioinguinal nerve (L1)."]]},{"id":"ab-9050862b","r":"ab","t":"Perineal reflexes","y":2,"d":1,"s":"Regarding perineal reflexes and dermatomes:","o":[["The anal reflex depends on intact sacral segments",1,"Pinprick of perianal skin produces contraction of the external sphincter."],["The bulbocavernosus reflex is mediated mainly by S3",1,"Last's."],["S4 supplies the perianal skin",1,"S5 and Co1 behind the anus and over the coccyx."],["Pain from the prostate may be referred to the posterior thigh",1,"Last's: via the pelvic splanchnics (S2 to S4) to the posterior femoral cutaneous territory, mimicking sciatica."]],"k":"E"},{"id":"ab-31bfa864","r":"ab","t":"Coeliac plexus","y":1,"d":1,"s":"Concerning the coeliac plexus:","o":[["The greater splanchnic nerves pierce the crura to reach the coeliac ganglia",1,"The lesser too."],["Preganglionic fibres to the suprarenal medulla pass through without relay",1,"Last's: the medulla is in effect a modified ganglion."],["Its sympathetic fibres are excitatory to peristalsis",0,"They are inhibitory to peristalsis, motor to sphincters, vasomotor and sensory."],["The vagus contributes parasympathetic fibres to it",1,"Last's."]]},{"id":"ab-2be443ab","r":"ab","t":"Vagus in abdomen","y":2,"d":1,"s":"Regarding the abdominal vagus:","o":[["About 10% of its fibres are afferent",0,"Last's: about 90% of the abdominal vagal fibres are afferent, serving reflex activity."],["Highly selective vagotomy divides the branches to the pyloric antrum",0,"Highly selective vagotomy divides only the branches to the fundus and body, preserving the antral supply (nerves of Latarjet)."],["Vagal afferents carry the main pain sensation from the stomach",0,"Pain from abdominal viscera runs with the sympathetic nerves."],["Truncal vagotomy divides the trunks on the abdominal oesophagus",1,"Last's."]],"k":"D"},{"id":"ab-1ae471ac","r":"ab","t":"Suprarenal glands","y":1,"d":1,"s":"Concerning the suprarenal glands:","o":[["The medulla develops from neural crest",1,"Chromaffin cells."],["The cortex develops from the intermediate cell mass mesoderm",1,"Last's."],["At birth the suprarenal is almost as large as the kidney",1,"Last's anatomy of the child."],["They receive both sympathetic and parasympathetic innervation",0,"Suprarenals and gonads have only sympathetic supply."]]},{"id":"ab-30a3ddc4","r":"ab","t":"Embryology of gut","y":2,"d":1,"s":"The ductus venosus:","o":[["Connects the left branch of the portal vein to the inferior vena cava",1,"Carrying blood from the left umbilical vein."],["Becomes the ligamentum venosum",1,"Bounding the caudate lobe."],["Is connected to the ligamentum teres",1,"The obliterated left umbilical vein."],["Closes at birth by muscular contraction triggered by oxygen",0,"That describes the ductus arteriosus. The ductus venosus clots off when flow stops."]],"k":"C"},{"id":"ab-b4831d09","r":"ab","t":"Child abdomen","y":1,"d":1,"s":"In the newborn:","o":[["The liver is relatively twice as large as in the adult",1,"Its lower border is palpable below the costal margin."],["The appendix arises from the apex of a conical caecum",1,"Last's."],["The fundus of the bladder lies above the symphysis pubis even when empty",1,"The pelvis is small."],["The kidneys have abundant perinephric fat",0,"They are lobulated with very little perinephric fat."]]},{"id":"ab-5bd30151","r":"ab","t":"Pelvic wall","y":2,"d":1,"s":"Concerning the pelvic wall:","o":[["The sacral plexus lies external to the parietal pelvic fascia",1,"Last's: nerves lie outside the fascia, vessels inside."],["Branches of the sacral plexus to the buttock pierce the parietal pelvic fascia",0,"Last's: because the plexus lies behind the fascia (between it and piriformis), its branches to the buttock do not pierce it."],["The pudendal nerve leaves the pelvis above piriformis",0,"It leaves below piriformis through the greater sciatic foramen, crosses the sacrospinous ligament and enters the pudendal canal through the lesser sciatic foramen."],["The internal iliac vessels lie external to the pelvic fascia",0,"The vessels lie internal to (inside) the fascia."]],"k":"A"},{"id":"au-80ab5dd2","r":"au","t":"Sympathetic outflow","y":1,"d":1,"s":"Concerning the sympathetic nervous system:","o":[["Preganglionic cell bodies lie in the lateral horns of T1 to L2",1,"The thoracolumbar outflow."],["Every spinal nerve from C1 to coccygeal carries postganglionic sympathetic fibres",1,"Via grey rami."],["Grey rami contain myelinated preganglionic fibres",0,"White rami contain myelinated preganglionic (and visceral afferent) fibres. Grey rami contain unmyelinated postganglionic fibres."],["Some preganglionic fibres pass to the suprarenal medulla without synapse",1,"A few, via the splanchnic nerves."]]},{"id":"au-bc4629c2","r":"au","t":"Sympathetic trunk","y":2,"d":1,"s":"Regarding the ganglia of the sympathetic trunk:","o":[["The inferior cervical ganglion represents C7, C8 and T1 in all subjects",0,"The inferior ganglion is C7 and C8, and often fuses with T1 to form the stellate ganglion."],["The middle cervical ganglion gives grey rami to C7 and C8",0,"Last's: the middle ganglion gives grey rami to C5 and C6, the inferior to C7 and C8."],["The superior cervical ganglion gives grey rami to C5 and C6",0,"The superior ganglion gives grey rami to C1 to C4 (the cervical plexus)."],["The superior cervical ganglion represents fused C1 to C4 ganglia",1,"Last's."]],"k":"D"},{"id":"au-e34805d9","r":"au","t":"Sympathetic distribution","y":1,"d":1,"s":"Regarding the distribution of sympathetic fibres:","o":[["The main function of sympathetic fibres in spinal nerves is vasoconstriction for thermoregulation",1,"Plus sudomotor and pilomotor fibres."],["Limb arteries receive sympathetic fibres from nearby peripheral nerves, not from fibres running down the vessels",1,"Last's."],["Head and neck arteries receive direct branches from the cervical ganglia",1,"E.g. the internal carotid plexus from the superior ganglion."],["A lesion of the nerve roots proper abolishes sudomotor function in the limb",0,"Last's: grey rami join distal to the roots, so a root lesion does not reduce sympathetic activity. A peripheral nerve lesion does."]]},{"id":"au-62f052cf","r":"au","t":"Splanchnic nerves","y":2,"d":1,"s":"Confusion to be avoided: which of the following are parasympathetic?","o":[["Pelvic splanchnic nerves",1,"S2 to S4 parasympathetic outflow."],["Sacral splanchnic nerves",0,"Last's: sacral splanchnics are sympathetic, from the sacral sympathetic ganglia."],["The greater splanchnic nerves",0,"Sympathetic, preganglionic fibres from the fifth to ninth thoracic ganglia to the coeliac ganglia."],["Lumbar splanchnic nerves",0,"Sympathetic, from the lumbar ganglia to the aortic and superior hypogastric plexuses."]],"k":"A"},{"id":"au-07749fdd","r":"au","t":"Parasympathetic outflow","y":1,"d":1,"s":"Concerning the parasympathetic nervous system:","o":[["It is entirely visceral, with no distribution to the body wall or limbs",1,"Last's."],["Vagal postganglionic cell bodies lie in the walls of the viscera supplied",1,"Heart, lungs and gut."],["The suprarenal glands receive parasympathetic fibres from the vagus",0,"Suprarenals and gonads have only sympathetic supply."],["Sacral preganglionic fibres arise from the lateral grey matter of S2 to S4",1,"Forming the pelvic splanchnic nerves."]]},{"id":"au-383a4dd9","r":"au","t":"Cranial parasympathetic ganglia","y":2,"d":1,"s":"In the cranial parasympathetic ganglia:","o":[["Only the parasympathetic fibres synapse",1,"Sympathetic and sensory fibres pass through."],["The sympathetic root carries postganglionic fibres whose preganglionic cells are in T1 to T3",1,"Via the superior cervical ganglion."],["The ciliary and pterygopalatine ganglia receive sympathetic fibres via branches of the internal carotid artery",1,"The otic and submandibular via branches of the external carotid."],["The sensory root contains cell bodies of trigeminal sensory neurones",0,"The sensory root carries peripheral processes whose cell bodies are in the trigeminal ganglion. There are no sensory cell bodies in the parasympathetic ganglia."]],"k":"C"},{"id":"au-1901da22","r":"au","t":"Horner's syndrome","y":1,"d":1,"s":"Regarding the sympathetic pathway to the eye and Horner's syndrome:","o":[["The central pathway descends from the posterolateral hypothalamus through the lateral brainstem near the spinal lemniscus",1,"Last's."],["Preganglionic fibres leave the cord in the T1 white ramus and ascend to synapse in the superior cervical ganglion",1,"Last's."],["Ptosis results from paralysis of the smooth muscle part of levator palpebrae superioris",1,"These fibres reach the muscle via the oculomotor nerve."],["Anhidrosis occurs with postganglionic lesions above the superior cervical ganglion",0,"Last's: anhidrosis occurs only with central or preganglionic lesions, because sudomotor fibres to the face follow the external carotid branches."]]},{"id":"au-15720955","r":"au","t":"Visceral afferents","y":2,"d":1,"s":"Concerning visceral afferent pathways:","o":[["Cranial parasympathetic afferent cell bodies lie in the dorsal motor nucleus of the vagus",0,"Last's: their cell bodies lie in the inferior ganglia of IX and X, and the central processes pass to the nucleus of the tractus solitarius."],["Grey rami carry visceral afferent fibres",0,"Visceral afferents travel in the white rami with the preganglionic efferents."],["Visceral pain from abdominal organs travels mainly with the vagus",0,"Pain from abdominal viscera travels with the sympathetic nerves."],["Pelvic parasympathetic afferent cell bodies lie in the posterior root ganglia of S2 to S4",1,"They serve bladder reflexes and pain from the pelvic viscera."]],"k":"D"},{"id":"au-879ed339","r":"au","t":"Cardiac and pulmonary autonomics","y":1,"d":1,"s":"Regarding autonomic supply of the thoracic viscera:","o":[["Cardiac pain afferents usually have cell bodies in the T1 to T5 dorsal root ganglia",1,"Last's: pain from the heart is subserved by the sympathetic system because the heart is a modified blood vessel."],["The vagus is sensory to the oesophagus, trachea and lungs",1,"Last's."],["Sympathetic supply to the lungs is from T2 to T6",1,"Dilator to bronchi and arterioles."],["The vagus carries pain fibres from the stomach and colon",0,"Last's: vagal branches to the gut are motor and secretomotor but do not carry pain fibres."]]},{"id":"au-0bd267ea","r":"au","t":"Autonomic control of pupil","y":2,"d":1,"s":"Concerning the pupil:","o":[["In the Argyll Robertson pupil the accommodation reflex is lost but the light reflex is preserved",0,"The reverse: the light reflex is lost and accommodation preserved, from a pretectal lesion."],["Dilator pupillae is supplied by sympathetic fibres travelling in the long ciliary nerves",1,"Picked up by the ophthalmic nerve in the cavernous sinus."],["The ciliary muscle is of ectodermal origin",0,"Last's: sphincter and dilator pupillae are ectodermal, but the ciliary muscle is mesodermal."],["Sphincter pupillae is supplied by parasympathetic fibres relaying in the ciliary ganglion",1,"Via the short ciliary nerves."]],"k":"B"},{"id":"au-5b9278f4","r":"au","t":"Hypothalamus and autonomics","y":1,"d":1,"s":"Regarding central autonomic control:","o":[["Hypothalamic cells send long axons by a descending sympathetic tract to the thoracolumbar lateral horn",1,"The tract lies adjacent to the lateral horn in the cord."],["The vasomotor and respiratory centres lie in the medullary reticular formation",1,"Not anatomically distinct nuclei."],["Hypoxia is detected mainly by central medullary chemoreceptors",0,"Last's: hypoxia is detected peripherally by the carotid and aortic bodies. The brain responds to CO2, not oxygen."],["The inspiratory centre lies near the nucleus of the tractus solitarius",1,"Last's: a kind of respiratory SA node."]]},{"id":"cn-bc2bcde6","r":"cn","t":"Facial nerve and colliculus","y":2,"d":2,"s":"Intrinsic fibres arising from the facial motor nucleus:","o":[["Loop around the abducent nucleus forming the internal genu",1,"The genu and abducent nucleus together raise the facial colliculus."],["Pass through the red nucleus",0,"That is the oculomotor nerve."],["Leave the brainstem through the inferior cerebellar peduncle",0,"They emerge at the lower border of the pons, above the olive."],["Arise from a nucleus lying in the floor of the fourth ventricle directly beneath the colliculus",0,"Last's: the facial nucleus lies deep in the reticular formation of the lower pons. The abducent nucleus, not the facial nucleus, lies beneath the colliculus."]],"k":"A"},{"id":"cn-4ceb507c","r":"cn","t":"Oculomotor nucleus","y":2,"d":2,"s":"Regarding the oculomotor nuclear complex:","o":[["The superior rectus subnucleus supplies the contralateral superior rectus",1,"Its fibres cross, so a nuclear lesion causes bilateral superior rectus weakness."],["Each levator palpebrae is supplied from its own side only",0,"Levator is supplied from a single midline central caudal subnucleus to both sides, so nuclear lesions give bilateral ptosis."],["The Edinger-Westphal nucleus lies caudal to the somatic nucleus",0,"Last's: it lies cranial (rostral) to the somatic part."],["A unilateral nuclear lesion can produce isolated unilateral ptosis",0,"Because levator is supplied from a single midline subnucleus, ptosis from a nuclear lesion is bilateral."]],"k":"A"},{"id":"cn-b44bc636","r":"cn","t":"Trochlear nerve","y":2,"d":2,"s":"A right trochlear nucleus lesion produces:","o":[["Weakness of the right superior oblique",0,"Trochlear fibres decussate, so the right nucleus supplies the left superior oblique."],["Weakness of the left superior oblique",1,"Last's: each trochlear nerve supplies the superior oblique of the opposite side."],["Head tilt towards the left",0,"Patients tilt the head away from the side of the weak superior oblique, i.e. towards the right here."],["Vertical diplopia worse on looking down and to the right",1,"The left superior oblique depresses the adducted left eye, which occurs on looking down and right."]],"k":"B"},{"id":"cn-fe8977e3","r":"cn","t":"Abducent nerve","y":1,"d":2,"s":"Regarding the abducent nerve in the posterior fossa and petrous apex:","o":[["It runs upward between the anterior inferior cerebellar artery and the pons",1,"Last's: in the pontine cistern."],["It pierces the dura on the clivus above the level of the jugular tubercle",1,"Last's."],["It enters the cavernous sinus through the inferior petrosal sinus beneath the petroclinoid ligament",1,"Dorello's canal."],["It enters the tendinous ring above the superior division of the oculomotor nerve",0,"Last's: it enters below the inferior division of III."]]},{"id":"cn-96f58cf2","r":"cn","t":"Trigeminal root","y":2,"d":2,"s":"Concerning the trigeminal nerve root and Meckel's cave:","o":[["In Meckel's cave the mandibular fibres lie most laterally and the ophthalmic most medially",1,"Last's: at the pons the mandibular fibres are superior and ophthalmic inferior; the root then rotates."],["The motor root emerges above and medial to the sensory root",1,"Last's. It spirals to enter the cave below the sensory root."],["The cave contains CSF around the posterior half of the ganglion",1,"Last's: the dura fuses with the pia halfway along the ganglion."],["The ganglion's chief blood supply is the posterior communicating artery",0,"Last's: ganglionic branches of the ICA and, appreciably, the accessory meningeal artery."]],"k":"C"},{"id":"cn-7453a3c6","r":"cn","t":"Trigeminal root","y":1,"d":2,"s":"An extradural middle fossa approach to the trigeminal ganglion:","o":[["Is possible because the anterior ganglion and mandibular division lie between two layers of dura",1,"Last's."],["May cause transient facial palsy from traction on the greater petrosal nerve",1,"Last's: oedema at the geniculate ganglion compresses facial motor fibres."],["Necessarily enters the subarachnoid space to reach the sensory root",0,"The sensory root and posterior half of the ganglion are bathed in CSF, but the extradural approach to the anterior ganglion avoids the subarachnoid space."],["Risks the abducent nerve less than the trochlear nerve because the abducent lies in the lateral sinus wall",0,"VI lies within the sinus, not in its lateral wall."]]},{"id":"cn-31784bf2","r":"cn","t":"Jugular foramen","y":1,"d":2,"s":"At the jugular foramen:","o":[["The glossopharyngeal nerve lies lateral to the inferior petrosal sinus in the anterior compartment",1,"Last's."],["The vagus lies lateral to the accessory nerve",0,"Last's: the accessory lies lateral to the vagus in the middle compartment."],["The cochlear canaliculus opens into the glossopharyngeal notch",1,"Last's: perilymph drains to the subarachnoid space here."],["The jugular bulb occupies the posterior and largest compartment",1,"Last's."]]},{"id":"cn-783b5baf","r":"cn","t":"Vagus and accessory","y":1,"d":2,"s":"Concerning the vagus and cranial accessory nerve:","o":[["The superior vagal ganglion contains cell bodies for the meningeal and auricular branches",1,"Last's."],["The inferior vagal ganglion contains cell bodies of the other vagal sensory fibres",1,"Including laryngeal, cardiac and visceral afferents."],["The cranial accessory fibres join the vagus at the inferior vagal ganglion",1,"Last's: they are effectively the vagal motor root from the nucleus ambiguus."],["The spinal accessory rootlets emerge anterior to the denticulate ligament",0,"Last's: they emerge from the lateral cord behind the denticulate ligament."]]},{"id":"cn-cba2ca31","r":"cn","t":"Hypoglossal nerve","y":2,"d":2,"s":"Regarding the hypoglossal nerve:","o":[["Its rootlets pass through the inferior olivary nucleus before emerging",1,"Last's."],["All its non-lingual branches carry C1 fibres",1,"Meningeal, superior root of ansa, thyrohyoid and geniohyoid."],["It exits the skull medial and posterior to the jugular foramen",1,"Last's: the hypoglossal canal lies deep to the jugular foramen."],["It supplies all the intrinsic and extrinsic muscles of the tongue",0,"Palatoglossus is supplied by the pharyngeal plexus."]],"k":"C"},{"id":"cn-10f3def0","r":"cn","t":"Optic pathway","y":1,"d":2,"s":"Concerning the arterial supply and relations of the optic pathway (Last's):","o":[["The optic tract is supplied chiefly by the anterior choroidal and posterior communicating arteries",1,"Last's."],["The chiasma and intracranial optic nerve are supplied by the anterior cerebral artery",1,"Last's."],["A pituitary tumour first compresses the upper posterior part of the chiasma",0,"Last's: it presses on the lower anterior part of the chiasma and the medial sides of the optic nerves."],["The central retinal artery supplies about the anterior 1 cm of the intraorbital nerve",1,"Last's: the posterior 2 cm by the ophthalmic artery."]]},{"id":"cn-8314b1ac","r":"cn","t":"Cranial nerve fibre counts","y":1,"d":2,"s":"According to Last's, the approximate numbers of fibres in cranial nerves are:","o":[["Oculomotor about 24 000",1,"Last's."],["Trochlear about 34 000",0,"About 3400; it is the smallest cranial nerve."],["Abducent about 6600",1,"Last's."],["Cochlear about 3000",0,"About 30 000. The vestibular nerve has about 18 000."]]},{"id":"cn-d1e33f9d","r":"cn","t":"Skull base relations","y":1,"d":2,"s":"On the base of the skull:","o":[["Foramen rotundum lies anteromedial to foramen ovale",1,"Foramen rotundum lies in front of and slightly medial to foramen ovale, opening into the pterygopalatine fossa."],["The carotid canal opens posterior to foramen ovale",1,"The carotid canal lies posteromedial to foramen ovale and spinosum, in the petrous bone."],["Foramen spinosum lies anteromedial to foramen ovale",0,"Foramen spinosum lies posterolateral to foramen ovale."],["The petrosal foramen, when present, lies behind foramen ovale and transmits the lesser petrosal nerve",1,"Last's. The venous foramen of Vesalius lies medial to it."]]},{"id":"cn-1f6b58de","r":"cn","t":"Olfactory nerve","y":1,"d":1,"src":"Last's text","s":"Concerning the olfactory pathway, as described in Last's:","o":[["The first neurons are bipolar cells scattered in the neuroepithelium",1,"Last's calls this \"a unique occurrence\". (Last's page pg 629)"],["About 40 olfactory nerve filaments pass through the cribriform plate",0,"Last's: \"nearly 20\" filaments. (Last's page pg 629)"],["The filaments pierce the dura and arachnoid of the anterior cranial fossa",1,"They pass through the cribriform plate of the ethmoid and pierce the meninges there. (Last's page pg 629)"],["The olfactory tract ends in the region of the posterior perforated substance and the uncus",0,"It ends in the region of the anterior perforated substance and the uncus. (Last's page pg 629)"]]},{"id":"cn-6bf33d3d","r":"cn","t":"Olfactory nerve","y":1,"d":1,"src":"Last's text","s":"Regarding the olfactory pathway:","o":[["The second-order neurons are the mitral cells of the olfactory bulb",1,"The filaments synapse on the mitral cells. (Last's page pg 629)"],["The second-order neuron relays in the thalamus before reaching the cortex",0,"The arrangement is \"primitive\": the second-order neuron directly activates the conscious cortex, by-passing the thalamus. (Last's page pg 629)"],["Polysynaptic olfactory pathways activate hypothalamic and brainstem nuclei",1,"These serve visceral and somatic effects distinct from conscious appreciation. (Last's page pg 629)"],["Three neurons link the neuroepithelium to the olfactory cortex",0,"Last's: trace the two neurons to the olfactory cortex. (Last's page pg 629)"]]},{"id":"cn-54d8bac3","r":"cn","t":"Optic pathway","y":1,"d":1,"src":"Last's text","s":"Concerning the retina and optic nerve (Last's):","o":[["The bipolar cells of the retina are the first sensory neurons",1,"Rods and cones activate the bipolar cells, which are the first sensory neurons. (Last's page pg 629-30)"],["The ganglion cells lie on the choroidal surface of the retina",0,"The rods and cones lie near the choroidal surface; the large ganglion cells lie scattered on the vitreous surface. (Last's page pg 629-30)"],["The optic nerve fibres are the central processes of the ganglion cells",1,"These second neurons converge to the optic disc. (Last's page pg 629-30)"],["The temporal fibres from each retina decussate in the chiasma",0,"The nasal fibres decussate. (Last's page pg 629-30)"]]},{"id":"cn-d38e4184","r":"cn","t":"Optic pathway","y":1,"d":1,"src":"Last's text","s":"Regarding the lateral geniculate body:","o":[["Crossed nasal fibres relay in layers 2, 3 and 5",0,"Crossed nasal fibres relay in layers 1, 4 and 6; temporal (uncrossed) fibres in layers 2, 3 and 5. (Last's page pg 629-30)"],["Temporal fibres relay in layers 2, 3 and 5",1,"Last's. (Last's page pg 629-30)"],["Third-order fibres leave through the retrolentiform part of the internal capsule",1,"They then pass back in the optic radiation. (Last's page pg 629-30)"],["Third-order fibres leave through the sublentiform part of the internal capsule",0,"The sublentiform part carries the auditory radiation; the optic radiation is retrolentiform. (Last's page pg 629-30)"]]},{"id":"cn-575c4076","r":"cn","t":"Optic pathway","y":1,"d":1,"src":"Last's text","s":"The optic tract and visual cortex:","o":[["The optic tract passes around the cerebral peduncle",1,"Last's: around the midbrain (cerebral peduncle). (Last's page pg 629-30)"],["The optic tract has three destinations",1,"Lateral geniculate body, pretectal nuclei and superior colliculus. (Last's page pg 629-30)"],["In the visual cortex the macula is represented anteriorly",0,"The macula is represented posteriorly; more peripheral retina registers more anteriorly. (Last's page pg 629-30)"],["The superior colliculus fibres mediate pupillary constriction to light",0,"The pretectal nuclei mediate pupillary constriction; the superior colliculus serves body reflexes to light. (Last's page pg 629-30)"]]},{"id":"cn-c42507dc","r":"cn","t":"Oculomotor nerve","y":1,"d":1,"src":"Last's text","s":"The oculomotor nucleus:","o":[["Lies at the level of the superior colliculi",1,"In the grey matter in the floor of the aqueduct, near the midline. (Last's page pg 630)"],["Has an Edinger-Westphal part lying caudal to the somatic nucleus",0,"The Edinger-Westphal (accessory oculomotor) nucleus lies cranial to the somatic nucleus. (Last's page pg 630)"],["Gives rise to about 24 000 fibres",1,"Last's. (Last's page pg 630)"],["Sends fibres that traverse the brainstem with a medial convexity",0,"The fibres traverse the brainstem with a lateral convexity, through the red nucleus and substantia nigra. (Last's page pg 630)"]]},{"id":"cn-4a69c54a","r":"cn","t":"Oculomotor nerve","y":1,"d":1,"src":"Last's text","s":"Concerning the intracranial course of the oculomotor nerve:","o":[["It is attached to the medial surface of the base of the cerebral peduncle, just above the pons",1,"Last's. (Last's page pg 630)"],["It passes forwards between the posterior cerebral and superior cerebellar arteries",1,"Last's. (Last's page pg 630)"],["It passes above and medial to the posterior communicating artery",0,"It passes below and lateral to the posterior communicating artery. (Last's page pg 630)"],["It runs just above the free margin of the tentorium",0,"It runs just below the free margin of the tentorium cerebelli. (Last's page pg 630)"]]},{"id":"cn-1810372f","r":"cn","t":"Oculomotor nerve","y":1,"d":1,"src":"Last's text","s":"The oculomotor nerve reaching the cavernous sinus:","o":[["Traverses the interpeduncular cistern below the floor of the third ventricle",1,"Last's. (Last's page pg 630)"],["Lies above the optic tract",0,"It lies below the optic tract. (Last's page pg 630)"],["Pierces the roof of the cavernous sinus just behind the upward bend of the internal carotid",1,"Last's. (Last's page pg 630)"],["Runs a tortuous course with a steep upward slope",0,"Last's: the nerve runs straight with a gentle downward slope. (Last's page pg 630)"]]},{"id":"cn-9f2dde1c","r":"cn","t":"Oculomotor nerve","y":1,"d":1,"src":"Last's text","s":"In the cavernous sinus and orbit, the oculomotor nerve:","o":[["Lies in the lateral wall above the abducent nerve",1,"Last's. (Last's page pg 630)"],["Slants down lateral to the trochlear and ophthalmic nerves",0,"It slants down medial to the trochlear nerve and the ophthalmic branch of the trigeminal. (Last's page pg 630)"],["Picks up sympathetic fibres from the internal carotid plexus for the smooth muscle part of levator palpebrae superioris",1,"Loss of these fibres accounts for the partial ptosis of Horner's syndrome. (Last's page pg 630)"],["Divides into superior and inferior divisions at the posterior pole of the cavernous sinus",0,"It divides at the anterior pole of the sinus and immediately enters the tendinous ring. (Last's page pg 630)"]]},{"id":"cn-b128239d","r":"cn","t":"Oculomotor nerve","y":1,"d":1,"src":"Last's text","s":"Within the tendinous ring and orbit:","o":[["The nasociliary nerve lies between the two divisions of the oculomotor nerve",1,"Last's. (Last's page pg 630)"],["The abducent nerve lies above the oculomotor nerve",0,"The abducent nerve lies below it. (Last's page pg 630)"],["Each branch enters the ocular surface of its muscle one-third of the way along",1,"Superior rectus, medial rectus and inferior rectus. (Last's page pg 630)"],["The Edinger-Westphal fibres run in the nerve to medial rectus",0,"They are in the proximal part of the nerve to inferior oblique. (Last's page pg 630)"]]},{"id":"cn-940831d6","r":"cn","t":"Oculomotor nerve","y":1,"d":1,"src":"Last's text","s":"Regarding the ciliary ganglion connections of the oculomotor nerve:","o":[["The parasympathetic fibres relay in the ciliary ganglion",1,"Last's. (Last's page pg 630)"],["The short ciliary nerves supply sphincter pupillae and the ciliary muscle",1,"For pupil constriction and accommodation. (Last's page pg 630)"],["The inferior division gives two branches only",0,"It breaks up quickly into three branches: to medial rectus, inferior rectus and inferior oblique. (Last's page pg 630)"],["Some afferent fibres passing through the ganglion without relay supply the conjunctiva",0,"Last's: they supply the cornea. (Last's page pg 630)"]]},{"id":"cn-e0b30bfa","r":"cn","t":"Trochlear nerve","y":1,"d":1,"src":"Last's text","s":"The trochlear nucleus and nerve:","o":[["The nucleus lies at the level of the inferior colliculi",1,"In the floor of the aqueduct near the midline. (Last's page pg 630)"],["The nerve contains about 34 000 fibres",0,"About 3400. (Last's page pg 630)"],["The fibres decussate completely ventral to the aqueduct",0,"They decussate dorsal to the aqueduct. (Last's page pg 630)"],["The nerve emerges through the apex of the superior medullary velum",1,"Dorsally near the midline behind the inferior colliculus. (Last's page pg 630)"]]},{"id":"cn-8b877c47","r":"cn","t":"Trochlear nerve","y":1,"d":1,"src":"Last's text","s":"Concerning the course of the trochlear nerve:","o":[["It clings to the under surface of the free edge of the tentorium",1,"Last's. (Last's page pg 630)"],["It pierces the roof of the cavernous sinus behind the oculomotor nerve",1,"Where the free and attached margins of the tentorium cross. (Last's page pg 630)"],["It runs forwards in the lateral wall of the cavernous sinus above the third nerve",0,"It runs below the third nerve, which then crosses it medially, so IV becomes the uppermost nerve at the anterior end of the sinus. (Last's page pg 630)"],["It enters the superior orbital fissure within the tendinous ring",0,"It enters lateral to the tendinous ring and passes over levator palpebrae superioris. (Last's page pg 630)"]]},{"id":"cn-58245bfe","r":"cn","t":"Trochlear nerve","y":2,"d":1,"src":"Last's text","s":"The trochlear nerve:","o":[["Enters the ocular surface of superior oblique",0,"It enters the orbital surface, one-third of the way along the muscle. (Last's page pg 630)"],["Becomes the uppermost nerve at the anterior end of the cavernous sinus",1,"Because the third nerve crosses it medially. (Last's page pg 630)"],["Passes beneath levator palpebrae superioris in the orbit",0,"It passes over levator palpebrae superioris. (Last's page pg 630)"],["Runs between the posterior cerebral and superior cerebellar arteries",1,"Last's. (Last's page pg 630)"]],"k":"B"},{"id":"cn-7ccea740","r":"cn","t":"Trigeminal nuclei","y":1,"d":1,"src":"Last's text","s":"Regarding the trigeminal nuclei (Last's):","o":[["The motor nucleus is in the upper pons, deep beneath the floor of the fourth ventricle",1,"It is branchial, for first arch muscles, and so lies off centre. (Last's page pg 631)"],["The sensory nuclei extend down to the fifth cervical segment",0,"The spinal nucleus extends to the third cervical segment (the upper two or three segments). (Last's page pg 631)"],["The mesencephalic nucleus lies lateral to the aqueduct in the central grey",1,"Through the whole length of the midbrain. (Last's page pg 631)"],["The main sensory nucleus lies medial to the motor nucleus",0,"It lies lateral to the motor nucleus and ventral to the superior cerebellar peduncle. (Last's page pg 631)"]]},{"id":"cn-b9f5a43e","r":"cn","t":"Trigeminal nuclei","y":1,"d":1,"src":"Last's text","s":"The mesencephalic nucleus of the trigeminal:","o":[["Contains the cell bodies of first-order neurons",1,"Unique: their peripheral processes pass straight through the trigeminal ganglion. (Last's page pg 631)"],["Mediates proprioception from muscles supplied by the oculomotor, trochlear, abducent and facial nerves",1,"And probably the hypoglossal. (Last's page pg 631)"],["Synapses with first-order neurons from the trigeminal ganglion",0,"Its cell bodies are themselves the first-order neurons. (Last's page pg 631)"],["Mediates pain and temperature from the face",0,"That is the spinal nucleus. (Last's page pg 631)"]]},{"id":"cn-d149cacb","r":"cn","t":"Trigeminal nuclei","y":1,"d":1,"src":"Last's text","s":"The spinal trigeminal nucleus:","o":[["Extends from the lower pons through the whole medulla",1,"Continuous below with the gelatinous substance of the cord. (Last's page pg 631)"],["Mediates pain and temperature",1,"Last's. (Last's page pg 631)"],["Is classically said to receive ophthalmic fibres in its uppermost part",0,"The classical description is upside-down: ophthalmic fibres in the lowest part and mandibular in the uppermost. (Last's page pg 631)"],["Is shown clinically to have a strictly divisional (V1, V2, V3) pattern",0,"Clinical observations indicate an onion-skin pattern, working backwards from the mouth. (Last's page pg 631)"]]},{"id":"cn-5ef90a67","r":"cn","t":"Trigeminal root","y":1,"d":1,"src":"Last's text","s":"The trigeminal roots and cave (Last's):","o":[["The sensory root is attached to the pons well lateral and just above centre",1,"Last's. (Last's page pg 631)"],["The motor root emerges slightly caudal and lateral to the sensory root",0,"It emerges slightly cranial and medial to its companion. (Last's page pg 631)"],["The roots pass below the tentorium to the mouth of the trigeminal cave",1,"Last's. (Last's page pg 631)"],["The cave is a prolongation of dura over the lower border of the petrous apex",0,"It crosses the upper border of the petrous bone near its apex. (Last's page pg 631)"]]},{"id":"cn-c5b7650f","r":"cn","t":"Trigeminal root","y":1,"d":1,"src":"Last's text","s":"The trigeminal cave and ganglion:","o":[["The dural sheath peels apart the two layers of dura flooring the middle fossa",1,"Just lateral to where the same two layers enclose the cavernous sinus. (Last's page pg 631)"],["The dura fuses with the pia at the posterior extremity of the ganglion",0,"Fusion is halfway along the ganglion, the anterior extremity of the cave. (Last's page pg 631)"],["The ophthalmic and maxillary divisions pass forwards in the lateral wall of the cavernous sinus",1,"Both are wholly sensory. (Last's page pg 631)"],["The mandibular division passes forwards in the lateral wall of the cavernous sinus before turning down",0,"It passes straight down from the lower part of the ganglion to foramen ovale, where the motor root joins it. (Last's page pg 631)"]]},{"id":"cn-0ab9be6e","r":"cn","t":"Ophthalmic nerve","y":1,"d":1,"src":"Last's text","s":"The ophthalmic division (Last's):","o":[["Is the nerve of the frontonasal process",1,"Last's. (Last's page pg 631)"],["Leaves the lower part of the trigeminal ganglion",0,"It leaves the upper part. (Last's page pg 631)"],["Runs in the lateral wall of the cavernous sinus above the trochlear nerve",0,"It runs below the trochlear nerve. (Last's page pg 631)"],["Picks up sympathetic fibres from the cavernous plexus for dilator pupillae",1,"Last's. (Last's page pg 631)"]]},{"id":"cn-7bb8241e","r":"cn","t":"Ophthalmic nerve","y":1,"d":1,"src":"Last's text","s":"The tentorial (meningeal) branches of the ophthalmic nerve:","o":[["Arise at the anterior end of the cavernous sinus",1,"Last's. (Last's page pg 631)"],["Supply most of the supratentorial dura",1,"All of it except that in the bony floor of the middle cranial fossa. (Last's page pg 631)"],["Supply the dura of the floor of the middle cranial fossa",0,"This is the exception: the middle fossa floor is supplied by maxillary and mandibular meningeal branches. (Last's page pg 631)"],["Arise after the nerve divides into its three branches",0,"They arise before it breaks into lacrimal, frontal and nasociliary. (Last's page pg 631)"]]},{"id":"cn-954b61bd","r":"cn","t":"Ophthalmic nerve","y":1,"d":1,"src":"Last's text","s":"The lacrimal and frontal nerves:","o":[["The lacrimal nerve passes lateral to the tendinous ring",1,"Last's. (Last's page pg 631-2)"],["The lacrimal nerve runs along the lower part of the lateral orbital wall",0,"It runs along the upper part; the zygomatic nerve runs along the lower part. (Last's page pg 631-2)"],["The frontal nerve lies between the lacrimal and trochlear nerves in the superior orbital fissure",1,"Bunched together lateral to the tendinous ring. (Last's page pg 631-2)"],["The frontal nerve runs below levator palpebrae superioris",0,"It runs forward in contact with orbital periosteum above levator. (Last's page pg 631-2)"]]},{"id":"cn-d2272027","r":"cn","t":"Ophthalmic nerve","y":1,"d":1,"src":"Last's text","s":"Branches of the frontal nerve:","o":[["The supraorbital branch is larger than the supratrochlear",1,"A large supraorbital and a small supratrochlear branch. (Last's page pg 631-2)"],["The supraorbital nerve supplies the frontal sinus",1,"And the forehead except a central strip, and frontal scalp up to the vertex. (Last's page pg 631-2)"],["The supraorbital nerve supplies the scalp back to the lambdoid suture",0,"Up to the vertex. (Last's page pg 631-2)"],["The supratrochlear nerve extends well beyond the hairline",0,"It scarcely extends beyond the hairline, where the two supraorbital nerves meet. (Last's page pg 631-2)"]]},{"id":"cn-34b5aaf3","r":"cn","t":"Ophthalmic nerve","y":1,"d":1,"src":"Last's text","s":"The nasociliary nerve:","o":[["Enters the tendinous ring between the two divisions of the oculomotor nerve",1,"Last's. (Last's page pg 631-2)"],["Crosses below the optic nerve",0,"It passes above the optic nerve. (Last's page pg 631-2)"],["Runs along the medial wall below superior oblique and above medial rectus",1,"Last's. (Last's page pg 631-2)"],["Changes its name to posterior ethmoidal and then external nasal",0,"It changes name to anterior ethmoidal and then external nasal. (Last's page pg 631-2)"]]},{"id":"cn-0e1c12c7","r":"cn","t":"Ophthalmic nerve","y":1,"d":1,"src":"Last's text","s":"The anterior ethmoidal nerve:","o":[["Lies in the roof of the middle and anterior ethmoidal air cells",1,"Supplying their mucous membranes. (Last's page pg 631-2)"],["Makes a brief appearance in the anterior cranial fossa between two layers of dura",1,"On the cribriform plate. (Last's page pg 631-2)"],["Supplies the posteroinferior half of the nasal septum",0,"It supplies the anterosuperior quadrant of the lateral wall and anterosuperior half of the septum. (Last's page pg 631-2)"],["Enters the nose through the foramen caecum",0,"It descends through the slit alongside the crista galli. (Last's page pg 631-2)"]]},{"id":"cn-1f93b97c","r":"cn","t":"Ophthalmic nerve","y":1,"d":1,"src":"Last's text","s":"Branches of the nasociliary nerve:","o":[["The infratrochlear nerve arises just before the nasociliary enters the anterior ethmoidal foramen",1,"Last's. (Last's page pg 631-2)"],["The posterior ethmoidal nerve arises distal to the infratrochlear nerve",0,"It arises proximal to the infratrochlear. (Last's page pg 631-2)"],["The posterior ethmoidal nerve does not reach the nasal cavity",1,"It supplies posterior ethmoidal cells and sphenoid sinus, and is often very small or absent. (Last's page pg 631-2)"],["The long ciliary nerves are usually four in number",0,"Usually two. (Last's page pg 631-2)"]]},{"id":"cn-ff7a8a63","r":"cn","t":"Ophthalmic nerve","y":1,"d":1,"src":"Last's text","s":"Ciliary nerves (Last's):","o":[["The communicating branch to the ciliary ganglion is its sensory root",1,"Its fibres pass through the ganglion. (Last's page pg 631-2)"],["There are usually 2-3 short ciliary nerves",0,"There are 8-10 short ciliary nerves. (Last's page pg 631-2)"],["The long ciliary nerves carry sympathetic fibres to dilator pupillae",1,"Picked up by the ophthalmic nerve in the cavernous sinus. (Last's page pg 631-2)"],["The ciliary nerves supply sensation to the conjunctiva",0,"They supply the eye including the cornea, but not the conjunctiva. (Last's page pg 631-2)"]]},{"id":"cn-472eff84","r":"cn","t":"Maxillary nerve","y":1,"d":1,"src":"Last's text","s":"The maxillary nerve:","o":[["Is the nerve of the maxillary process of the first arch",1,"Last's. (Last's page pg 632)"],["Leaves the upper part of the trigeminal ganglion",0,"It leaves the middle part; the ophthalmic leaves the upper part. (Last's page pg 632)"],["Runs in the lateral wall of the cavernous sinus below the ophthalmic nerve",1,"Last's. (Last's page pg 632)"],["Is directed into foramen rotundum because the lateral wall fuses with dura at the medial margin of the foramen",0,"Fusion is at the lateral margin of foramen rotundum. (Last's page pg 632)"]]},{"id":"cn-3fc75fe4","r":"cn","t":"Maxillary nerve","y":1,"d":1,"src":"Last's text","s":"Concerning the maxillary nerve in the pterygopalatine fossa and orbit:","o":[["It enters the upper part of the pterygopalatine fossa",1,"Through foramen rotundum. (Last's page pg 632)"],["It runs laterally for a centimetre or so in the inferior orbital fissure",1,"And becomes the infraorbital nerve there. (Last's page pg 632)"],["Its middle meningeal branch supplies the posterior half of the middle cranial fossa",0,"It supplies the anterior half; the nervus spinosus supplies the posterior half. (Last's page pg 632)"],["Its trunk runs just above the roof of the fossa",0,"It runs below the roof of the fossa. (Last's page pg 632)"]]},{"id":"cn-8811bfdc","r":"cn","t":"Pterygopalatine ganglion","y":1,"d":1,"src":"Last's text","s":"The pterygopalatine ganglion and its connections:","o":[["The ganglionic branches form a single stout trunk despite their plural name",1,"It passes downwards and medially to the ganglion. (Last's page pg 632-3)"],["Most maxillary fibres pass through the ganglion into its branches",1,"Mingling with postganglionic fibres of the nerve of the pterygoid canal. (Last's page pg 632-3)"],["The nasopalatine nerve supplies the anterosuperior half of the nasal septum",0,"It supplies the posteroinferior half of the septum; the anterior ethmoidal supplies the anterosuperior half. (Last's page pg 632-3)"],["The nasopalatine nerve supplies the gum behind the canines",0,"It supplies the gum behind the two incisor teeth via the incisive canal. (Last's page pg 632-3)"]]},{"id":"cn-146834e3","r":"cn","t":"Pterygopalatine ganglion","y":1,"d":1,"src":"Last's text","s":"Palatine and pharyngeal branches:","o":[["The greater palatine nerve runs between the perpendicular plate of the palatine bone and the body of the maxilla",1,"In the greater palatine canal. (Last's page pg 632-3)"],["The greater palatine nerve supplies all the hard palate except the incisor gum",1,"Last's. (Last's page pg 632-3)"],["The lesser palatine nerves supply only the oral surface of the soft palate",0,"They supply both surfaces of the soft palate and the tonsil. (Last's page pg 632-3)"],["The pharyngeal branch passes through the pterygoid canal",0,"It passes back through the palatovaginal canal. (Last's page pg 632-3)"]]},{"id":"cn-e6ca338b","r":"cn","t":"Pterygopalatine ganglion","y":1,"d":1,"src":"Last's text","s":"Nerve supply of the nasal walls (Last's):","o":[["Posterior superior lateral and medial nasal nerves supply the posterosuperior quadrant of the lateral wall and septum",1,"They enter through the sphenopalatine foramen. (Last's page pg 632-3)"],["Branches of the greater palatine nerve supply the posteroinferior quadrant of the lateral wall",1,"And the adjacent floor of the nose. (Last's page pg 632-3)"],["The pharyngeal branch supplies nasopharyngeal mucosa down to the soft palate's free border",0,"Down to the level of the opening of the auditory tube. (Last's page pg 632-3)"],["The anterior superior alveolar nerve supplies the posterosuperior quadrant of the lateral nasal wall",0,"It reaches the anteroinferior quadrant, including the nasolacrimal duct. (Last's page pg 632-3)"]]},{"id":"cn-2ad0e3ad","r":"cn","t":"Maxillary nerve","y":1,"d":1,"src":"Last's text","s":"The zygomatic nerve:","o":[["Arises from the maxillary nerve in the pterygopalatine fossa",1,"Last's. (Last's page pg 633)"],["Runs along the upper part of the lateral wall of the orbit",0,"It runs along the lower part; the lacrimal runs along the upper part. (Last's page pg 633)"],["Carries postganglionic secretomotor fibres for the lacrimal gland",1,"These go up the lateral wall to join the lacrimal nerve. (Last's page pg 633)"],["Its zygomaticotemporal branch supplies the hairy skin of the temple",0,"It supplies the hairless skin of the temple above the zygomatic arch; the auriculotemporal supplies the hairy scalp. (Last's page pg 633)"]]},{"id":"cn-d0f5e0f7","r":"cn","t":"Maxillary nerve","y":1,"d":1,"src":"Last's text","s":"The superior alveolar nerves:","o":[["The posterior superior alveolar nerve emerges through the pterygomaxillary fissure",1,"As three branches. (Last's page pg 633)"],["The posterior superior alveolar nerve supplies all roots of the three molar teeth",0,"It supplies the molars except the anterior buccal root of the first molar. (Last's page pg 633)"],["The middle superior alveolar nerve supplies the premolars",1,"And the anterior buccal root of the first molar. (Last's page pg 633)"],["The middle superior alveolar nerve arises in the infraorbital canal",0,"It arises in the infraorbital groove; the anterior superior alveolar arises in the canal. (Last's page pg 633)"]]},{"id":"cn-9f54957c","r":"cn","t":"Maxillary nerve","y":1,"d":1,"src":"Last's text","s":"The infraorbital nerve on the face:","o":[["Emerges between levator labii superioris and levator anguli oris",1,"Last's. (Last's page pg 633)"],["Communicates with the facial nerve for proprioception from facial muscles",1,"Last's. (Last's page pg 633)"],["Its labial branches supply the upper lip and gum to the first premolar",0,"To include the gum of the second premolar. (Last's page pg 633)"],["Its nasal branches supply the whole skin of the external nose",0,"Only a small strip of skin along the external nose. (Last's page pg 633)"]]},{"id":"cn-a2cc02ba","r":"cn","t":"Mandibular nerve","y":1,"d":1,"src":"Last's text","s":"The mandibular nerve:","o":[["Leaves the inferior part of the trigeminal ganglion",1,"Last's. (Last's page pg 633)"],["Is joined by the motor root at foramen ovale",1,"The motor root passes beneath the ganglion. (Last's page pg 633)"],["Divides after about 2 cm in the infratemporal fossa",0,"After 4 or 5 mm. (Last's page pg 633)"],["Lies between the lower head of lateral pterygoid and tensor palati",0,"Between the upper head of lateral pterygoid and tensor palati. (Last's page pg 633)"]]},{"id":"cn-7a33f58d","r":"cn","t":"Mandibular nerve","y":1,"d":1,"src":"Last's text","s":"Branches of the mandibular trunk:","o":[["The nervus spinosus may pass through foramen ovale",1,"Sometimes through foramen spinosum. (Last's page pg 633)"],["The nervus spinosus supplies the dura of the anterior half of the middle fossa",0,"The posterior half; the maxillary supplies the anterior half. (Last's page pg 633)"],["The nervus spinosus supplies the mastoid antrum and air cells",1,"Passing between squamous and petrous parts of the temporal bone; it is the nerve of the first pharyngeal pouch. (Last's page pg 633)"],["The nerve to medial pterygoid enters the superficial surface of the muscle",0,"It sinks into the deep surface. (Last's page pg 633)"]]},{"id":"cn-5909ea4e","r":"cn","t":"Mandibular nerve","y":2,"d":1,"src":"Last's text","s":"The nerve to medial pterygoid:","o":[["Arises from the trunk before it divides",1,"One of two trunk branches. (Last's page pg 633)"],["Supplies tensor tympani",1,"Via a branch near the otic ganglion. (Last's page pg 633)"],["Supplies tensor palati",1,"Last's. (Last's page pg 633)"],["Relays in the otic ganglion",0,"It only passes close to the ganglion. (Last's page pg 633)"]],"k":"C"},{"id":"cn-4932f09a","r":"cn","t":"Mandibular nerve","y":1,"d":1,"src":"Last's text","s":"The anterior division of the mandibular nerve:","o":[["Gives two nerves to the lateral pterygoid, one to each head",1,"Last's. (Last's page pg 634)"],["Gives a single deep temporal nerve",0,"Two deep temporal nerves. (Last's page pg 634)"],["Contains only one sensory branch, the buccal nerve",1,"Last's. (Last's page pg 634)"],["The nerve to masseter passes between the two heads of lateral pterygoid",0,"The buccal nerve is the only nerve to pass between the two heads; the nerve to masseter passes above the upper head. (Last's page pg 634)"]]},{"id":"cn-39b66634","r":"cn","t":"Mandibular nerve","y":1,"d":1,"src":"Last's text","s":"The buccal nerve:","o":[["Supplies a thumbprint area of skin below the zygomatic bone",1,"Over the soft cheek. (Last's page pg 634)"],["Pierces buccinator",1,"Then supplies mucosa on its deep surface. (Last's page pg 634)"],["Ends by supplying the vestibular gum of the mandibular premolars",0,"It ends on the vestibular gum of the three mandibular molars. (Last's page pg 634)"],["Is motor to buccinator",0,"Buccinator is supplied by the facial nerve; the buccal nerve is the only sensory branch of the anterior group. (Last's page pg 634)"]]},{"id":"cn-7a5bc88d","r":"cn","t":"Mandibular nerve","y":1,"d":1,"src":"Last's text","s":"The auriculotemporal nerve:","o":[["Has two roots around the middle meningeal artery",1,"Last's. (Last's page pg 634)"],["Gives the major sensory supply to the mandibular joint",1,"Last's. (Last's page pg 634)"],["Passes in front of the neck of the mandible",0,"It passes back deep to the neck, then curves around it. (Last's page pg 634)"],["Runs in front of the superficial temporal vessels",0,"Its temporal branch runs behind the superficial temporal vessels. (Last's page pg 634)"]]},{"id":"cn-83ae37d4","r":"cn","t":"Mandibular nerve","y":1,"d":1,"src":"Last's text","s":"The inferior alveolar nerve:","o":[["Lies on medial pterygoid between the mandible and sphenomandibular ligament",1,"Last's. (Last's page pg 634)"],["Enters the mandibular foramen behind the inferior alveolar artery",0,"It enters in front of the artery and vein. (Last's page pg 634)"],["The nerve to mylohyoid pierces the sphenomandibular ligament",1,"Last's. (Last's page pg 634)"],["Supplies the posterior six teeth before dividing",0,"It supplies the posterior five teeth (three molars, two premolars). (Last's page pg 634)"]]},{"id":"cn-4586c114","r":"cn","t":"Mandibular nerve","y":1,"d":1,"src":"Last's text","s":"Terminal branches of the inferior alveolar nerve:","o":[["The incisive branch overlaps to the opposite central incisor",1,"Last's. (Last's page pg 634)"],["The mental nerve supplies the gum from the midline to the first premolar",0,"To include the second premolar gum. (Last's page pg 634)"],["The mental nerve carries a few otic ganglion fibres to the labial glands",1,"Last's. (Last's page pg 634)"],["The nerve to mylohyoid is accompanied by the submental branches of the lingual artery",0,"By the submental branches of the facial artery and vein. (Last's page pg 634)"]]},{"id":"cn-d4f71a90","r":"cn","t":"Mandibular nerve","y":1,"d":1,"src":"Last's text","s":"The lingual nerve:","o":[["Is joined by the chorda tympani about 2 cm below the skull base",1,"Deep to the lower border of lateral pterygoid. (Last's page pg 634)"],["Curves down on medial pterygoid about 1 cm behind the inferior alveolar nerve",0,"About 1 cm in front of it. (Last's page pg 634)"],["Passes under the free lower border of the superior constrictor",1,"Then forward above mylohyoid. (Last's page pg 634)"],["Passes above the submandibular duct before ascending on hyoglossus",0,"It dips below the duct. (Last's page pg 634)"]]},{"id":"cn-e5c8fde2","r":"cn","t":"Mandibular nerve","y":2,"d":1,"src":"Last's text","s":"The lingual nerve:","o":[["Supplies only half of the floor of the mouth, the rest from the mylohyoid nerve",0,"Last's: the lingual nerve and no other supplies all the mucous membrane of the floor of the mouth. (Last's page pg 634)"],["Grooves the lingual plate of the mandible just below the last molar",1,"Last's. (Last's page pg 634)"],["Carries taste from the posterior third of the tongue",0,"Anterior two-thirds, via chorda tympani fibres. (Last's page pg 634)"],["Gives a gingival branch supplying the lingual gum to the midline",1,"Last's. (Last's page pg 634)"]],"k":"B"},{"id":"cn-93302424","r":"cn","t":"Abducent nerve","y":1,"d":1,"src":"Last's text","s":"The abducent nerve (Last's):","o":[["The nucleus is in the lower pons",1,"Last's. (Last's page pg 634-5)"],["The nerve contains about 66 000 fibres",0,"About 6600. (Last's page pg 634-5)"],["It emerges at the lower border of the pons above the pyramid",1,"Last's. (Last's page pg 634-5)"],["It pierces the dura on the clivus below the level of the jugular tubercle",0,"Above the level of the jugular tubercle. (Last's page pg 634-5)"]]},{"id":"cn-6ae00b12","r":"cn","t":"Abducent nerve","y":1,"d":1,"src":"Last's text","s":"The abducent nerve:","o":[["Enters the inferior petrosal sinus at the apex of the petrous temporal bone",1,"Then bends forwards under the petroclinoid ligament. (Last's page pg 634-5)"],["Passes medial to the S-bend of the internal carotid in the cavernous sinus",0,"It passes lateral to the S-bend. (Last's page pg 634-5)"],["Enters the ocular surface of lateral rectus one-third of the way along",1,"Last's. (Last's page pg 634-5)"],["Enters the tendinous ring above the superior division of oculomotor",0,"Below the inferior division. (Last's page pg 634-5)"]]},{"id":"cn-d013fd3f","r":"cn","t":"Facial nerve","y":1,"d":1,"src":"Last's text","s":"Components of the facial nerve (Last's):","o":[["The nervus intermedius contains visceral efferent as well as afferent fibres",1,"So \"sensory root\" is not entirely appropriate. (Last's page pg 635)"],["The facial nerve contains about 70 000 fibres",0,"About 7000. (Last's page pg 635)"],["The facial nucleus is deep in the reticular formation of the lower pons",1,"Last's. (Last's page pg 635)"],["The facial nerve fibres themselves produce the bulge of the facial colliculus",0,"It is the abducent nucleus deep to them that is responsible. (Last's page pg 635)"]]},{"id":"cn-4d5c34e6","r":"cn","t":"Facial nerve","y":1,"d":1,"src":"Last's text","s":"Nuclei of the facial nerve:","o":[["The secretomotor nucleus is the superior salivary nucleus",1,"Part of the visceral efferent column. (Last's page pg 635)"],["The secretomotor nucleus is the inferior salivary nucleus",0,"That belongs to the glossopharyngeal nerve. (Last's page pg 635)"],["Taste fibres end in the nucleus of the tractus solitarius",1,"Which lies further laterally, mostly in the medulla. (Last's page pg 635)"],["Cutaneous fibres from the external ear end in the nucleus of the tractus solitarius",0,"They pass to trigeminal nuclei. (Last's page pg 635)"]]},{"id":"cn-fe4a634e","r":"cn","t":"Facial nerve","y":1,"d":1,"src":"Last's text","s":"The facial nerve at the internal acoustic meatus:","o":[["The nervus intermedius emerges between the pons and the inferior cerebellar peduncle",1,"Near the vestibulocochlear nerve. (Last's page pg 635)"],["In the meatus the facial nerve lies on the upper surface of the eighth nerve",1,"With the nervus intermedius in between. (Last's page pg 635)"],["The facial nerve passes into the anteroinferior quadrant of the meatus",0,"The anterosuperior quadrant; the cochlear nerve is anteroinferior. (Last's page pg 635)"],["The facial nerve runs below the vestibule of the internal ear",0,"It runs above the vestibule. (Last's page pg 635)"]]},{"id":"cn-6893ab62","r":"cn","t":"Facial nerve","y":1,"d":1,"src":"Last's text","s":"The facial nerve in the temporal bone:","o":[["The geniculum is a sharp posterior bend near the middle ear",1,"Distended by the geniculate ganglion. (Last's page pg 635)"],["It runs in the medial wall of the middle ear below the promontory",0,"Above the promontory and just below the bulge of the lateral semicircular canal. (Last's page pg 635)"],["It passes deep to the aditus to the antrum",1,"Then vertically down the facial canal. (Last's page pg 635)"],["It emerges from the stylomastoid foramen carrying taste fibres",0,"It has shed all nervus intermedius fibres and is purely branchial motor. (Last's page pg 635)"]]},{"id":"cn-3bc7b306","r":"cn","t":"Facial nerve","y":1,"d":1,"src":"Last's text","s":"The greater petrosal nerve:","o":[["Is a branch of the nervus intermedius",1,"Last's: the nerve of tear secretion. (Last's page pg 635-6)"],["Has its taste fibre cell bodies in the geniculate ganglion",1,"For taste buds on the palate. (Last's page pg 635-6)"],["Runs through the petrous bone at a 90 degree angle to the facial nerve",0,"At a 45 degree slant forwards and medially. (Last's page pg 635-6)"],["Passes above the trigeminal ganglion",0,"It passes beneath the trigeminal ganglion in Meckel's cave. (Last's page pg 635-6)"]]},{"id":"cn-64fc9502","r":"cn","t":"Facial nerve","y":1,"d":1,"src":"Last's text","s":"Nerve of the pterygoid canal:","o":[["The deep petrosal nerve has its cell bodies in the superior cervical ganglion",1,"Last's. (Last's page pg 635-6)"],["The secretomotor fibres relay in th
