an a third of the bimastoid distance",1,"Last's. (Last's p. 648)"],["The tectorial membrane lies in front of the cruciform ligament",0,"It is adherent to dura, behind the cruciform ligament. (Last's p. 648)"],["Meningeal arteries lie inside the fibrous dura here",0,"Outside it. (Last's p. 648)"]]},{"id":"sk-d3f3b380","r":"sk","t":"Foramen magnum","y":1,"d":1,"src":"Last's text","s":"Ligaments at the foramen magnum:","o":[["The alar ligaments attach medial to the anterior pole of each condyle",1,"Last's. (Last's p. 649)"],["The posterior atlanto-occipital membrane attaches to more than half the margin",1,"Last's. (Last's p. 649)"],["Squamous and jugular parts fuse at the sixth year",0,"At the second year; jugular parts with basiocciput at the sixth. (Last's p. 649)"],["The apical ligament lies behind the tectorial membrane",0,"In front of it. (Last's p. 649)"]]},{"id":"sk-0ebfd997","r":"sk","t":"Occipital condyles","y":1,"d":1,"src":"Last's text","s":"The occipital condyles (Last's):","o":[["They permit nodding and some abduction but no rotation",1,"Last's. (Last's p. 649)"],["Incomplete fusion may give two articular surfaces",1,"Last's. (Last's p. 649)"],["They are covered with fibrocartilage",0,"Hyaline cartilage. (Last's p. 649)"],["The condylar canal transmits an emissary to the pterygoid plexus",0,"To the suboccipital plexus. (Last's p. 649)"]]},{"id":"sk-c712d7ea","r":"sk","t":"Occipital bone","y":1,"d":1,"src":"Last's text","s":"The jugular process and basiocciput (Last's):","o":[["Rectus capitis lateralis attaches to the jugular process",1,"Last's. (Last's p. 649)"],["The occipital artery grooves the occipitomastoid suture",1,"Last's. (Last's p. 649)"],["Rectus capitis anterior inserts in front of longus capitis",0,"Behind it, just in front of the condyle. (Last's p. 649)"],["The basiocciput fuses with the basisphenoid 5 cm in front of the foramen magnum",0,"2.5 cm. (Last's p. 649)"]]},{"id":"sk-a0745a70","r":"sk","t":"Temporal bone","y":1,"d":1,"src":"Last's text","s":"The styloid process (Last's):","o":[["Its base lies one-third of the way from mastoid tip to pterygoid tubercle",1,"Last's. (Last's p. 649-50)"],["Stylopharyngeus arises high up medially",1,"Last's. (Last's p. 649-50)"],["Styloglossus arises high up posteriorly",0,"Low down in front; stylohyoid is high posteriorly. (Last's p. 649-50)"],["The stylomastoid foramen lies in front of its base",0,"Behind it. (Last's p. 649-50)"]]},{"id":"sk-e05b1003","r":"sk","t":"Temporal bone","y":1,"d":1,"src":"Last's text","s":"The petrous apex and foramen lacerum (Last's):","o":[["No suture forms between the petrous apex and greater wing",1,"Last's. (Last's p. 650)"],["Levator palati arises from the petrous apex",1,"And the cartilaginous tube. (Last's p. 650)"],["The greater petrosal nerve passes through the foramen lacerum to the exterior",0,"Nothing major passes; it runs above the fibrous floor into the pterygoid canal. (Last's p. 650)"],["The auditory tube runs parallel to the skull base",0,"It angles down about 20 degrees. (Last's p. 650)"]]},{"id":"sk-8b2327f5","r":"sk","t":"Temporal bone","y":1,"d":1,"src":"Last's text","s":"The tympanic plate (Last's):","o":[["Its vaginal process is indented by the styloid",1,"Last's. (Last's p. 650)"],["The stylomandibular ligament runs from the vaginal process to the mandibular angle",1,"Last's. (Last's p. 650)"],["The suprameatal triangle overlies the antrum about 5 mm deep",0,"About 15 mm. (Last's p. 650)"],["The tympanic part is C-shaped and open below",0,"Open above. (Last's p. 650)"]]},{"id":"sk-d23ec32c","r":"sk","t":"Temporal bone","y":1,"d":1,"src":"Last's text","s":"The squamotympanic fissure (Last's):","o":[["The tegmen tympani divides its medial end",1,"Last's. (Last's p. 651)"],["The chorda tympani emerges in the petrotympanic fissure",1,"Last's. (Last's p. 651)"],["The petrosquamous fissure lies behind the tegmen flange",0,"In front. (Last's p. 651)"],["The tegmen flange forms the medial boundary of the bony auditory tube",0,"The lateral boundary. (Last's p. 651)"]]},{"id":"sk-5d146bb8","r":"sk","t":"Sphenoid","y":1,"d":1,"src":"Last's text","s":"The greater wing on the skull base (Last's):","o":[["The upper head of lateral pterygoid arises from its infratemporal surface",1,"Last's. (Last's p. 651)"],["The sphenomandibular ligament attaches to the tip of the spine",1,"Last's. (Last's p. 651)"],["The petrosal foramen lies in front of foramen ovale",0,"Behind. (Last's p. 651)"],["Tensor palati arises lateral to the spine of the sphenoid",0,"Between the scaphoid fossa and the spine. (Last's p. 651)"]]},{"id":"sk-4ee00c01","r":"sk","t":"Sphenoid","y":1,"d":1,"src":"Last's text","s":"The pterygoid plates (Last's):","o":[["The medial plate forms the posterior boundary of the nose",1,"Last's. (Last's p. 652)"],["The pterygomandibular raphe attaches to the hamulus",1,"Last's. (Last's p. 652)"],["The pterygoid canal opening lies in line with the lateral pterygoid plate",0,"In line with the medial plate. (Last's p. 652)"],["The lower head of lateral pterygoid arises from the medial surface of the lateral plate",0,"The whole lateral surface; medial pterygoid from the medial surface. (Last's p. 652)"]]},{"id":"sk-2a304edc","r":"sk","t":"Sphenoid","y":1,"d":1,"src":"Last's text","s":"The vomerovaginal and palatovaginal canals:","o":[["The vomerovaginal canal carries a pharyngeal branch of the sphenopalatine artery",1,"Last's. (Last's p. 652)"],["The palatovaginal canal carries the pharyngeal nerve of the pterygopalatine ganglion",1,"Last's. (Last's p. 652)"],["The palatovaginal canal opens into the infratemporal fossa",0,"Into the pterygopalatine fossa. (Last's p. 652)"],["The palatovaginal canal opens at the very back of the nasal vault",0,"Half a centimetre in front of its posterior limit. (Last's p. 652)"]]},{"id":"sk-51a233e1","r":"sk","t":"Cranial fossae","y":1,"d":1,"src":"Last's text","s":"The internal skull base (Last's):","o":[["Sutures ossify from within out, starting about age 40 "sk","t":"Middle cranial fossa","y":1,"d":1,"src":"Last's text","s":"Foramen ovale and related foramina (Last's):","o":[["The accessory meningeal artery passes through foramen ovale",1,"Last's. (Last's p. 654)"],["The nervus spinosus commonly accompanies the accessory meningeal artery through foramen ovale",1,"Last's. (Last's p. 654)"],["Foramen rotundum opens into the infratemporal fossa",0,"Into the pterygopalatine fossa. (Last's p. 654)"],["Foramen ovale lies posterolateral to foramen spinosum",0,"Anteromedial. (Last's p. 654)"]]},{"id":"sk-e9430507","r":"sk","t":"Middle cranial fossa","y":1,"d":1,"src":"Last's text","s":"The superior orbital fissure (Last's):","o":[["It is closed by dura lateral to the line of foramen rotundum",1,"Last's. (Last's p. 654-5)"],["Its medial end transmits the front of the cavernous sinus and its nerves",1,"Last's. (Last's p. 654-5)"],["The sphenoparietal sinus runs above the lesser wing",0,"Below the margin of the lesser wing. (Last's p. 654-5)"],["The nervus spinosus passes to the mastoid through the greater wing",0,"Through the junction of squamous and petrous parts. (Last's p. 654-5)"]]},{"id":"sk-82ec6433","r":"sk","t":"Posterior cranial fossa","y":1,"d":1,"src":"Last's text","s":"The posterior cranial fossa (Last's):","o":[["The larger jugular foramen usually receives the superior sagittal blood",1,"More commonly the right. (Last's p. 655)"],["The jugular tubercle marks fusion of basiocciput and lateral parts",1,"Last's. (Last's p. 655)"],["The narrower transverse groove receives the superior sagittal sinus",0,"The narrower receives the straight sinus. (Last's p. 655)"],["The hypoglossal canal lies below the occipital condyle",0,"Between tubercle and condyle. (Last's p. 655)"]]},{"id":"sk-0370dec4","r":"sk","t":"Posterior cranial fossa","y":1,"d":1,"src":"Last's text","s":"The clivus:","o":[["Runs from foramen magnum to dorsum sellae",1,"Last's. (Last's p. 655)"],["Its upper broader part lodges the pons",1,"Last's. (Last's p. 655)"],["The inferior petrosal groove lies between basiocciput and sphenoid",0,"Between basiocciput and temporal. (Last's p. 655)"],["The falx cerebelli attaches to the internal occipital protuberance only",0,"Along the internal occipital crest. (Last's p. 655)"]]},{"id":"sk-d264b5f2","r":"sk","t":"Skull bones","y":1,"d":1,"src":"Last's text","s":"The frontal and sphenoid bones (Last's):","o":[["The frontal bone ossifies wholly in membrane",1,"Last's. (Last's p. 656-7)"],["The pterygoid canal lies lower and more medial than foramen rotundum",1,"Last's. (Last's p. 656-7)"],["The metopic suture normally unites at birth",0,"In the second year. (Last's p. 656-7)"],["The sphenoidal septum is usually central",0,"It is always deviated. (Last's p. 656-7)"]]},{"id":"sk-2238aacf","r":"sk","t":"Skull bones","y":1,"d":1,"src":"Last's text","s":"Ossification of the sphenoid:","o":[["The body and lesser wing ossify in cartilage",1,"Last's. (Last's p. 657)"],["The pterygoid plates ossify in membrane",1,"Last's. (Last's p. 657)"],["The whole greater wing ossifies in cartilage",0,"Only its base; the rest is membrane. (Last's p. 657)"],["The optic canal perforates the greater wing",0,"The base of the lesser wing. (Last's p. 657)"]]},{"id":"sk-3a8d4276","r":"sk","t":"Temporal bone","y":1,"d":1,"src":"Last's text","s":"The musculotubular canal (Last's):","o":[["The ICA bends through a right angle in the carotid canal",1,"Last's. (Last's p. 657)"],["The upper semicanal is for tensor tympani",1,"Last's. (Last's p. 657)"],["The lower semicanal is for tensor tympani",0,"The lower is the bony auditory tube. (Last's p. 657)"],["The septum divides it vertically",0,"Horizontally. (Last's p. 657)"]]},{"id":"sk-254fd9f5","r":"sk","t":"Skull ossification","y":1,"d":1,"src":"Last's text","s":"Ossification of the temporal and occipital bones (Last's):","o":[["The styloid process belongs to the second arch",1,"Last's. (Last's p. 658)"],["The squamous and tympanic parts ossify at the eighth week",1,"Last's. (Last's p. 658)"],["The occipital centres appear at the end of the fourth month",0,"At the end of the second month. (Last's p. 658)"],["The jugular parts fuse with the basiocciput at the second year",0,"At the sixth year. (Last's p. 658)"]]},{"id":"sk-dab97bb1","r":"sk","t":"Skull ossification","y":1,"d":1,"src":"Last's text","s":"The parietal bone:","o":[["Its inferior border is bevelled and overlapped by the squamous temporal",1,"Last's. (Last's p. 658)"],["Its ossification centre appears at the future parietal eminence",1,"Last's. (Last's p. 658)"],["It ossifies in cartilage",0,"In membrane, before the eighth week. (Last's p. 658)"],["Its anteroinferior angle articulates with the temporal bone",0,"With the sphenoid. (Last's p. 658)"]]},{"id":"sk-6624556e","r":"sk","t":"Ethmoid","y":1,"d":1,"src":"Last's text","s":"The ethmoid bone (Last's):","o":[["Its lateral labyrinth wall is the orbital plate (lamina papyracea)",1,"Last's. (Last's p. 658)"],["The labyrinth ossifies in cartilage at the fifth month",1,"Complete before birth. (Last's p. 658)"],["The cribriform plate ossifies before birth",0,"At about 1 year, with crista galli and perpendicular plate. (Last's p. 658)"],["The crista galli projects down from the cribriform plate",0,"It projects up; the perpendicular plate projects down. (Last's p. 658)"]]},{"id":"sk-090ff42a","r":"sk","t":"Foramina","y":1,"d":1,"src":"Last's text","s":"Structures passing through foramen ovale include:","o":[["The mandibular nerve",1,"Last's. (Last's p. 658)"],["The accessory meningeal artery",1,"Last's. (Last's p. 658)"],["An emissary vein from the cavernous sinus",1,"Last's. (Last's p. 658)"],["The middle meningeal artery",0,"Foramen spinosum. (Last's p. 658)"]]},{"id":"sk-9a7d712e","r":"sk","t":"Foramina","y":1,"d":1,"src":"Last's text","s":"Foramen magnum (Last's):","o":[["The spinal roots of the accessory nerves pass through it",1,"Last's. (Last's p. 658)"],["The vertebral arteries pass through it",1,"Last's. (Last's p. 658)"],["The hypoglossal nerves pass through it",0,"They use the hypoglossal canals. (Last's p. 658)"],["The brain weighs about 500 g in CSF",0,"About 50 g; 1500 g out of CSF. (Last's p. 658)"]]},{"id":"sk-b89a4505","r":"sk","t":"Pterygopalatine fossa","y":1,"d":1,"src":"Last's text","s":"The pterygopalatine fossa:","o":[["Foramen rotundum opens into it",1,"Last's. (Last's p. 658)"],["The pterygoid process forms its posterior wall",1,"Last's. (Last's p. 658)"],["Its medial wall is the lateral pterygoid plate",0,"The perpendicular plate of the palatine. (Last's p. 658)"],["It communicates laterally through the inferior orbital fissure",0,"Laterally through the pterygomaxillary fissure; the inferior orbital fissure is superior. (Last's p. 658)"]]},{"id":"sk-8113fc0c","r":"sk","t":"Hamulus","y":1,"d":1,"src":"Last's text","s":"The pterygoid hamulus (Last's):","o":[["It is the lower end of the medial pterygoid plate",1,"Last's. (Last's p. 658)"],["Tensor palati turns around it",1,"Last's. (Last's p. 658)"],["It gives attachment to the stylomandibular ligament",0,"To the pterygomaxillary ligament and raphe. (Last's p. 658)"],["The pterygomandibular raphe attaches to the lateral plate",0,"To the hamulus. (Last's p. 658)"]]},{"id":"sk-13e5a05c","r":"sk","t":"NSA sample question","y":1,"d":1,"src":"NSA sample","s":"The foramen rotundum","o":[["opens into the pterygopalatine fossa",1,"The maxillary nerve passes forward through it into the upper part of the pterygopalatine fossa."],["transmits the accessory meningeal artery",0,"The accessory meningeal artery enters through foramen ovale (Last's: its chief supply goes to the trigeminal ganglion)."],["transmits the maxillary division of the trigeminal nerve",1,"Its only significant content."],["lies medial to the anterior clinoid process",0,"It lies in the root of the greater wing below the medial end of the superior orbital fissure, inferolateral to the anterior clinoid process. Last's: the lateral wall of the cavernous sinus attaches at its lateral margin, so it lies outside the line of the sinus and clinoid. The optic canal is the opening medial to the clinoid."]]},{"id":"sk-5fb29587","r":"sk","t":"NSA sample question","y":1,"d":1,"src":"NSA sample","s":"The zygomatic bone articulates with the","o":[["frontal bone",1,"At the frontozygomatic suture, a palpable landmark."],["temporal bone",1,"Its temporal process meets the zygomatic process of the temporal bone in the arch."],["maxilla",1,"Via the zygomatic process of the maxilla, the anterior pillar of the arch."],["greater wing of the sphenoid",1,"In the lateral wall of the orbit. The zygomatic bone articulates with these four bones only."]]},{"id":"sk-b1a9a706","r":"sk","t":"Foramina of the middle cranial fossa","y":1,"d":1,"s":"Concerning the foramen rotundum:","o":[["It lies in the greater wing of the sphenoid, below the medial end of the superior orbital fissure",1,"Foramen rotundum pierces the root of the greater wing just below the medial end of the superior orbital fissure."],["It opens anteriorly into the pterygopalatine fossa",1,"The maxillary nerve passes forward through it into the upper part of the pterygopalatine fossa."],["It transmits the maxillary nerve and the middle meningeal artery",0,"Only the maxillary nerve (with small emissary veins). The middle meningeal artery passes through foramen spinosum."],["It transmits the nerve of the pterygoid canal",0,"The nerve of the pterygoid canal runs in the pterygoid canal, which lies below and medial to foramen rotundum."]]},{"id":"sk-f8109249","r":"sk","t":"Foramina of the middle cranial fossa","y":1,"d":1,"s":"Structures passing through the foramen ovale include the:","o":[["Lesser petrosal nerve",1,"The lesser petrosal nerve usually leaves through foramen ovale (sometimes through the small canaliculus innominatus) to reach the otic ganglion."],["Accessory meningeal artery",1,"The accessory meningeal artery, from the maxillary artery or middle meningeal artery, enters the skull through foramen ovale."],["Nervus spinosus",0,"The meningeal branch of the mandibular nerve arises below the skull and re-enters through foramen spinosum with the middle meningeal artery."],["Emissary vein connecting the cavernous sinus to the pterygoid plexus",1,"Emissary veins through foramen ovale connect the cavernous sinus with the pterygoid venous plexus."]]},{"id":"sk-c46b0060","r":"sk","t":"Foramina of the middle cranial fossa","y":2,"d":1,"s":"Regarding the foramen spinosum:","o":[["It lies posterolateral to the foramen ovale",1,"Foramen spinosum lies just posterolateral to foramen ovale, anteromedial to the spine of the sphenoid."],["It transmits the middle meningeal artery",1,"The middle meningeal artery, from the first part of the maxillary artery, enters the middle cranial fossa here."],["It transmits the meningeal branch of the mandibular nerve",1,"The nervus spinosus accompanies the artery back into the skull."],["It lies anteromedial to the spine of the sphenoid",1,"The spine of the sphenoid lies posterolateral to the foramen and gives attachment to the sphenomandibular ligament."]],"k":"E"},{"id":"sk-b3eb74da","r":"sk","t":"Zygomatic bone","y":1,"d":1,"s":"The zygomatic bone:","o":[["Articulates with the greater wing of the sphenoid",1,"Its frontal process articulates with the frontal bone and its orbital surface with the greater wing of the sphenoid, forming the lateral orbital wall."],["Articulates with the lacrimal bone",0,"The zygomatic bone articulates with four bones: frontal, sphenoid, temporal and maxilla. The lacrimal does not reach it."],["Transmits branches of the maxillary nerve through the zygomaticofacial and zygomaticotemporal foramina",1,"The zygomatic nerve, a branch of the maxillary nerve, divides into zygomaticofacial and zygomaticotemporal branches that pierce the bone."],["Gives attachment to the masseter muscle",1,"The superficial part of masseter arises from the zygomatic process of the maxilla and the lower border of the zygomatic arch."]]},{"id":"sk-6fb25346","r":"sk","t":"Jugular foramen","y":1,"d":1,"s":"Concerning the jugular foramen:","o":[["It lies between the petrous temporal bone and the occipital bone",1,"It lies at the posterior end of the petro-occipital fissure, between the jugular notches of the two bones."],["The inferior petrosal sinus passes through its anterior part",1,"The inferior petrosal sinus occupies the anterior compartment and joins the internal jugular vein just below the skull."],["The glossopharyngeal nerve passes through its posterior part with the sigmoid sinus",0,"Last's: two dural septa divide the foramen into three compartments. IX shares the anterior compartment with the inferior petrosal sinus (IX lies lateral to the sinus). X and XI occupy the middle compartment, and the large posterior compartment holds the jugular bulb (end of the sigmoid sinus)."],["The hypoglossal nerve passes through it",0,"The hypoglossal nerve leaves through its own hypoglossal canal, above the anterior part of the occipital condyle."]]},{"id":"sk-2fd8a4ac","r":"sk","t":"Internal acoustic meatus","y":1,"d":1,"s":"Regarding the internal acoustic meatus:","o":[["It transmits the facial nerve, the nervus intermedius and the vestibulocochlear nerve",1,"These three, together with the labyrinthine artery, enter the meatus."],["The facial nerve lies in the anterosuperior quadrant of the fundus",1,"At the fundus the transverse crest separates the upper facial and superior vestibular areas from the lower cochlear and inferior vestibular areas. The facial nerve is anterosuperior."],["The cochlear nerve lies in the posterosuperior quadrant",0,"The cochlear nerve is anteroinferior. The superior vestibular nerve is posterosuperior."],["The labyrinthine artery is most commonly a branch of the posterior inferior cerebellar artery",0,"Last's gives the labyrinthine artery as a branch of the basilar artery or of AICA, never of PICA."]]},{"id":"sk-9145c678","r":"sk","t":"Superior orbital fissure","y":2,"d":1,"s":"Structures passing through the superior orbital fissure within the common tendinous ring include the:","o":[["Nasociliary nerve",1,"The nasociliary nerve passes within the ring, between the two divisions of the oculomotor nerve."],["Abducent nerve",1,"The abducent nerve passes within the ring, inferolateral to the nasociliary nerve."],["Superior and inferior divisions of the oculomotor nerve",1,"Both divisions of III pass within the ring."],["Trochlear nerve",0,"The trochlear nerve passes above the ring with the frontal and lacrimal nerves, so it is not within it."]],"k":"C"},{"id":"sk-a7a279d8","r":"sk","t":"Optic canal","y":1,"d":1,"s":"The optic canal:","o":[["Lies between the two roots of the lesser wing of the sphenoid",1,"The canal is bounded by the body of the sphenoid medially and the two roots of the lesser wing."],["Transmits the ophthalmic artery, which lies above and medial to the optic nerve",0,"In the canal the ophthalmic artery lies below and lateral to the nerve, within the dural sheath."],["Transmits postganglionic sympathetic fibres",1,"Sympathetic fibres from the internal carotid plexus accompany the ophthalmic artery."],["Is separated from the sphenoidal sinus by bone that may be very thin",1,"The canal is related medially to the sphenoidal (and sometimes posterior ethmoidal) sinus, and the bony wall may be deficient."]]},{"id":"sk-b04bce0e","r":"sk","t":"Pterygopalatine fossa","y":1,"d":1,"s":"The pterygopalatine fossa communicates directly with the:","o":[["Nasal cavity through the sphenopalatine foramen",1,"The sphenopalatine foramen, in its medial wall, opens into the nasal cavity behind the middle meatus."],["Orbit through the inferior orbital fissure",1,"The apex of the inferior orbital fissure opens into the fossa."],["Oral cavity through the greater palatine canal",1,"The greater and lesser palatine canals lead down from the fossa to the palate."],["Posterior cranial fossa through the pterygoid canal",0,"The pterygoid canal opens posteriorly at the anterior wall of foramen lacerum in the middle cranial fossa, not the posterior cranial fossa."]]},{"id":"sk-e6ed0f58","r":"sk","t":"Pterion and surface anatomy","y":1,"d":1,"s":"Concerning the pterion:","o":[["It is the H-shaped junction of the frontal, parietal, squamous temporal bones and greater wing of the sphenoid",1,"These four bones meet at the pterion in the temporal fossa."],["It overlies the anterior branch of the middle meningeal artery",1,"The anterior (frontal) branch grooves, or tunnels through, the inner surface here, making it vulnerable to fracture and extradural haematoma."],["Its burr-hole site lies about 3 cm above the midpoint of the zygomatic arch, behind and above the frontozygomatic suture",1,"This is Last's surface marking for exposing the frontal branch of the middle meningeal artery (many other texts quote 4 cm). The frontozygomatic suture is the palpable landmark."],["It overlies the junction of the transverse and sigmoid sinuses",0,"That is the asterion, where the parietal, occipital and mastoid temporal bones meet."]]},{"id":"sk-c70db090","r":"sk","t":"Foramen magnum","y":2,"d":1,"s":"Structures passing through the foramen magnum include the:","o":[["Hypoglossal nerves",0,"The hypoglossal nerves leave through the hypoglossal canals."],["Vertebral arteries",1,"They pierce the posterior atlanto-occipital membrane and dura to enter the skull."],["Internal jugular veins",0,"The sigmoid sinus becomes the internal jugular vein at the jugular foramen."],["Spinal roots of the accessory nerves",1,"Last's: with the lower medulla, the spinal arteries and veins and the vertebral arteries."]],"k":"B"},{"id":"sk-826a1d33","r":"sk","t":"Petrous temporal bone","y":1,"d":1,"s":"On the anterior (cerebral) surface of the petrous temporal bone:","o":[["The arcuate eminence is produced by the superior semicircular canal",1,"The arcuate eminence is raised by the underlying superior (anterior) semicircular canal."],["The tegmen tympani forms the roof of the middle ear and mastoid antrum",1,"The thin tegmen tympani roofs the tympanic cavity and antrum and continues backward over the auditory tube canal."],["The hiatus for the greater petrosal nerve lies lateral to the hiatus for the lesser petrosal nerve",0,"The greater petrosal hiatus lies medial to (and in front of) the smaller hiatus for the lesser petrosal nerve."],["The trigeminal impression lies near the apex",1,"The trigeminal ganglion lies in a depression near the apex, within the trigeminal (Meckel's) cave."]]},{"id":"sk-79850ec7","r":"sk","t":"Foramen lacerum","y":1,"d":1,"s":"Regarding the foramen lacerum:","o":[["In life it is closed by dense fibrous tissue and transmits no major structure",1,"Last's: apart from minute emissary veins, no structure passes through the foramen lacerum from the cranial cavity to the exterior."],["The internal carotid artery passes vertically through it from the neck",0,"The internal carotid artery enters via the carotid canal and crosses the upper part of the foramen lacerum horizontally, then turns up into the cavernous sinus. It does not traverse the foramen from below."],["The greater and deep petrosal nerves unite here to form the nerve of the pterygoid canal",1,"They join in the foramen lacerum and enter the pterygoid canal in its anterior wall."],["Lies between the apex of the petrous temporal bone and the body and greater wing of the sphenoid",1,"These bones bound the foramen, with the basiocciput medially."]]},{"id":"sk-b0d96508","r":"sk","t":"Mandible","y":1,"d":1,"s":"Concerning the mandible:","o":[["The sphenomandibular ligament attaches to the lingula",1,"The lingula projects over the mandibular foramen and gives attachment to the sphenomandibular ligament, a remnant of Meckel's cartilage."],["The superior mental (genial) spines give origin to geniohyoid",0,"The superior genial tubercles give origin to genioglossus. Geniohyoid arises from the inferior tubercles."],["The lateral pterygoid inserts into the pterygoid fovea on the front of the neck of the mandible",1,"Last's: the two heads lie edge to edge and form a thick tendon into the pterygoid fovea, drawing the condyle and disc forward down the articular tubercle."],["In the adult the mental foramen lies midway between the upper and lower borders below the second premolar",1,"In the dentate adult it lies midway between the borders. In infants it is near the lower border, and in edentulous elderly near the upper border, after the alveolar margin is absorbed."]]},{"id":"sk-8ea0f799","r":"sk","t":"Hyoid bone","y":1,"d":1,"s":"The hyoid bone:","o":[["Gives attachment to the middle constrictor along the greater horn and lesser horn",1,"The middle constrictor arises from the upper border of the greater horn, the lesser horn and the lower part of the stylohyoid ligament."],["Has its lesser horns derived from the third pharyngeal arch",0,"The lesser horns and upper body come from the second arch. The greater horns and lower body come from the third."],["Is separated from the thyrohyoid membrane by a bursa",1,"The thyrohyoid membrane attaches to the upper border of the posterior body, and a bursa lies between membrane and the back of the body."],["Gives attachment to the stylohyoid ligament at the tip of the greater horn",0,"The stylohyoid ligament attaches to the lesser horn."]]},{"id":"sk-ad0225ea","r":"sk","t":"Neonatal skull","y":1,"d":1,"s":"In the skull of the newborn:","o":[["The mastoid process is absent and the facial nerve is relatively unprotected as it emerges from the stylomastoid foramen",1,"The mastoid process develops after the second year, so the emerging facial nerve lies superficially, covered only by fibres of sternocleidomastoid."],["The mastoid antrum is absent",0,"The internal ear, middle ear and mastoid antrum are fully developed at birth."],["The vault contains no cancellous diploe",1,"At birth the vault bones are a single layer of compact bone. The diploe develops later."],["The anterior fontanelle closes at about 18 months",1,"Last's: the anterior fontanelle closes at about 18 months and the posterior fontanelle by the end of the first year."]]},{"id":"sk-795c278b","r":"sk","t":"Neonatal skull","y":1,"d":1,"s":"Concerning the skull at birth:","o":[["The tympanic membrane is almost of adult size",1,"The tympanic membrane is nearly adult size but faces more downward."],["The mandibular fossa is deep and faces directly forward",0,"The fossa is shallow at birth and faces slightly laterally. It deepens and turns forward with development."],["The maxillary sinus is a narrow slit in the medial wall of the maxilla",1,"The sinus enlarges rapidly after the permanent teeth begin to erupt, at about 6 years."],["The two halves of the frontal bone are united by a fused metopic suture",0,"The frontal bone is in two halves at birth. Last's: the metopic suture usually unites in the second year, though it may persist."]]},{"id":"sk-a74bf5dc","r":"sk","t":"Anterior cranial fossa","y":1,"d":1,"s":"Regarding the anterior cranial fossa:","o":[["The falx cerebri attaches to the crista galli",1,"The anterior end of the falx attaches to the crista galli of the ethmoid."],["The anterior ethmoidal nerve crosses the cribriform plate before entering the nasal cavity beside the crista galli",1,"It enters the cranial cavity from the orbit through the anterior ethmoidal foramen, runs extradurally on the cribriform plate, then descends through a slit beside the crista galli."],["The foramen caecum may transmit an emissary vein from the nose to the superior sagittal sinus",1,"Last's: the foramen caecum is usually a blind pit plugged by the falx (a huge Sharpey's fibre). Only in about 1% does a patent vein connect nasal veins with the superior sagittal sinus."],["Its floor is formed entirely by the orbital plates of the frontal bone",0,"The floor is formed by the orbital plates of the frontal bone, the cribriform plate of the ethmoid, and the lesser wings and anterior body (jugum) of the sphenoid."]]},{"id":"sk-7fe9ce15","r":"sk","t":"Sphenoid and sella","y":1,"d":1,"s":"Concerning the sphenoid bone and sella turcica:","o":[["The tentorium cerebelli's free border attaches to the anterior clinoid process",1,"The free margin runs forward to the anterior clinoid process. The attached margin ends at the posterior clinoid process, so the two cross."],["The pituitary gland is separated from the sphenoidal sinus by the floor of the hypophysial fossa",1,"This relationship is the basis of the trans-sphenoidal approach."],["The diaphragma sellae is pierced by the infundibulum",1,"The diaphragma sellae roofs the fossa and is pierced centrally by the pituitary stalk."],["The optic chiasma lies directly within the hypophysial fossa",0,"The chiasma lies above the diaphragma sellae, usually above and slightly behind the tuberculum sellae, not within the fossa."]]},{"id":"sk-ec5f80f7","r":"sk","t":"Orbital walls and fissures","y":1,"d":1,"s":"The inferior orbital fissure:","o":[["Lies between the greater wing of the sphenoid and the orbital surface of the maxilla",1,"It separates the lateral wall (greater wing) from the floor (maxilla and orbital process of palatine)."],["Transmits the zygomatic nerve",1,"The zygomatic branch of the maxillary nerve enters the orbit through the fissure."],["Transmits the infraorbital vessels and nerve",1,"The infraorbital nerve and vessels enter the infraorbital groove from the fissure."],["Transmits the superior ophthalmic vein",0,"The superior ophthalmic vein passes through the superior orbital fissure. Branches of the inferior ophthalmic vein may pass through the inferior fissure to the pterygoid plexus."]]},{"id":"sk-f70f1c18","r":"sk","t":"Medial orbital wall","y":2,"d":1,"s":"The medial wall of the orbit is formed by the:","o":[["Frontal process of the maxilla",1,"It forms the anterior part, including the anterior lacrimal crest."],["Lacrimal bone",1,"The lacrimal bone carries the posterior lacrimal crest."],["Orbital plate (lamina papyracea) of the ethmoid",1,"The paper-thin lamina papyracea forms most of the medial wall and is easily breached by ethmoid infection."],["Orbital surface of the zygomatic bone",0,"The zygomatic bone contributes to the lateral wall and floor, not the medial wall. The body of the sphenoid completes the medial wall posteriorly."]],"k":"C"},{"id":"sk-040a407b","r":"sk","t":"Middle ear walls","y":1,"d":1,"s":"Regarding the walls of the tympanic cavity:","o":[["The promontory on the medial wall is formed by the basal turn of the cochlea",1,"The promontory overlies the first turn of the cochlea and is covered by the tympanic plexus."],["The prominence of the facial canal lies above the oval window on the medial wall",1,"The facial canal runs backward above the oval window, then turns down in the posterior wall."],["The floor separates the cavity from the internal carotid artery",0,"The floor is a thin plate separating the cavity from the bulb of the internal jugular vein. The internal carotid artery is related to the anterior wall."],["The aditus to the mastoid antrum lies in the upper part of the posterior wall",1,"The aditus leads back from the epitympanic recess to the antrum."]]},{"id":"sk-24fa065c","r":"sk","t":"Cranial dura and venous sinuses","y":1,"d":1,"s":"Concerning the cavernous sinus:","o":[["The oculomotor and trochlear nerves lie in its lateral wall",1,"From above down the lateral wall contains III, IV, ophthalmic and maxillary nerves."],["The abducent nerve lies in the lateral wall below the ophthalmic nerve",0,"Last's: VI lies within the sinus, lateral to and then below the ICA. No nerve lies medial to the abducent, and no nerve lies lateral to the trigeminal branches."],["It drains into the superior and inferior petrosal sinuses",1,"It drains posteriorly into the superior petrosal sinus (to the transverse/sigmoid) and inferior petrosal sinus (to the internal jugular vein)."],["It receives the superficial middle cerebral vein",1,"Last's: the superficial middle cerebral vein crosses the subarachnoid space and pierces the roof of the cavernous sinus near the emerging ICA. This is how cavernous thrombosis can spread to the hemisphere."]]},{"id":"sk-37dbb949","r":"sk","t":"Cranial dura and venous sinuses","y":2,"d":1,"s":"The straight sinus:","o":[["Is formed by the union of the inferior sagittal sinus and the great cerebral vein",1,"These join at the anterior end of the junction of falx and tentorium."],["Runs in the line of attachment of the falx cerebri to the tentorium cerebelli",1,"It runs backward in this junction to the internal occipital protuberance."],["Usually becomes continuous with the left transverse sinus",1,"The superior sagittal sinus usually continues as the right transverse sinus, and the straight sinus as the left."],["Slopes gently, at much less than 45 degrees, from front to back",0,"Last's: the straight sinus slopes down steeply, at more than 45 degrees, in the intact dura. Last's also says it receives the inferior sagittal sinus, the great cerebral vein and both basal veins at its anterior end."]],"k":"C"},{"id":"sk-b2015144","r":"sk","t":"Nerve supply of the dura","y":1,"d":1,"s":"Regarding the sensory nerve supply of the cranial dura:","o":[["The upper surface of the tentorium cerebelli is supplied by tentorial branches of the ophthalmic nerve",1,"Last's: the tentorial nerves arise at the anterior end of the cavernous sinus and supply the falx, the vault dura and the upper surface of the tentorium. Its under surface is supplied by IX and X."],["The dura around the margin of the foramen magnum is supplied by the upper three cervical nerves",1,"Last's: the rest of the posterior fossa dura (and the under surface of the tentorium) is supplied by meningeal branches of IX and X. The ring around the foramen magnum is supplied by C1 to C3, which explains suboccipital pain."],["The dura of the middle cranial fossa is supplied mainly by the facial nerve",0,"Last's: the anterior half of the middle fossa dura is supplied by the middle meningeal nerve (V2) and the posterior half by the nervus spinosus (V3)."],["The dura of the anterior cranial fossa receives branches of the anterior ethmoidal nerve",1,"The anterior ethmoidal and other ophthalmic branches supply the anterior fossa dura."]]},{"id":"sk-ea9bba8f","r":"sk","t":"Emissary veins and diploe","y":1,"d":1,"s":"Concerning emissary veins:","o":[["The mastoid emissary vein connects the sigmoid sinus to the posterior auricular or occipital veins",1,"The mastoid emissary vein runs through the mastoid foramen."],["They contain valves that ensure flow is directed outward",0,"Emissary veins are valveless, so flow can occur in either direction. This lets infection spread from scalp to sinuses."],["The parietal emissary vein connects the superior sagittal sinus with veins of the scalp",1,"It passes through the parietal foramen."],["A vein through the hypoglossal canal connects the sigmoid sinus or basilar plexus with the internal jugular vein",1,"The venous plexus of the hypoglossal canal connects intracranial veins with the internal jugular vein."]]},{"id":"sk-c2fbf202","r":"sk","t":"Occipital bone","y":1,"d":1,"s":"Regarding the occipital bone:","o":[["The hypoglossal canal lies above the anterior part of the occipital condyle",1,"The canal pierces the bone above the anterior part of each condyle."],["The condylar canal, when present, transmits an emissary vein from the sigmoid sinus",1,"The posterior condylar canal in the condylar fossa transmits an emissary vein."],["The basiocciput gives attachment to the pharyngobasilar fascia at the pharyngeal tubercle",1,"The pharyngeal tubercle gives attachment to the median raphe of the superior constrictor."],["The alar ligaments attach to the anterior margin of the foramen magnum",0,"The apical ligament attaches to the anterior margin (basion). The alar ligaments attach to the medial sides of the occipital condyles."]]},{"id":"sk-c59cbef5","r":"sk","t":"Nasal cavity lateral wall","y":1,"d":1,"s":"Concerning the lateral wall of the nasal cavity:","o":[["The nasolacrimal duct opens into the inferior meatus",1,"The nasolacrimal duct opens into the anterior part of the inferior meatus, guarded by a mucosal fold (valve of Hasner)."],["The maxillary sinus opens into the hiatus semilunaris of the middle meatus",1,"The maxillary ostium is high on its medial wall, opening into the posterior part of the hiatus semilunaris. Hence poor gravitational drainage."],["The posterior ethmoidal air cells open into the middle meatus",0,"Posterior ethmoidal cells open into the superior meatus. Anterior and middle cells open into the middle meatus."],["The sphenoidal sinus opens into the sphenoethmoidal recess",1,"The sphenoidal sinus drains into the sphenoethmoidal recess above the superior concha."]]},{"id":"sk-5a9edbab","r":"sk","t":"Paranasal sinuses","y":2,"d":1,"s":"Regarding the paranasal sinuses:","o":[["The sphenoidal sinus is well developed at birth",0,"It is rudimentary at birth and develops mainly after puberty."],["The maxillary sinus opens into the inferior meatus",0,"It opens high on its medial wall into the posterior end of the hiatus semilunaris of the middle meatus."],["The posterior ethmoidal air cells open into the middle meatus",0,"They open into the superior meatus."],["The infraorbital nerve runs in the roof of the maxillary sinus",1,"In its groove and canal in the floor of the orbit."]],"k":"D"},{"id":"sp-be2d7a1b","r":"sp","t":"Vertebral development","y":1,"d":1,"src":"Last's text","s":"Development of the vertebrae (Last's):","o":[["They derive from the sclerotome parts of the somites",1,"Last's. (Last's p. 557-8)"],["Each vertebra forms from adjacent caudal and cranial halves of two somites",1,"So vertebrae lie in intersegmental planes. (Last's p. 557-8)"],["Each cartilaginous ring ossifies from a single centre",0,"From three centres: centrum and two halves of the neural arch. (Last's p. 557-8)"],["Failure of one half of the double centrum centre causes spina bifida",0,"It causes a hemivertebra. (Last's p. 557-8)"]]},{"id":"sp-c7da1033","r":"sp","t":"Vertebral ossification","y":1,"d":1,"src":"Last's text","s":"Ossification of a typical vertebra (Last's):","o":[["All vertebrae ossify in hyaline cartilage",1,"Last's. (Last's p. 557-8)"],["The laminae are completely united by 2 years",1,"Last's. (Last's p. 557-8)"],["The neurocentral junctions are united by about 2 years",0,"By about 7 years. (Last's p. 557-8)"],["The ring epiphyses fuse with the body around puberty",0,"They appear soon after puberty and fuse in the early twenties. (Last's p. 557-8)"]]},{"id":"sp-221444d0","r":"sp","t":"Vertebral ossification","y":1,"d":1,"src":"Last's text","s":"Secondary centres and costal elements (Last's):","o":[["The bifid cervical spines have double secondary centres",1,"Last's. (Last's p. 557-8)"],["Mamillary processes of T12 and lumbar vertebrae have secondary centres",1,"Last's. (Last's p. 557-8)"],["Cervical and lumbar costal elements have separate bony centres",0,"They ossify from the neural arch; an occasional centre causes a cervical or lumbar rib. (Last's p. 557-8)"],["Sacral costal elements have no separate centres",0,"They do, appearing at 6 months fetal life. (Last's p. 557-8)"]]},{"id":"sp-0c1bcb51","r":"sp","t":"Atlas and axis","y":1,"d":1,"src":"Last's text","s":"Ossification of the atlas and axis (Last's):","o":[["The atlas lateral masses ossify at the seventh week",1,"Last's. (Last's p. 557-8)"],["The anterior arch centre appears at the first year",1,"Last's. (Last's p. 557-8)"],["The posterior arch of the atlas unites at 12 years",0,"At the fourth year. (Last's p. 557-8)"],["The tip of the dens fuses at 3 years",0,"It appears at about 3 and fuses at 12. (Last's p. 557-8)"]]},{"id":"sp-d1471a7b","r":"sp","t":"Atlas and axis","y":1,"d":1,"src":"Last's text","s":"Ossification of the axis (Last's):","o":[["The dens has two half-side centres appearing at the fifth month",1,"Fusing two months later. (Last's p. 557-8)"],["The dens unites with the body at 3 years",1,"Last's. (Last's p. 557-8)"],["The lower ring epiphysis fuses at about 12 years",0,"At about 25 years. (Last's p. 557-8)"],["The anterior arch epiphyses of the atlas fuse at 3 years",0,"At 7 years. (Last's p. 557-8)"]]},{"id":"sp-787f23fe","r":"sp","t":"Vertebrae","y":1,"d":1,"src":"Last's text","s":"Morphology of the vertebrae (Last's):","o":[["The primary curvature is retained in the thoracic and sacral regions",1,"Last's. (Last's p. 535-6)"],["The costal facets of thoracic vertebrae lie on the neural arch, not the centrum",1,"The neurocentral junction lies in front of them. (Last's p. 535-6)"],["Lumbar transverse processes are true transverse elements",0,"They are costal elements; the mamillary process and accessory tubercle are the true transverse elements. (Last's p. 535-6)"],["A lumbar rib results from fusion of the costal element",0,"From its failure to fuse. (Last's p. 535-6)"]]},{"id":"sp-c3db10ac","r":"sp","t":"Intervertebral disc","y":1,"d":1,"src":"Last's text","s":"The intervertebral disc (Last's):","o":[["It is a secondary cartilaginous joint",1,"A symphysis. (Last's p. 537)"],["The nucleus pulposus lies posteriorly in the adult disc",1,"Because the notochord moved backwards. (Last's p. 537)"],["The nucleus pulposus is about 50% of the disc",0,"About 15%. (Last's p. 537)"],["The nucleus pulposus is about 70% water at birth",0,"About 90% at birth, 70% in old age. (Last's p. 537)"]]},{"id":"sp-a17ccb48","r":"sp","t":"Longitudinal ligaments","y":1,"d":1,"src":"Last's text","s":"The longitudinal ligaments (Last's):","o":[["The anterior longitudinal ligament broadens as it passes down",1,"Last's. (Last's p. 537)"],["The posterior longitudinal ligament is firmly attached over the discs",1,"Loosely over the bodies. (Last's p. 537)"],["The posterior longitudinal ligament broadens as it descends",0,"It narrows. (Last's p. 537)"],["The anterior longitudinal ligament begins at the body of the axis",0,"At the anterior tubercle of the atlas; the PLL begins at the axis. (Last's p. 537)"]]},{"id":"sp-a5d940ab","r":"sp","t":"Notochord","y":1,"d":1,"src":"Last's text","s":"The notochord (Last's):","o":[["It extended as far cranially as the sella turcica",1,"Last's. (Last's p. 537)"],["The apical ligament of the dens is a notochordal remnant",1,"Last's. (Last's p. 537)"],["Its remnant in the disc is the annulus fibrosus",0,"The nucleus pulposus. (Last's p. 537)"],["The alar ligaments are notochordal remnants",0,"Only the apical ligament. (Last's p. 537)"]]},{"id":"sp-99e2293c","r":"sp","t":"Disc prolapse","y":1,"d":1,"src":"Last's text","s":"Discs and nerve roots (Last's):","o":[["An L5/S1 disc prolapse usually irritates the S1 root",1,"Last's. (Last's p. 539)"],["A C6/7 disc irritates the C7 root",1,"Last's. (Last's p. 539)"],["An L4/5 disc prolapse usually irritates the L4 root",0,"The L5 root (one below). (Last's p. 539)"],["Uncovertebral joints are synovial",0,"They are degenerative clefts, not synovial joints. (Last's p. 539)"]]},{"id":"sp-f0ca794a","r":"sp","t":"Neural arch joints","y":1,"d":1,"src":"Last's text","s":"Joints between the neural arches (Last's):","o":[["Facet joints are supplied from their own level and the level above",1,"One nerve supplies two joints. (Last's p. 539)"],["Ligamenta flava attach to the front of the upper lamina and back of the lower",1,"Last's. (Last's p. 539)"],["Ligamenta flava are relaxed by flexion",0,"Stretched by flexion. (Last's p. 539)"],["The supraspinous ligament continues in the neck as the anterior longitudinal ligament",0,"As the ligamentum nuchae. (Last's p. 539)"]]},{"id":"sp-3a3e9cec","r":"sp","t":"Vertebral canal","y":1,"d":1,"src":"Last's text","s":"The vertebral canal and intervertebral foramina (Last's):","o":[["The canal becomes progressively smaller from above down",1,"Last's. (Last's p. 540)"],["Pedicles form the upper and lower boundaries of each foramen",1,"Last's. (Last's p. 540)"],["In the cervical spine only the body above bounds the foramen anteriorly",0,"The body below is also included. (Last's p. 540)"],["The lumbar spine permits free rotation",0,"Lumbar rotation is not possible. (Last's p. 540)"]]},{"id":"sp-7570ffa3","r":"sp","t":"Spinal movement","y":1,"d":1,"src":"Last's text","s":"Movements of the spine (Last's):","o":[["Thoracic rotation occurs mainly above T9",1,"The lower 3-4 vertebrae do not rotate. (Last's p. 540)"],["The atlantoaxial joints allow rotation only",1,"Last's. (Last's p. 540)"],["The atlanto-occipital joints allow rotation",0,"Flexion, extension and some abduction only. (Last's p. 540)"],["Cervical facets lie on the circumference of a circle centred on the body",0,"Thoracic ones do; cervical ones do not. (Last's p. 540)"]]},{"id":"sp-0e14d566","r":"sp","t":"Atlas and axis","y":1,"d":1,"src":"Last's text","s":"The atlas (Last's):","o":[["The anterior arch is the ossified hypochordal bow",1,"Last's. (Last's p. 541-2)"],["C1 and C2 anterior rami pass behind the atlantal joints",1,"Last's. (Last's p. 541-2)"],["The inferior facet of the atlas is kidney-shaped",0,"The superior facet is kidney-shaped; the inferior is round and flat. (Last's p. 541-2)"],["Rectus capitis posterior major attaches to the posterior arch of the atlas",0,"Minor is the only muscle there. (Last's p. 541-2)"]]},{"id":"sp-5bd32696","r":"sp","t":"Atlas and axis","y":1,"d":1,"src":"Last's text","s":"The axis (Last's):","o":[["The dens bears no weight",1,"Weight passes through the superior articular facets. (Last's p. 541-2)"],["Its foramen transversarium is directed upwards and outwards",1,"Giving the vertebral artery a lateral bend. (Last's p. 541-2)"],["The dens is the centrum of the atlas",0,"Last's says it is not. (Last's p. 541-2)"],["Semispinalis capitis inserts into the bifid spine of the axis",0,"Semispinalis cervicis does. (Last's p. 541-2)"]]},{"id":"sp-2ed80547","r":"sp","t":"Atlanto-occipital region","y":1,"d":1,"src":"Last's text","s":"Ligaments at the craniovertebral junction (Last's):","o":[["The tectorial membrane is continuous with the PLL",1,"Last's. (Last's p. 541-2)"],["The alar ligaments limit rotation",1,"Last's. (Last's p. 541-2)"],["The tectorial membrane lies behind the dura",0,"In front of the dura, firmly attached to it. (Last's p. 541-2)"],["The apical ligament lies behind the cruciform ligament",0,"In front of its upper longitudinal band. (Last's p. 541-2)"]]},{"id":"sp-2c4b630f","r":"sp","t":"Atlanto-occipital region","y":1,"d":1,"src":"Last's text","s":"The atlanto-occipital membranes (Last's):","o":[["They are supplied by C1",1,"Last's. (Last's p. 541-2)"],["The posterior membrane is deficient laterally for the vertebral artery and C1",1,"Last's. (Last's p. 541-2)"],["The anterior membrane attaches to the posterior border of the anterior arch",0,"To its anterior (upper) border. (Last's p. 541-2)"],["The lateral atlantoaxial joints are supplied by C1",0,"By C2. (Last's p. 541-2)"]]},{"id":"sp-46327014","r":"sp","t":"Back muscles","y":1,"d":1,"src":"Last's text","s":"Extensor muscles of the back (Last's):","o":[["Rotatores occur only in the thoracic spine",1,"Last's. (Last's p. 544)"],["Semispinalis capitis is the chief extensor of the head",1,"Last's. (Last's p. 544)"],["Multifidus extends from the sacrum to C1",0,"To C2. (Last's p. 544)"],["Iliocostalis forms the most medial part of erector spinae",0,"The most lateral; spinalis is the most medial. (Last's p. 544)"]]},{"id":"sp-351cdb8f","r":"sp","t":"Back muscles","y":1,"d":1,"src":"Last's text","s":"Splenius and the vertebral flexors (Last's):","o":[["Splenius cervicis attaches to the transverse processes of C1-3 or C1-4",1,"Last's. (Last's p. 544)"],["Longus colli and psoas belong to the flexor group",1,"Supplied by anterior rami. (Last's p. 544)"],["Splenius is supplied by the accessory nerve",0,"By posterior rami. (Last's p. 544)"],["The vertebral flexors derive from the outer layer of the body wall",0,"From the innermost layer. (Last's p. 544)"]]},{"id":"sp-92883d6b","r":"sp","t":"Suboccipital triangle","y":1,"d":1,"src":"Last's text","s":"The suboccipital triangle (Last's):","o":[["Its floor is the posterior arch of the atlas and posterior atlanto-occipital membrane",1,"Last's. (Last's p. 546)"],["The suboccipital nerve and vertebral artery cross its floor",1,"Last's. (Last's p. 546)"],["It is bounded by rectus capitis posterior minor",0,"By rectus major and the two obliques. (Last's p. 546)"],["The greater occipital nerve crosses its floor",0,"It crosses its roof. (Last's p. 546)"]]},{"id":"sp-8ccced8d","r":"sp","t":"Suboccipital muscles","y":1,"d":1,"src":"Last's text","s":"The suboccipital muscles (Last's):","o":[["They are supplied by the posterior ramus of C1",1,"Last's. (Last's p. 546)"],["Inferior oblique runs from the axis spine to the atlas lateral mass",1,"It rotates the atlas. (Last's p. 546)"],["Superior oblique runs from the axis spine to the occiput",0,"From the atlas lateral mass. (Last's p. 546)"],["The suboccipital nerve supplies skin of the occiput",0,"Neither ramus supplies skin. (Last's p. 546)"]]},{"id":"sp-eddff9b9","r":"sp","t":"Vertebral artery","y":1,"d":1,"src":"Last's text","s":"The vertebral artery in the neck (Last's):","o":[["It enters the C6 foramen transversarium",1,"Last's. (Last's p. 547-8)"],["It passes behind the atlanto-occipital joint",1,"Last's. (Last's p. 547-8)"],["It runs behind the emerging cervical nerves",0,"In front of them. (Last's p. 547-8)"],["Vertebral veins accompany it inside the skull",0,"They exist only in the neck. (Last's p. 547-8)"]]},{"id":"sp-d42274ae","r":"sp","t":"Vertebral veins","y":1,"d":1,"src":"Last's text","s":"Vertebral veins (Last's):","o":[["One emerges with the artery through C6",1,"Last's. (Last's p. 547-8)"],["One passes alone through C7 foramen transversarium",1,"Last's. (Last's p. 547-8)"],["They drain into the internal jugular vein",0,"Into the brachiocephalic vein. (Last's p. 547-8)"],["The C7 foramen transmits the vertebral artery",0,"It does not. (Last's p. 547-8)"]]},{"id":"sp-de980d8a","r":"sp","t":"Occipital artery","y":1,"d":1,"src":"Last's text","s":"The occipital artery (Last's):","o":[["It grooves the occipitomastoid suture deep to digastric",1,"Last's. (Last's p. 547-8)"],["The hypoglossal nerve hooks round it from behind",1,"Last's. (Last's p. 547-8)"],["It crosses the floor of the suboccipital triangle",0,"The upper part of its roof. (Last's p. 547-8)"],["Its upper sternocleidomastoid branch is a guide to the facial nerve",0,"To the accessory nerve. (Last's p. 547-8)"]]},{"id":"sp-12f5d664","r":"sp","t":"Thoracic vertebrae","y":1,"d":1,"src":"Last's text","s":"Typical thoracic vertebrae (Last's):","o":[["The spines are steepest at T7",1,"Then level out to T12. (Last's p. 548-50)"],["The upper six costotransverse facets are concave",1,"Lower ones flat. (Last's p. 548-50)"],["The superior articular facets face anteromedially",0,"Posterolaterally. (Last's p. 548-50)"],["The body takes part in the boundary of the foramen above",0,"The pedicle is flush with the top, so it does not. (Last's p. 548-50)"]]},{"id":"sp-7a299b61","r":"sp","t":"Thoracic vertebrae","y":1,"d":1,"src":"Last's text","s":"Atypical thoracic vertebrae (Last's):","o":[["T1 has a whole facet for the first rib",1,"Last's. (Last's p. 548-50)"],["T12 has a lumbar-type inferior facet",1,"Last's. (Last's p. 548-50)"],["T1 pedicles are flush with the top of the body",0,"They attach below the upper margin, as in cervical vertebrae. (Last's p. 548-50)"],["The T12 posterior ramus runs between its mamillary and accessory processes",0,"The T11 posterior ramus does. (Last's p. 548-50)"]]},{"id":"sp-90ba3b50","r":"sp","t":"Lumbar vertebrae","y":1,"d":1,"src":"Last's text","s":"Lumbar vertebrae (Last's):","o":[["L5 is the only vertebra whose transverse process joins the body",1,"Last's. (Last's p. 550-2)"],["The lumbar lordosis is mainly due to wedge-shaped discs",1,"Last's. (Last's p. 550-2)"],["L1 usually has the longest transverse process",0,"L4 (L3 in other texts); L5 is short and massive. (Last's p. 550-2)"],["Lumbar bodies are heart-shaped",0,"Kidney-shaped. (Last's p. 550-2)"]]},{"id":"sp-0c0d8a43","r":"sp","t":"Lumbar vertebrae","y":1,"d":1,"src":"Last's text","s":"Relations of lumbar vertebrae (Last's):","o":[["Psoas spans the vertebral concavity on fibrous arches",1,"Lumbar vessels and sympathetic rami pass beneath. (Last's p. 550-2)"],["The arcuate ligaments attach to the L1 transverse process",1,"Last's. (Last's p. 550-2)"],["Quadratus lumborum lies medial to the ridge on the transverse process",0,"Lateral; psoas is medial. (Last's p. 550-2)"],["The L5 inferior facets face backwards",0,"They face forwards into backward-facing sacral facets. (Last's p. 550-2)"]]},{"id":"sp-377a3e1a","r":"sp","t":"Sacrum","y":1,"d":1,"src":"Last's text","s":"The sacrum (Last's):","o":[["The sacroiliac joint itself is not weight-bearing",1,"The ligaments bear the weight. (Last's p. 552-4)"],["Medial borders of the anterior foramina are vertebral bodies",1,"The rest is costal. (Last's p. 552-4)"],["The sacral hiatus is due to failure of fusion of S1 laminae",0,"S5 (and sometimes S4). (Last's p. 552-4)"],["The sacral plexus lies medial to the anterior foramina",0,"Lateral, on piriformis. (Last's p. 552-4)"]]},{"id":"sp-7669ae19","r":"sp","t":"Sacrum","y":1,"d":1,"src":"Last's text","s":"Relations of the sacrum (Last's):","o":[["The sympathetic trunk crosses medial to the sacral foramina",1,"Last's. (Last's p. 552-4)"],["The obturator nerve is the most lateral structure crossing the ala",1,"After trunk, lumbosacral trunk and iliolumbar artery. (Last's p. 552-4)"],["Sacrotuberous ligament arises above the auricular surface",0,"Below it. (Last's p. 552-4)"],["The dural sac in the sacral canal ends at S4",0,"At S2. (Last's p. 552-4)"]]},{"id":"sp-cb4a3452","r":"sp","t":"Coccyx","y":1,"d":1,"src":"Last's text","s":"The coccyx (Last's):","o":[["The lateral sacrococcygeal ligament completes the foramen for S5",1,"Last's. (Last's p. 552-4)"],["Its tip gives attachment to the anococcygeal raphe",1,"Last's. (Last's p. 552-4)"],["It usually has six pieces",0,"Four. (Last's p. 552-4)"],["Its lower surface lies in the pelvic floor",0,"Upper surface in the pelvic floor, lower in the buttock. (Last's p. 552-4)"]]},{"id":"sp-ef9306bb","r":"sp","t":"Cervical vertebrae","y":1,"d":1,"src":"Last's text","s":"Typical cervical vertebrae (Last's):","o":[["The C6 anterior tubercle is the carotid tubercle",1,"Last's. (Last's p. 555-6)"],["The posterior root ganglia lie on the lamella behind the foramen",1,"Last's. (Last's p. 555-6)"],["Scalenus anterior attaches to posterior tubercles",0,"To anterior tubercles. (Last's p. 555-6)"],["The vertebral body is larger than the vertebral foramen",0,"The same size or smaller. (Last's p. 555-6)"]]},{"id":"sp-767d14f6","r":"sp","t":"Cervical vertebrae","y":1,"d":1,"src":"Last's text","s":"The seventh cervical vertebra (Last's):","o":[["Its foramen transversarium does not transmit the vertebral artery",1,"Last's. (Last's p. 555-6)"],["Its spine ends in a rounded tubercle, not bifid",1,"Last's. (Last's p. 555-6)"],["Its anterior tubercle is large",0,"Small, for scalenus pleuralis and suprapleural membrane. (Last's p. 555-6)"],["Its foramen transmits the grey ramus to C8",0,"To the C7 anterior ramus. (Last's p. 555-6)"]]},{"id":"sp-2feac3dc","r":"sp","t":"Ossification","y":1,"d":1,"src":"Last's text","s":"Ossification of the axis (Last's):","o":[["It has five primary centres",1,"Last's. (Last's p. 555-6)"],["It has seven centres in total",1,"Five primary, tip of dens, and lower ring epiphysis. (Last's p. 555-6)"],["The tip of the dens centre appears at 12",0,"It appears at 3 and fuses at 12. (Last's p. 555-6)"],["The arch centres appear at the fifth month",0,"At the seventh week. (Last's p. 555-6)"]]},{"id":"sp-b88f8efa","r":"sp","t":"Back blood supply","y":1,"d":1,"src":"Last's text","s":"Blood supply of the vertebral column (Last's):","o":[["The deep cervical artery supplies the cervical extensors",1,"With the transverse cervical artery. (Last's p. 555-6)"],["Vertebral veins communicate with the left renal vein",1,"Last's. (Last's p. 555-6)"],["Basivertebral veins drain into the external vertebral plexus",0,"Into the internal plexus. (Last's p. 555-6)"],["The external vertebral plexus lies within the vertebral canal",0,"It is intramuscular. (Last's p. 555-6)"]]},{"id":"sp-619e1928","r":"sp","t":"NSA sample question","y":2,"d":1,"src":"NSA sample","s":"The spinal dura mater","o":[["has denticulate ligament attaching down to S2 level",0,"The denticulate ligament is pia mater. Its lowest denticulation is at the L1 root (Last's). It is the dural sac that ends at S2."],["is a prolongation of the inner layer of the dura mater of the posterior cranial fossa",1,"Last's: the outer (periosteal) layer does not continue below the foramen magnum."],["is attached to the spinal arachnoid by web-like processes which are well developed to form an anterior median septum",0,"The web-like strands run from arachnoid to pia, not dura, and they form an incomplete posterior median septum."],["is surrounded by a layer of fat in which lies the internal vertebral venous plexus",1,"The extradural (epidural) space contains fat and the internal vertebral plexus."]],"k":"B"},{"id":"sp-bc618ef1","r":"sp","t":"Atlas and axis","y":1,"d":1,"s":"Concerning the atlas:","o":[["It has no body",1,"Its body has fused with the axis to form the dens."],["The vertebral artery grooves the upper surface of its posterior arch",1,"The artery and the C1 nerve (suboccipital nerve) lie in the groove behind the lateral mass."],["Its transverse process is palpable between the mastoid process and the angle of the mandible",1,"The tip of the large transverse process of the atlas is palpable there."],["The transverse ligament attaches to the anterior tubercle",0,"The transverse ligament attaches to tubercles on the medial sides of the lateral masses, holding the dens against the anterior arch. The anterior tubercle gives attachment to longus colli."]]},{"id":"sp-e9096a50","r":"sp","t":"Craniovertebral ligaments","y":1,"d":1,"s":"Regarding the ligaments of the craniovertebral junction:","o":[["The apical ligament of the dens is a remnant of the notochord",1,"The apical ligament runs from the tip of the dens to the anterior margin of the foramen magnum."],["The alar ligaments attach the dens to the medial sides of the occipital condyles and limit rotation",1,"They are strong and check rotation and lateral flexion."],["The tectorial membrane is the upward continuation of the anterior longitudinal ligament",0,"The tectorial membrane continues the posterior longitudinal ligament up to the basiocciput. The anterior longitudinal ligament continues as the anterior atlanto-occipital membrane."],["The vertebral artery pierces the posterior atlanto-occipital membrane",1,"The artery and C1 nerve pass beneath the lower free border of the membrane, which may ossify to form a ponticulus posticus."]]},{"id":"sp-878d6ceb","r":"sp","t":"Craniovertebral joints","y":2,"d":1,"s":"Concerning movements of the craniovertebral joints:","o":[["Flexion and extension of the head occur mainly at the atlanto-occipital joints",1,"Last's: the atlanto-occipital joint allows nodding (flexion and extension) and some abduction, but no rotation, because the condyles form an egg-shaped ball."],["Rotation of the head occurs mainly at the atlanto-axial joints",1,"The atlas and skull rotate on the axis around the dens."],["The atlanto-axial joints comprise one median and two lateral synovial joints",1,"Median: dens with anterior arch and transverse ligament. Lateral: between the lateral masses."],["There is an intervertebral disc between the atlas and the axis",0,"There is no intervertebral disc between C1 and C2, or between the occiput and C1. The first disc is C2/3."]],"k":"C"},{"id":"sp-15af76c6","r":"sp","t":"Cervical vertebrae","y":1,"d":1,"s":"Regarding the cervical vertebrae:","o":[["The vertebral artery usually enters the foramen transversarium of C6",1,"The foramen of C7 usually transmits only the vertebral vein (and sometimes an accessory vein)."],["The anterior tubercle of the transverse process of C6 is the carotid tubercle",1,"The common carotid can be compressed against it. It is also a landmark for the stellate ganglion block and the inferior thyroid artery."],["Uncovertebral joints occur between C1 and C2",0,"Last's: the uncus on the upper surface of C3 to T1 bodies may appear to form a joint (of Luschka) because a small cavity develops. These are not true synovial joints but result from degenerative change in the disc."],["The spines of C3 to C6 are usually bifid",1,"C2 to C6 spines are usually bifid. C7 (vertebra prominens) has a long non-bifid spine."]]},{"id":"sp-f497a60e","r":"sp","t":"Thoracic vertebrae","y":2,"d":1,"s":"Concerning the costovertebral articulations:","o":[["The head of a typical rib articulates with the bodies of its own and the vertebra above",1,"Hence demifacets on typical thoracic vertebrae."],["The first rib articulates with T1 only",1,"T1 has a complete facet for rib 1 and a demifacet for rib 2."],["The tubercle of a typical rib articulates with the transverse process of the vertebra of the same number",1,"A typical rib, e.g. rib 6, articulates with T5 and T6 bodies and the T6 transverse process."],["The 11th and 12th ribs articulate with the transverse processes of their own vertebrae",0,"Ribs 11 and 12 have no tubercles and no costotransverse joints."]],"k":"C"},{"id":"sp-ff31576f","r":"sp","t":"Lumbar vertebrae and sacrum","y":1,"d":1,"s":"Regarding the lumbar vertebrae and sacrum:","o":[["The mammillary process is on the posterior border of the superior articular process",1,"Mammillary processes give attachment to multifidus. Accessory processes lie at the root of the transverse process."],["The iliolumbar ligament attaches to the transverse process of L5",1,"It runs from the tip of the L5 transverse process to the iliac crest."],["The sacral hiatus results from failure of fusion of the laminae of S5",1,"Sometimes S4 too. It is bounded by the sacral cornua and used for caudal epidural injection."],["The dural sac in the adult ends at the level of L5",0,"The dural and arachnoid sac ends at about S2."]]},{"id":"sp-0be7cf2e","r":"sp","t":"Intervertebral discs and ligaments","y":1,"d":1,"s":"Concerning the intervertebral discs and ligaments:","o":[["The nucleus pulposus is derived from the notochord",1,"The nucleus pulposus is a notochordal remnant. The annulus fibrosus is from sclerotome."],["A posterolateral L4/5 disc protrusion usually compresses the L5 nerve root",1,"Last's rule: a posterolateral herniation irritates the root one below the disc (L4 disc to L5 root, L5 disc to S1, C6 disc to C7). The root of the same number has already left, hugging its pedicle."],["The ligamentum flavum is composed mainly of collagen",0,"The ligamenta flava are composed mainly of yellow elastic tissue."],["The posterior longitudinal ligament is broad over the vertebral bodies and narrow over the discs",0,"It is the reverse. The PLL is narrow over the bodies (where basivertebral veins exit) and broad, denticulate and attached over the discs. Its weakness posterolaterally favours posterolateral herniation."]]},{"id":"sp-1bd7b4a8","r":"sp","t":"Spinal nerves and foramina","y":1,"d":1,"s":"Regarding the spinal nerves:","o":[["There are 31 pairs: 8 cervical, 12 thoracic, 5 lumbar, 5 sacral and 1 coccygeal",1,"Standard numbers."],["The C5 nerve emerges between C5 and C6 vertebrae",0,"Cervical nerves C1 to C7 emerge above their vertebrae, so C5 emerges between C4 and C5. C8 emerges between C7 and T1."],["The dorsal root ganglion lies in the intervertebral foramen",1,"Except in the sacral and coccygeal nerves, where the ganglia lie in the sacral canal."],["The dorsal root ganglion contains synapses between primary and secondary sensory neurones",0,"The ganglion contains pseudounipolar cell bodies. There are no synapses in it."]]},{"id":"sp-6f622088","r":"sp","t":"Dorsal rami","y":1,"d":1,"s":"Concerning the posterior (dorsal) rami of spinal nerves:","o":[["The dorsal ramus of C1 has no cutaneous branch",1,"The suboccipital nerve is purely motor to the suboccipital muscles."],["The dorsal rami of C7, C8, L4 and L5 usually do not reach the skin",1,"Last's principles of body wall innervation."],["Dorsal rami supply the skin of the posterior surface of the upper limb",0,"No dorsal ramus ever supplies the skin or muscle of a limb."],["In the upper half of the body the medial branch reaches the skin",1,"In the upper half the medial branches are cutaneous. In the lower half the lateral branches are."]]},{"id":"sp-4a170e6e","r":"sp","t":"Suboccipital region","y":1,"d":1,"s":"Concerning the suboccipital triangle:","o":[["It is bounded by rectus capitis posterior major, obliquus capitis superior and obliquus capitis inferior",1,"These form its three sides."],["Its floor is formed by the posterior atlanto-occipital membrane and posterior arch of atlas",1,"The vertebral artery lies on the posterior arch in the floor."],["The greater occipital nerve is the dorsal ramus of C1",0,"The greater occipital nerve is the medial branch of the dorsal ramus of C2. It winds around the lower border of obliquus inferior and pierces semispinalis capitis and trapezius."],["The suboccipital nerve supplies all the muscles bounding the triangle and rectus capitis posterior minor",1,"It also supplies semispinalis capitis in part."]]},{"id":"sp-8455e42f","r":"sp","t":"Muscles of the back","y":2,"d":1,"s":"The erector spinae:","o":[["Includes multifidus",0,"Multifidus belongs to the transversospinalis group, deep to erector spinae."],["Is supplied by anterior rami",0,"All the intrinsic back muscles are supplied by posterior (dorsal) rami."],["Has spinalis as its most lateral column",0,"Iliocostalis is lateral, longissimus intermediate, spinalis medial."],["Arises from a common origin on the sacrum, iliac crest and lumbar spines",1,"Last's: from a thick tendon deep to the lumbar fascia, diverging into iliocostalis and longissimus."]],"k":"D"},{"id":"sp-978e8d57","r":"sp","t":"Ligamentum nuchae and superficial back","y":1,"d":1,"s":"The ligamentum nuchae:","o":[["Extends from the external occipital protuberance to the spine of C7",1,"It is a median fibrous septum attached to the external occipital crest and the cervical spines."],["Gives origin to trapezius",1,"Also to splenius capitis, rhomboid minor and serratus posterior superior."],["Gives origin to levator scapulae",0,"Levator scapulae arises from the transverse processes of C1 to C4."],["Is homologous with the supraspinous ligament",1,"It continues the supraspinous ligament above C7."]]},{"id":"sp-08493ff7","r":"sp","t":"Vertebral venous plexus","y":2,"d":1,"s":"The internal vertebral venous plexus:","o":[["Lies in the extradural space",1,"It lies in the epidural fat between dura and bone."],["Is valveless",1,"Hence a route for metastasis, for example from prostate to vertebrae and skull."],["Communicates with the cranial dural venous sinuses through the foramen magnum",1,"It connects with the basilar plexus and occipital sinus."],["Receives the basivertebral veins from the vertebral bodies",1,"These emerge from the back of each body beneath the posterior longitudinal ligament."]],"k":"E"},{"id":"sp-7077dbcd","r":"sp","t":"Lumbar puncture","y":1,"d":1,"s":"In a lumbar puncture in an adult:","o":[["The line joining the highest points of the iliac crests usually crosses the L4 spine or the L4/5 interspace",1,"This intercristal (Tuffier's) line is the main landmark."],["The needle passes through the ligamentum flavum before the epidural space",1,"Skin, subcutaneous tissue, supraspinous ligament, interspinous ligament, ligamentum flavum, epidural space, dura, arachnoid."],["The needle must penetrate the pia mater to enter the subarachnoid space",0,"The pia invests the cord and roots. The subarachnoid space lies between arachnoid and pia."],["Puncture at L1/2 is safe because the cord ends at L3",0,"The adult cord usually ends at L1/2, so punctures are performed at L3/4 or L4/5. The L3 level applies at birth."]]},{"id":"sp-6d011f4c","r":"sp","t":"Dermatomes","y":1,"d":1,"s":"Concerning dermatomes:","o":[["C6 supplies the thumb",1,"C6 supplies the lateral forearm and thumb, C7 the middle finger, C8 the little finger."],["T10 supplies the umbilicus",1,"T4/5 nipple, T7 subcostal angle, T10 umbilicus."],["L4 supplies the medial side of the leg",1,"L4 supplies the medial leg and medial malleolus region."],["S1 supplies the skin over the medial malleolus",0,"S1 supplies the lateral ankle, lateral dorsum and sole of the foot and the little toe."]]},{"id":"sp-bfd6b553","r":"sp","t":"Dermatomes","y":2,"d":1,"s":"Regarding axial lines and dermatomes:","o":[["An axial line is a junction between dermatomes supplied from discontinuous spinal levels",1,"For example C5 and T1 on the front of the arm."],["There is no cutaneous area supplied by C1",1,"C1 has no cutaneous branch."],["The posterior two-thirds of the scrotum is supplied by S3",1,"The anterior third is supplied by L1, an example of an axial line in the perineum."],["Division of a single intercostal nerve produces a band of anaesthesia on the trunk",0,"Overlap between adjacent dermatomes means single-nerve division usually produces no anaesthesia, except across axial lines."]],"k":"C"},{"id":"sp-70b8ee05","r":"sp","t":"Myotomes and reflexes","y":1,"d":1,"s":"Regarding myotomes and tendon reflexes:","o":[["The biceps jerk is mediated by C5 and C6",1,"Biceps C5/6, triceps C7, knee L3/4, ankle S1."],["The knee jerk is mediated mainly by L3 and L4",1,"Via the femoral nerve to quadriceps."],["Extension of the great toe is a good test of the L5 myotome",1,"Extensor hallucis longus is a clean L5 test."],["The ankle jerk is mediated mainly by L4",0,"The ankle jerk is mediated by S1 (and S2)."]]},{"id":"sp-edd2de34","r":"sp","t":"Myotomes and reflexes","y":2,"d":1,"s":"Movements and their main segmental supply:","o":[["Shoulder abduction and lateral rotation, C5",1,"Deltoid, supraspinatus, infraspinatus and teres minor."],["Hip flexion, L4 and L5",0,"Hip flexion and adduction are L2 and L3. Hip extension and abduction are L4 and L5."],["Ankle plantarflexion, L4 and L5",0,"Plantarflexion is S1 and S2. Dorsiflexion is L4 and L5."],["Knee extension, L5 and S1",0,"Knee extension (quadriceps) is L3 and L4. Knee flexion is L5 and S1."]],"k":"A"},{"id":"sp-3e660f40","r":"sp","t":"Spinal meninges","y":1,"d":1,"s":"Concerning the spinal meninges:","o":[["The spinal dura is separated from the vertebral periosteum by an epidural space containing fat and veins",1,"Unlike the cranial dura, which is fused to the periosteum."],["The spinal dura is firmly attached to the margin of the foramen magnum",1,"It is also attached to the backs of C2 and C3 bodies and to the posterior longitudinal ligament."],["The dural sleeves of the spinal nerves end at the dorsal root ganglia, becoming continuous with the epineurium",1,"The dura fuses with the epineurium at the intervertebral foramen."],["The subarachnoid space ends at the conus medullaris",0,"It extends to S2, containing the cauda equina, which is the space sampled in lumbar puncture."]]},{"id":"sp-f0f14065","r":"sp","t":"Development of the vertebral column","y":2,"d":1,"s":"Concerning development and the vertebral column of the child:","o":[["The spinal cord ends at about L3 at birth",1,"It ascends relatively to L1/2 as the vertebral column grows faster than the cord."],["The cervical curvature becomes a secondary ventral convexity when the infant holds up its head",1,"The lumbar curvature develops when the infant starts to walk."],["The fetal vertebral column is C-shaped and concave ventrally",1,"The primary curvature is a ventral concavity, retained in the thoracic and sacral regions."],["The nucleus pulposus is derived from sclerotome",0,"The nucleus pulposus is notochordal. The vertebral bodies and annulus fibrosus come from sclerotome."]],"k":"C"},{"id":"th-ef9dc8ae","r":"th","t":"Rib joints","y":1,"d":1,"src":"Last's text","s":"Joints of the heads of the ribs (Last's):","o":[["The lower facet of the head articulates with its own vertebra",1,"Last's."],["The intra-articular ligament attaches the ridge to the disc",1,"Last's."],["The first rib articulates with C7 and T1",0,"T1 only, never C7."],["The radiate ligament of the first rib has three bands",0,"Two bands for the first and last two ribs."]]},{"id":"th-d42d1710","r":"th","t":"Rib joints","y":1,"d":1,"src":"Last's text","s":"The hypochordal bow (Last's):","o":[["It is formed by the central band of the radiate ligament",1,"Last's."],["It runs deep to the anterior longitudinal ligament",1,"Last's."],["It explains the formation of the dens",0,"It explains the anterior arch of the atlas."],["It lies superficial to the anterior longitudinal ligament",0,"Deep to it."]]},{"id":"th-bc76dc93","r":"th","t":"Rib joints","y":1,"d":1,"src":"Last's text","s":"Costal cartilage joints (Last's):","o":[["Costochondral joints are primary cartilaginous",1,"No movement occurs."],["The first sternocostal joint is primary cartilaginous",1,"Manubrium and first ribs move together."],["Interchondral synovial joints exist between cartilages 2 to 5",0,"Between 6 and 7, 7 and 8, 8 and 9."],["The third sternocostal joint has two cavities",0,"It is the second that has two separate cavities."]]},{"id":"th-b2ff109a","r":"th","t":"Rib joints","y":1,"d":1,"src":"Last's text","s":"Costotransverse joints (Last's):","o":[["The upper six are reciprocally curved",1,"Lower down they are flat."],["The superior costotransverse ligament runs to the transverse process above",1,"Last's."],["The lower two ribs have synovial costotransverse joints",0,"Only ligamentous attachments."],["The lateral costotransverse ligament attaches to the medial facet of the tubercle",0,"To the lateral, non-articular facet."]]},{"id":"th-26065632","r":"th","t":"Thoracic wall","y":1,"d":1,"src":"Last's text","s":"Thoracic wall muscles (Last's):","o":[["The serratus posterior muscles belong to the outer layer",1,"With the external intercostals."],["The neurovascular plane lies between middle and inner layers",1,"Last's."],["The subcostals belong to the middle layer",0,"To the inner (transversus thoracis) group."],["The internal intercostals correspond to external oblique",0,"To internal oblique."]]},{"id":"th-eebd3dd0","r":"th","t":"Thoracic joints","y":1,"d":1,"src":"Last's text","s":"Joints of the thoracic cage (Last's):","o":[["The last two costal cartilages are free",1,"Last's."],["The manubriosternal joint is a symphysis",1,"Last's."],["The upper ten costal cartilages articulate with the sternum",0,"The upper seven."],["Ribs articulate with the vertebral column in one place",0,"In two: heads and tubercles."]]},{"id":"th-be76b138","r":"th","t":"Respiration","y":1,"d":1,"src":"Last's text","s":"Central control of respiration (Last's):","o":[["The inspiratory centre lies near the nucleus of the tractus solitarius",1,"Last's."],["The pneumotaxic centre lies near the superior cerebellar peduncle",1,"Last's."],["Inspiratory neurons project to the ipsilateral phrenic neurons",0,"To the contralateral phrenic neurons."],["Hypoxia is detected centrally in the medulla",0,"Peripherally by carotid and aortic bodies; the brain responds to CO2."]]},{"id":"th-b3648c33","r":"th","t":"Cardiac plexus","y":1,"d":1,"src":"Last's text","s":"The cardiac plexus (Last's):","o":[["Its superficial and deep parts are functionally one",1,"Last's."],["It includes a pulmonary part supplying bronchial muscle",1,"Last's."],["Its branches reach only the SA node",0,"Also the AV node, bundle, ventricles and coronary arteries."],["Afferent vagal fibres from the lungs have cell bodies in the superior vagal ganglion",0,"In the inferior vagal ganglion."]]},{"id":"th-ed3910dc","r":"th","t":"Thoracic wall nerves","y":1,"d":1,"src":"Last's text","s":"Cutaneous supply of the thoracic wall (Last's):","o":[["Skin above the second rib is supplied by supraclavicular nerves (C4)",1,"Last's."],["Lateral cutaneous branches emerge in the midaxillary line",1,"With anterior and posterior divisions."],["The first intercostal nerve has a large lateral cutaneous branch",0,"It has no lateral or anterior cutaneous branch."],["The collateral branch supplies skin",0,"It has no cutaneous supply."]]},{"id":"th-a32b2acd","r":"th","t":"Intercostal nerves","y":1,"d":1,"src":"Last's text","s":"The intercostal neurovascular bundle (Last's):","o":[["The order from above down is vein, artery, nerve",1,"Last's."],["The collateral branches run along the upper border of the rib below",1,"Last's."],["Upper anterior cutaneous branches pass behind the internal thoracic artery",0,"They pass in front of it."],["The subcostal lateral cutaneous branch supplies skin over the umbilicus",0,"It supplies the anterior buttock between iliac crest and greater trochanter."]]},{"id":"th-a45b926d","r":"th","t":"Intercostal vessels","y":1,"d":1,"src":"Last's text","s":"Intercostal arteries (Last's):","o":[["The first two spaces are supplied posteriorly by the superior intercostal artery",1,"From the costocervical trunk."],["The musculophrenic artery supplies spaces 7 to 9 anteriorly",1,"Last's."],["The internal thoracic artery supplies spaces 1 to 9 anteriorly",0,"Spaces 1 to 6."],["Spaces 10 and 11 have anterior intercostal arteries from the musculophrenic",0,"They have none."]]},{"id":"th-9eb74db9","r":"th","t":"Intercostal vessels","y":1,"d":1,"src":"Last's text","s":"Intercostal veins (Last's):","o":[["The first space drains to the supreme intercostal vein",1,"Then the brachiocephalic vein."],["The left superior intercostal vein crosses the arch superficial to the vagus",1,"Deep to the phrenic."],["The right superior intercostal vein drains to the right brachiocephalic vei
