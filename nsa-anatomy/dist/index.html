misphere",1,"The pars opercularis and triangularis (areas 44 and 45)."],["The frontal eye field lies in the precentral gyrus",0,"The frontal eye field (area 8) lies in the posterior part of the middle frontal gyrus, in front of the precentral gyrus."],["The primary visual cortex lies on the walls of the calcarine sulcus",1,"Area 17, marked by the stria of Gennari."]]},{"id":"cns-3e572f83","r":"cns","t":"Commissures","y":1,"d":1,"s":"Regarding the commissural fibres:","o":[["The anterior commissure interconnects the temporal lobes and olfactory structures",1,"It crosses in the lamina terminalis, linking olfactory regions and the middle and inferior temporal gyri."],["The forceps minor passes through the splenium of the corpus callosum",0,"The forceps minor passes through the genu to the frontal lobes. The forceps major passes through the splenium to the occipital lobes."],["The posterior commissure carries fibres concerned with the consensual light reflex",1,"Pretectal fibres to the contralateral Edinger-Westphal nucleus cross in the posterior commissure."],["The anterior commissure crosses in the posterior wall of the third ventricle",0,"The anterior commissure crosses in the lamina terminalis, in the anterior wall. The posterior and habenular commissures are in the posterior wall."]]},{"id":"cns-587f725a","r":"cns","t":"Circle of Willis","y":1,"d":1,"s":"Concerning the arteries at the base of the brain:","o":[["The oculomotor nerve passes between the posterior cerebral and superior cerebellar arteries",1,"The nerve emerges between these two arteries close to the basilar bifurcation."],["The anterior cerebral artery passes above the optic nerve",1,"The A1 segment runs forward and medially above the optic nerve or chiasma to the longitudinal fissure."],["The recurrent artery of Heubner usually arises from the middle cerebral artery",0,"Heubner's artery arises from the anterior cerebral artery. Last's describes it as the largest medial striate branch, supplying the more posterior part of the capsule including the leg area (absent in 3%). Many neurosurgical texts emphasise the head of caudate and anterior limb, so know both."],["The posterior communicating artery is closely related to the oculomotor nerve",1,"The oculomotor nerve runs alongside the posterior communicating artery. An aneurysm at its origin compresses the nerve, and the pupil is often affected first."]]},{"id":"cns-50395fda","r":"cns","t":"Cerebral arteries","y":1,"d":1,"s":"The anterior choroidal artery:","o":[["Arises from the internal carotid artery",1,"Last's: it arises from the termination of the ICA or its near neighbours (MCA or posterior communicating). It is the fourth artery to the cerebrum and does not supply cortex."],["Supplies the choroid plexus of the inferior horn of the lateral ventricle",1,"It enters the choroid fissure to supply the inferior horn plexus."],["Supplies the optic tract and lateral geniculate body",1,"Last's: it supplies the optic chiasma and tract, lateral geniculate body, choroid plexus (entering the choroid fissure at the tip of the inferior horn) and the posterior part of the internal capsule. Occlusion gives contralateral hemiplegia, hemianaesthesia and hemianopia."],["Supplies the head of the caudate nucleus",0,"The head of the caudate is supplied mainly by the recurrent artery of Heubner and lateral striate arteries. The anterior choroidal supplies hippocampus, amygdala, posterior limb, optic tract and LGB."]]},{"id":"cns-979cc6a6","r":"cns","t":"Cerebral arteries","y":2,"d":1,"s":"Occlusion of the cortical branches of the middle cerebral artery (beyond the origin of its striate branches) would be expected to produce:","o":[["Contralateral hemiplegia affecting the face and arm more than the leg",1,"Cortical MCA territory includes the face and arm motor areas. The leg area is on the medial surface (ACA). Last's notes that occlusion of the stem, including the striate arteries, gives complete contralateral hemiplegia."],["Contralateral sensory loss over the face and arm",1,"The face and arm areas of the postcentral gyrus lie on the lateral surface in MCA territory."],["Aphasia if the dominant hemisphere is affected",1,"Broca's and Wernicke's areas are both in MCA territory."],["Contralateral loss of sensation in the leg predominating",0,"Leg sensory cortex is on the medial surface (paracentral lobule), supplied by the ACA."]],"k":"C"},{"id":"cns-9aa9fae2","r":"cns","t":"Cerebral veins","y":1,"d":1,"s":"Concerning the cerebral veins:","o":[["The great cerebral vein is formed by the union of the two internal cerebral veins",1,"They unite beneath the splenium to form the great cerebral vein (of Galen)."],["The internal cerebral vein is formed at the interventricular foramen by the thalamostriate and choroidal veins",1,"The thalamostriate and choroidal veins (with septal veins) unite behind the column of the fornix."],["The superior anastomotic vein connects the superficial middle cerebral vein with the transverse sinus",0,"The superior anastomotic vein (Trolard) drains to the superior sagittal sinus. The inferior anastomotic vein (Labbe) drains to the transverse sinus."],["Cerebral veins have no valves",1,"The cerebral veins and dural sinuses are valveless."]]},{"id":"cns-f99d2670","r":"cns","t":"Spinal cord","y":1,"d":1,"s":"Regarding the spinal cord:","o":[["In the adult it usually ends at the level of the L1/L2 intervertebral disc",1,"The conus medullaris usually ends at L1/2. At birth it ends at L3."],["The denticulate ligaments are attached between the anterior and posterior nerve roots",1,"The pia mater forms about 21 pairs of denticulate ligaments, attached to the dura between the roots."],["The filum terminale is attached to the back of the first coccygeal segment",1,"The filum pierces the dural sac at S2 and attaches to the dorsum of the coccyx."],["The lateral grey horn is present from C1 to C8",0,"Last's: a lateral horn of preganglionic sympathetic cells is present from T1 to L2, and a similar small lateral horn of parasympathetic cells lies in S2 to S4."]]},{"id":"cns-6983072a","r":"cns","t":"Spinal cord tracts","y":1,"d":1,"s":"Concerning the ascending tracts of the spinal cord:","o":[["The fasciculus cuneatus is present only above about the T6 segment",1,"The fasciculus cuneatus carries upper limb and upper trunk fibres, entering above about T6."],["In the posterior columns, sacral fibres lie most medially",1,"Fibres are added laterally as they ascend, so sacral fibres lie most medially in the fasciculus gracilis."],["Spinothalamic fibres cross in the posterior white commissure",0,"They cross in front of the central canal (anterior white commissure). Last's: crossing is transverse in the lowest cord but increasingly oblique higher up, taking 4 to 5 segments in the cervical region."],["The dorsal spinocerebellar tract arises from the nucleus dorsalis (Clarke's column)",1,"Last's: the thoracic nucleus (Clarke's column, lamina VII) occupies all the thoracic and first two lumbar segments (T1 to L2). Cervical proprioception reaches the cerebellum by the accessory cuneate nucleus and cuneocerebellar tract instead."]]},{"id":"cns-f7ff7184","r":"cns","t":"Spinal cord tracts","y":2,"d":1,"s":"A hemisection of the spinal cord at T10 (Brown-Sequard) would produce below the lesion:","o":[["Ipsilateral upper motor neurone paralysis",1,"The lateral corticospinal tract has already crossed in the medulla."],["Contralateral loss of proprioception",0,"The dorsal columns are uncrossed in the cord, so proprioception and vibration loss are ipsilateral."],["Ipsilateral loss of pain and temperature below the lesion",0,"Pain and temperature loss is contralateral, because the anterolateral tract has already crossed."],["Bilateral complete loss of light touch",0,"Light touch is partly carried in both dorsal columns and anterior spinothalamic tracts, so it is usually relatively preserved."]],"k":"A"},{"id":"cns-943945a1","r":"cns","t":"Spinal cord tracts","y":1,"d":1,"s":"Regarding the lateral corticospinal tract:","o":[["About 85 percent of corticospinal fibres decussate in the lower medulla",1,"Most fibres cross in the pyramidal decussation. The rest descend uncrossed as the anterior corticospinal tract."],["Fibres for the lower limb lie most laterally in the tract",1,"In the lateral corticospinal tract, cervical fibres are medial and sacral fibres lateral."],["It lies anterior to the lateral spinothalamic tract",0,"The lateral corticospinal tract lies in the posterior part of the lateral funiculus, in front of the posterior horn. The spinothalamic tract lies anterolaterally."],["Many fibres arise from cells in the postcentral gyrus",1,"Only about a third of corticospinal fibres arise from area 4. Others come from premotor and parietal cortex, including the postcentral gyrus."]]},{"id":"cns-3810a2ee","r":"cns","t":"Spinal cord blood supply","y":1,"d":1,"s":"Concerning the blood supply of the spinal cord:","o":[["The anterior spinal artery is formed by branches of both vertebral arteries",1,"A branch from each vertebral artery unites in front of the medulla to form the single anterior spinal artery."],["The anterior spinal artery supplies about the anterior two-thirds of the cord",1,"Last's: it supplies the whole cord anterior to the posterior grey columns. Anterior spinal artery syndrome spares the posterior columns, and pial vessels may spare the superficial sacral fibres (sacral sparing)."],["The arteria radicularis magna (of Adamkiewicz) usually enters on the right side",0,"Last's: it is slightly commoner on the left and at T10 or T11, but may be anywhere from T7 to L4, so it cannot be relied on to accompany a low thoracic root."],["The posterior spinal arteries usually arise from the posterior inferior cerebellar arteries or vertebral arteries",1,"Last's: each arises from PICA or the vertebral artery at the foramen magnum, is usually double, and runs through and behind the posterior rootlets. Each supplies the posterior grey and white columns of its own side."]]},{"id":"cns-6c103634","r":"cns","t":"Medulla","y":2,"d":1,"s":"The lateral medullary syndrome (PICA or vertebral artery occlusion) typically includes:","o":[["Contralateral loss of pain and temperature sensation in the face",0,"Facial loss is ipsilateral, because the spinal tract and nucleus of V are uncrossed. Body loss is contralateral, from the crossed spinothalamic tract."],["Ipsilateral paralysis of the tongue",0,"The hypoglossal nucleus and nerve are medial. Tongue paralysis belongs to the medial medullary syndrome."],["Contralateral hemiplegia",0,"The pyramid is medial (anterior spinal artery territory), so hemiplegia is not a feature."],["Ipsilateral paralysis of the palate, pharynx and vocal cord",1,"Involvement of the nucleus ambiguus causes dysphagia and dysphonia. Ipsilateral Horner's, vertigo, nystagmus and ataxia also occur."]],"k":"D"},{"id":"cns-a9e059a3","r":"cns","t":"Medulla","y":1,"d":1,"s":"In the medial medullary syndrome:","o":[["The tongue deviates towards the side of the lesion on protrusion",1,"Ipsilateral hypoglossal paralysis: the intact genioglossus pushes the tongue toward the paralysed side."],["There is contralateral hemiplegia",1,"The pyramid is involved above the decussation."],["There is contralateral loss of touch and proprioception",1,"The medial lemniscus is involved after it has crossed."],["There is ipsilateral loss of pain and temperature on the face",0,"That is a feature of the lateral medullary syndrome (spinal tract of V)."]]},{"id":"cns-3ca195d4","r":"cns","t":"Brainstem surface","y":1,"d":1,"s":"Regarding the superficial attachments of the cranial nerves to the brainstem:","o":[["The hypoglossal nerve emerges between the pyramid and the olive",1,"Its rootlets emerge in the preolivary (anterolateral) sulcus."],["The abducent nerve emerges at the junction of the pons and pyramid",1,"It emerges at the lower border of the pons, above the pyramid."],["The trochlear nerve emerges from the ventral surface of the midbrain",0,"The trochlear is the only cranial nerve to emerge from the dorsal surface, just below the inferior colliculus. It then crosses in the superior medullary velum."],["The glossopharyngeal, vagus and cranial accessory nerves emerge posterior to the olive",1,"They emerge in the postolivary sulcus, between the olive and the inferior cerebellar peduncle."]]},{"id":"cns-f3b268b7","r":"cns","t":"Floor of fourth ventricle","y":2,"d":1,"s":"Concerning features of the floor of the fourth ventricle:","o":[["The facial colliculus overlies the abducent nucleus",1,"The colliculus is formed by facial motor fibres looping (internal genu) around the abducent nucleus."],["The area postrema lies outside the blood-brain barrier",1,"It is a circumventricular organ concerned with vomiting."],["The vagal trigone overlies the dorsal motor nucleus of the vagus",1,"The hypoglossal trigone lies medially, the vagal trigone laterally."],["The striae medullares cross the floor at the level of the pontomedullary junction",1,"Last's: the medullary striae cross the floor at its widest part, between the pontine and medullary parts. They are aberrant fibres from pontine nuclei passing to the cerebellum by the inferior peduncle."]],"k":"E"},{"id":"cns-707ecb03","r":"cns","t":"Midbrain","y":1,"d":1,"s":"At the level of the superior colliculus, the midbrain contains the:","o":[["Oculomotor nucleus",1,"The oculomotor complex lies in front of the aqueduct at this level."],["Red nucleus",1,"The red nucleus lies in the tegmentum at the superior colliculus level and is traversed by the oculomotor fibres."],["Trochlear nucleus",0,"The trochlear nucleus is at the level of the inferior colliculus."],["Decussation of the superior cerebellar peduncles",0,"This is at the level of the inferior colliculus."]]},{"id":"cns-d4402a8d","r":"cns","t":"Visual pathway","y":1,"d":1,"s":"Concerning the visual pathways:","o":[["A lesion of the optic chiasma typically causes bitemporal hemianopia",1,"Crossing nasal fibres serve the temporal fields."],["Fibres of Meyer's loop serving the contralateral upper quadrant pass through the temporal lobe",1,"Inferior retinal fibres loop around the inferior horn. A temporal lesion produces a contralateral superior quadrantanopia."],["The pupillary light reflex is relayed through the lateral geniculate body",0,"Light reflex fibres leave the optic tract before the LGB to reach the pretectal nuclei."],["A lesion of the optic tract produces contralateral homonymous hemianopia",1,"Each tract carries fibres from the ipsilateral temporal and contralateral nasal retina."]]},{"id":"cns-d792d20b","r":"cns","t":"Limbic system","y":1,"d":1,"s":"Regarding the limbic system:","o":[["The amygdala lies in the temporal lobe in front of the tip of the inferior horn",1,"The amygdaloid body lies deep to the uncus, anterior to the inferior horn tip."],["The stria terminalis runs from the amygdala alongside the thalamostriate vein",1,"The stria terminalis runs in the groove between caudate and thalamus with the thalamostriate vein, to the septal area and hypothalamus."],["The hippocampus forms the floor of the inferior horn of the lateral ventricle",1,"It forms the floor (medial part) of the inferior horn."],["The mammillothalamic tract projects to the medial dorsal nucleus of the thalamus",0,"It projects to the anterior thalamic nucleus."]]},{"id":"cns-68780c53","r":"cns","t":"Meninges and spaces","y":2,"d":1,"s":"Regarding the subarachnoid cisterns:","o":[["The pontine cistern contains the vertebral arteries",0,"Last's: the pontine cistern contains the basilar artery and nerves V to XII. The vertebral arteries and PICA lie in the lateral part of the cisterna magna."],["The interpeduncular cistern contains the anterior communicating artery",0,"The anterior communicating artery lies in the chiasmatic cistern. The interpeduncular cistern holds the posterior circle, the pituitary stalk and nerves III and IV."],["The cisterna magna receives CSF from the lateral apertures",0,"It receives CSF from the median aperture. The lateral apertures open into the pontine cistern."],["The cerebellomedullary cistern can be entered by a needle passed through the posterior atlanto-occipital membrane",1,"Cisternal puncture, in the midline, through the membrane and spinal dura."]],"k":"D"},{"id":"cns-62401d92","r":"cns","t":"Cranial nerve nuclei","y":1,"d":1,"s":"Concerning the trigeminal nuclei:","o":[["The mesencephalic nucleus contains the cell bodies of primary proprioceptive neurones",1,"Unusually, these are primary sensory neurones lying within the CNS, carrying proprioception from the muscles of mastication and periodontal ligaments."],["The spinal nucleus extends down into the upper cervical cord",1,"It extends to about C2 or C3, continuous with the substantia gelatinosa."],["Pain and temperature from the face relay in the principal (chief) sensory nucleus",0,"Pain and temperature relay in the spinal nucleus (pars caudalis). The principal nucleus serves discriminative touch."],["The motor nucleus lies in the pons medial to the principal sensory nucleus",1,"The motor nucleus lies medial to the principal sensory nucleus in the mid pons."]]},{"id":"cns-86307f19","r":"cns","t":"Cranial nerve nuclei","y":2,"d":1,"s":"The nucleus ambiguus supplies motor fibres to the:","o":[["Stylopharyngeus via the glossopharyngeal nerve",1,"The cranial-most part of the nucleus ambiguus supplies stylopharyngeus via IX."],["Intrinsic muscles of the larynx via the vagus",1,"The intrinsic laryngeal muscles are supplied via the recurrent and external laryngeal nerves."],["Muscles of the soft palate except tensor veli palatini",1,"Via the pharyngeal plexus (vagus and cranial accessory)."],["Striated muscle of the upper oesophagus via the vagus",1,"Last's: the upper part of the nucleus serves the palate, the middle part the pharynx and oesophagus, the lowest part the larynx."]],"k":"E"},{"id":"cns-a57a3c87","r":"cns","t":"Cranial nerve nuclei","y":2,"d":1,"s":"The nucleus of the tractus solitarius receives:","o":[["Taste fibres from the anterior two-thirds of the tongue via the facial nerve",1,"Taste via chorda tympani, cell bodies in the geniculate ganglion."],["Taste fibres from the posterior third of the tongue via the glossopharyngeal nerve",1,"Cell bodies in the inferior ganglion of IX."],["Visceral afferents from the carotid sinus via the glossopharyngeal nerve",1,"Baroreceptor and chemoreceptor input via the carotid sinus nerve."],["Visceral afferents from the thoracic and abdominal viscera via the vagus",1,"General visceral afferents from the vagus end in the caudal part of the nucleus."]],"k":"E"},{"id":"cns-d4860c49","r":"cns","t":"Development of the nervous system","y":1,"d":1,"s":"Regarding myelination and development:","o":[["In the central nervous system, myelin is formed by oligodendrocytes",1,"One oligodendrocyte myelinates segments of many axons."],["In peripheral nerves, myelin is formed by satellite cells",0,"Peripheral myelin is formed by Schwann cells (neurolemmocytes). Satellite cells surround neurones in ganglia."],["The corticospinal tracts are fully myelinated at birth",0,"Corticospinal tracts are not fully myelinated at birth. Myelination continues during the first two years, which explains the extensor plantar response in infancy."],["Microglia are the phagocytic cells of the CNS",1,"Microglia are of mesodermal (monocyte) origin and act as CNS macrophages."]]},{"id":"cns-a8e2c534","r":"cns","t":"Pineal and epithalamus","y":2,"d":1,"s":"Concerning the epithalamus:","o":[["The pineal gland frequently calcifies in adults",1,"Last's: corpora amylacea calcify, and after about 40 years they normally cast a shadow on skull radiographs. A displaced pineal indicates a supratentorial mass."],["The habenular nuclei receive fibres through the stria medullaris thalami",1,"The stria medullaris thalami carries fibres from the septal area to the habenula."],["The habenulointerpeduncular tract (fasciculus retroflexus) projects to the interpeduncular nucleus",1,"It projects from the habenula to the interpeduncular nucleus of the midbrain."],["The pineal gland lies above the posterior commissure and below the splenium",1,"The pineal lies in the posterior wall of the third ventricle, below the splenium, with the posterior commissure in its lower lamina."]],"k":"E"},{"id":"gp-7e1de97b","r":"gp","t":"Tissues","y":1,"d":1,"src":"Last's text","s":"Superficial tissues (Last's):","o":[["Skin creases have thinner epidermis and thicker dermis",1,"Bound firmly to underlying fascia."],["The panniculus carnosus forms palmaris brevis in man",1,"And dartos, platysma and facial muscles."],["Deep fascia passes freely over bone",0,"It is always anchored firmly to periosteum."],["Deep fascia has its own nerve supply distinct from the overlying skin",0,"It shares the innervation of the overlying skin."]]},{"id":"gp-f88f4d83","r":"gp","t":"Tissues","y":1,"d":1,"src":"Last's text","s":"Cartilage (Last's):","o":[["Only fibrocartilage has a blood supply",1,"The others rely on diffusion."],["The epiglottis is elastic cartilage",1,"As is the pinna."],["Secondary cartilage is the cartilage of secondary cartilaginous joints",0,"It is a special cartilage of growing membrane bones such as the mandibular head and clavicle."],["Menisci of the knee are hyaline cartilage",0,"Fibrocartilage."]]},{"id":"gp-e33d0113","r":"gp","t":"Tissues","y":1,"d":1,"src":"Last's text","s":"Ligaments, tendons and joints (Last's):","o":[["Yellow ligaments include the ligamenta flava",1,"And capsular ligaments of the auditory ossicles."],["The epiphyseal plate is a primary cartilaginous joint",1,"Last's."],["The pubic symphysis is a primary cartilaginous joint",0,"Secondary (symphysis)."],["Hilton's law states that a joint's nerve supplies only its capsule",0,"The nerve to a muscle also supplies the joint it moves and the overlying skin."]]},{"id":"gp-05906c6d","r":"gp","t":"Tissues","y":1,"d":1,"src":"Last's text","s":"Serous membranes and veins (Last's):","o":[["The parietal layer of serosa develops from somatopleure",1,"Supplied segmentally by spinal nerves."],["The visceral layer has no sensory supply",1,"Autonomic only."],["The pulmonary veins have valves",0,"They are valveless."],["Veins have an internal elastic lamina like arteries",0,"They lack one."]]},{"id":"gp-2eb28078","r":"gp","t":"Peripheral nerves","y":1,"d":1,"src":"Last's text","s":"Peripheral nerve structure (Last's):","o":[["Perineurium joins fibres into fascicles",1,"Last's."],["The phrenic nerve takes its own artery through the mediastinum",1,"The pericardiacophrenic."],["Endoneurium binds fascicles into a nerve",0,"That is epineurium."],["About 10% of fibres in a muscle nerve are afferent",0,"About 40%."]]},{"id":"gp-d46c3796","r":"gp","t":"Spinal nerves","y":1,"d":1,"src":"Last's text","s":"Spinal nerves (Last's):","o":[["There are 31 pairs",1,"8, 12, 5, 5, 1."],["Anterior roots contain some unmyelinated afferent pain fibres",1,"They double back from the DRG."],["Spinal nerves lie in the spinal canal",0,"The roots unite in the intervertebral foramen; no spinal nerves lie in the canal."],["The spinal nerve proper is about 1 cm long",0,"1-2 mm at best."]]},{"id":"gp-d4c6c6b6","r":"gp","t":"Motor neuron pools","y":1,"d":1,"src":"Last's text","s":"Segmental innervation (Last's):","o":[["The trochlear and abducent nuclei are the exception to overlapping motor pools",1,"Each supplies a single muscle."],["More distal joints are controlled from lower cord segments",1,"Last's."],["Cutaneous nerve lesions cause proprioceptive loss",0,"Cutaneous nerves carry no muscle proprioceptive fibres."],["Muscles sharing an action are usually supplied by different segments",0,"The same segments."]]},{"id":"gp-d55ef297","r":"gp","t":"Body wall","y":1,"d":1,"src":"Last's text","s":"Nerves and vessels of the body wall (Last's):","o":[["Where nerve and segmental artery cross, the nerve lies nearer the skin",1,"Last's."],["The sympathetic trunk lies within the circle of the segmental artery",1,"Last's."],["Posterior rami supply limb muscles",0,"Never."],["The collateral intercostal branch supplies skin",0,"Motor only."]]},{"id":"gp-be5eaa09","r":"gp","t":"Limbs","y":1,"d":1,"src":"Last's text","s":"Limb innervation plan (Last's):","o":[["Limb buds arise from the lateral strip of the body wall",1,"Supplied by lateral branches of anterior rami."],["Posterior divisions supply extensor compartments",1,"Last's."],["The extensor compartment has the richer nerve supply",0,"The flexor; the lowest root of each plexus goes wholly to flexors."],["The cephalic vein marks the postaxial border of the upper limb",0,"The preaxial border; basilic is postaxial."]]},{"id":"gp-55b4b61a","r":"gp","t":"Limbs","y":1,"d":1,"src":"Last's text","s":"Compartment migration (Last's):","o":[["Brachioradialis developed in the extensor compartment",1,"Hence radial nerve supply."],["The adult septum imprisons the ulnar nerve in the extensor compartment above the elbow",1,"Last's."],["The short head of biceps femoris developed in the flexor compartment",0,"In the extensor; hence common peroneal supply."],["The radial nerve lies in the extensor compartment just above the elbow",0,"The septum places it in the flexor compartment."]]},{"id":"gp-48283ace","r":"gp","t":"Dermatomes","y":1,"d":1,"src":"Last's text","s":"Axial lines (Last's):","o":[["There is no dermatomal overlap across axial lines",1,"Last's."],["The upper limb anterior axial line starts near the sternal angle",1,"Across the 2nd costal cartilage."],["The posterior upper limb axial line ends at the wrist",0,"At the deltoid insertion."],["The root of the penis is S2",0,"L1; the rest and scrotum S2/3."]]},{"id":"gp-de4fa012","r":"gp","t":"Dermatomes","y":1,"d":1,"src":"Last's text","s":"Dermatomes (Last's):","o":[["C1 has no skin supply",1,"Last's."],["T10 supplies the umbilicus",1,"Last's."],["C7 supplies the little finger",0,"The middle finger; C8 the ring and little fingers."],["T1 supplies the axilla",0,"The medial elbow, not the axilla."]]},{"id":"gp-f3c90cea","r":"gp","t":"Dermatomes","y":1,"d":1,"src":"Last's text","s":"Lower limb dermatomes (Last's):","o":[["L4 supplies the medial malleolus",1,"Last's."],["S3 supplies the sitting area of the buttock",1,"Last's."],["L5 supplies the lateral malleolus",0,"S1 does."],["S4 supplies the posterior thigh",0,"Perianal."]]},{"id":"gp-b01e73d0","r":"gp","t":"Myotomes","y":1,"d":1,"src":"Last's text","s":"Myotomes and reflexes (Last's):","o":[["Biceps jerk is C6",1,"Last's."],["Knee jerk is L3",1,"Last's."],["Ankle jerk is L5",0,"S1."],["Abductor pollicis brevis is C6",0,"T1."]]},{"id":"gp-c67d4ea3","r":"gp","t":"Myotomes","y":1,"d":1,"src":"Last's text","s":"Lower limb segmental supply (Last's):","o":[["Hip adduction is L2/3",1,"Last's."],["Tibialis posterior is supplied by L4",1,"With its inverting partner tibialis anterior."],["Gluteus maximus is L4, 5, S1",0,"L5, S1, 2."],["Hip abduction is L2/3",0,"L4/5."]]},{"id":"gp-bc8977e4","r":"gp","t":"Reflexes","y":1,"d":1,"src":"Last's text","s":"Spinal reflexes (Last's):","o":[["The plantar response becomes flexor during the second year",1,"Last's."],["The anal and bulbocavernosus reflexes depend mainly on S3",1,"Last's."],["Abdominal reflexes are exaggerated in upper motor neuron lesions",0,"They are absent."],["In Beevor's sign the umbilicus moves downwards",0,"Upwards."]]},{"id":"gp-20f29044","r":"gp","t":"Autonomic","y":1,"d":1,"src":"Last's text","s":"The sympathetic trunk (Last's):","o":[["The superior cervical ganglion represents C1-4",1,"Last's."],["Only T1-L2 give white rami",1,"Last's."],["Grey rami are preganglionic",0,"Postganglionic."],["Limb vessels receive sympathetics by fibres running long distances along the arteries",0,"From adjacent peripheral nerves."]]},{"id":"gp-1c4182d4","r":"gp","t":"Autonomic","y":1,"d":1,"src":"Last's text","s":"Autonomic terminology (Last's):","o":[["Sacral splanchnic nerves are sympathetic",1,"Last's."],["Pelvic splanchnic nerves are parasympathetic",1,"Last's."],["A proximal root lesion reduces sympathetic function in the limb",0,"Sympathetics join distal to the roots, so peripheral lesions do."],["Preganglionic fibres to the suprarenal synapse in the coeliac ganglion",0,"They pass without synapse."]]},{"id":"gp-fce43c1c","r":"gp","t":"Embryology","y":1,"d":1,"src":"Last's text","s":"Early development (Last's):","o":[["The embryo becomes a fetus after 8 weeks",1,"Last's."],["Neural crest gives Schwann cells",1,"And DRG, autonomic ganglia, suprarenal medulla."],["Paraxial mesoderm gives the limb buds",0,"The lateral plate does."],["Intermediate mesoderm is unsegmented",0,"The lateral plate is unsegmented."]]},{"id":"gp-e0324b5d","r":"gp","t":"Branchial arches","y":1,"d":1,"src":"Last's text","s":"Branchial arches (Last's):","o":[["The stapedial artery is a second arch remnant",1,"Last's."],["Stylopharyngeus is the third arch muscle",1,"Last's."],["The mandible ossifies in Meckel's cartilage",0,"In membrane; Meckel's remnants include the lingula."],["The 4th arch forms the pulmonary arteries",0,"The 6th does."]]},{"id":"gp-8bb093fd","r":"gp","t":"Branchial pouches","y":1,"d":1,"src":"Last's text","s":"Branchial pouches (Last's):","o":[["The third pouch forms the inferior parathyroid",1,"And thymus."],["The fourth pouch forms the superior parathyroid",1,"Last's."],["The second pouch forms the thymus",0,"It forms the tonsillar crypts."],["The fifth pouch forms the follicular thyroid cells",0,"Ultimobranchial body and parafollicular cells."]]},{"id":"gp-37b8a023","r":"gp","t":"Branchial arches","y":1,"d":1,"src":"Last's text","s":"Branchial anomalies (Last's):","o":[["A branchial fistula tracks between internal and external carotids",1,"Last's."],["An aberrant right subclavian makes the right laryngeal nerve non-recurrent",1,"Incidence 1-2%."],["The fistula opens at the posterior border of SCM",0,"At the anterior lower border."],["The chorda tympani is a post-trematic nerve",0,"It is pretrematic."]]},{"id":"gp-1aeb030b","r":"gp","t":"Child skull","y":1,"d":1,"src":"Last's text","s":"The newborn skull (Last's):","o":[["The anterior fontanelle closes at about 18 months",1,"Last's."],["The posterior fontanelle closes by the end of the first year",1,"Last's."],["The mastoid is aerated at birth",0,"From the beginning of the second year."],["The geniculate ganglion is separated from middle fossa dura at birth",0,"The tegmen is incomplete so it contacts the dura."]]},{"id":"gp-8db2029b","r":"gp","t":"Child skull","y":1,"d":1,"src":"Last's text","s":"Development of the temporal bone (Last's):","o":[["The squamous and tympanic parts ossify in membrane",1,"Last's."],["The foramen of Huschke is temporary",1,"Last's."],["The facial nerve at birth is protected by the mastoid process",0,"Unprotected, covered only by SCM."],["The spinal cord ends at L1 at birth",0,"L3."]]},{"id":"gp-896670bd","r":"gp","t":"Tissues","y":1,"d":1,"s":"Concerning the basic tissues (Last's chapter 1):","o":[["Sweat glands are supplied by cholinergic fibres in sympathetic nerves",1,"Sudomotor fibres are sympathetic but cholinergic."],["Sweat glands are absent from the lip margins, nipples and glans penis",1,"Also from the tympanic membrane, inner prepuce and labia minora, where sebaceous glands are present instead."],["Elastic cartilage is found in the epiglottis and auditory tube",1,"And the external ear."],["Hyaline cartilage has a rich blood supply",0,"Last's: only fibrocartilage has a (sparse) blood supply. Hyaline and elastic cartilage rely on diffusion."]]},{"id":"gp-fbcfa0de","r":"gp","t":"Tissues","y":2,"d":1,"s":"The panniculus carnosus in man is represented by:","o":[["Platysma and the muscles of the scalp and face",1,"Last's."],["Palmaris brevis",1,"Last's."],["Dartos of the scrotum",1,"Also corrugator cutis ani and the subareolar muscle of the nipple."],["Corrugator cutis ani",1,"Last's list also includes the subareolar muscle of the nipple."]],"k":"E"},{"id":"gp-978bef2b","r":"gp","t":"Joints","y":1,"d":1,"s":"Regarding joints:","o":[["The spheno-occipital joint is a primary cartilaginous joint",1,"A synchondrosis that ossifies at about 25 years."],["Intervertebral discs are secondary cartilaginous joints",1,"Symphyses, typically midline."],["The first sternochondral joint is a synovial joint",0,"It is a primary cartilaginous joint."],["Articular discs are found in the sternoclavicular and temporomandibular joints",1,"Where congruity is low. Also the menisci of the knee."]]},{"id":"gp-8fb2dc29","r":"gp","t":"Joints","y":2,"d":1,"s":"Hilton's law states that the nerve to a muscle tends to supply:","o":[["The joint moved by that muscle",1,"Last's."],["The skin over the joint",1,"Last's."],["The muscle itself",1,"The motor nerve gives branches to the joint and overlying skin."],["The periosteum deep to the muscle",0,"Not part of Hilton's law as stated by Last's."]],"k":"C"},{"id":"gp-6c3b14a7","r":"gp","t":"Bone","y":1,"d":1,"s":"Concerning bone:","o":[["The periosteum does not cover articular surfaces of synovial joints",1,"Last's."],["Subcutaneous periosteum is supplied by the nerve of the overlying skin",1,"Deeper periosteum is supplied by nerves to nearby muscles."],["Secondary cartilage develops in the head of the mandible and ends of the clavicle",1,"Last's: in certain growing membrane bones. Not related to secondary cartilaginous joints."],["Sesamoid bones are constantly present in the tendon of flexor pollicis longus",0,"Last's: constant sesamoids are the patella and those in adductor pollicis, flexor pollicis brevis and flexor hallucis brevis."]]},{"id":"gp-75a3937d","r":"gp","t":"Blood vessels and lymphatics","y":2,"d":1,"s":"Veins without valves include the:","o":[["Superior and inferior venae cavae",1,"Last's list."],["Dural venous sinuses and veins of the head and neck",1,"Including the ophthalmic veins."],["Vertebral venous plexuses",1,"A route for metastatic spread."],["Portal vein and its tributaries",1,"Also hepatic, cardiac, pulmonary and pelvic veins."]],"k":"E"},{"id":"gp-49a2ac0e","r":"gp","t":"Peripheral nerves","y":1,"d":1,"s":"Regarding peripheral nerves:","o":[["In the sciatic nerve about 80% of the cross-section is connective tissue",1,"BSE notes after Last's."],["The median nerve has its own artery from the anterior interosseous artery",1,"And the sciatic from the inferior gluteal."],["Group C fibres are thinly myelinated preganglionic autonomic fibres",0,"Group B are preganglionic autonomic (myelinated). Group C are unmyelinated postganglionic autonomic and slow pain fibres."],["About 40% of the fibres in a nerve to a limb muscle are afferent",1,"Last's."]]},{"id":"gp-756732aa","r":"gp","t":"Spinal nerves and rami","y":2,"d":1,"s":"Concerning the posterior (dorsal) rami:","o":[["In the upper half of the body the medial branches reach the skin",1,"Down to about T6. Below this the lateral branches do."],["The posterior rami of C7, C8, L4 and L5 have no cutaneous branches",1,"Nor does C1."],["No posterior ramus supplies skin or muscle of a limb",1,"Last's."],["The cutaneous territory of posterior rami extends to the posterior axillary line",0,"Last's: it extends beyond the extensor muscles but does not reach the posterior axillary lines."]],"k":"C"},{"id":"gp-0f90e2f1","r":"gp","t":"Body wall nerves","y":1,"d":1,"s":"Regarding the general plan of body wall innervation:","o":[["Where a spinal nerve and segmental artery cross, the nerve lies nearer the skin",1,"Last's."],["The neurovascular plane lies between the middle and innermost muscle layers",1,"In both thorax and abdomen."],["The most caudal root of a limb plexus is distributed entirely to the extensor compartment",0,"It goes entirely to the flexor compartment (T1 in the brachial, S3 in the sacral plexus), showing the richer flexor supply."],["Limb buds grow out from the lateral strip supplied by lateral branches of anterior rami",1,"Their anterior divisions supply flexors, posterior divisions extensors."]]},{"id":"gp-c9faacf0","r":"gp","t":"Body wall nerves","y":2,"d":1,"s":"Muscles with double innervation because of migration between compartments include:","o":[["Deltoid (axillary and suprascapular)",0,"Deltoid is supplied by the axillary nerve alone."],["Brachialis (lateral part supplied by the radial nerve)",1,"Last's: the lateral part developed in the extensor compartment."],["Rectus femoris (femoral and obturator)",0,"Rectus femoris is supplied by the femoral nerve only."],["Short head of biceps femoris (common peroneal)",1,"Last's: it migrated from the extensor compartment, so its supply differs from the long head (tibial)."]],"k":"B"},{"id":"gp-a6edd7f2","r":"gp","t":"Dermatomes and segments","y":1,"d":1,"s":"Concerning Last's rules of segmental innervation of muscles:","o":[["Muscles sharing a primary action on a joint are supplied by the same segments",1,"Usually two."],["Their opponents are supplied by segments running in numerical sequence with these",1,"E.g. elbow flexion C5/6, extension C7/8."],["For a more distal joint the spinal centre lies one segment lower",1,"Last's."],["Most upper limb muscles are supplied equally by three segments",0,"Most muscles are supplied equally by two adjacent segments. Some upper limb muscles are predominantly unisegmental."]]},{"id":"gp-7f3099ac","r":"gp","t":"Reflexes","y":2,"d":1,"s":"Concerning reflexes:","o":[["The plantar reflex becomes flexor during the second year",1,"Under one year an extensor response is normal."],["Exaggerated tendon reflexes in upper motor neurone lesions reflect release of the fusimotor loop",1,"Loss of supraspinal (reticulospinal, vestibulospinal) control makes gamma motor neurones over-excitable."],["The abdominal reflexes are lost in upper motor neurone lesions",1,"Beevor's sign indicates weakness below the umbilicus."],["The anal reflex is a monosynaptic stretch reflex",0,"Last's: plantar, abdominal, anal and bulbocavernosus are multisynaptic cutaneous reflexes."]],"k":"C"},{"id":"gp-5b0d6632","r":"gp","t":"Pharyngeal arches","y":1,"d":1,"s":"Derivatives of the first pharyngeal arch include:","o":[["The malleus and incus",1,"From Meckel's cartilage."],["The sphenomandibular ligament and lingula",1,"The anterior ligament of the malleus too."],["The mandible, formed by ossification of Meckel's cartilage",0,"Last's: the mandible and maxilla ossify in membrane, not from Meckel's cartilage."],["Tensor tympani and tensor veli palatini",1,"Supplied by the mandibular nerve."]]},{"id":"gp-5f5826ab","r":"gp","t":"Pharyngeal arches","y":2,"d":1,"s":"Derivatives of the second pharyngeal arch include:","o":[["Stapes",1,"Second arch cartilage."],["Styloid process and stylohyoid ligament",1,"Their lengths vary inversely."],["Lesser horns and upper body of the hyoid",1,"Third arch: greater horns and lower body."],["Stapedius and posterior belly of digastric",1,"Supplied by the facial nerve."]],"k":"E"},{"id":"gp-17bbed9a","r":"gp","t":"Pharyngeal pouches","y":1,"d":1,"s":"Concerning the pharyngeal pouches:","o":[["The third pouch forms the inferior parathyroid and the thymus",1,"Hence the inferior parathyroid descends with the thymus and may be found in the mediastinum."],["The fourth pouch forms the superior parathyroid",1,"Last's."],["The fifth pouch forms the ultimobranchial body, giving the parafollicular cells",1,"Last's."],["The second pouch forms the auditory tube",0,"The first pouch forms the auditory tube, middle ear and mastoid antrum. The second pouch forms the tonsillar crypts and supratonsillar fossa."]]},{"id":"gp-5a08b8e0","r":"gp","t":"Aortic arches","y":2,"d":1,"s":"Regarding the aortic arch arteries:","o":[["The right fourth arch forms the proximal right subclavian artery",1,"The left fourth forms the arch of the aorta."],["The third arch forms part of the internal carotid artery",1,"So the carotid sinus is supplied by IX, the third arch nerve."],["The right recurrent laryngeal nerve hooks under the subclavian because the right fifth and dorsal sixth arches disappear",1,"Last's."],["The second arch artery persists as the stapedial artery in the adult",0,"Last's: the stapedial artery does not persist after birth."]],"k":"C"},{"id":"gp-13398c53","r":"gp","t":"Neural crest and early development","y":1,"d":1,"s":"Neural crest cells give rise to:","o":[["Posterior root ganglia",1,"Last's."],["Schwann cells",1,"Also satellite cells of ganglia."],["Chromaffin cells of the suprarenal medulla",1,"Last's."],["Oligodendrocytes",0,"Oligodendrocytes arise from the neural tube (neuroectoderm), not the neural crest."]]},{"id":"gp-a9c20e04","r":"gp","t":"Mesoderm","y":2,"d":1,"s":"Regarding the intraembryonic mesoderm:","o":[["Paraxial mesoderm forms somites giving sclerotome and myotome",1,"Sclerotome gives vertebrae and dura, myotome the body wall muscles."],["The intermediate cell mass gives the gonads and suprarenal cortex medially",1,"And the nephric systems laterally."],["Rathke's pouch arises from ectoderm cranial to the buccopharyngeal membrane",1,"It forms the adenohypophysis."],["The lateral plate is segmented",0,"Last's: the lateral plate remains unsegmented and gives the limb buds."]],"k":"C"},{"id":"gp-4840235b","r":"gp","t":"Septum transversum","y":1,"d":1,"s":"Concerning the septum transversum:","o":[["Its cranial part forms the pericardium and part of the diaphragm",1,"Last's."],["It is invaded by cervical myotomes, mainly the fourth",1,"Producing diaphragmatic muscle."],["Its caudal part is invaded by the developing liver",1,"Forming the ventral mesogastrium."],["It forms the oesophageal and vena caval openings",0,"Last's: the connective tissue around these openings comes from the oesophageal mesentery."]]},{"id":"gp-1fecf9ca","r":"gp","t":"Anatomy of the child","y":2,"d":1,"s":"In the newborn:","o":[["The foot is everted",0,"The foot is inverted at birth and gradually everts."],["The spinal cord ends at L1",0,"At birth it ends at L3, reaching L1/2 by about 20 years."],["The mastoid process is well developed",0,"It is absent at birth, leaving the emerging facial nerve unprotected."],["The internal ear, middle ear and mastoid antrum are fully developed",1,"Last's."]],"k":"D"},{"id":"gp-644977c0","r":"gp","t":"Anatomy of the child","y":1,"d":1,"s":"Concerning growth of the skull and face:","o":[["In the fetus the vertical height of the orbit equals that of the maxilla and mandible together",1,"In the adult it is a third, because of growth of the maxillary sinus and alveolar bone."],["The face elongates rapidly when the permanent teeth erupt from about 6 years",1,"Last's."],["In the newborn the mental foramen lies near the lower border of the mandible",1,"In the edentulous elderly it lies near the upper border."],["The two halves of the mandible are fused at birth",0,"They are separated by fibrous tissue at the symphysis and unite in the first year."]]},{"id":"gp-0cc70ca2","r":"gp","t":"Ossification","y":2,"d":1,"s":"Bones that ossify in membrane include the:","o":[["Clavicle",1,"Last's: skull vault, face and clavicle ossify in membrane."],["Bones of the skull vault",1,"Also the squamous and tympanic temporal."],["Tuberosity of each terminal phalanx",1,"Last's."],["Squamous and tympanic parts of the temporal bone",1,"Last's: the vault and these parts ossify in membrane, the petromastoid and styloid in cartilage."]],"k":"E"},{"id":"gp-e2c59b36","r":"gp","t":"Ossification","y":1,"d":1,"s":"Regarding ossification of the vertebrae:","o":[["Each vertebra ossifies from three primary centres, a centrum and two halves of the neural arch",1,"All are ossified by the eighth fetal week."],["The neurocentral junctions unite by about 7 years",1,"The laminae unite by about 2 years."],["The costal elements of cervical and lumbar vertebrae have separate primary centres",0,"Last's: they ossify by extension from the neural arch. An occasional centre in C7 or L1 gives a cervical or lumbar rib. Sacral costal elements do have centres."],["The tip of the dens has a secondary centre appearing at about 3 years and fusing at 12",1,"Last's."]]},{"id":"gp-9452aa16","r":"gp","t":"Ossification","y":1,"d":1,"s":"Concerning the axis:","o":[["It has five primary ossification centres",1,"Last's: lower part of the body, two for the halves of the arch and lateral parts, and two for the halves of the dens and upper body."],["It has no secondary ossification centres",0,"It has a secondary centre for the tip of the dens (appears about 3 years, fuses about 12) and an epiphyseal ring for the lower body (puberty, fuses about 25)."],["The dens and lateral parts unite with the body at about 3 years",1,"Last's."],["The dens transmits the weight of the skull to the axis",0,"Last's: the dens bears no weight. Weight passes through the superior articular facets beside it."]]},{"id":"hn-c69676aa","r":"hn","t":"Platysma","y":1,"d":1,"src":"Last's text","s":"Platysma (Last's):","o":[["It is part of the panniculus carnosus",1,"Last's."],["It covers the external and anterior jugular veins",1,"Last's."],["It is supplied by the marginal mandibular branch of the facial nerve",0,"By the cervical branch; proprioception via the transverse cervical nerve."],["Its lateral border forms zygomaticus minor",0,"It forms risorius, attached to the modiolus."]]},{"id":"hn-2951490d","r":"hn","t":"Submandibular gland","y":1,"d":1,"src":"Last's text","s":"The superficial part of the submandibular gland (Last's):","o":[["Its lateral surface is grooved by the facial artery",1,"Last's. (Last's p. 436)"],["Its inferior surface is crossed by the facial vein",1,"And the cervical branch of the facial nerve. (Last's p. 436)"],["Its medial surface lies mostly against hyoglossus",0,"Mostly against mylohyoid; hyoglossus is overlapped posteriorly. (Last's p. 436)"],["It overlaps the masseter insertion",0,"It overlaps the front of the medial pterygoid insertion. (Last's p. 436)"]]},{"id":"hn-09fb27a8","r":"hn","t":"Submandibular gland","y":1,"d":1,"src":"Last's text","s":"The deep part of the gland and its duct (Last's):","o":[["The lingual nerve lies above the deep part",1,"Last's. (Last's p. 436)"],["The duct is about 5 cm long",1,"The same length as the parotid duct. (Last's p. 436)"],["The hypoglossal nerve lies above the deep part",0,"Below it, with the duct. (Last's p. 436)"],["The duct emerges from the deep part of the gland",0,"From the superficial part near the posterior border of mylohyoid. (Last's p. 436)"]]},{"id":"hn-e596cc90","r":"hn","t":"Submandibular gland","y":1,"d":1,"src":"Last's text","s":"Innervation of the submandibular gland:","o":[["Preganglionic fibres arise in the superior salivary nucleus",1,"Last's. (Last's p. 436)"],["Sympathetic fibres come from the plexus on the facial artery",1,"Last's. (Last's p. 436)"],["Preganglionic fibres run in the lesser petrosal nerve",0,"Via nervus intermedius, chorda tympani and lingual nerve. (Last's p. 436)"],["All secretomotor cell bodies lie in the submandibular ganglion",0,"A few lie in small ganglionic masses on the gland. (Last's p. 436)"]]},{"id":"hn-cc5c5aa8","r":"hn","t":"External carotid","y":1,"d":1,"src":"Last's text","s":"The external carotid artery (Last's):","o":[["It begins near the greater horn of the hyoid",1,"Last's. (Last's p. 436)"],["It divides behind the neck of the mandible",1,"Within the parotid. (Last's p. 436)"],["It lies lateral to the internal carotid at its origin",0,"It is initially medial; the ICA is really lateral at its origin. (Last's p. 436)"],["The IJV lies medial to it at its commencement",0,"Lateral at first, then posterior and deep. (Last's p. 436)"]]},{"id":"hn-dc129853","r":"hn","t":"External carotid","y":1,"d":1,"src":"Last's text","s":"Branches of the external carotid below the parotid:","o":[["There are six",1,"Last's. (Last's p. 436)"],["The ascending pharyngeal is the medial branch",1,"Last's. (Last's p. 436)"],["The occipital artery arises from the front",0,"From behind, with the posterior auricular. (Last's p. 436)"],["The facial artery runs along the upper border of the posterior belly of digastric",0,"The occipital and posterior auricular run along digastric's borders. (Last's p. 436)"]]},{"id":"hn-fc57efe6","r":"hn","t":"External carotid","y":1,"d":1,"src":"Last's text","s":"Separating the external from the internal carotid artery are:","o":[["The styloid process",1,"Last's. (Last's p. 436)"],["Stylopharyngeus",1,"Last's. (Last's p. 436)"],["The glossopharyngeal nerve",1,"Last's. (Last's p. 436)"],["The hypoglossal nerve",0,"It crosses both carotids superficially. (Last's p. 436)"]]},{"id":"hn-7b9f9f17","r":"hn","t":"Vertebral canal","y":1,"d":1,"src":"Last's text","s":"The vertebral canal (Last's):","o":[["The internal vertebral plexus receives mainly basivertebral veins",1,"Last's. (Last's p. 574)"],["It is a bypass of the diaphragm during raised abdominal pressure",1,"Last's. (Last's p. 574)"],["The internal vertebral plexus has valves",0,"There are no valves. (Last's p. 574)"],["The spinal dura fits tightly within the canal",0,"Cord is narrower than dura, dura narrower than canal. (Last's p. 574)"]]},{"id":"hn-addc6542","r":"hn","t":"Spinal meninges","y":1,"d":1,"src":"Last's text","s":"The spinal dura (Last's):","o":[["It is the inner layer of posterior fossa dura continued",1,"Last's. (Last's p. 574)"],["It attaches firmly to the PLL on the axis",1,"And the tectorial membrane. (Last's p. 574)"],["It is firmly attached to the lumbar vertebral bodies",0,"Elsewhere it is free of bony attachments. (Last's p. 574)"],["It ends at L2",0,"At S2. (Last's p. 574)"]]},{"id":"hn-af649fd4","r":"hn","t":"Spinal meninges","y":1,"d":1,"src":"Last's text","s":"The spinal pia and arachnoid (Last's):","o":[["The filum terminale perforates the theca at S2",1,"Last's. (Last's p. 574-5)"],["The lowest denticulation lies at the L1 root",1,"Last's. (Last's p. 574-5)"],["The filum terminale ends at the tip of the sacrum",0,"It descends to the back of the coccyx. (Last's p. 574-5)"],["The arachnoid strands are well developed in the anterior midline",0,"In the posterior midline. (Last's p. 574-5)"]]},{"id":"hn-b8bc465c","r":"hn","t":"Lumbar puncture","y":1,"d":1,"src":"Last's text","s":"Lumbar puncture and spinal anaesthesia (Last's):","o":[["The spinal subarachnoid space holds about 75 ml of CSF",1,"Last's. (Last's p. 575)"],["The needle passes supraspinous then interspinous ligaments",1,"Last's. (Last's p. 575)"],["The spinal cord ends at L3 in the adult",0,"At L1. (Last's p. 575)"],["Epidural anaesthetic is injected into the subarachnoid space",0,"Into the extradural space. (Last's p. 575)"]]},{"id":"hn-2e4ea744","r":"hn","t":"Internal carotid","y":1,"d":1,"src":"Last's text","s":"The carotid sinus and body (Last's):","o":[["The carotid sinus wall contains baroreceptors",1,"Supplied by the glossopharyngeal. (Last's p. 438)"],["The carotid body lies behind the bifurcation",1,"Last's. (Last's p. 438)"],["The carotid body is supplied by the ascending pharyngeal artery",0,"By glomic arteries from the bifurcation. (Last's p. 438)"],["The carotid body is mainly innervated by the vagus",0,"By the glossopharyngeal nerve. (Last's p. 438)"]]},{"id":"hn-501bcbd2","r":"hn","t":"Internal carotid","y":1,"d":1,"src":"Last's text","s":"Relations of the cervical internal carotid (Last's):","o":[["The sympathetic trunk lies behind it outside the sheath",1,"Last's. (Last's p. 438)"],["The superior laryngeal nerve crosses obliquely behind it",1,"Last's. (Last's p. 438)"],["It gives several branches in the neck",0,"It has no branches in the neck. (Last's p. 438)"],["Its surface marking runs to the tragus",0,"To the head of the mandible; the ECA line runs to the tragus. (Last's p. 438)"]]},{"id":"hn-a8076bb8","r":"hn","t":"Internal jugular vein","y":1,"d":1,"src":"Last's text","s":"The internal jugular vein (Last's):","o":[["It leaves the posterior compartment of the jugular foramen",1,"Last's. (Last's p. 438)"],["Its first tributary is the inferior petrosal sinus",1,"Last's. (Last's p. 438)"],["The thoracic duct crosses behind the right vein at C7",0,"Behind the left vein. (Last's p. 438)"],["The inferior root of the ansa curls round its medial border",0,"Its lateral border. (Last's p. 438)"]]},{"id":"hn-f42181ff","r":"hn","t":"Internal jugular vein","y":1,"d":1,"src":"Last's text","s":"Tributaries and surface marking of the IJV:","o":[["The pharyngeal plexus joins above the facial vein",1,"Last's order. (Last's p. 439)"],["The middle thyroid is the lowest named tributary",1,"Last's. (Last's p. 439)"],["The surface marking runs from the tragus to the sternal end of the clavicle",0,"From the ear lobule. (Last's p. 439)"],["At 45 degrees the jugular pulse is normally seen at the angle of the mandible",0,"Just above the clavicle. (Last's p. 439)"]]},{"id":"hn-2caf6e95","r":"hn","t":"Carotid sheath","y":1,"d":1,"src":"Last's text","s":"The carotid sheath (Last's):","o":[["The vagus always lies between the IJV and ICA",1,"Last's. (Last's p. 462)"],["The cervical sympathetic trunk lies behind it on the prevertebral fascia",1,"Last's. (Last's p. 462)"],["The glossopharyngeal nerve curves backwards superficial to the IJV",0,"The accessory does; IX curves forwards between ICA and ECA. (Last's p. 462)"],["The parotid lies medial to the sheath",0,"The pharynx is medial; parotid lateral. (Last's p. 462)"]]},{"id":"hn-fbe40984","r":"hn","t":"Infratemporal fossa","y":1,"d":1,"src":"Last's text","s":"Boundaries of the infratemporal fossa (Last's):","o":[["Its medial boundary is the lateral pterygoid plate",1,"Last's. (Last's p. 457)"],["Its lateral boundary is the ramus of the mandible",1,"Last's. (Last's p. 457)"],["Its posterior boundary is the posterior surface of the maxilla",0,"That is anterior; the carotid sheath is posterior. (Last's p. 457)"],["Its roof is formed by the lesser wing of the sphenoid",0,"By the infratemporal surfaces of greater wing and squamous temporal. (Last's p. 457)"]]},{"id":"hn-29f70c60","r":"hn","t":"Pterygoid muscles","y":1,"d":1,"src":"Last's text","s":"The pterygoid muscles (Last's):","o":[["Lateral pterygoid inserts into the pterygoid fovea",1,"Last's. (Last's p. 458)"],["The superficial head of medial pterygoid arises from the maxillary tuberosity",1,"And palatine pyramidal process. (Last's p. 458)"],["Lateral pterygoid closes the mouth",0,"It opens the mouth, drawing condyle and disc forwards. (Last's p. 458)"],["Medial pterygoid is supplied by the anterior division of the mandibular nerve",0,"From the main trunk. (Last's p. 458)"]]},{"id":"hn-3890689b","r":"hn","t":"Maxillary artery","y":1,"d":1,"src":"Last's text","s":"The maxillary artery (Last's):","o":[["It passes between the neck of the mandible and sphenomandibular ligament",1,"Last's. (Last's p. 459)"],["Branches of its first and third parts enter bony foramina",1,"Second part branches do not. (Last's p. 459)"],["The anterior tympanic artery enters through the squamotympanic fissure",0,"Through the petrotympanic fissure; the deep auricular enters the squamotympanic. (Last's p. 459)"],["It usually passes above both heads of lateral pterygoid",0,"Usually between the heads or deep to the lower head; rarely above. (Last's p. 459)"]]},{"id":"hn-2c3e25f4","r":"hn","t":"Maxillary artery","y":1,"d":1,"src":"Last's text","s":"Branches of the third part of the maxillary artery (Last's):","o":[["The pharyngeal artery enters the palatovaginal canal",1,"Last's. (Last's p. 459)"],["The infraorbital artery passes through the inferior orbital fissure",1,"Last's. (Last's p. 459)"],["It terminates as the greater palatine artery",0,"As the sphenopalatine artery. (Last's p. 459)"],["The posterior superior alveolar artery arises from the second part",0,"From the third part. (Last's p. 459)"]]},{"id":"hn-e4b6b1c0","r":"hn","t":"Pterygoid plexus","y":1,"d":1,"src":"Last's text","s":"The pterygoid venous plexus (Last's):","o":[["It lies around and within lateral pterygoid",1,"Last's. (Last's p. 460)"],["It acts as a peripheral heart for venous return",1,"Last's. (Last's p. 460)"],["It drains into the facial vein directly",0,"Into the maxillary veins, forming the retromandibular vein with the superficial temporal. (Last's p. 460)"],["It has no connection with the inferior ophthalmic vein",0,"It receives it via the inferior orbital fissure. (Last's p. 460)"]]},{"id":"hn-e88ebad8","r":"hn","t":"Sphenomandibular ligament","y":1,"d":1,"src":"Last's text","s":"The sphenomandibular ligament (Last's):","o":[["It develops from the perichondrium of Meckel's cartilage",1,"Last's. (Last's p. 460)"],["It is pierced by the mylohyoid nerve",1,"Last's. (Last's p. 460)"],["The inferior alveolar nerve passes between it and the neck of the mandible",0,"The auriculotemporal nerve and maxillary vessels do; inferior alveolar passes between it and the ramus. (Last's p. 460)"],["The mylohyoid groove is made by the mylohyoid nerve",0,"By the mylohyoid vessels (vein). (Last's p. 460)"]]},{"id":"hn-d60fb87f","r":"hn","t":"Mandibular nerve","y":1,"d":1,"src":"Last's text","s":"The mandibular nerve in the infratemporal fossa (Last's):","o":[["It lies about 4 cm deep to the articular tubercle",1,"Last's. (Last's p. 460-2)"],["The otic ganglion lies on its deep surface",1,"Last's. (Last's p. 460-2)"],["The auriculotemporal nerve lies below the maxillary artery",0,"Above it. (Last's p. 460-2)"],["The lingual nerve enters the pharynx between middle and inferior constrictors",0,"Between superior and middle constrictors. (Last's p. 460-2)"]]},{"id":"hn-87244fc4","r":"hn","t":"Otic ganglion","y":1,"d":1,"src":"Last's text","s":"The otic ganglion (Last's):","o":[["It lies between tensor palati and the mandibular nerve",1,"Last's. (Last's p. 460-2)"],["It lies just below foramen ovale",1,"Last's. (Last's p. 460-2)"],["It is round and about 1 cm across",0,"2-3 mm, flat and applied to the nerve. (Last's p. 460-2)"],["Its parasympathetic root is the greater petrosal nerve",0,"The lesser petrosal. (Last's p. 460-2)"]]},{"id":"hn-f279b421","r":"hn","t":"Glossopharyngeal nerve","y":1,"d":1,"src":"Last's text","s":"The glossopharyngeal nerve in the neck (Last's):","o":[["It curves forwards around the lateral side of stylopharyngeus",1,"Last's. (Last's p. 462-5)"],["Its pharyngeal branches join the plexus on the middle constrictor",1,"Last's. (Last's p. 462-5)"],["The tympanic branch leaves at the superior ganglion",0,"At the inferior ganglion. (Last's p. 462-5)"],["It reaches the tongue in front of hyoglossus",0,"Behind its posterior border. (Last's p. 462-5)"]]},{"id":"hn-269b386a","r":"hn","t":"Vagus in neck","y":1,"d":1,"src":"Last's text","s":"The vagus in the neck (Last's):","o":[["The external laryngeal nerve runs close to the superior thyroid vessels",1,"Last's. (Last's p. 462-5)"],["The auricular branch supplies part of the outer tympanic membrane",1,"Last's. (Last's p. 462-5)"],["The pharyngeal branch supplies stylopharyngeus",0,"All pharyngeal muscles except stylopharyngeus. (Last's p. 462-5)"],["The right cervical cardiac branches pass in front of the subclavian artery",0,"Behind it. (Last's p. 462-5)"]]},{"id":"hn-3be1105a","r":"hn","t":"Styloid apparatus","y":1,"d":1,"src":"Last's text","s":"The styloid apparatus (Last's):","o":[["It derives from the second arch",1,"Last's. (Last's p. 462-5)"],["The external carotid passes superficial to stylopharyngeus",1,"Deep to digastric and stylohyoid. (Last's p. 462-5)"],["Stylopharyngeus arises low down in front",0,"It is deepest and highest; styloglossus arises low in front. (Last's p. 462-5)"],["The three styloid muscles share one nerve supply",0,"Each has a different supply. (Last's p. 462-5)"]]},{"id":"hn-9c2f5b04","r":"hn","t":"Hypoglossal nerve","y":1,"d":1,"src":"Last's text","s":"The hypoglossal nerve in the neck (Last's):","o":[["It picks up a branch from C1",1,"Last's. (Last's p. 462-5)"],["It passes forwards just above the greater horn of the hyoid",1,"Last's. (Last's p. 462-5)"],["It lies superficial to the IJV",0,"Deep to the veins. (Last's p. 462-5)"],[" e is the anterior limiting layer",0,"Bowman's is anterior; Descemet's posterior. (Last's p. 516-18)"]]},{"id":"hn-fc514221","r":"hn","t":"Eye","y":1,"d":1,"src":"Last's text","s":"The retina (Last's):","o":[["The macula lies 3 mm lateral to the optic disc",1,"Last's. (Last's p. 516-18)"],["The fovea contains only cones",1,"Last's. (Last's p. 516-18)"],["The optic disc is about 5 mm across",0,"About 1.5 mm. (Last's p. 516-18)"],["The ganglion cells lie outermost, next to the pigment epithelium",0,"They are innermost; light passes through them. (Last's p. 516-18)"]]},{"id":"hn-e53122b8","r":"hn","t":"Pupil","y":1,"d":1,"src":"Last's text","s":"Pupillary reflexes (Last's):","o":[["The consensual reflex occurs because each pretectal nucleus reaches both Edinger-Westphal nuclei",1,"And partial chiasmal crossing. (Last's p. 518-19)"],["Accommodation fibres bypass the pretectal nucleus",1,"Explaining the Argyll Robertson pupil. (Last's p. 518-19)"],["Pupillary fibres run on the ventral surface of the oculomotor nerve near the brainstem",0,"On the dorsal surface. (Last's p. 518-19)"],["Accommodation fibres pass through the posterior limb of the internal capsule",0,"Through the anterior limb. (Last's p. 518-19)"]]},{"id":"hn-97e02d43","r":"hn","t":"Pupil","y":1,"d":1,"src":"Last's text","s":"Ocular sympathetic pathway (Last's):","o":[["It begins in the posterolateral hypothalamus",1,"Last's. (Last's p. 518-19)"],["Preganglionic neurons are at T1",1,"Last's. (Last's p. 518-19)"],["Postganglionic fibres reach the eye mainly via short ciliary nerves",0,"Via the long ciliary nerves (nasociliary). (Last's p. 518-19)"],["Anhidrosis occurs with all Horner's lesions",0,"Only central or preganglionic lesions. (Last's p. 518-19)"]]},{"id":"hn-4caf017c","r":"hn","t":"External ear","y":1,"d":1,"src":"Last's text","s":"The external ear (Last's):","o":[["The external acoustic meatus is about 3 cm long",1,"Last's. (Last's p. 523-6)"],["The deep auricular artery enters through the squamotympanic fissure",1,"Last's. (Last's p. 523-6)"],["The extrinsic auricular muscles are supplied by the auriculotemporal nerve",0,"By the facial nerve. (Last's p. 523-6)"],["The TMJ is supplied only by the auriculotemporal nerve",0,"Also by the nerve to masseter. (Last's p. 523-6)"]]},{"id":"hn-62245d8f","r":"hn","t":"External ear","y":1,"d":1,"src":"Last's text","s":"Nerve supply of the external ear (Last's):","o":[["The great auricular supplies the cranial surface of the auricle",1,"Last's. (Last's p. 523-6)"],["The vagus supplies posterior meatal skin",1,"Last's. (Last's p. 523-6)"],["The auriculotemporal supplies the lower lateral auricle",0,"The upper lateral surface and most meatal skin. (Last's p. 523-6)"],["The lesser occipital supplies most of the lateral surface",0,"Only a small overlap at the top. (Last's p. 523-6)"]]},{"id":"hn-f2f8f9a0","r":"hn","t":"Middle ear","y":1,"d":1,"src":"Last's text","s":"Walls of the tympanic cavity (Last's):","o":[["The promontory is formed by the first turn of the cochlea",1,"Last's. (Last's p. 526-8)"],["The pyramid lies on the posterior wall",1,"Stapedius tendon emerges at its apex. (Last's p. 526-8)"],["The round window lies above and behind the promontory",0,"Below and behind; the oval window lies above and behind. (Last's p. 526-8)"],["The trochleariform process lies on the lateral wall",0,"On the medial wall. (Last's p. 526-8)"]]},{"id":"hn-3d61e305","r":"hn","t":"Tympanic membrane","y":1,"d":1,"src":"Last's text","s":"The tympanic membrane (Last's):","o":[["It is about 1 cm across",1,"Last's. (Last's p. 526-8)"],["It lies at about 55 degrees to the meatus",1,"Last's. (Last's p. 526-8)"],["Its mucosal surface is supplied by the auriculotemporal nerve",0,"By the tympanic plexus (IX). (Last's p. 526-8)"],["The chorda tympani crosses lateral to the neck of the malleus",0,"Medial to it. (Last's p. 526-8)"]]},{"id":"hn-39e1ea55","r":"hn","t":"Ossicles","y":1,"d":1,"src":"Last's text","s":"The auditory ossicles (Last's):","o":[["The stapes derives from the second arch",1,"Last's. (Last's p. 528-9)"],["The anterior ligament of the malleus continues as the sphenomandibular ligament",1,"Last's. (Last's p. 528-9)"],["The incus derives from the second arch",0,"From the first arch, with the malleus. (Last's p. 528-9)"],["The anterior limb of the stapes is longer than the posterior",0,"Shorter and straighter. (Last's p. 528-9)"]]},{"id":"hn-fc825e0f","r":"hn","t":"Ossicles","y":1,"d":1,"src":"Last's text","s":"Muscles of the ossicles (Last's):","o":[["Tensor tympani inserts into the handle of the malleus",1,"Last's. (Last's p. 528-9)"],["Stapedius inserts into the neck of the stapes",1,"Last's. (Last's p. 528-9)"],["Tensor tympani relays in the otic ganglion",0,"It passes near without relay. (Last's p. 528-9)"],["Stapedius lies in the upper semicanal of the musculotubular canal",0,"Tensor tympani does; stapedius lies in the pyramid. (Last's p. 528-9)"]]},{"id":"hn-3220f1a4","r":"hn","t":"Middle ear","y":1,"d":1,"src":"Last's text","s":"The tympanic plexus and lesser petrosal nerve (Last's):","o":[["The plexus is formed mainly by Jacobsen's nerve",1,"Tympanic branch of IX. (Last's p. 529-31)"],["The lesser petrosal nerve emerges through a hiatus lateral to the greater petrosal",1,"Last's. (Last's p. 529-31)"],["The lesser petrosal nerve leaves through the posterior wall",0,"The anterior wall above the tube. (Last's p. 529-31)"],["Sympathetic fibres reach the plexus with the stylomastoid artery",0,"Caroticotympanic nerves from the ICA. (Last's p. 529-31)"]]},{"id":"hn-8914355e","r":"hn","t":"Auditory tube","y":1,"d":1,"src":"Last's text","s":"The auditory tube (Last's):","o":[["It is more than 3 cm long",1,"Last's. (Last's p. 529-31)"],["The isthmus lies posteromedial to the sphenoid spine",1,"Last's. (Last's p. 529-31)"],["Its bony part is longer than its cartilaginous part",0,"The cartilaginous part (2 cm) is longer. (Last's p. 529-31)"],["Its cartilaginous part is supplied by the tympanic plexus",0,"By the nervus spinosus; the bony part by the plexus. (Last's p. 529-31)"]]},{"id":"hn-a46f6f22","r":"hn","t":"Mastoid antrum","y":1,"d":1,"src":"Last's text","s":"The mastoid antrum (Last's):","o":[["It is about 1 cm across",1,"Last's. (Last's p. 529-31)"],["It connects to the epitympanic recess by the aditus",1,"Last's. (Last's p. 529-31)"],["It lies 5 mm deep to the suprameatal triangle",0,"15 mm. (Last's p. 529-31)"],["Mastoid air cells develop before birth",0,"During the first year onwards. (Last's p. 529-31)"]]},{"id":"hn-927ef27d","r":"hn","t":"Inner ear","y":1,"d":1,"src":"Last's text","s":"The osseous labyrinth (Last's):","o":[["The cochlea makes 2.75 turns",1,"Last's. (Last's p. 531-5)"],["The scala vestibuli and tympani communicate at the helicotrema",1,"Last's. (Last's p. 531-5)"],["Endolymph and perilymph communicate freely",0,"There is no communication. (Last's p. 531-5)"],["The perilymphatic duct opens into the internal acoustic meatus",0,"Into the cochlear canaliculus at the jugular foramen. (Last's p. 531-5)"]]},{"id":"hn-add018b5","r":"hn","t":"Inner ear","y":1,"d":1,"src":"Last's text","s":"Semicircular canals (Last's):","o":[["The anterior canal produces the arcuate eminence",1,"Last's. (Last's p. 531-5)"],["There are five openings into the vestibule",1,"Last's. (Last's p. 531-5)"],["The lateral canal opens by a crus commune",0,"The anterior and posterior share the common crus. (Last's p. 531-5)"],["The posterior canal lies perpendicular to the long axis of the petrous bone",0,"Parallel; the anterior is perpendicular. (Last's p. 531-5)"]]},{"id":"hn-cc17a453","r":"hn","t":"Inner ear","y":1,"d":1,"src":"Last's text","s":"The membranous labyrinth (Last's):","o":[["The stria vascularis produces endolymph",1,"Last's. (Last's p. 531-5)"],["The saccule lies in the spherical recess",1,"Last's. (Last's p. 531-5)"],["The utricle connects to the cochlear duct by the ductus reuniens",0,"The saccule does. (Last's p. 531-5)"],["The maculae serve kinetic balance",0,"Static; the cristae serve kinetic balance. (Last's p. 531-5)"]]},{"id":"hn-71d872e9","r":"hn","t":"Labyrinth","y":1,"d":1,"src":"Last's text","s":"Blood supply of the labyrinth (Last's):","o":[["The labyrinthine artery usually arises from AICA",1,"Last's (it may also arise directly from the basilar). (Last's p. 531-5)"],["The labyrinthine vein drains to the inferior petrosal sinus",1,"Last's. (Last's p. 531-5)"],["The vein of the vestibular aqueduct joins the inferior petrosal sinus",0,"The superior petrosal sinus; the cochlear aqueduct vein joins the inferior. (Last's p. 531-5)"],["The stylomastoid artery does not supply the labyrinth",0,"It assists. (Last's p. 531-5)"]]},{"id":"hn-3f932e40","r":"hn","t":"Deep cervical fascia","y":1,"d":1,"s":"Concerning the prevertebral fascia:","o":[["It extends inferiorly to the body of T3, the lower limit of longus colli",1,"Last's: attached to the skull base in front of longus capitis and rectus capitis lateralis, it extends down to T3 and fades out laterally under trapezius."],["It is pierced by the four cutaneous branches of the cervical plexus",1,"Great auricular, lesser occipital, transverse cervical and supraclavicular nerves pierce it."],["The accessory nerve lies deep to it in the posterior triangle",0,"The accessory nerve, the posterior triangle lymph nodes, the subclavian and axillary veins and the cervical sympathetic trunk lie anterior to (superficial to) it."],["It is prolonged over the subclavian artery into the axilla as the axillary sheath",1,"The third part of the subclavian artery and the brachial plexus trunks lie behind it, so it is carried into the axilla. The subclavian vein lies in front and is free to dilate."]]},{"id":"hn-e6702c3c","r":"hn","t":"Deep cervical fascia","y":2,"d":1,"s":"The investing layer of deep cervical fascia:","o":[["Forms the floor of the posterior triangle",0,"It forms the roof. The floor is the prevertebral fascia over the muscles."],["Splits to enclose sternocleidomastoid and trapezius",1,"It also splits to form the parotid capsule and the suprasternal space."],["Is attached to the anterior tubercles of the cervical transverse processes",0,"That is the prevertebral fascia's attachment region. The investing layer attaches to the skull, mandible, hyoid, ligamentum nuchae and pectoral girdle."],["Is attached to the hyoid bone",1,"This draws sternocleidomastoid forward in a gentle convexity."]],"k":"B"},{"id":"hn-ddcfb5c3","r":"hn","t":"Pretracheal fascia and thyroid","y":1,"d":1,"s":"Regarding the pretracheal fascia and thyroid gland:","o":[["The pretracheal fascia is attached above to the hyoid bone and the oblique line of the thyroid cartilage",1,"It is limited by the infrahyoid strap muscles."],["The fascia is firmly attached to the thyroid gland only between the isthmus and the second to fourth tracheal rings",1,"Elsewhere the gland is loosely enclosed. This attachment makes the gland move with swallowing."],["Inferiorly the pretracheal fascia blends with the fibrous pericardium",1,"It passes behind the brachiocephalic veins to blend with the arch adventitia and fibrous pericardium."],["The sympathetic supply of the thyroid comes mainly from the inferior cervical ganglion",0,"Last's: sympathetic fibres reach the gland from the superior cervical ganglion (with the superior thyroid artery) and the middle cervical ganglion (with the inferior thyroid artery)."]]},{"id":"hn-03d0728b","r":"hn","t":"Carotid sheath","y":1,"d":1,"s":"Concerning the carotid sheath and its contents:","o":[["The vagus nerve lies between and behind the internal jugular vein and the carotid artery",1,"It remains in the gutter between artery and vein throughout the neck."],["The ansa cervicalis is embedded in the anterior wall of the sheath",1,"It lies in front of the internal jugular vein."],["The cervical sympathetic trunk lies within the sheath, medial to the vagus",0,"The sympathetic trunk lies behind the sheath, outside it, on the prevertebral fascia."],["The thoracic duct arches behind the left internal jugular vein at the level of C7",1,"It then descends to the junction of the internal jugular and subclavian veins."]]},{"id":"hn-b9c5aed4","r":"hn","t":"Internal jugular vein","y":2,"d":1,"s":"Tributaries of the internal jugular vein include the:","o":[["Inferior thyroid vein",0,"The inferior thyroid veins drain into the brachiocephalic veins."],["Facial vein",1,"Facial, lingual and superior thyroid veins usually join near the tip of the greater horn of the hyoid."],["Vertebral vein",0,"The vertebral vein drains into the brachiocephalic vein at the root of the neck."],["Inferior petrosal sinus",1,"Last's: it is the first (highest) tributary, joining just below the skull base."]],"k":"B"},{"id":"hn-b7e4dec7","r":"hn","t":"External carotid artery","y":1,"d":1,"s":"Regarding the external carotid artery:","o":[["It gives three branches from its front, two from behind and one from its medial side before entering the parotid",1,"Front: superior thyroid, lingual, facial. Behind: occipital, posterior auricular. Medial: ascending pharyngeal."],["It is separated from the internal carotid by the styloid process, stylopharyngeus and the glossopharyngeal nerve",1,"Also by the stylohyoid ligament, the pharyngeal branch of the vagus and the deep part of the parotid."],["The hypoglossal nerve crosses it deep to the internal jugular vein's facial tributary",1,"The hypoglossal nerve runs superficial to the arteries but deep to the veins (facial vein)."],["It ends behind the neck of the mandible by dividing into the maxillary and facial arteries",0,"It divides in the parotid behind the neck of the mandible into the maxillary and superficial temporal arteries."]]},{"id":"hn-63b0dfe9","r":"hn","t":"Internal carotid artery in the neck","y":2,"d":1,"s":"The internal carotid artery in the neck:","o":[["Has no branches",1,"It gives no branches in the neck."],["Lies lateral to the external carotid at its origin",1,"Last's: it is external (lateral) at its origin, then slopes back to a medial, deeper level."],["Is crossed superficially by the hypoglossal nerve and the occipital artery",1,"Also by the lingual and facial veins, and higher up by the posterior belly of digastric and stylohyoid."],["Has the superior laryngeal nerve passing superficial to it",0,"The superior laryngeal nerve crosses obliquely behind (deep to) the ICA to reach its medial side, where it divides."]],"k":"C"},{"id":"hn-3c7339fb","r":"hn","t":"Carotid sinus and body","y":1,"d":1,"s":"Concerning the carotid sinus and carotid body:","o":[["The carotid sinus is a dilatation at the origin of the internal carotid artery",1,"Its thin wall contains baroreceptors."],["The carotid sinus is supplied by the glossopharyngeal nerve",1,"Via the carotid sinus nerve to the nucleus of the tractus solitarius."],["The carotid body lies behind the bifurcation of the common carotid artery",1,"It contains chemoreceptor glomus cells and is supplied by IX and X."],["The carotid body responds mainly to changes in blood pressure",0,"It is a chemoreceptor concerned with respiratory reflexes. The sinus is the baroreceptor."]]},{"id":"hn-ef26c9a3","r":"hn","t":"Posterior triangle","y":1,"d":1,"s":"Concerning the posterior triangle of the neck:","o":[["Its floor includes splenius, levator scapulae and the scalene muscles",1,"From above down: semispinalis capitis, splenius, levator scapulae, scaleni posterior, medius and anterior, and the first digitation of serratus anterior."],["The trunks of the brachial plexus lie behind the prevertebral fascia in its lower part",1,"Together with the third part of the subclavian artery."],["The cervical plexus lies within the posterior triangle",0,"Last's: the cervical plexus lies on scalenus medius under cover of the upper SCM and does not actually lie in the posterior triangle. Only its cutaneous branches emerge into it."],["The external jugular vein crosses it to pierce the investing fascia above the clavicle",1,"It then drains into the subclavian vein."]]},{"id":"hn-5e4477f0","r":"hn","t":"Cervical plexus","y":2,"d":1,"s":"Cutaneous branches of the cervical plexus and their roots:","o":[["Lesser occipital nerve, C3 and C4",0,"The lesser occipital is C2 (anterior ramus). It hooks around the accessory nerve."],["Great auricular nerve, C4 and C5",0,"The great auricular is C2 and C3, mainly C2."],["Transverse cervical nerve, from the posterior ramus of C3",0,"The transverse cervical nerve is from the anterior rami of C2 and C3 (cervical plexus). The third occipital nerve is the posterior ramus of C3."],["Supraclavicular nerves, C3 and C4",1,"Mainly C4. Medial, intermediate and lateral groups supply skin down to the sternal angle and over the shoulder to the scapular spine."]],"k":"D"},{"id":"hn-8da99e89","r":"hn","t":"Ansa cervicalis and infrahyoid muscles","y":1,"d":1,"s":"Regarding the ansa cervicalis:","o":[["Its superior root consists of C1 fibres carried by the hypoglossal nerve",1,"Formerly called the descendens hypoglossi."],["Its inferior root is formed from C2 and C3",1,"Formerly the descendens cervicalis. It spirals around the lateral side of the IJV."],["It supplies thyrohyoid",0,"Thyrohyoid and geniohyoid are supplied by C1 fibres directly from the hypoglossal nerve, not via the ansa."],["It supplies sternohyoid, omohyoid and sternothyroid",1,"Segmentally: sternohyoid and omohyoid C1 to C3, sternothyroid C2 and C3."]]},{"id":"hn-7f3a0797","r":"hn","t":"Root of the neck","y":1,"d":1,"s":"Concerning scalenus anterior and its relations:","o":[["The phrenic nerve descends on its anterior surface deep to the prevertebral fascia",1,"It is plastered to the muscle and crosses its obliquity from lateral to medial."],["The subclavian vein passes behind it",0,"The subclavian vein lies in front of the muscle, anterior to the prevertebral fascia. The second part of the subclavian artery and the plexus roots are behind it."],["It arises from the anterior tubercles of C3 to C6 and inserts on the scalene tubercle of the first rib",1,"It is supplied by C4 to C6."],["The transverse cervical and suprascapular arteries cross in front of it",1,"They lie in front of the prevertebral fascia, between the muscle and the carotid sheath."]]},{"id":"hn-6cb3d067","r":"hn","t":"Root of the neck","y":2,"d":1,"s":"The pyramidal space between longus colli and scalenus anterior:","o":[["Has the carotid tubercle of C6 at its apex",1,"Chassaignac's tubercle."],["Contains the vertebral artery and vein",1,"And the inferior cervical or stellate ganglion."],["Has as its base the subclavian artery and neck of the first rib",1,"With the suprapleural membrane between them."],["Is roofed by the investing layer of deep cervical fascia",0,"Last's: there is no fascial roof across the pyramidal space."]],"k":"C"},{"id":"hn-bab2a540","r":"hn","t":"Cervical sympathetic trunk","y":1,"d":1,"s":"Regarding the cervical sympathetic ganglia:","o":[["The superior cervical ganglion lies in front of the lateral masses of the atlas and axis",1,"It lies behind the carotid sheath, medial to the vertebral artery."],["The superior ganglion gives grey rami to C1 to C4",1,"Middle gives grey rami to C5 and C6, inferior to C7 and C8."],["The middle cervical ganglion lies medial to the carotid tubercle of C6, in front of the vertebral artery",1,"Last's: it is small and inconstant. The ansa subclavia passes in front of the subclavian artery to link it with the inferior (stellate) ganglion."],["The stellate ganglion lies on the neck of the first rib",1,"It lies on the front of the neck of the first rib. Lateral to it, from medial to lateral, lie the supreme intercostal vein, the superior intercostal artery and the anterior ramus of T1."]]},{"id":"hn-fc6f43f3","r":"hn","t":"Parotid region","y":1,"d":1,"s":"Concerning the parotid gland:","o":[["From superficial to deep, the facial nerve, retromandibular vein and external carotid artery lie within it",1,"The nerve is immediately superficial to the vein, whic
