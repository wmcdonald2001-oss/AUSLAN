89)"]]},{"id":"cns-7e084887","r":"cns","t":"Fornix","y":1,"d":1,"src":"Last's text","s":"The columns of the fornix and Papez circuit:","o":[["The columns pass both anterior and posterior to the anterior commissure",1,"Last's. (Last's p. 589)"],["The precommissural fibres pass to nuclei within the septum pellucidum",0,"To the septal nuclei near the lamina terminalis, not in the septum pellucidum. (Last's p. 589)"],["The mamillothalamic tract runs in the lateral wall of the third ventricle",1,"To the anterior pole of the thalamus. (Last's p. 589)"],["The anterior thalamic neurons project to the parahippocampal gyrus",0,"Through the internal capsule to the cingulate gyrus. (Last's p. 589)"]]},{"id":"cns-b9697f79","r":"cns","t":"Fornix","y":1,"d":1,"src":"Last's text","s":"The induseum griseum:","o":[["Is a thin film of grey matter on the upper surface of the corpus callosum",1,"Last's. (Last's p. 589)"],["Overlies the medial and lateral longitudinal striae",1,"Last's. (Last's p. 589)"],["Lies on the under surface of the corpus callosum",0,"On the upper surface. (Last's p. 589)"],["Contains striae that are aberrant fibres of the cingulum",0,"Aberrant fibres of the fornix. (Last's p. 589)"]]},{"id":"cns-a4161664","r":"cns","t":"Ventricles","y":1,"d":1,"src":"Last's text","s":"The choroid plexuses (Last's):","o":[["A choroid plexus forms where ependyma contacts pia with no nervous tissue between",1,"Allowing capillaries to invaginate. (Last's p. 589-90)"],["The lateral ventricle plexuses secrete the bulk of the CSF",1,"Last's. (Last's p. 589-90)"],["The fourth ventricle plexus is continuous with the third ventricle plexus",0,"It is separate and makes only a small contribution. (Last's p. 589-90)"],["The third ventricle comes to the surface in its floor",0,"On its roof, invaginated by two choroid plexuses. (Last's p. 589-90)"]]},{"id":"cns-2edff1e2","r":"cns","t":"Ventricles","y":1,"d":1,"src":"Last's text","s":"Concerning the ventricular system:","o":[["The central canal extends into the upper end of the filum terminale",1,"Last's. (Last's p. 589-90)"],["The midline ventricles are symmetrical",1,"Last's. (Last's p. 589-90)"],["Asymmetry of the lateral ventricles is abnormal",0,"Asymmetry, especially posteriorly, is the rule. (Last's p. 589-90)"],["Apertures exist in the roof of the third ventricle",0,"The only apertures are in the roof of the fourth ventricle. (Last's p. 589-90)"]]},{"id":"cns-82c10a3d","r":"cns","t":"Lateral ventricle","y":1,"d":1,"src":"Last's text","s":"The choroid fissure (Last's):","o":[["It is a C-shaped slit on the medial surface of the hemisphere",1,"Curving around the thalamus and caudate tail. (Last's p. 590)"],["It is the medial wall of the body and inferior horn",1,"Last's. (Last's p. 590)"],["It extends into the anterior horn",0,"The plexus does not extend into the anterior horn; the fissure is limited anteriorly by the interventricular foramen. (Last's p. 590)"],["It forms the lateral wall of the inferior horn",0,"The tapetum closes the inferior horn laterally. (Last's p. 590)"]]},{"id":"cns-30243c6e","r":"cns","t":"Lateral ventricle","y":1,"d":1,"src":"Last's text","s":"Structures indenting the lateral ventricle:","o":[["The calcarine sulcus",1,"As the calcar avis. (Last's p. 590)"],["The collateral sulcus",1,"As the collateral eminence. (Last's p. 590)"],["The central sulcus",0,"Not listed: the parahippocampal (hippocampal), calcarine and collateral sulci indent it. (Last's p. 590)"],["The cingulate sulcus",0,"Not listed. (Last's p. 590)"]]},{"id":"cns-0262568a","r":"cns","t":"Lateral ventricle","y":1,"d":1,"src":"Last's text","s":"The anterior horn and body of the lateral ventricle:","o":[["The anterior horn is bounded by the forceps minor",1,"Fibres from the genu and rostrum. (Last's p. 590)"],["The head of the caudate lies in its floor",1,"Meeting the roof laterally. (Last's p. 590)"],["The septum pellucidum separates the floor from the roof laterally",0,"Medially. (Last's p. 590)"],["The interventricular foramen lies in front of the anterior column of the fornix",0,"Behind the column, between it and the anterior pole of the thalamus. (Last's p. 590)"]]},{"id":"cns-a753a847","r":"cns","t":"Lateral ventricle","y":1,"d":1,"src":"Last's text","s":"The floor of the body of the lateral ventricle:","o":[["Is formed by the thalamus and body of caudate",1,"With the thalamostriate groove between. (Last's p. 590)"],["A band of white matter running the whole length of the caudate lies in the thalamostriate groove",1,"Last's: it runs from the amygdaloid body at the tail to the anterior perforated substance at the head (usually named the stria terminalis). (Last's p. 590)"],["The thalamostriate vein runs in the roof",0,"It runs in the groove in the floor. (Last's p. 590)"],["The roof is formed by the septum pellucidum alone",0,"The corpus callosum, with the crus and body of fornix medially. (Last's p. 590)"]]},{"id":"cns-8d58c171","r":"cns","t":"Lateral ventricle","y":1,"d":1,"src":"Last's text","s":"The posterior horn (Last's):","o":[["It is the most variably developed and may be absent",1,"Last's. (Last's p. 590-1)"],["The bulb of the posterior horn is formed by the forceps major",1,"Upper convexity on the medial wall. (Last's p. 590-1)"],["The calcar avis is the upper convexity on the medial wall",0,"It is the lower convexity, formed by the calcarine sulcus. (Last's p. 590-1)"],["The optic radiation lies in the medial wall",0,"It lies against the tapetum in the lateral wall. (Last's p. 590-1)"]]},{"id":"cns-54de0a3a","r":"cns","t":"Lateral ventricle","y":1,"d":1,"src":"Last's text","s":"The inferior horn (Last's):","o":[["It is the largest horn",1,"Last's. (Last's p. 591-2)"],["The hippocampus forms the medial part of its floor",1,"With the collateral eminence laterally. (Last's p. 591-2)"],["The tail of the caudate lies in its floor",0,"In the roof. (Last's p. 591-2)"],["The fimbria forms the upper lip of the choroid fissure here",0,"The fimbria forms the lower lip; the fornix forms the upper lip in the body. (Last's p. 591-2)"]]},{"id":"cns-224f3219","r":"cns","t":"Lateral ventricle","y":1,"d":1,"src":"Last's text","s":"The C-shape of the lateral ventricle:","o":[["Structures around the convexity appear in the roof of the body and floor of the inferior horn",1,"Last's. (Last's p. 591-2)"],["The amygdala lies to the lateral side of the anterior perforated substance",1,"Bulging the roof at the tip of the inferior horn. (Last's p. 591-2)"],["Structures in the concavity appear in the roof of the body",0,"In the floor of the body and roof of the inferior horn. (Last's p. 591-2)"],["The internal capsule lies outside the concavity of the caudate",0,"It lies within the concavity of the caudate. (Last's p. 591-2)"]]},{"id":"cns-2931eb9e","r":"cns","t":"Third ventricle","y":1,"d":1,"src":"Last's text","s":"The anterior wall and floor of the third ventricle:","o":[["The lamina terminalis extends from the rostrum of the corpus callosum to the chiasma",1,"Last's. (Last's p. 592-3)"],["The anterior commissure lies in the upper part of the lamina terminalis",1,"Joining the two piriform areas. (Last's p. 592-3)"],["The anterior commissure joins the two cingulate gyri",0,"The two piriform areas. (Last's p. 592-3)"],["The floor ends at the anterior perforated substance",0,"It extends back to the posterior perforated substance. (Last's p. 592-3)"]]},{"id":"cns-c9e868f8","r":"cns","t":"Third ventricle","y":1,"d":1,"src":"Last's text","s":"The septum pellucidum and third ventricle (Last's):","o":[["The cavum septi pellucidi is lined with pia, not ependyma",1,"Last's. (Last's p. 593)"],["The cavum septi pellucidi communicates with the ventricular system",0,"It has no connexion; \"fifth ventricle\" should be avoided. (Last's p. 593)"],["The interthalamic adhesion is not a commissure",1,"No interchange of fibres. (Last's p. 593)"],["The interthalamic adhesion is present in about 20% of brains",0,"About 60% (two-thirds). (Last's p. 593)"]]},{"id":"cns-8fb358a0","r":"cns","t":"Hypothalamus","y":1,"d":1,"src":"Last's text","s":"The hypothalamus and subthalamus:","o":[["The hypothalamus lies below the hypothalamic groove",1,"Including the floor. (Last's p. 594)"],["The subthalamic nucleus lies on the medial side of the internal capsule",1,"Adjacent to the substantia nigra. (Last's p. 594)"],["The subthalamic nucleus belongs functionally to the limbic system",0,"To the basal nuclei. (Last's p. 594)"],["Supraoptic axons control the anterior lobe through the portal vessels",0,"Supraoptic and paraventricular axons run to the posterior lobe. (Last's p. 594)"]]},{"id":"cns-c0493d5a","r":"cns","t":"Third ventricle","y":1,"d":1,"src":"Last's text","s":"The roof of the third ventricle (Last's):","o":[["The medullary striae join posteriorly in the habenular commissure",1,"Last's. (Last's p. 594-5)"],["The habenular commissure is probably olfactory",1,"Like the anterior commissure. (Last's p. 594-5)"],["The suprapineal recess lies within the pineal stalk",0,"That is the pineal recess; the suprapineal recess lies between pineal and habenular commissure. (Last's p. 594-5)"],["The roof is a thick layer of nervous tissue",0,"It is pia lined with ependyma. (Last's p. 594-5)"]]},{"id":"cns-675d779f","r":"cns","t":"Pineal","y":1,"d":1,"src":"Last's text","s":"The pineal body:","o":[["Lies above the superior colliculi, below the splenium",1,"Last's. (Last's p. 595)"],["Lacks a blood-brain barrier",1,"Last's. (Last's p. 595)"],["Is normally calcified on radiographs before age 20",0,"Normally after the age of forty. (Last's p. 595)"],["Secretes melatonin with a gonadotrophic action",0,"Antigonadotrophic action. (Last's p. 595)"]]},{"id":"cns-3d3669d2","r":"cns","t":"Pineal","y":1,"d":1,"src":"Last's text","s":"Regarding the pineal stalk and thalamus:","o":[["The posterior commissure connects the two superior colliculi",1,"Above the entrance to the aqueduct. (Last's p. 595)"],["The pineal recess lies between the habenular and posterior commissures",1,"Last's. (Last's p. 595)"],["The neothalamus lies on the medial side of the thalamus",0,"On the lateral side. (Last's p. 595)"],["The thalamus is part of the cerebral hemisphere",0,"It is part of the wall of the diencephalon. (Last's p. 595)"]]},{"id":"cns-64a1b0a3","r":"cns","t":"Thalamus","y":1,"d":1,"src":"Last's text","s":"The surfaces of the thalamus (Last's):","o":[["The medial walls of the two thalami lie parallel",1,"Joined in two-thirds of cases. (Last's p. 595-6)"],["The pulvinar is the large posterior convexity",1,"The lateral geniculate bulges from its lateral part. (Last's p. 595-6)"],["The anterior pole is large and the pulvinar small",0,"Small blunt anterior pole, large pulvinar. (Last's p. 595-6)"],["The medial geniculate body relays through the retrolentiform internal capsule",0,"Through the sublentiform part. (Last's p. 595-6)"]]},{"id":"cns-cbc78dec","r":"cns","t":"Thalamus","y":1,"d":1,"src":"Last's text","s":"Thalamic relations:","o":[["The lateral surface is bevelled by the internal capsule",1,"Last's. (Last's p. 596)"],["The anterior pole lies at the interventricular foramen",1,"Covered with ependyma. (Last's p. 596)"],["The inferior surface is wider than the superior",0,"Narrower. (Last's p. 596)"],["The superior surface is entirely covered with ependyma",0,"It is on the external surface, covered with pia; only a lateral strip is ependyma-covered. (Last's p. 596)"]]},{"id":"cns-bb9ea96f","r":"cns","t":"Thalamus","y":1,"d":1,"src":"Last's text","s":"Thalamic nuclei (Last's):","o":[["The ventroposterior part of the lateral nuclei receives the medial and spinal lemnisci",1,"Projecting to sensory cortex. (Last's p. 596)"],["Parts of the lateral nucleus receive from the dentate nucleus and globus pallidus",1,"Projecting to motor areas. (Last's p. 596)"],["The anterior nucleus receives the mamillothalamic tract and projects to the frontal eye field",0,"It projects to the cingulate gyrus. (Last's p. 596)"],["The medial geniculate is concerned with vision",0,"Hearing; the lateral geniculate is vision. (Last's p. 596)"]]},{"id":"cns-3cc3bbc2","r":"cns","t":"Tela choroidea","y":1,"d":1,"src":"Last's text","s":"The tela choroidea (Last's):","o":[["It is two layers of pia lying in contact",1,"Because fornix and corpus callosum project back over the diencephalon. (Last's p. 596-7)"],["It forms a triangular pouch with its apex forwards",1,"Last's. (Last's p. 596-7)"],["Its base is closed",0,"The base is open, where the layers part. (Last's p. 596-7)"],["The upper layer passes down over the back of the midbrain",0,"The lower layer does; the upper passes forwards around the splenium. (Last's p. 596-7)"]]},{"id":"cns-ebf42b66","r":"cns","t":"Forebrain development","y":1,"d":1,"src":"Last's text","s":"Development of the forebrain:","o":[["The neural tube cavity reaches the surface at two places, both dorsal",1,"Forebrain and hindbrain. (Last's p. 597)"],["The anterior choroidal artery feeds the lateral ventricle plexus at its lateral extremity",1,"Last's. (Last's p. 597)"],["The corpus callosum grows first backwards then forwards",0,"First forwards (rostrum) then backwards. (Last's p. 597)"],["The fornix is composed of commissural fibres",0,"Association fibres. (Last's p. 597)"]]},{"id":"cns-194c620e","r":"cns","t":"Forebrain development","y":1,"d":1,"src":"Last's text","s":"Later development of the forebrain:","o":[["The cerebral vesicles grow caudally, then ventrally, then forwards",1,"Last's. (Last's p. 598-9)"],["The internal capsule almost separates caudate from lentiform nucleus",1,"Last's. (Last's p. 598-9)"],["The corpus striatum develops in the roof of the cerebral vesicle",0,"In the floor. (Last's p. 598-9)"],["The choroid fissure represents the original ventral floor plate",0,"The original dorsal roof plate. (Last's p. 598-9)"]]},{"id":"cns-768daa3e","r":"cns","t":"Forebrain morphology","y":1,"d":1,"src":"Last's text","s":"Archaeopallium and neopallium (Last's):","o":[["The insula and piriform area are remnants of the archaeopallium",1,"Last's. (Last's p. 599)"],["The archaeocerebellum was mainly vestibular",1,"Last's. (Last's p. 599)"],["The corpus callosum is the commissure of the archaeopallium",0,"It is the commissure of the neopallium; anterior and posterior commissures unite the archaeopallium. (Last's p. 599)"],["The red nucleus appeared with the archaeopallium",0,"It appears with the neopallium, as do the neocerebellum and olivary nucleus. (Last's p. 599)"]]},{"id":"cns-38d22243","r":"cns","t":"Circle of Willis","y":1,"d":1,"src":"Last's text","s":"The circle of Willis (Last's):","o":[["The basilar divides at the upper border of the pons",1,"Last's. (Last's p. 599-600)"],["The posterior communicating runs through the interpeduncular cistern",1,"Last's. (Last's p. 599-600)"],["The anterior communicating lies in the interpeduncular cistern",0,"In the chiasmatic cistern. (Last's p. 599-600)"],["The circle encircles the mamillary bodies",0,"Only the optic chiasma and pituitary stalk. (Last's p. 599-600)"]]},{"id":"cns-cef4b373","r":"cns","t":"Circle of Willis","y":1,"d":1,"src":"Last's text","s":"Aneurysms and cerebral arteries:","o":[["Rupture of circle aneurysms causes about 90% of subarachnoid haemorrhages",1,"Last's. (Last's p. 599-600)"],["Aneurysms are commoner on the carotid part of the circle",1,"Last's. (Last's p. 599-600)"],["They are commonest where the tunica intima is weakest",0,"Where the tunica media is weakest, at branching points. (Last's p. 599-600)"],["Arteries entering the brain anastomose freely at precapillary level",0,"They are end arteries. (Last's p. 599-600)"]]},{"id":"cns-f8074409","r":"cns","t":"Cerebral arteries","y":1,"d":1,"src":"Last's text","s":"Regarding the cerebral arteries:","o":[["The anterior choroidal does not supply cortex",1,"Last's. (Last's p. 600)"],["Surface vessels have sympathetic innervation that is lost intracortically",1,"Last's. (Last's p. 600)"],["The anterior choroidal arises from the anterior cerebral",0,"From the internal carotid termination, or middle cerebral or posterior communicating. (Last's p. 600)"],["The perforating branches anastomose with each other",0,"They are invariably end arteries. (Last's p. 600)"]]},{"id":"cns-7a861f05","r":"cns","t":"Blood-brain barrier","y":1,"d":1,"src":"Last's text","s":"Regions without a blood-brain barrier (Last's) include:","o":[["Posterior pituitary",1,"Last's. (Last's p. 600)"],["Pineal body",1,"Last's. (Last's p. 600)"],["Median eminence",1,"Last's. (Last's p. 600)"],["Choroid plexus epithelium of the lateral ventricle",0,"Not listed; the area postrema is the fourth. (Last's p. 600)"]]},{"id":"cns-68220503","r":"cns","t":"Internal carotid","y":1,"d":1,"src":"Last's text","s":"Concerning the intracranial internal carotid artery and brain capillaries:","o":[["Gives off the ophthalmic artery after emerging from the cavernous sinus roof",1,"Last's. (Last's p. 600)"],["Divides at the anterior perforated substance",1,"Into middle and anterior cerebral. (Last's p. 600)"],["Lies on the back half of the cavernous sinus roof after curling back",0,"On the front half of the roof. (Last's p. 600)"],["Brain capillaries are fenestrated with few tight junctions",0,"They lack fenestrations and have abundant tight junctions. (Last's p. 600)"]]},{"id":"cns-7821e47d","r":"cns","t":"Middle cerebral artery","y":1,"d":1,"src":"Last's text","s":"The middle cerebral artery (Last's):","o":[["Is the largest and most direct branch of the internal carotid",1,"Hence most subject to embolism. (Last's p. 600)"],["Supplies the insula and overlying opercula",1,"Last's. (Last's p. 600)"],["Supplies the superior frontal gyrus",0,"Its territory falls short of the borders by about one gyrus: it does not reach the superior frontal or inferior temporal gyri. (Last's p. 600)"],["Supplies the motor area for the leg and perineum",0,"These are in anterior cerebral territory. (Last's p. 600)"]]},{"id":"cns-59bba5a5","r":"cns","t":"Anterior cerebral artery","y":1,"d":1,"src":"Last's text","s":"The anterior cerebral artery:","o":[["Passes forwards above the optic nerve",1,"Last's. (Last's p. 600)"],["Supplies the medial surface above the corpus callosum back to the parieto-occipital sulcus",1,"Last's. (Last's p. 600)"],["Supplies the inferior temporal gyrus",0,"That is posterior cerebral territory. (Last's p. 600)"],["Never arises from the opposite carotid",0,"Occasionally both anterior cerebrals arise from one carotid by a common stem. (Last's p. 600)"]]},{"id":"cns-67df85ce","r":"cns","t":"Internal carotid occlusion","y":1,"d":1,"src":"Last's text","s":"Concerning internal carotid stenosis or occlusion (Last's):","o":[["It may cause blindness in one eye with contralateral hemiplegia",1,"Ophthalmic plus anterior and middle cerebral territories. (Last's p. 600)"],["It may be clinically silent",1,"Owing to collateral flow through the arterial circle. (Last's p. 600)"],["The typical combination is blindness in one eye with ipsilateral hemiplegia",0,"Contralateral hemiplegia. (Last's p. 600)"],["Micturition and defecation areas lie in middle cerebral territory",0,"In anterior cerebral territory. (Last's p. 600)"]]},{"id":"cns-52ab68c3","r":"cns","t":"Posterior cerebral artery","y":1,"d":1,"src":"Last's text","s":"The posterior cerebral artery:","o":[["Supplies the cerebral peduncle and optic tract as it curls round the peduncle",1,"Last's. (Last's p. 601)"],["Supplies the inferior temporal gyrus",1,"And a strip of lateral occipital cortex. (Last's p. 601)"],["Has the macular visual cortex always wholly within its territory",0,"Middle cerebral branches sometimes supply the macular area, giving macular sparing. (Last's p. 601)"],["Arising from the internal carotid is an acquired anomaly",0,"It is persistence of the primitive embryonic pattern. (Last's p. 601)"]]},{"id":"cns-4f96631f","r":"cns","t":"Striate arteries","y":1,"d":1,"src":"Last's text","s":"The striate (central) arteries (Last's):","o":[["They enter through the anterior perforated substance from anterior and middle cerebrals",1,"Last's. (Last's p. 601)"],["Medial striate branches supply the genu and posterior limb of the internal capsule",1,"Last's. (Last's p. 601)"],["Heubner's artery arises from the middle cerebral",0,"From the anterior cerebral. (Last's p. 601)"],["Heubner's artery is absent in about 30%",0,"In about 3%. (Last's p. 601)"]]},{"id":"cns-553ae856","r":"cns","t":"Striate arteries","y":1,"d":1,"src":"Last's text","s":"Regarding the lateral striate arteries:","o":[["They arise from the middle cerebral and anterior choroidal arteries",1,"Last's. (Last's p. 601)"],["One of them is \"the artery of cerebral haemorrhage\"",1,"From the middle cerebral. (Last's p. 601)"],["They arise from the posterior cerebral artery",0,"Posterior cerebral branches enter the posterior perforated substance. (Last's p. 601)"],["Their occlusion typically causes ipsilateral hemiplegia",0,"Contralateral hemiplegia. (Last's p. 601)"]]},{"id":"cns-18d22f3e","r":"cns","t":"Anterior choroidal artery","y":1,"d":1,"src":"Last's text","s":"The anterior choroidal artery:","o":[["Passes below the optic tract",1,"Last's. (Last's p. 601)"],["Enters the choroid fissure at the tip of the inferior horn, just above the uncus",1,"Last's. (Last's p. 601)"],["Supplies the anterior limb of the internal capsule",0,"It supplies the posterior part of the internal capsule. (Last's p. 601)"],["Supplies the medial geniculate body",0,"It supplies the chiasma, optic tract and lateral geniculate body. (Last's p. 601)"]]},{"id":"cns-eedc5d34","r":"cns","t":"Arterial occlusion","y":1,"d":1,"src":"Last's text","s":"Effects of complete occlusion described by Last's:","o":[["Anterior cerebral distal to Heubner's artery affects only the opposite leg",1,"Last's. (Last's p. 601)"],["Middle cerebral occlusion may cause hemianopia from oedema compressing the optic radiation",1,"Last's. (Last's p. 601)"],["Posterior cerebral occlusion causes contralateral hemiplegia",0,"Contralateral hemianopia and hemianaesthesia, and cerebral oedema. (Last's p. 601)"],["Anterior choroidal occlusion spares vision",0,"Contralateral hemiplegia, hemianaesthesia and hemianopia. (Last's p. 601)"]]},{"id":"cns-593ad2ed","r":"cns","t":"Cerebral veins","y":1,"d":1,"src":"Last's text","s":"Superficial cerebral veins (Last's):","o":[["Cortical veins travel superficially in the arachnoid",1,"Unlike arteries, deep in the sulci. (Last's p. 602)"],["They enter sinuses obliquely against the bloodstream",1,"Last's. (Last's p. 602)"],["Superior cerebral veins meeting a blood lake pass between the dural layers",0,"They pass on its cerebral surface beneath the arachnoid. (Last's p. 602)"],["The superficial middle cerebral vein drains into the transverse sinus",0,"Into the cavernous sinus. (Last's p. 602)"]]},{"id":"cns-0fe5c90e","r":"cns","t":"Cerebral veins","y":1,"d":1,"src":"Last's text","s":"Regarding the cerebral veins:","o":[["The depths of the lateral sulcus and insula drain by the deep middle cerebral vein",1,"Which joins the basal vein. (Last's p. 602)"],["The anterior cerebral vein drains the orbital surface of the frontal lobe",1,"Last's. (Last's p. 602)"],["The anterior cerebral vein drains into the inferior sagittal sinus",0,"It joins the basal vein. (Last's p. 602)"],["The superior anastomotic vein empties into the transverse sinus",0,"Into the superior sagittal sinus; the inferior anastomotic vein into the transverse. (Last's p. 602)"]]},{"id":"cns-59a7b5b7","r":"cns","t":"Deep veins","y":1,"d":1,"src":"Last's text","s":"The basal vein (Last's):","o":[["Is formed from striate, deep middle cerebral and anterior cerebral veins",1,"Last's. (Last's p. 603)"],["Passes round the peduncle below the optic tract",1,"With the fourth nerve and posterior cerebral artery. (Last's p. 603)"],["Drains the upper parts of the basal ganglia",0,"Only the lower parts; the upper parts drain to the internal cerebral vein. (Last's p. 603)"],["Joins the straight sinus directly",0,"It joins the great cerebral vein below the splenium. (Last's p. 603)"]]},{"id":"cns-e0ee2ef2","r":"cns","t":"Deep veins","y":1,"d":1,"src":"Last's text","s":"The internal cerebral vein:","o":[["Is formed at the interventricular foramen",1,"By choroidal and thalamostriate veins. (Last's p. 603)"],["Runs back in the tela choroidea",1,"Last's. (Last's p. 603)"],["Receives the septal veins directly in most cases",0,"Septal veins usually join the thalamostriate vein. (Last's p. 603)"],["Joins its fellow above the splenium",0,"Beneath the splenium, forming the great cerebral vein. (Last's p. 603)"]]},{"id":"cns-84b3551d","r":"cns","t":"Cerebral cortex","y":1,"d":1,"src":"Last's text","s":"The structure of the cerebral cortex (Last's):","o":[["Layer I is the plexiform layer",1,"Abundant fibres, few cells. (Last's p. 603)"],["Layer IV is the ganglionic layer",0,"IV is internal granular; V is ganglionic. (Last's p. 603)"],["The stria of Gennari is the external band of Baillarger",1,"In the visual cortex. (Last's p. 603)"],["Betz cells give rise to about 20% of corticospinal fibres",0,"No more than 2%. (Last's p. 603)"]]},{"id":"cns-cb90f7c3","r":"cns","t":"Cerebral cortex","y":1,"d":1,"src":"Last's text","s":"Cortical histology:","o":[["Sensory cortex has predominantly granular cells",1,"Postcentral, superior temporal, calcarine. (Last's p. 603)"],["Betz cells are in layer V of the precentral gyrus",1,"Last's. (Last's p. 603)"],["CNS myelin is formed by Schwann cells",0,"By oligodendrocytes. (Last's p. 603)"],["Layer II is the external pyramidal layer",0,"Layer II is external granular; III is pyramidal. (Last's p. 603)"]]},{"id":"cns-5ed333d6","r":"cns","t":"Brainstem","y":1,"d":1,"src":"Last's text","s":"The brainstem (Last's):","o":[["It extends from just above the tentorial aperture to C1",1,"Last's. (Last's p. 603-5)"],["The reticular formation continues into the spinal cord",1,"Last's. (Last's p. 603-5)"],["The vital centres are anatomically demonstrable nuclei",0,"They are not anatomically demonstrable as distinct nuclei. (Last's p. 603-5)"],["Five sections are the minimum needed to understand it",0,"A minimum of seven. (Last's p. 603-5)"]]},{"id":"cns-16fa1af1","r":"cns","t":"Brainstem","y":1,"d":1,"src":"Last's text","s":"Levels of cranial nerve nuclei:","o":[["III and IV nuclei are in the midbrain",1,"Last's. (Last's p. 603-5)"],["The trigeminal motor nucleus, VI and VII are in the pons",1,"Last's. (Last's p. 603-5)"],["The eighth nerve nuclei lie wholly in the medulla",0,"They overlap the pontomedullary junction. (Last's p. 603-5)"],["The trigeminal sensory nuclei are confined to pons and medulla",0,"They extend through midbrain, pons and medulla. (Last's p. 603-5)"]]},{"id":"cns-4396da70","r":"cns","t":"Midbrain","y":1,"d":1,"src":"Last's text","s":"The midbrain (Last's):","o":[["Most of it lies in the posterior cranial fossa",1,"Extending from just above the dorsum sellae to the petrous apices. (Last's p. 606)"],["The tectum is the part dorsal to the aqueduct",1,"Last's. (Last's p. 606)"],["The medial geniculate body lies medial to the superior colliculus",0,"It lies lateral to each superior colliculus. (Last's p. 606)"],["The superior cerebellar peduncles converge above the superior colliculi",0,"Below the inferior colliculi. (Last's p. 606)"]]},{"id":"cns-d1668026","r":"cns","t":"Midbrain","y":1,"d":1,"src":"Last's text","s":"The trochlear nerve is unique in that it:","o":[["Is the smallest cranial nerve",1,"Last's. (Last's p. 606)"],["Is the only one emerging dorsally",1,"Last's. (Last's p. 606)"],["Is the only one to decussate within the brainstem",1,"Last's. (Last's p. 606)"],["Is the only one passing between posterior cerebral and superior cerebellar arteries",0,"The oculomotor also passes between them, more medially. (Last's p. 606)"]]},{"id":"cns-66e5b0a7","r":"cns","t":"Midbrain","y":1,"d":1,"src":"Last's text","s":"Around the cerebral peduncle:","o":[["The trochlear nerve passes lateral to the oculomotor between the arteries",1,"Last's. (Last's p. 606)"],["The basal vein lies ventral to the optic tract",1,"Last's. (Last's p. 606)"],["The posterior communicating artery lies dorsal to the optic tract",0,"It lies ventral to it. (Last's p. 606)"],["The trochlear nerve enters the cavernous sinus above the free edge of the tentorium",0,"It runs just below the free edge. (Last's p. 606)"]]},{"id":"cns-dc7d4ebc","r":"cns","t":"Midbrain sections","y":1,"d":1,"src":"Last's text","s":"Midbrain sections (Last's):","o":[["At superior colliculus level the red nucleus is seen",1,"With III fibres sweeping through. (Last's p. 606-7)"],["At inferior colliculus level the decussation of the superior cerebellar peduncles is central",1,"Last's. (Last's p. 606-7)"],["The substantia nigra belongs functionally to the limbic system",0,"To the basal nuclei. (Last's p. 606-7)"],["Parkinsonism follows loss of about 30% of nigral dopaminergic cells",0,"About 80%. (Last's p. 606-7)"]]},{"id":"cns-ee8b9e4b","r":"cns","t":"Midbrain sections","y":1,"d":1,"src":"Last's text","s":"Colliculi and pretectal nuclei:","o":[["The superior colliculus mediates general light reflexes",1,"Last's. (Last's p. 606-7)"],["The inferior colliculus mediates sound reflexes",1,"Last's. (Last's p. 606-7)"],["The pretectal nuclei lie caudal to the superior colliculi",0,"Just cranial, at the midbrain-diencephalic junction. (Last's p. 606-7)"],["The colliculi project via the medial longitudinal bundle only",0,"Via tectobulbar and tectospinal tracts. (Last's p. 606-7)"]]},{"id":"cns-151a6114","r":"cns","t":"Midbrain nuclei","y":1,"d":1,"src":"Last's text","s":"Midbrain nuclei (Last's):","o":[["The oculomotor nucleus lies against the midline ventral to the aqueduct",1,"In line with IV, VI and XII. (Last's p. 607)"],["The trochlear nucleus is at inferior colliculus level",1,"Caudal to the oculomotor. (Last's p. 607)"],["The red nucleus lies dorsal to the oculomotor nucleus",0,"Ventral to it; III axons pass through it. (Last's p. 607)"],["The red nucleus receives from the ipsilateral dentate nucleus",0,"From the opposite dentate via the superior cerebellar peduncle. (Last's p. 607)"]]},{"id":"cns-921436f5","r":"cns","t":"Midbrain nuclei","y":1,"d":1,"src":"Last's text","s":"The red nucleus:","o":[["Is slightly larger than a full-sized pea",1,"Last's. (Last's p. 607)"],["Connects especially with the cortex and globus pallidus",1,"Last's. (Last's p. 607)"],["Its efferent fibres decussate at superior colliculus level",0,"At the level of the inferior colliculi. (Last's p. 607)"],["Is associated with a well-defined human disease",0,"Last's: it is not associated with any known disease. (Last's p. 607)"]]},{"id":"cns-223e0091","r":"cns","t":"Midbrain","y":1,"d":1,"src":"Last's text","s":"Midbrain blood supply and related structures:","o":[["Supplied by the posterior cerebral and superior cerebellar arteries",1,"As they curl round the peduncle. (Last's p. 607-8)"],["Veins drain mostly into the basal vein",1,"Some from the colliculi into the great cerebral vein. (Last's p. 607-8)"],["The mesencephalic nucleus lies medial to the aqueduct",0,"Lateral, in the central grey. (Last's p. 607-8)"],["The medial geniculate body lies at inferior colliculus level",0,"At superior colliculus level. (Last's p. 607-8)"]]},{"id":"cns-4f6d8674","r":"cns","t":"Pons","y":1,"d":1,"src":"Last's text","s":"The pons (Last's):","o":[["The trigeminal is the only nerve to emerge from the pons",1,"Its emergence marks the change from pons to peduncle. (Last's p. 608)"],["It lies along the clivus separated by the pontine cistern",1,"Last's. (Last's p. 608)"],["The anterior inferior cerebellar artery curls round the upper margin of the pons",0,"The superior cerebellar artery does. (Last's p. 608)"],["The pontine roof of the fourth ventricle is the inferior medullary velum",0,"The superior medullary velum, with the lingula on it. (Last's p. 608)"]]},{"id":"cns-6106aeec","r":"cns","t":"Pons","y":1,"d":1,"src":"Last's text","s":"Internal structure of the pons:","o":[["Pontine nuclei send fibres across to form the middle cerebellar peduncle",1,"Last's. (Last's p. 608)"],["The trigeminal motor nucleus lies below the lateral floor of the upper fourth ventricle",1,"Last's. (Last's p. 608)"],["The main sensory nucleus lies medial to the motor nucleus",0,"Lateral to it. (Last's p. 608)"],["The spinal nucleus subserves touch",0,"The main sensory nucleus subserves touch; spinal nucleus pain and temperature. (Last's p. 608)"]]},{"id":"cns-16dc0cb2","r":"cns","t":"Pons","y":1,"d":1,"src":"Last's text","s":"Salivary and vestibular nuclei:","o":[["The superior salivary nucleus lies alongside the facial nucleus",1,"Axons via nervus intermedius. (Last's p. 609)"],["The inferior salivary nucleus lies just above the pontomedullary junction",1,"To the otic ganglion via IX. (Last's p. 609)"],["The cochlear nuclei are mainly pontine",0,"Mainly medullary. (Last's p. 609)"],["Vestibular fibres pass posterior to the inferior cerebellar peduncle",0,"Anterior to it. (Last's p. 609)"]]},{"id":"cns-985f054d","r":"cns","t":"Pons","y":1,"d":1,"src":"Last's text","s":"Pontine blood supply and venous drainage:","o":[["Mainly pontine branches of the basilar",1,"Last's. (Last's p. 609)"],["Contributions from the superior cerebellar and AICA",1,"Last's. (Last's p. 609)"],["Venous return is mainly to the superior petrosal sinus",0,"Inferior petrosal sinuses and the basilar plexus. (Last's p. 609)"],["The pontine reticular formation lies ventral to the pontine nuclei",0,"Dorsal to them. (Last's p. 609)"]]},{"id":"cns-f557e023","r":"cns","t":"Medulla","y":1,"d":1,"src":"Last's text","s":"The medulla oblongata (Last's):","o":[["Lies from a line joining the jugular tubercles to the atlas",1,"Last's. (Last's p. 609-10)"],["It lies in the vallecula of the cerebellum",1,"Last's. (Last's p. 609-10)"],["The closed part is the upper part",0,"The closed part is the lower part with the central canal. (Last's p. 609-10)"],["The inferior cerebellar peduncle enters above and lateral to the middle peduncle",0,"Medial to and below. (Last's p. 609-10)"]]},{"id":"cns-a7cf10e2","r":"cns","t":"Medulla","y":1,"d":1,"src":"Last's text","s":"Surface of the medulla:","o":[["The sixth nerve emerges between pons and pyramid",1,"Last's. (Last's p. 609-10)"],["The twelfth emerges between pyramid and olive",1,"In two small groups of rootlets. (Last's p. 609-10)"],["IX, X and cranial XI emerge medial to the olive",0,"Lateral to the olive. (Last's p. 609-10)"],["The vagal trigone lies medial to the hypoglossal trigone",0,"The hypoglossal trigone is adjacent to the midline with the vagal trigone lateral. (Last's p. 609-10)"]]},{"id":"cns-0b3022e8","r":"cns","t":"Medulla sections","y":1,"d":1,"src":"Last's text","s":"Sections through the medulla (Last's):","o":[["The upper medulla shows the sac-like olivary nucleus",1,"Last's. (Last's p. 610)"],["Pyramidal decussation characterises the lowest part",1,"Last's. (Last's p. 610)"],["The sensory decussation lies below the pyramidal decussation",0,"The decussation of the medial lemnisci is at a slightly higher level. (Last's p. 610)"],["The nucleus ambiguus lies superficially beneath the floor of the ventricle",0,"At a deeper level. (Last's p. 610)"]]},{"id":"cns-125035c7","r":"cns","t":"Tractus solitarius","y":1,"d":1,"src":"Last's text","s":"The nucleus of the tractus solitarius (Last's):","o":[["Its cells are the most tightly packed of any brainstem nucleus",1,"Last's. (Last's p. 610)"],["The two sides meet in the lowest part of the open medulla",1,"Forming a V. (Last's p. 610)"],["Its lower part receives taste fibres",0,"Its upper part receives taste. (Last's p. 610)"],["It contains the expiratory centre",0,"Some of its cells form the inspiratory centre. (Last's p. 610)"]]},{"id":"cns-8ef41f56","r":"cns","t":"Tractus solitarius","y":2,"d":1,"src":"Last's text","s":"The nucleus of the tractus solitarius receives:","o":[["Taste fibres from the chorda tympani",1,"Last's. (Last's p. 610)"],["Baroreceptor afferents from the carotid sinus",1,"Last's. (Last's p. 610)"],["Afferents from the aortic bodies",1,"Last's. (Last's p. 610)"],["Taste via the internal laryngeal nerve",1,"Last's. (Last's p. 610)"]],"k":"E"},{"id":"cns-ffb78271","r":"cns","t":"Medulla nuclei","y":1,"d":1,"src":"Last's text","s":"The nucleus ambiguus (Last's):","o":[["Its upper part supplies the palate",1,"Last's. (Last's p. 610-11)"],["Its lowest part supplies the larynx",1,"Last's. (Last's p. 610-11)"],["Its middle part supplies the larynx",0,"The middle supplies pharynx and oesophagus. (Last's p. 610-11)"],["All its fibres are distributed by the vagus",0,"Except stylopharyngeus by the glossopharyngeal. (Last's p. 610-11)"]]},{"id":"cns-0b47b3d1","r":"cns","t":"Medulla nuclei","y":1,"d":1,"src":"Last's text","s":"Further medullary nuclei:","o":[["The spinal trigeminal nucleus lies lateral to the tractus solitarius nucleus",1,"Last's. (Last's p. 610-11)"],["Olivocerebellar fibres decussate to enter the inferior cerebellar peduncle",1,"Last's. (Last's p. 610-11)"],["The accessory cuneate nucleus conveys lower limb proprioception",0,"Upper limb, via cuneocerebellar fibres. (Last's p. 610-11)"],["The gracile and cuneate nuclei give rise to the lateral lemniscus",0,"To the medial lemniscus. (Last's p. 610-11)"]]},{"id":"cns-d8f37236","r":"cns","t":"Medulla","y":1,"d":1,"src":"Last's text","s":"The area postrema and reticular formation (Last's):","o":[["The area postrema lies medial to each gracile nucleus at the lower angle of the ventricle",1,"Last's. (Last's p. 611)"],["The area postrema is the chemoreceptor trigger zone",1,"And vomiting centre, with no blood-brain barrier. (Last's p. 611)"],["The reticular formation receives cerebellar input from the ipsilateral hemisphere via the dentate",0,"From the opposite cerebellar hemisphere. (Last's p. 611)"],["Spinoreticular fibres are part of the touch pathway",0,"They are part of the pain pathway. (Last's p. 611)"]]},{"id":"cns-8a5636b7","r":"cns","t":"Medullary syndromes","y":1,"d":1,"src":"Last's text","s":"Medial medullary syndrome (Last's):","o":[["Results from damage to penetrating branches of the anterior spinal branch of the vertebral",1,"Last's. (Last's p. 611-12)"],["Causes paralysis of the tongue on the same side",1,"Hypoglossal nucleus. (Last's p. 611-12)"],["Causes loss of pain and temperature on the opposite side",0,"It causes hemiplegia with loss of touch and kinaesthetic sense on the opposite side (pyramid and medial lemniscus). (Last's p. 611-12)"],["Causes ipsilateral Horner's syndrome",0,"That is lateral medullary syndrome. (Last's p. 611-12)"]]},{"id":"cns-7499812f","r":"cns","t":"Medullary syndromes","y":1,"d":1,"src":"Last's text","s":"Lateral medullary (PICA) syndrome:","o":[["Ipsilateral vocal fold paralysis from nucleus ambiguus involvement",1,"Last's. (Last's p. 611-12)"],["Loss of pain and temperature on the same side of the face",1,"Uncrossed spinal trigeminal tract. (Last's p. 611-12)"],["Loss of pain and temperature on the same side of the body",0,"On the opposite side, from the crossed spinal lemniscus. (Last's p. 611-12)"],["Contralateral Horner's syndrome",0,"Ipsilateral, from the descending sympathetic pathway. (Last's p. 611-12)"]]},{"id":"cns-cdf1d7b6","r":"cns","t":"Medulla","y":1,"d":1,"src":"Last's text","s":"Blood supply and venous drainage of the medulla:","o":[["Ventrally from vertebral and basilar branches",1,"Last's. (Last's p. 611-12)"],["Laterally and dorsally from PICA",1,"Last's. (Last's p. 611-12)"],["Veins drain dorsally to the inferior petrosal sinus",0,"Dorsally to the occipital sinus; ventrally to the basilar plexus and inferior petrosal sinus. (Last's p. 611-12)"],["Medullary veins do not communicate with spinal veins",0,"They do communicate. (Last's p. 611-12)"]]},{"id":"cns-e26ceae0","r":"cns","t":"Descending tracts","y":1,"d":1,"src":"Last's text","s":"Corticospinal and corticonuclear fibres (Last's):","o":[["They arise from cells in layer 5 of MsI",1,"Last's. (Last's p. 612)"],["About 80% come from the primary motor area",0,"Only about 40%; the rest from widely scattered areas. (Last's p. 612)"],["Corticonuclear fibres run in the genu of the internal capsule",1,"Last's. (Last's p. 612)"],["The upper part of the facial nucleus receives only contralateral cortical input",0,"The lower part of the facial nucleus is the important exception, supplied only by the opposite cortex. (Last's p. 612)"]]},{"id":"cns-26eed75e","r":"cns","t":"Descending tracts","y":1,"d":1,"src":"Last's text","s":"The pyramid and decussation (Last's):","o":[["Each pyramid contains about one million fibres",1,"About 700 000 are small and myelinated. (Last's p. 612)"],["About 85% of fibres cross in the motor decussation",1,"Last's. (Last's p. 612)"],["In the crus, arm fibres lie lateral to leg fibres",0,"Arm fibres are medial to leg fibres. (Last's p. 612)"],["Anterior corticospinal fibres never cross",0,"They eventually cross in the cord. (Last's p. 612)"]]},{"id":"cns-98f2ea5e","r":"cns","t":"Descending tracts","y":1,"d":1,"src":"Last's text","s":"Corticopontine fibres and tegmental decussations:","o":[["Frontopontine fibres occupy the medial one-fifth of the crus",1,"Last's. (Last's p. 612)"],["Temporo-, parieto- and occipitopontine fibres occupy the lateral one-fifth",1,"Last's. (Last's p. 612)"],["Rubrospinal fibres decussate in the dorsal tegmental decussation",0,"In the ventral tegmental decussation; tectospinal fibres cross in the dorsal one. (Last's p. 612)"],["The superior cerebellar peduncles decussate at superior colliculus level",0,"At inferior colliculus level. (Last's p. 612)"]]},{"id":"cns-38a878e6","r":"cns","t":"Brainstem tracts","y":1,"d":1,"src":"Last's text","s":"The medial longitudinal bundle (Last's):","o":[["Lies immediately ventral to the periaqueductal grey",1,"Last's. (Last's p. 613)"],["Extends to the upper cervical cord",1,"Last's. (Last's p. 613)"],["Links mainly the cochlear nuclei with eye-muscle nuclei",0,"It links the vestibular nuclei with III, IV and VI. (Last's p. 613)"],["Lies far lateral to the midline in the medulla",0,"It remains adjacent to the midline. (Last's p. 613)"]]},{"id":"cns-8efd9502","r":"cns","t":"Brainstem tracts","y":1,"d":1,"src":"Last's text","s":"Reticulospinal and vestibulospinal tracts:","o":[["The lateral reticulospinal tract arises from the medullary reticular formation",1,"Last's. (Last's p. 613)"],["The lateral vestibulospinal tract arises from the lateral vestibular nucleus",1,"Last's. (Last's p. 613)"],["The anterior (medial) reticulospinal tract arises from the medulla",0,"From the pontine reticular formation. (Last's p. 613)"],["The tectospinal tract descends to lumbar levels",0,"No farther than the cervical cord. (Last's p. 613)"]]},{"id":"cns-1a4c8f07","r":"cns","t":"Brainstem tracts","y":1,"d":1,"src":"Last's text","s":"The medial lemniscus (Last's):","o":[["Begins in the lower medulla",1,"From the opposite gracile and cuneate nuclei. (Last's p. 613)"],["Its fibres cross as internal arcuate fibres",1,"In the sensory decussation. (Last's p. 613)"],["Lies laterally in the medulla and moves medially in the midbrain",0,"It starts adjacent to the midline and deviates laterally higher up. (Last's p. 613)"],["Is joined by the lateral lemniscus",0,"It is joined by the trigeminal lemniscus. (Last's p. 613)"]]},{"id":"cns-5ae9ef7b","r":"cns","t":"Brainstem tracts","y":1,"d":1,"src":"Last's text","s":"Ascending brainstem tracts:","o":[["Most spinal lemniscus fibres end in the reticular formation",1,"So it quickly becomes smaller. (Last's p. 613)"],["The trapezoid body is formed by decussating cochlear nucleus fibres",1,"At the pontomedullary junction. (Last's p. 613)"],["The posterior spinocerebellar tract enters the superior cerebellar peduncle",0,"It enters the inferior peduncle; the anterior tract enters the superior. (Last's p. 613)"],["Trigeminal pain fibres synapse before descending in the spinal tract",0,"They descend first, then synapse in the spinal nucleus. (Last's p. 613)"]]},{"id":"cns-ecfd48f6","r":"cns","t":"Fourth ventricle","y":1,"d":1,"src":"Last's text","s":"The roof of the fourth ventricle:","o":[["The superior medullary velum is bounded by the superior cerebellar peduncles",1,"Last's. (Last's p. 613-14)"],["The inferior medullary velum is white matter from the base of the flocculus",1,"Last's. (Last's p. 613-14)"],["The median aperture opens into the pontine cistern",0,"Into the cerebellomedullary cistern. (Last's p. 613-14)"],["The lateral apertures open posteriorly into the cerebellomedullary cistern",0,"They open anteriorly just behind VIII into the pontine cistern. (Last's p. 613-14)"]]},{"id":"cns-45001cfa","r":"cns","t":"Fourth ventricle","y":1,"d":1,"src":"Last's text","s":"The choroid plexus of the fourth ventricle (Last's):","o":[["Is supplied by a branch of PICA",1,"Starting at the lateral aperture. (Last's p. 613-14)"],["Lies just below the flocculus at the lateral aperture",1,"Last's. (Last's p. 613-14)"],["Indents the pontine part of the roof",0,"It indents the medullary part. (Last's p. 613-14)"],["Drains to the straight sinus",0,"To the occipital sinus. (Last's p. 613-14)"]]},{"id":"cns-0b7625ce","r":"cns","t":"Fourth ventricle","y":1,"d":1,"src":"Last's text","s":"The floor of the fourth ventricle:","o":[["The medullary striae are aberrant pontine fibres to the cerebellum",1,"Via the inferior peduncle. (Last's p. 614)"],["The locus caeruleus lies in the upper superior fovea",1,"Pigmented noradrenergic cells. (Last's p. 614)"],["The facial colliculus lies at the upper end of the medial eminence",0,"At its lower end. (Last's p. 614)"],["The hypoglossal trigone has its apex upwards",0,"Apex down; the vagal trigone has its apex upwards. (Last's p. 614)"]]},{"id":"cns-12170a0c","r":"cns","t":"Fourth ventricle","y":1,"d":1,"src":"Last's text","s":"The medullary part of the floor:","o":[["Is smaller than the pontine part",1,"Last's. (Last's p. 614)"],["The inferior fovea divides it into two triangles",1,"Last's. (Last's p. 614)"],["The vagal trigone lies medial to the hypoglossal trigone",0,"Lateral. (Last's p. 614)"],["The vestibular area is confined to the pontine part",0,"Its lower part occupies the medullary lateral angle. (Last's p. 614)"]]},{"id":"cns-406b0aff","r":"cns","t":"CSF","y":1,"d":1,"src":"Last's text","s":"Cerebrospinal fluid (Last's):","o":[["About 30% comes from brain capillaries other than the choroid plexuses",1,"Last's. (Last's p. 614)"],["The total volume is about 130 ml",1,"Last's. (Last's p. 614)"],["About 75 ml lies in the cranial subarachnoid space",0,"75 ml spinal; 25 ml cranial. (Last's p. 614)"],["Production is about 150 ml per day",0,"Over 500 ml per day. (Last's p. 614)"]]},{"id":"cns-734652d8","r":"cns","t":"CSF","y":1,"d":1,"src":"Last's text","s":"Regarding CSF:","o":[["About 30 ml is within the ventricular system",1,"Last's. (Last's p. 614)"],["Some drains through the cribriform plate to cervical lymphatics",1,"Last's. (Last's p. 614)"],["CSF pressure follows arterial pressure closely",0,"Arterial changes have little effect; venous pressure changes are quickly reflected. (Last's p. 614)"],["Buoyancy reduces the brain's effective weight to about 500 g",0,"From 1500 g to about 50 g. (Last's p. 614)"]]},{"id":"cns-9ea2d631","r":"cns","t":"Cranial nerve nuclei","y":1,"d":1,"src":"Last's text","s":"Cranial nerve nuclei summary (Last's):","o":[["Sensory nuclei contain cell bodies of second neurons",1,"First neurons lie in ganglia. (Last's p. 614-15)"],["The trigeminal motor nucleus supplies mylohyoid and tensor palati",1,"And muscles of mastication. (Last's p. 614-15)"],["The oculomotor somatic nucleus is level with the inferior colliculi",0,"Superior colliculi; the trochlear is at inferior colliculus level. (Last's p. 614-15)"],["The main sensory trigeminal nucleus lies medial to the motor nucleus",0,"Lateral. (Last's p. 614-15)"]]},{"id":"cns-b52f654f","r":"cns","t":"Cranial nerve nuclei","y":1,"d":1,"src":"Last's text","s":"Glossopharyngeal and vagal nuclei:","o":[["The nucleus ambiguus lies deep in the upper medulla",1,"Last's. (Last's p. 615-16)"],["IX carries carotid body chemoreceptor fibres to the tractus solitarius",1,"Last's. (Last's p. 615-16)"],["X carries taste from the posterior third of the tongue",0,"IX does; X carries taste from the epiglottis. (Last's p. 615-16)"],["The tractus solitarius lies medial to the dorsal vagal nucleus",0,"Lateral. (Last's p. 615-16)"]]},{"id":"cns-75c15237","r":"cns","t":"Brain death","y":1,"d":1,"src":"Last's text","s":"Brainstem death tests and their anatomical basis (Last's):","o":[["Fixed pupils test midbrain function",1,"Last's. (Last's p. 616)"],["Absent corneal reflex tests pontine trigeminal-facial connections",1,"Last's. (Last's p. 616)"],["Absent gag reflex tests pontine connexions",0,"It tests vagal connexions in the medulla. (Last's p. 616)"],["The apnoea test requires PaCO2 above 30 mm Hg",0,"Above 50 mm Hg (6.7 kPa). (Last's p. 616)"]]},{"id":"cns-49b81b4a","r":"cns","t":"Cerebellum","y":1,"d":1,"src":"Last's text","s":"The cerebellum (Last's):","o":[["The superior peduncle enters the midbrain",1,"Last's. (Last's p. 616)"],["The archaeocerebellum is concerned with balance",1,"Vestibular mechanisms. (Last's p. 616)"],["The palaeocerebellum is associated with the cerebral hemispheres",0,"With spinal mechanisms (limb movements); the neocerebellum with the cerebrum. (Last's p. 616)"],["The highest part of the cerebellum lies at the attached margin of the tentorium",0,"At the tentorial notch. (Last's p. 616)"]]},{"id":"cns-8e37aba0","r":"cns","t":"Cerebellum","y":1,"d":1,"src":"Last's text","s":"Cerebellar fissures and lobes:","o":[["The horizontal fissure is the deepest sulcus",1,"But of no functional significance. (Last's p. 617)"],["The primary fissure separates palaeocerebellum from neocerebellum",1,"Last's. (Last's p. 617)"],["The anterior lobe is large and the posterior lobe small",0,"Small anterior lobe, large posterior lobe. (Last's p. 617)"],["The primary fissure lies on the inferior surface",0,"On the superior surface, in front of the horizontal fissure. (Last's p. 617)"]]},{"id":"cns-c28cd9a4","r":"cns","t":"Cerebellum","y":1,"d":1,"src":"Last's text","s":"The vermis and flocculonodular lobe (Last's):","o":[["The inferior vermis consists of pyramid, uvula and nodule",1,"Last's. (Last's p. 617)"],["The nodule lies highest, on the roof of the fourth ventricle",1,"Last's. (Last's p. 617)"],["The flocculonodular lobe and pyramid form the archaeocerebellum",0,"The flocculonodular lobe and the lingula. (Last's p. 617)"],["The paraflocculus lies above the flocculus",0,"It lies beneath the flocculus, attached mainly to the pyramid. (Last's p. 617)"]]},{"id":"cns-be539962","r":"cns","t":"Cerebellum","y":1,"d":1,"src":"Last's text","s":"Cerebellar lesions (Last's):","o":[["Archaeocerebellar lesions cause trunk ataxia",1,"Without nystagmus or tremor. (Last's p. 617-18)"],["Neocerebellar lesions cause intention tremor",1,"And hypotonia, pendular jerks, dysdiadochokinesia and nystagmus. (Last's p. 617-18)"],["Palaeocerebellar lesions cause reduced muscle reflexes",0,"Increased muscle reflexes with disturbed postural mechanisms. (Last's p. 617-18)"],["Cerebellar lesions cause paralysis",0,"They do not cause paralysis. (Last's p. 617-18)"]]},{"id":"cns-f3a0e5b6","r":"cns","t":"Cerebellar nuclei","y":1,"d":1,"src":"Last's text","s":"The cerebellar nuclei (Last's):","o":[["The dentate opens towards the superior peduncle",1,"Last's. (Last's p. 618)"],["From lateral to medial: emboliform, globose, fastigial",1,"EGF. (Last's p. 618)"],["The fastigial nucleus belongs to the palaeocerebellum",0,"To the archaeocerebellum. (Last's p. 618)"],["Dentate efferents go to the ipsilateral red nucleus",0,"To the contralateral red nucleus and thalamus. (Last's p. 618)"]]},{"id":"cns-8a22f266","r":"cns","t":"Cerebellar cortex","y":1,"d":1,"src":"Last's text","s":"The cerebellar cortex:","o":[["The molecular layer is superficial",1,"Mostly fibres with few cells. (Last's p. 618)"],["Purkinje cells lie between molecular and granular layers",1,"Last's. (Last's p. 618)"],["Climbing fibres act through granule cells",0,"Climbing fibres activate Purkinje cells directly; mossy fibres act through granule and basket cells. (Last's p. 618)"],["Purkinje dendrites lie parallel to the long axis of a folium",0,"At right angles to it. (Last's p. 618)"]]},{"id":"cns-05b43663","r":"cns","t":"Cerebellar cortex","y":1,"d":1,"src":"Last's text","s":"Cerebellar circuitry (Last's):","o":[["A climbing fibre activates one Purkinje cell",1,"Last's. (Last's p. 618-19)"],["A basket cell axon arborises around some 500 Purkinje cells",1,"Last's. (Last's p. 618-19)"],["Mossy fibres are terminals of pontine and vestibular fibres",0,"Those are climbing fibres; mossy fibres are spino- and olivocerebellar terminals. (Last's p. 618-19)"],["Efferent fibres generally arise from the cortex",0,"From subcortical nuclei. (Last's p. 618-19)"]]},{"id":"cns-d9247e01","r":"cns","t":"Cerebellar peduncles","y":1,"d":1,"src":"Last's text","s":"The cerebellar peduncles (Last's):","o":[["The superior peduncle is predominantly efferent",1,"Last's. (Last's p. 619)"],["The middle peduncle carries fibres from contralateral pontine nuclei",1,"Last's. (Last's p. 619)"],["The anterior spinocerebellar tract runs in the inferior peduncle",0,"In the superior peduncle. (Last's p. 619)"],["Olivocerebellar fibres come from the ipsilateral olive",0,"From the opposite olive. (Last's p. 619)"]]},{"id":"cns-d8d17ee4","r":"cns","t":"Cerebellar arteries","y":1,"d":1,"src":"Last's text","s":"Cerebellar blood supply (Last's):","o":[["PICA is the largest branch of the vertebral artery",1,"Last's. (Last's p. 619)"],["PICA passes between the rootlets of IX and X",1,"After passing below the hypoglossal rootlets. (Last's p. 619)"],["AICA arises from the basilar at the upper part of the pons",0,"At the lower part of the pons. (Last's p. 619)"],["The superior cerebellar artery winds round the peduncle above the fourth nerve",0,"Below the fourth nerve. (Last's p. 619)"]]},{"id":"cns-3a17ad8c","r":"cns","t":"Cerebellar veins","y":1,"d":1,"src":"Last's text","s":"Cerebellar venous drainage (Last's):","o":[["Superior and posterior surfaces drain to straight and transverse sinuses",1,"Last's. (Last's p. 619)"],["The superior vermis drains to the great cerebral vein",1,"At its entrance to the straight sinus. (Last's p. 619)"],["The inferior surfaces drain to the superior petrosal sinus",0,"To the inferior petrosal, sigmoid and occipital sinuses. (Last's p. 619)"],["Two arteries supply the small upper surface of each hemisphere",0,"One supplies the upper surface; two supply the large under surface. (Last's p. 619)"]]},{"id":"cns-42f97158","r":"cns","t":"Spinal cord","y":1,"d":1,"src":"Last's text","s":"The spinal cord (Last's):","o":[["In the fetus it reaches S2 vertebra",1,"Last's. (Last's p. 619-20)"],["At birth the conus lies opposite L3",1,"Last's. (Last's p. 619-20)"],["It reaches its adult level at about 5 years",0,"About 20 years. (Last's p. 619-20)"],["The cervical enlargement occupies segments C3 to T1",0,"C5 to T1; vertebral levels C3 to T1. (Last's p. 619-20)"]]},{"id":"cns-e61bd033","r":"cns","t":"Spinal cord","y":1,"d":1,"src":"Last's text","s":"Spinal cord enlargements and roots:","o":[["The lumbosacral enlargement spans segments L2 to S3",1,"Last's. (Last's p. 619-20)"],["It lies opposite vertebrae T9 to L1",1,"Last's. (Last's p. 619-20)"],["Each anterior root has ten or more rootlets",0,"Three or four. (Last's p. 619-20)"],["The roots unite inside the dural theca",0,"They unite in the intervertebral foramina after evaginating the dura separately. (Last's p. 619-20)"]]},{"id":"cns-89825afc","r":"cns","t":"Spinal roots","y":1,"d":1,"src":"Last's text","s":"Spinal nerve roots (Last's):","o":[["Cervical posterior root ganglia lie just lateral to the foramina",1,"In contact with the vertebral artery. (Last's p. 620)"],["The cauda equina consists of nerve roots, not nerves",1,"Last's. (Last's p. 620)"],["The filum terminale is part of the cauda equina",0,"It is pia and not classified as part of the cauda. (Last's p. 620)"],["Upper thoracic roots kink downwards to reach their foramina",0,"They kink upwards. (Last's p. 620)"]]},{"id":"cns-843f723d","r":"cns","t":"Spinal cord","y":1,"d":1,"src":"Last's text","s":"Internal structure of the cord:","o":[["The central canal extends into the upper few mm of the filum",1,"Last's. (Last's p. 620)"],["The white commissure lies anterior to the grey commissure",1,"Last's. (Last's p. 620)"],["Posterior white columns are largest in the lumbar region",0,"In the cervical region. (Last's p. 620)"],["The anterior horn reaches the surface of the cord",0,"It falls short; the posterior horn reaches the surface. (Last's p. 620)"]]},{"id":"cns-d1350128","r":"cns","t":"Spinal grey matter","y":1,"d":1,"src":"Last's text","s":"Anterior horn cell organisation (Last's):","o":[["Medial cells supply trunk muscles",1,"Last's. (Last's p. 621-2)"],["Lateral cells supply limbs",1,"Last's. (Last's p. 621-2)"],["Dorsal cells of the lateral group supply proximal limb muscles",0,"Ventral cells supply proximal; dorsal cells distal. (Last's p. 621-2)"],["The sympathetic lateral horn spans T1 to L4",0,"T1 to L2. (Last's p. 621-2)"]]},{"id":"cns-e43d2508","r":"cns","t":"Rexed laminae","y":1,"d":1,"src":"Last's text","s":"Rexed laminae (Last's):","o":[["Lamina II is the gelatinous substance",1,"Last's. (Last's p. 621-2)"],["The thoracic nucleus is in the medial part of lamina VII",1,"Last's. (Last's p. 621-2)"],["Laminae VII and VIII form the nucleus proprius",0,"Laminae III to VI. (Last's p. 621-2)"],["Lamina V contains the alpha motor neurons",0,"Lamina IX; lamina V is a main source of anterolateral tract fibres. (Last's p. 621-2)"]]},{"id":"cns-43c48339","r":"cns","t":"Spinal white matter","y":1,"d":1,"src":"Last's text","s":"Spinal white matter (Last's):","o":[["Anterior roots divide lateral from anterior white columns",1,"Last's. (Last's p. 622-3)"],["Propriospinal fibres lie adjacent to the grey matter",1,"Last's. (Last's p. 622-3)"],["Tracts have sharp boundaries throughout the cord",0,"Except in the posterior columns, there are no sharp boundaries. (Last's p. 622-3)"],["The posterior column contains descending fibres",0,"It is wholly occupied by ascending gracile and cuneate fibres. (Last's p. 622-3)"]]},{"id":"cns-97286ade","r":"cns","t":"Posterior columns","y":1,"d":1,"src":"Last's text","s":"The posterior white columns (Last's):","o":[["Fibres from the lowest segments lie nearest the midline",1,"Last's. (Last's p. 622-3)"],["They carry the sense of bladder and rectal fullness",1,"Last's. (Last's p. 622-3)"],["Fibres enter on the lateral side of the posterior roots",0,"On the medial side. (Last's p. 622-3)"],["The gracile tract carries upper limb fibres",0,"Lower trunk, lower limb and perineum; the cuneate carries upper limb. (Last's p. 622-3)"]]},{"id":"cns-8cdc74fa","r":"cns","t":"Posterior columns","y":1,"d":1,"src":"Last's text","s":"Testing posterior column function:","o":[["Romberg's sign indicates sensory ataxia",1,"Last's. (Last's p. 623-4)"],["Two points 3 mm apart are normally distinguishable on the finger pads",1,"Last's. (Last's p. 623-4)"],["Vibration is tested with a 512 Hz fork",0,"Last's: 128 Hz. (Last's p. 623-4)"],["Cerebellar ataxia worsens markedly with eyes closed",0,"With cerebellar or labyrinthine ataxia there is little difference. (Last's p. 623-4)"]]},{"id":"cns-d0999bfb","r":"cns","t":"Anterolateral tract","y":1,"d":1,"src":"Last's text","s":"The anterolateral tract (Last's):","o":[["Lies in front of the lateral corticospinal tract",1,"And in front of the denticulate ligament. (Last's p. 623-4)"],["Arises mainly from laminae I and V",1,"Last's. (Last's p. 623-4)"],["Fibres cross behind the central canal",0,"In front of the central canal. (Last's p. 623-4)"],["Cervical fibres lie most laterally",0,"Sacral fibres lie most laterally; cervical most deeply. (Last's p. 623-4)"]]},{"id":"cns-e185da91","r":"cns","t":"Anterolateral tract","y":1,"d":1,"src":"Last's text","s":"Pain fibres and Lissauer's tract:","o":[["C fibres carry slow pain",1,"Unmyelinated. (Last's p. 623-4)"],["A-delta fibres carry fast pain and temperature",1,"Thinly myelinated. (Last's p. 623-4)"],["Lissauer's tract fibres run 5-6 segments before synapsing",0,"One or two segments. (Last's p. 623-4)"],["Crude touch fibres occupy the lateral part of the tract",0,"The more medial part, and cross less obliquely. (Last's p. 623-4)"]]},{"id":"cns-f177ebdd","r":"cns","t":"Anterolateral tract","y":1,"d":1,"src":"Last's text","s":"Pain pathways (Last's):","o":[["About 10% of anterolateral fibres pass directly to the thalamus",1,"Last's. (Last's p. 624)"],["The rest synapse in the reticular formation",1,"Spinoreticulothalamic. (Last's p. 624)"],["Endogenous opioid peptides readily cross the blood-brain barrier",0,"They do not. (Last's p. 624)"],["Deep pain is tested by pinprick",0,"Pinprick tests superficial pain; squeezing tests deep pain. (Last's p. 624)"]]},{"id":"cns-9cd61d47","r":"cns","t":"Cordotomy","y":1,"d":1,"src":"Last's text","s":"Anterolateral cordotomy (Last's):","o":[["The knife enters in front of the denticulate ligament",1,"To spare the corticospinal tract. (Last's p. 625)"],["The cut is made several segments above the desired level",1,"Because fibres cross obliquely. (Last's p. 625)"],["Pain relief is usually permanent",0,"It rarely lasts more than a few months (2 years at most). (Last's p. 625)"],["It divides the medial part of the anterolateral tract",0,"The lateral part. (Last's p. 625)"]]},{"id":"cns-c785f00f","r":"cns","t":"Spinocerebellar tracts","y":1,"d":1,"src":"Last's text","s":"Spinocerebellar pathways (Last's):","o":[["Clarke's column spans all thoracic and first two lumbar segments",1,"Last's. (Last's p. 625)"],["The posterior spinocerebellar tract is uncrossed",1,"To the inferior peduncle. (Last's p. 625)"],["The anterior spinocerebellar tract is mostly uncrossed",0,"It mostly crosses. (Last's p. 625)"],["Cervical proprioception travels in the posterior spinocerebellar tract",0,"Via the accessory cuneate nucleus and cuneocerebellar tract. (Last's p. 625)"]]},{"id":"cns-25dea5d8","r":"cns","t":"Corticospinal tract","y":1,"d":1,"src":"Last's text","s":"The lateral corticospinal tract (Last's):","o":[["Lies behind the attachment of the denticulate ligament",1,"Last's. (Last's p. 625)"],["Arm fibres cross slightly higher than leg fibres",1,"Last's. (Last's p. 625)"],["About 25% of fibres supply the upper limb",0,"About 55% end at cervical and T1 levels; 25% for the lower limb. (Last's p. 625)"],["Most fibres synapse directly on motor neurons",0,"98% synapse with interneurons in laminae VII and VIII. (Last's p. 625)"]]},{"id":"cns-f2581a71","r":"cns","t":"Descending tracts","y":1,"d":1,"src":"Last's text","s":"Extrapyramidal tracts in the cord (Last's):","o":[["The lateral reticulospinal tract is facilitatory",1,"Last's. (Last's p. 625)"],["The medial reticulospinal tract is inhibitory",1,"Last's. (Last's p. 625)"],["The anterior corticospinal tract reaches the sacral cord",0,"No lower than the upper thoracic cord. (Last's p. 625)"],["The vestibulospinal tract mainly affects distal limb muscles",0,"Trunk and limb girdle muscles. (Last's p. 625)"]]},{"id":"cns-18ef769a","r":"cns","t":"Motor lesions","y":1,"d":1,"src":"Last's text","s":"Upper motor neuron lesions (Last's):","o":[["A pure pyramidal lesion causes flaccid paralysis",1,"Last's. (Last's p. 625-6)"],["Spasticity reflects concomitant extrapyramidal involvement",1,"Last's. (Last's p. 625-6)"],["A pure pyramidal lesion can arise in the internal capsule",0,"It is possible from a lesion confined to the medullary pyramid. (Last's p. 625-6)"],["Parasagittal meningioma affects both arm areas",0,"It presses on the leg areas of both hemispheres. (Last's p. 625-6)"]]},{"id":"cns-32c7108a","r":"cns","t":"Spinal arteries","y":1,"d":1,"src":"Last's text","s":"Spinal arteries (Last's):","o":[["The anterior spinal artery forms from both vertebral arteries",1,"At the foramen magnum. (Last's p. 626)"],["It supplies the cord anterior to the posterior grey columns",1,"Last's. (Last's p. 626)"],["The posterior spinal arteries arise from the anterior spinal artery",0,"From PICA or the vertebral artery. (Last's p. 626)"],["The anterior spinal artery is largest in the thoracic region",0,"It may become so small there that it is considered absent. (Last's p. 626)"]]},{"id":"cns-cfd56b12","r":"cns","t":"Spinal arteries","y":1,"d":1,"src":"Last's text","s":"Radicular arteries (Last's):","o":[["Embryonically every segment has a radicular vessel on both sides",1,"Last's. (Last's p. 626)"],["Adamkiewicz is slightly commoner on the left",1,"Last's. (Last's p. 626)"],["Adamkiewicz always accompanies T10 or T11",0,"It may be anywhere from T7 to L4. (Last's p. 626)"],["Lateral sacral arteries never give radicular branches",0,"They are among the parent vessels. (Last's p. 626)"]]},{"id":"cns-c4815597","r":"cns","t":"Spinal veins","y":1,"d":1,"src":"Last's text","s":"Spinal pial supply and veins:","o":[["Pial arteries supply the periphery of the cord",1,"Last's. (Last's p. 626)"],["Sacral sparing results from pial supply to superficial sacral fibres",1,"Last's. (Last's p. 626)"],["Posterior spinal veins are single",0,"Double, straddling the posterior roots. (Last's p. 626)"],["Spinal veins drain to the azygos system in the lumbar region",0,"To lumbar veins; azygos in the thorax. (Last's p. 626)"]]},{"id":"cns-44c5ab2d","r":"cns","t":"Cord injury","y":1,"d":1,"src":"Last's text","s":"Spinal cord injury (Last's):","o":[["Transection above T10 abolishes effective cough",1,"From abdominal and lower intercostal paralysis. (Last's p. 627)"],["Perianal sensation tests conduction through the cord",1,"Last's. (Last's p. 627)"],["Brown-Sequard causes ipsilateral loss of pain and temperature",0,"Contralateral. (Last's p. 627)"],["In anterior spinal artery syndrome touch is lost",0,"The posterior columns and touch remain intact. (Last's p. 627)"]]},{"id":"cns-817b95be","r":"cns","t":"Cord injury","y":1,"d":1,"src":"Last's text","s":"Central cord syndrome (Last's):","o":[["Commonly follows sudden hyperextension of the cervical spine",1,"Last's. (Last's p. 627)"],["Causes flaccid upper limb paralysis",1,"Anterior horn damage. (Last's p. 627)"],["Lower limb spasticity arises from sacral corticospinal fibres",0,"From lumbar fibres; sacral fibres are more superficial. (Last's p. 627)"],["It spares upper limb pain sensation",0,"Deep cervical anterolateral fibres are interrupted. (Last's p. 627)"]]},{"id":"cns-9f5e0ed5","r":"cns","t":"Development","y":1,"d":1,"src":"Last's text","s":"The sulcus limitans and nuclear columns (Last's):","o":[["The alar lamina is dorsal and sensory",1,"Last's. (Last's p. 627)"],["Autonomic cells lie near the sulcus limitans",1,"Last's. (Last's p. 627)"],["Somatic cells lie nearest the sulcus limitans",0,"They lie further away. (Last's p. 627)"],["In the fourth ventricle efferent cells lie lateral",0,"They lie medial; afferent cells lateral. (Last's p. 627)"]]},{"id":"cns-694e2fad","r":"cns","t":"Brainstem nuclei","y":1,"d":1,"src":"Last's text","s":"Motor columns of the brainstem:","o":[["Somatic motor nuclei lie near the midline",1,"III, IV, VI and XII. (Last's p. 627-8)"],["The branchial column is sometimes called special visceral",1,"Last's. (Last's p. 627-8)"],["The nucleus ambiguus has migrated medially",0,"It has migrated laterally. (Last's p. 627-8)"],["The Edinger-Westphal nucleus has migrated laterally",0,"It migrated medially, cranial to the somatic oculomotor nucleus. (Last's p. 627-8)"]]},{"id":"cns-828e2321","r":"cns","t":"Brainstem nuclei","y":1,"d":1,"src":"Last's text","s":"Afferent columns of the brainstem (Last's):","o":[["From medial to lateral: visceral, branchial, somatic",1,"The reverse of the motor columns. (Last's p. 628-9)"],["Cochlear and vestibular nuclei form a special somatic group lying farthest laterally",1,"Last's. (Last's p. 628-9)"],["Each afferent column consists of several separate nuclei",0,"Each is a single nuclear mass. (Last's p. 628-9)"],["The dorsal nucleus of the vagus is currently regarded as mixed motor and sensory",0,"Recent authorities regard it as purely motor. (Last's p. 628-9)"]]},{"id":"cns-3b3a3442","r":"cns","t":"Internal capsule","y":1,"d":1,"src":"Last's text","s":"The posterior parts of the internal capsule (Last's):","o":[["Thalamocortical fibres lie beside and behind corticospinal fibres",1,"Last's. (Last's p. 584-5)"],["The retrolentiform part carries the optic radiation",1,"From the lateral geniculate body. (Last's p. 584-5)"],["The sublentiform part carries the optic radiation",0,"It carries the auditory radiation. (Last's p. 584-5)"],["Parieto-, occipito- and temporopontine fibres occupy the medial third of the peduncle base",0,"The lateral third. (Last's p. 584-5)"]]},{"id":"cns-f0ebb402","r":"cns","t":"Third ventricle","y":1,"d":1,"src":"Last's text","s":"The floor of the third ventricle (Last's):","o":[["The median eminence lies at the base of the infundibulum",1,"Part of the tuber cinereum. (Last's p. 594)"],["The supraoptic recess lies between lamina terminalis and chiasma",1,"Last's. (Last's p. 594)"],["The mamillary bodies indent the inside of the ventricle",0,"They make no mark inside. (Last's p. 594)"],["The anterior commissure is a commissure of the neopallium",0,"Of the archaeopallium. (Last's p. 594)"]]},{"id":"cns-75658011","r":"cns","t":"Internal capsule","y":1,"d":1,"s":"Concerning the internal capsule:","o":[["The anterior limb lies between the head of the caudate nucleus and the lentiform nucleus",1,"The anterior limb separates the caudate head medially from the lentiform nucleus laterally. The posterior limb lies between thalamus and lentiform nucleus."],["Corticobulbar (corticonuclear) fibres occupy the genu",1,"Corticonuclear fibres to the motor cranial nerve nuclei lie in the genu."],["In the posterior limb, corticospinal fibres for the lower limb lie anterior to those for the upper limb",0,"In the posterior limb the arrangement runs face/arm (anterior) to leg (posterior)."],["The optic radiation passes through the retrolentiform part",1,"The optic radiation (geniculocalcarine) passes in the retrolentiform part. The auditory radiation passes in the sublentiform part."]]},{"id":"cns-f0bdb2dc","r":"cns","t":"Internal capsule","y":2,"d":1,"s":"Arteries supplying the internal capsule include the:","o":[["Lateral striate (lenticulostriate) branches of the middle cerebral artery",1,"These supply most of the upper parts of both limbs. Their rupture is the classic cause of capsular haemorrhage."],["Anterior inferior cerebellar artery",0,"AICA supplies the lower pons, the inferolateral cerebellum and usually gives the labyrinthine artery. It does not reach the capsule."],["Superior cerebellar artery",0,"It supplies the upper surface of the cerebellum and parts of the midbrain, not the internal capsule."],["Posterior inferior cerebellar artery",0,"PICA supplies the lateral medulla and inferior cerebellum, not the capsule."]],"k":"A"},{"id":"cns-482f6881","r":"cns","t":"Thalamus","y":1,"d":1,"s":"Regarding the thalamic nuclei:","o":[["The ventral posteromedial nucleus receives the trigeminal lemniscus and taste fibres",1,"VPM relays sensation from the face (trigeminothalamic fibres) and taste (from the solitary nucleus) to the postcentral gyrus and insula."],["The ventral lateral nucleus receives fibres from the dentate nucleus of the contralateral cerebellum",1,"Dentatothalamic fibres cross in the superior cerebellar peduncle decussation and relay in VL to the motor cortex."],["The anterior nucleus receives the mammillothalamic tract",1,"The anterior nucleus is part of the Papez circuit and projects to the cingulate gyrus."],["The reticular nucleus projects mainly to the cerebral cortex",0,"The reticular nucleus lies outside the external medullary lamina. Its GABAergic neurones project back to other thalamic nuclei, not to the cortex."]]},{"id":"cns-eda28fd2","r":"cns","t":"Thalamus","y":1,"d":1,"s":"The lateral geniculate body:","o":[["Receives fibres from the temporal retina of the ipsilateral eye",1,"Uncrossed temporal fibres reach the ipsilateral LGB."],["Relays auditory impulses to the transverse temporal gyri",0,"That is the medial geniculate body."],["Has six layers, with crossed fibres ending in layers 1, 4 and 6",1,"Contralateral (crossed nasal) fibres end in layers 1, 4 and 6. Ipsilateral fibres end in 2, 3 and 5."],["Projects to the superior colliculus through the brachium of the superior colliculus",0,"Fibres from the optic tract bypass the LGB to reach the superior colliculus and pretectum through the superior brachium. The LGB projects to the calcarine cortex."]]},{"id":"cns-36d61dca","r":"cns","t":"Basal ganglia","y":1,"d":1,"s":"Concerning the basal nuclei:","o":[["The lentiform nucleus consists of the putamen and globus pallidus",1,"The lentiform (lenticular) nucleus is the putamen laterally plus the globus pallidus medially."],["The corpus striatum includes the caudate nucleus and the lentiform nucleus",1,"Corpus striatum = caudate + lentiform. The striatum (neostriatum) = caudate + putamen."],["The claustrum lies between the external capsule and the extreme capsule",1,"The claustrum is a thin sheet of grey matter between the external capsule (medially) and extreme capsule (laterally), deep to the insula."],["The tail of the caudate nucleus lies in the floor of the inferior horn of the lateral ventricle",0,"The tail of the caudate lies in the roof of the inferior horn. The hippocampus forms the floor."]]},{"id":"cns-ca4dc875","r":"cns","t":"Cerebellum","y":1,"d":1,"s":"Regarding the cerebellar peduncles:","o":[["The inferior cerebellar peduncle carries olivocerebellar fibres",1,"Olivocerebellar (climbing) fibres from the contralateral inferior olive enter through the inferior peduncle."],["The middle cerebellar peduncle carries only afferent pontocerebellar fibres",1,"The middle peduncle is composed of crossed pontocerebellar fibres from the pontine nuclei."],["The superior cerebellar peduncle carries the dorsal spinocerebellar tract",0,"The dorsal spinocerebellar tract enters through the inferior peduncle. The ventral spinocerebellar tract enters through the superior peduncle."],["Efferent fibres from the dentate nucleus decussate in the midbrain at the level of the inferior colliculus",1,"The decussation of the superior cerebellar peduncles is in the caudal midbrain at the level of the inferior colliculi."]]},{"id":"cns-23fe1e2a","r":"cns","t":"Cerebellum","y":2,"d":1,"s":"Concerning the cerebellar cortex and nuclei:","o":[["Granule cells are the only output neurones of the cerebellar cortex",0,"Purkinje cell axons are the sole output of the cortex. Granule cell axons form the parallel fibres within the cortex."],["Purkinje cells are inhibitory (GABAergic)",1,"Purkinje cells inhibit the deep cerebellar and vestibular nuclei."],["The deep nuclei from medial to lateral are dentate, emboliform, globose and fastigial",0,"From medial to lateral the order is fastigial, globose, emboliform, dentate. The dentate is the most lateral."],["Mossy fibres synapse with granule cells in the cerebellar glomeruli",1,"Mossy fibres (pontocerebellar, spinocerebellar, vestibular and others) end on granule cell dendrites in the glomeruli. Climbing fibres from the inferior olive end on Purkinje cells."]],"k":"B"},{"id":"cns-30fcbc8b","r":"cns","t":"Cerebellum","y":1,"d":1,"s":"The flocculonodular lobe:","o":[["Is separated from the body of the cerebellum by the posterolateral fissure",1,"The posterolateral fissure is the first fissure to appear and separates the flocculonodular lobe."],["Is phylogenetically the oldest part (archicerebellum)",1,"It is the vestibulocerebellum."],["Has major connections with the vestibular nuclei",1,"It receives primary and secondary vestibular fibres and projects to the vestibular nuclei, directly and through the fastigial nucleus."],["Is separated from the anterior lobe by the primary fissure",0,"The primary fissure separates the anterior lobe from the posterior (middle) lobe."]]},{"id":"cns-6afabb84","r":"cns","t":"Ventricular system","y":1,"d":1,"s":"Regarding the choroid plexus:","o":[["It is present in the body and inferior horn of the lateral ventricle",1,"The plexus runs along the choroid fissure from the interventricular foramen through the body, atrium (glomus) and inferior horn."],["It is present in the anterior horn of the lateral ventricle",0,"There is no choroid plexus in the anterior (frontal) or posterior (occipital) horns."],["It is present in the roof of the third ventricle",1,"Two strands hang from the tela choroidea in the roof of the third ventricle."],["It is present in the cerebral aqueduct",0,"The aqueduct contains no choroid plexus."]]},{"id":"cns-caf6f858","r":"cns","t":"Ventricular system","y":2,"d":1,"s":"The fourth ventricle:","o":[["Has the facial colliculus in the floor of its medullary part",0,"The facial colliculus is in the pontine part of the floor. The hypoglossal and vagal trigones are in the medullary part."],["Communicates with the subarachnoid space through the median aperture",1,"The foramen of Magendie in the lower roof opens into the cerebellomedullary cistern."],["Communicates directly with the third ventricle through the interventricular foramina",0,"It communicates with the third ventricle through the cerebral aqueduct. The interventricular foramina join the lateral and third ventricles."],["Communicates with the pontine cistern through the lateral apertures",1,"Last's: the lateral apertures (foramina of Luschka) open just behind VIII into the pontine cistern."]],"k":"B"},{"id":"cns-ced606a8","r":"cns","t":"Ventricular system","y":1,"d":1,"s":"Concerning the third ventricle:","o":[["The interventricular foramina lie between the fornix and the anterior pole of the thalamus",1,"Last's: the anterior columns of the fornix form the anterior margins of the interventricular foramina, with the anterior pole of the thalamus behind."],["The optic and infundibular recesses lie in its anterior inferior wall",1,"The optic recess lies above the chiasma, the infundibular recess in the stalk."],["Its lateral walls are formed entirely by the thalamus",0,"The upper lateral wall is thalamus. Below the hypothalamic sulcus it is hypothalamus."],["The pineal recess lies in its posterior wall",1,"The posterior wall has the suprapineal and pineal recesses, with the posterior commissure below and the habenular commissure above the pineal stalk."]]},{"id":"cns-5cd4c126","r":"cns","t":"Hypothalamus and pituitary","y":1,"d":1,"s":"Regarding the hypothalamus:","o":[["The supraoptic and paraventricular nuclei produce vasopressin and oxytocin",1,"Their magnocellular neurones produce ADH and oxytocin, transported down the hypothalamohypophysial tract to the posterior pituitary."],["The suprachiasmatic nucleus receives direct retinal input",1,"The retinohypothalamic tract to the suprachiasmatic nucleus regulates circadian rhythms."],["The fornix ends mainly in the mammillary body",1,"Most postcommissural fornix fibres end in the mammillary body."],["Releasing hormones reach the anterior pituitary via the hypothalamohypophysial nerve tract",0,"Releasing hormones from the arcuate (infundibular) and other nuclei reach the anterior lobe via the hypophysial portal veins, not by axons."]]},{"id":"cns-6e4be541","r":"cns","t":"Cerebral cortex areas","y":1,"d":1,"s":"Concerning functional areas of the cerebral cortex:","o":[["The primary auditory cortex is in the transverse temporal gyri",1,"Heschl's gyri (areas 41 and 42) on the upper surface of the superior temporal gyrus."],["The motor speech area of Broca lies in the inferior frontal gyrus of the dominant he
