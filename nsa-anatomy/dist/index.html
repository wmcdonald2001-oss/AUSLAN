n",0,"It drains to the azygos."],["Each space has two posterior and one anterior vein",0,"One posterior and two anterior."]]},{"id":"th-a905e0d4","r":"th","t":"Superior intercostal artery","y":1,"d":1,"src":"Last's text","s":"At the neck of the first rib, from medial to lateral, lie:","o":[["The sympathetic trunk (stellate ganglion)",1,"Most medial."],["The supreme intercostal vein",1,"Next."],["The superior intercostal artery",1,"Then."],["The internal thoracic artery",0,"T1 anterior ramus is most lateral."]]},{"id":"th-c8d14907","r":"th","t":"Diaphragm","y":1,"d":1,"src":"Last's text","s":"Origins of the diaphragm (Last's):","o":[["The right crus attaches to L1-3",1,"Last's."],["The left crus attaches to L1-2",1,"Last's."],["The medial arcuate ligament is a thickening of the lumbar fascia",0,"Of the psoas fascia; the lateral is lumbar fascia."],["The median arcuate ligament lies at L2",0,"At T12."]]},{"id":"th-463a26eb","r":"th","t":"Diaphragm","y":1,"d":1,"src":"Last's text","s":"Openings of the diaphragm (Last's):","o":[["The vena caval opening transmits the right phrenic nerve",1,"Last's."],["The oesophageal opening transmits the left gastric vessels",1,"And vagal trunks."],["The aortic opening lies at T10",0,"At T12, behind the median arcuate ligament."],["The left phrenic nerve passes through the oesophageal opening",0,"It pierces the muscle of the left dome."]]},{"id":"th-8498e492","r":"th","t":"Diaphragm","y":1,"d":1,"src":"Last's text","s":"Nerve supply of the diaphragm (Last's):","o":[["The phrenic nerves supply it from its abdominal surface",1,"Last's."],["Each half including its crus is supplied by the ipsilateral phrenic",1,"Last's."],["The sling of the right crus around the oesophagus is supplied by the right phrenic",0,"By the left phrenic."],["Its morphology is the outer (external oblique) layer",0,"It is the inner (transversus) layer."]]},{"id":"th-7cb9ca1c","r":"th","t":"Phrenic nerve","y":1,"d":1,"src":"Last's text","s":"The phrenic nerve (Last's):","o":[["It is plastered to scalenus anterior by prevertebral fascia",1,"Last's. (Last's p. 442)"],["About one-third of its fibres are sensory",1,"Last's. (Last's p. 442)"],["It passes lateral to the apex of the lung",0,"Medial. (Last's p. 442)"],["It runs behind the lung root",0,"In front of the lung root. (Last's p. 442)"]]},{"id":"th-36476742","r":"th","t":"Phrenic nerve","y":1,"d":1,"src":"Last's text","s":"Relations of the phrenic nerves in the thorax:","o":[["The right phrenic lies on venous structures throughout",1,"Last's. (Last's p. 442)"],["The left phrenic lies lateral to the left superior intercostal vein",1,"Last's. (Last's p. 442)"],["The phrenic lies behind the vagus",0,"Anterior to the vagus. (Last's p. 442)"],["The left phrenic supplies the visceral serous pericardium",0,"The visceral layer is insensate. (Last's p. 442)"]]},{"id":"th-8fabfa9b","r":"th","t":"Thoracic vagus","y":1,"d":1,"src":"Last's text","s":"The vagus in the thorax (Last's):","o":[["The right vagus is in contact with the trachea",1,"Last's. (Last's p. 442)"],["The anterior vagal trunk carries predominantly left vagal fibres",1,"Last's. (Last's p. 442)"],["Both vagi pass in front of the lung roots",0,"Behind them. (Last's p. 442)"],["The right vagus runs superficial to the azygos arch",0,"Deep to it. (Last's p. 442)"]]},{"id":"th-82cc7e94","r":"th","t":"Cardiac plexus","y":1,"d":1,"src":"Last's text","s":"The cardiac plexus (Last's):","o":[["The superficial plexus lies in front of the ligamentum arteriosum",1,"Last's. (Last's p. 442)"],["The deep plexus lies in front of the left main bronchus",1,"To the right of the ligamentum. (Last's p. 442)"],["The superficial plexus receives the right vagal cervical branches",0,"It receives the left inferior cervical vagal branch and left superior cervical sympathetic branch. (Last's p. 442)"],["Cardiac pain afferents travel only with the vagus",0,"With the sympathetics; vagal afferents serve reflexes. (Last's p. 442)"]]},{"id":"th-3b0177e9","r":"th","t":"Sympathetic trunk","y":1,"d":1,"src":"Last's text","s":"The thoracic sympathetic trunk (Last's):","o":[["It lies on the necks of the ribs",1,"Lateral to the heads. (Last's p. 442)"],["It lies in front of the intercostal vessels and nerves",1,"Last's. (Last's p. 442)"],["It enters the abdomen behind the lateral arcuate ligament",0,"Behind the medial arcuate ligament. (Last's p. 442)"],["It always has 12 ganglia",0,"Up to 12, often fewer from fusion. (Last's p. 442)"]]},{"id":"th-bbabdb20","r":"th","t":"Pleura","y":1,"d":1,"src":"Last's text","s":"Innervation of the pleura and lungs (Last's):","o":[["The visceral pleura is insensate",1,"Last's. (Last's p. 442)"],["The mediastinal pleura is supplied by the phrenic",1,"Last's. (Last's p. 442)"],["The costal pleura is supplied by the phrenic",0,"By intercostal nerves. (Last's p. 442)"],["Sympathetic fibres constrict the bronchi",0,"Sympathetic (T2-6) dilates; vagus constricts. (Last's p. 442)"]]},{"id":"th-09cea4a4","r":"th","t":"Thoracic landmarks","y":1,"d":1,"src":"Last's text","s":"Thoracic vertebral levels (Last's):","o":[["The jugular notch lies at T3",1,"Last's (lower border T2/T3). (Last's p. 442)"],["The sternal angle lies at T4",1,"Last's. (Last's p. 442)"],["The lower end of the sternum lies at T12",0,"At T8. (Last's p. 442)"],["The vena caval opening lies at T12",0,"At T8. (Last's p. 442)"]]},{"id":"th-e8e82d0d","r":"th","t":"Ribs","y":1,"d":1,"src":"Last's text","s":"Typical and atypical ribs (Last's):","o":[["The lower facet on the head articulates with its own vertebra",1,"Last's. (Last's p. 442)"],["The first, eleventh and twelfth ribs have a single facet on the head",1,"Last's. (Last's p. 442)"],["The 11th and 12th ribs have synovial costotransverse joints",0,"Only ligaments, usually no tubercles. (Last's p. 442)"],["The tenth rib is always atypical",0,"Usually typical. (Last's p. 442)"]]},{"id":"th-cd674386","r":"th","t":"Ribs","y":1,"d":1,"src":"Last's text","s":"The first rib (Last's):","o":[["The lower trunk of the brachial plexus lies in the subclavian groove",1,"The artery touches only the outer border. (Last's p. 442)"],["Scalenus anterior attaches to the scalene tubercle",1,"Last's. (Last's p. 442)"],["The subclavian artery lies in its groove",0,"The lower trunk does. (Last's p. 442)"],["Scalenus medius attaches in front of the subclavian vein groove",0,"Between the arterial groove and tubercle. (Last's p. 442)"]]},{"id":"th-0f755e2e","r":"th","t":"Ribs","y":1,"d":1,"src":"Last's text","s":"The second and twelfth ribs:","o":[["The second rib has a tuberosity for serratus anterior",1,"For its first two digitations. (Last's p. 442)"],["The twelfth rib has no angle or costal groove",1,"Last's. (Last's p. 442)"],["The second rib has a tuberosity for scalenus medius",0,"For scalenus posterior. (Last's p. 442)"],["Quadratus lumborum attaches to the lateral part of the twelfth rib",0,"To the medial half of the lower border. (Last's p. 442)"]]},{"id":"th-aaedaff5","r":"th","t":"Thoracic wall muscles","y":1,"d":1,"src":"Last's text","s":"Thoracic wall muscles (Last's):","o":[["Levatores costarum are supplied by posterior rami",1,"Last's. (Last's p. 244-6)"],["Serratus posterior superior inserts lateral to the angles of ribs 2-5",1,"Last's. (Last's p. 244-6)"],["Serratus posterior inferior inserts into ribs 5-8",0,"Ribs 9-12. (Last's p. 244-6)"],["External intercostals extend forward to the sternum",0,"To the costochondral junction, then anterior intercostal membrane. (Last's p. 244-6)"]]},{"id":"th-93ecbe31","r":"th","t":"Thoracic wall muscles","y":1,"d":1,"src":"Last's text","s":"Internal and innermost intercostals (Last's):","o":[["Internal intercostals extend to the side of the sternum",1,"Last's. (Last's p. 244-6)"],["They are replaced posteriorly by the posterior intercostal membrane",1,"From the angle to the superior costotransverse ligament. (Last's p. 244-6)"],["Innermost intercostals are wider above than below",0,"Wider below than above. (Last's p. 244-6)"],["Transversus thoracis arises from the manubrium",0,"From the lower end of the sternum. (Last's p. 244-6)"]]},{"id":"th-f6c83771","r":"th","t":"Oesophagus","y":1,"d":1,"src":"Last's text","s":"Innervation of the oesophagus (Last's):","o":[["The upper striated muscle is supplied from the nucleus ambiguus",1,"Last's. (Last's p. 244-6)"],["The upper part receives sympathetics from the middle cervical ganglion",1,"Via inferior thyroid arteries. (Last's p. 244-6)"],["The lower part receives no sympathetic supply",0,"From the trunks and greater splanchnics. (Last's p. 244-6)"],["Sensation travels only via sympathetic fibres",0,"Vagus (inferior ganglion) and sympathetics. (Last's p. 244-6)"]]},{"id":"th-61812534","r":"th","t":"Phrenic nerve","y":1,"d":1,"s":"Concerning the phrenic nerve:","o":[["It is C3, C4 and C5, mainly C4",1,"Muscle migrated from cervical myotomes into the septum transversum, carrying its nerve."],["It descends on scalenus anterior deep to the prevertebral fascia",1,"The transverse cervical and suprascapular arteries cross it anterior to the fascia."],["The right phrenic nerve passes through the oesophageal opening of the diaphragm",0,"The right nerve passes through the vena caval opening in the central tendon. The left pierces the muscle of the left dome."],["It is accompanied by the pericardiacophrenic artery because it has no regional artery in the mediastinum",1,"Last's."]]},{"id":"th-3f38371f","r":"th","t":"Phrenic nerve","y":2,"d":1,"s":"Sensory fibres of the phrenic nerve supply the:","o":[["Costal pleura",0,"Costal pleura is supplied by the intercostal nerves."],["Fibrous pericardium and parietal serous pericardium",1,"About a third of phrenic fibres are sensory."],["Visceral serous pericardium",0,"Last's: the visceral serous pericardium is insensitive."],["Central parts of the diaphragmatic pleura and peritoneum",1,"The periphery is supplied by the lower intercostal nerves."]],"k":"B"},{"id":"th-a7c05c7e","r":"th","t":"Vagus in thorax","y":1,"d":1,"s":"Regarding the vagi in the thorax:","o":[["The right vagus is in contact with the trachea",1,"Last's: the vagi try to reach the midline. On the left the great arteries hold the nerve away."],["The left vagus crosses the arch of the aorta deep to the left superior intercostal vein",1,"The phrenic lies anterior, the vein crossing between."],["Both vagi pass behind the lung roots",1,"They contribute to the posterior pulmonary plexuses."],["The anterior vagal trunk consists predominantly of right vagal fibres",0,"The anterior trunk is mainly left vagal fibres and the posterior trunk mainly right, reflecting gut rotation."]]},{"id":"th-ec8e6fc1","r":"th","t":"Cardiac plexus","y":2,"d":1,"s":"Concerning the cardiac plexus:","o":[["The superficial part lies in front of the ligamentum arteriosum",1,"The deep part lies to its right, in front of the left main bronchus."],["The superficial part receives the cardiac branch of the left superior cervical sympathetic ganglion",1,"And the inferior cervical cardiac branch of the left vagus."],["Both recurrent laryngeal nerves contribute to the deep part",1,"Last's."],["Cardiac pain fibres travel with the vagus",0,"Cardiac pain travels with sympathetic fibres (cell bodies in upper thoracic DRG). Vagal afferents mediate cardiovascular reflexes."]],"k":"C"},{"id":"th-104252de","r":"th","t":"Sympathetic trunk in thorax","y":1,"d":1,"s":"Regarding the thoracic sympathetic trunk:","o":[["It lies on the necks of the ribs, anterior to the intercostal vessels and nerves",1,"Lateral to the heads of the ribs."],["The greater splanchnic nerve arises from the fifth to ninth ganglia",1,"Lesser from T10 and T11, least from T12."],["It enters the abdomen behind the lateral arcuate ligament",0,"It passes behind the medial arcuate ligament on the front of psoas. The subcostal bundle passes behind the lateral arcuate ligament."],["The least splanchnic nerve relays in a renal ganglion",1,"Last's: an offshoot of the coeliac ganglion behind the renal artery."]]},{"id":"th-0f47c522","r":"th","t":"Sympathectomy","y":2,"d":1,"s":"Concerning sympathectomy:","o":[["White rami communicantes are found on all cervical nerves",0,"White rami exist only from T1 to L2. Every spinal nerve receives a grey ramus."],["Removal of the T1 ganglion risks Horner's syndrome",1,"Last's: never remove T1 in upper limb sympathectomy."],["Sympathetic fibres to the upper limb reach it mainly by running along the subclavian and axillary arteries",0,"Last's: limb vessels get their sympathetic fibres from adjacent peripheral nerves, not from fibres running long distances along the arteries."],["Removal of the L1 ganglion may compromise ejaculation",1,"Last's."]],"k":"B"},{"id":"th-56736349","r":"th","t":"Intercostal spaces","y":1,"d":1,"s":"Regarding the intercostal spaces:","o":[["The neurovascular bundle lies between the internal intercostal and innermost intercostal layers",1,"The plane between the middle and inner layers."],["From above down, the order in the costal groove is vein, artery, nerve",1,"The nerve lies lowest and nearest the skin."],["The first intercostal nerve gives a large lateral cutaneous branch",0,"Last's: the first intercostal nerve has no lateral or anterior cutaneous branch."],["Levatores costarum are supplied by posterior rami",1,"Last's: the only thoracic wall muscles supplied by posterior rami."]]},{"id":"th-65ff21f0","r":"th","t":"Intercostal spaces","y":2,"d":1,"s":"The posterior intercostal arteries of the first two spaces arise from the:","o":[["Superior intercostal artery",1,"A branch of the costocervical trunk (second part of the subclavian)."],["Internal thoracic artery",0,"It gives the anterior intercostal arteries of the upper six spaces."],["Musculophrenic branch of the internal thoracic artery",0,"The musculophrenic artery gives anterior intercostal branches to spaces 7 to 9."],["Descending thoracic aorta",0,"The aorta supplies the remaining nine spaces."]],"k":"A"},{"id":"th-03df8d4e","r":"th","t":"Ribs and joints","y":1,"d":1,"s":"Concerning the costovertebral joints:","o":[["The radiate ligament has three bands, the central one forming the hypochordal bow",1,"Last's: this explains the anterior arch of the atlas."],["The first rib articulates with C7 and T1",0,"Last's: the first rib articulates with T1 only, never with C7."],["The 11th and 12th ribs have no costotransverse synovial joints",1,"They have only ligamentous attachments."],["Every costochondral joint is a primary cartilaginous joint",1,"No movement occurs there."]]},{"id":"th-24ad443c","r":"th","t":"First rib","y":2,"d":1,"s":"Regarding the first rib:","o":[["The subclavian artery lies in the groove on the upper surface, in contact with the bone",0,"Last's: the lower trunk of the brachial plexus lies in the groove. The artery usually lies a little higher, touching only the outer border."],["Scalenus medius inserts into the scalene tubercle",0,"Scalenus anterior inserts into the scalene tubercle. Scalenus medius inserts between the groove and the tubercle of the rib."],["The first costal cartilage forms a synovial joint with the manubrium",0,"It forms a primary cartilaginous joint, so the first ribs and manubrium move as one."],["The subclavian vein lies in contact with the bone in front of the scalene tubercle",1,"In its own groove, in front of scalenus anterior."]],"k":"D"},{"id":"th-ae6d83f1","r":"th","t":"Diaphragm","y":1,"d":1,"s":"Concerning the openings in the diaphragm:","o":[["The aortic opening lies at T12 behind the median arcuate ligament",1,"It transmits the aorta, azygos vein and thoracic duct."],["The oesophageal opening at T10 transmits the vagal trunks",1,"And the oesophageal branches of the left gastric vessels."],["The vena caval opening lies in the left leaf of the central tendon",0,"It lies near the junction of the central and right leaves at T8."],["The splanchnic nerves pierce the crura",1,"Last's."]]},{"id":"th-5be2390a","r":"th","t":"Diaphragm development","y":2,"d":1,"s":"The diaphragm develops from the:","o":[["Septum transversum",1,"It forms the central tendon."],["Pleuroperitoneal membranes",1,"Their failure is the commonest cause of congenital diaphragmatic hernia."],["Third to fifth cervical myotomes",1,"Muscle cells bring the phrenic nerve with them."],["Dorsal mesentery of the oesophagus and body wall mesoderm",1,"Last's lists all four sources."]],"k":"E"},{"id":"th-84d89040","r":"th","t":"Pleura and lungs","y":1,"d":1,"s":"Regarding the nerve supply of the pleura and lungs:","o":[["The parietal pleura of the chest wall is supplied by the intercostal nerves",1,"It is pain-sensitive."],["The visceral pleura has only autonomic supply and is insensitive",1,"Last's."],["Sympathetic fibres to the lungs cause bronchoconstriction",0,"Sympathetic fibres (T2 to T6) are dilator to bronchi. Vagal parasympathetic fibres are constrictor."],["The cough reflex from the bronchi is mediated by vagal afferents",1,"Cell bodies in the inferior vagal ganglion."]]},{"id":"th-8cb54e6a","r":"th","t":"Superior mediastinum","y":2,"d":1,"s":"Concerning the veins of the superior mediastinum:","o":[["The arch of the azygos vein passes superficial to the right vagus and deep to the right phrenic nerve",1,"Last's: the same relationship as the left superior intercostal vein on the left."],["The left superior intercostal vein drains into the left brachiocephalic vein",1,"It drains the second to fourth left spaces."],["In the infant the left brachiocephalic vein may cross the trachea above the jugular notch",1,"Relevant to tracheostomy in children."],["The first intercostal space drains into the superior intercostal vein",0,"The first space drains into the highest (supreme) intercostal vein, which joins the brachiocephalic vein."]],"k":"C"},{"id":"th-4ba71ba5","r":"th","t":"Oesophagus","y":1,"d":1,"s":"Regarding the innervation of the oesophagus:","o":[["The upper striated part is supplied from the nucleus ambiguus",1,"Via the recurrent laryngeal nerves."],["The lower smooth muscle part is supplied from the dorsal motor nucleus of the vagus",1,"Via the oesophageal plexus."],["Its sympathetic supply in the upper part comes from the middle cervical ganglion with the inferior thyroid artery",1,"Last's."],["Pain from the oesophagus is carried only by the vagus",0,"Last's: pain travels with both vagus and sympathetics."]]},{"id":"th-846d2c3f","r":"th","t":"Thorax surface anatomy","y":2,"d":1,"s":"Vertebral levels of thoracic landmarks:","o":[["The jugular notch lies at the level of T3",1,"Last's: jugular notch T3, sternal angle T4 (the T4/5 disc), lower end of sternum T8."],["The sternal angle lies at the level of T4",1,"Last's gives T4 (at the T4/5 disc). It marks the lower limit of the superior mediastinum."],["The lower end of the sternum lies at T8",1,"Last's."],["The plane of the sternal angle marks the lower limit of the superior mediastinum",1,"It passes to the T4/5 disc behind."]],"k":"E"},{"id":"th-bba3683c","r":"th","t":"Development of the heart and great vessels","y":1,"d":1,"s":"Concerning the ductus arteriosus:","o":[["It is derived from the left sixth arch artery",1,"The right dorsal sixth arch disappears, so the right RLN hooks under the subclavian."],["It closes after birth by contraction of its muscular wall",1,"Stimulated by the rise in oxygen tension."],["It becomes the ligamentum venosum",0,"It becomes the ligamentum arteriosum. The ductus venosus becomes the ligamentum venosum."],["The left recurrent laryngeal nerve hooks around it",1,"Lying to its left."]]},{"id":"ul-4e21c8b8","r":"ul","t":"Brachial plexus","y":1,"d":1,"src":"Last's text","s":"The brachial plexus (Last's):","o":[["A prefixed plexus (C4-C8) occurs in about 10%",1,"Last's."],["The divisions lie behind the clavicle",1,"Last's."],["The lateral cord is formed from the lower anterior division",0,"The medial cord; the lateral cord is from the upper two anterior divisions."],["The cords embrace the first part of the axillary artery",0,"They embrace its second part."]]},{"id":"ul-f8731257","r":"ul","t":"Brachial plexus","y":1,"d":1,"src":"Last's text","s":"Branches from the roots and trunks (Last's):","o":[["The dorsal scapular nerve (C5) passes behind the roots",1,"Last's."],["The nerve to subclavius passes in front of the roots",1,"Last's."],["The long thoracic nerve passes in front of the roots",0,"Behind them."],["The suprascapular nerve arises from the lateral cord",0,"From the upper trunk."]]},{"id":"ul-5d29ca01","r":"ul","t":"Brachial plexus","y":1,"d":1,"src":"Last's text","s":"Branches of the cords (Last's):","o":[["The thoracodorsal nerve is C6, 7, 8",1,"Last's."],["The ulnar nerve is C7, 8, T1",1,"Last's."],["The axillary nerve arises from the lateral cord",0,"From the posterior cord."],["The medial cutaneous nerve of the arm arises from the posterior cord",0,"From the medial cord."]]},{"id":"ul-d9af2aa4","r":"ul","t":"Brachial plexus","y":1,"d":1,"src":"Last's text","s":"Nerve supply of muscles (Last's):","o":[["The long thoracic nerve supplies the lowest four digitations of serratus anterior from C7",1,"C5 the first two, C6 the next two."],["Pectoralis major is supplied by all five segments of the plexus",1,"The only muscle to be so."],["The nerve to subclavius never carries phrenic fibres",0,"It may carry an accessory phrenic contribution."],["The dorsal scapular nerve supplies latissimus dorsi",0,"It supplies the rhomboids and often levator scapulae."]]},{"id":"ul-5c29a0bc","r":"ul","t":"Axillary artery","y":1,"d":1,"src":"Last's text","s":"The axillary artery (Last's):","o":[["Its first part has one branch",1,"The superior thoracic."],["Its third part has three branches",1,"Subscapular and two circumflex humerals."],["The lateral thoracic artery arises from the third part",0,"From the second part, with the thoracoacromial."],["It becomes the brachial artery at the lower border of pectoralis minor",0,"At the lower border of teres major."]]},{"id":"ul-8d4db24b","r":"ul","t":"Axillary nerve","y":1,"d":1,"src":"Last's text","s":"The axillary nerve (Last's):","o":[["It passes through the quadrangular space",1,"With the posterior circumflex humeral vessels."],["Its posterior branch supplies teres minor",1,"And becomes the upper lateral cutaneous nerve of the arm."],["It lies below the posterior circumflex humeral vessels",0,"It lies above them."],["It supplies the skin over the upper half of deltoid",0,"Its cutaneous branch supplies skin over the lower half."]]},{"id":"ul-3ef5518a","r":"ul","t":"Axilla","y":1,"d":1,"src":"Last's text","s":"Spaces in the posterior axillary wall:","o":[["The quadrangular space is bounded medially by the long head of triceps",1,"Last's."],["The triangular space (lower) transmits the radial nerve and profunda brachii vessels",1,"Last's."],["The quadrangular space is bounded above by teres major",0,"By teres minor (with subscapularis); teres major is below."],["The circumflex scapular artery passes through the quadrangular space",0,"It passes between subscapularis and teres major in the upper triangular space."]]},{"id":"ul-08ab3edc","r":"ul","t":"Musculocutaneous nerve","y":1,"d":1,"src":"Last's text","s":"The musculocutaneous nerve (Last's):","o":[["It pierces coracobrachialis",1,"Last's."],["It continues as the lateral cutaneous nerve of the forearm",1,"Last's."],["It is the sole supply of brachialis",0,"Brachialis also receives a lateral branch from the radial nerve."],["It pierces the deep fascia medial to the biceps tendon",0,"Lateral to the biceps tendon."]]},{"id":"ul-cade700c","r":"ul","t":"Median nerve","y":1,"d":1,"src":"Last's text","s":"The median nerve (Last's):","o":[["It usually supplies no muscle above the elbow",1,"Unless a high branch to pronator teres."],["It passes between the two heads of pronator teres",1,"Last's."],["In the carpal tunnel it lies medial to the FDS tendons",0,"Lateral to FDS (to middle finger), medial to FCR."],["The palmar cutaneous branch arises within the carpal tunnel",0,"Just above the flexor retinaculum."]]},{"id":"ul-9257cf00","r":"ul","t":"Median nerve","y":1,"d":1,"src":"Last's text","s":"Hand muscles and the median nerve (Last's):","o":[["Flexor pollicis brevis has the most variable innervation of any muscle",1,"Median, ulnar or both."],["Opponens pollicis usually has a double supply",1,"Median and ulnar."],["The median nerve supplies all four lumbricals",0,"It supplies two; the ulnar supplies two."],["The medial and lateral branches of the median nerve arise in the forearm",0,"In the carpal tunnel."]]},{"id":"ul-18b23b0d","r":"ul","t":"Ulnar nerve","y":1,"d":1,"src":"Last's text","s":"The ulnar nerve (Last's):","o":[["It gives no branches in the arm",1,"Last's."],["It pierces the medial intermuscular septum in the lower third of the arm",1,"Last's."],["It passes through the cubital fossa",0,"It does not; the fossa contains median nerve, brachial artery and biceps tendon."],["Its C7 fibres usually come from the middle trunk",0,"From the lateral cord in more than 95%."]]},{"id":"ul-c07c7201","r":"ul","t":"Ulnar nerve","y":1,"d":1,"src":"Last's text","s":"The ulnar nerve at the wrist and hand (Last's):","o":[["It divides into superficial and deep branches on the flexor retinaculum",1,"Beside the pisiform."],["Its superficial branch supplies palmaris brevis",1,"Last's."],["Its C7 fibres supply the interossei",0,"They form the branch to FCU in the forearm."],["Its deep branch passes medial to the hook of hamate without contacting it",0,"It lies on the hook of hamate."]]},{"id":"ul-00d30df1","r":"ul","t":"Radial nerve","y":1,"d":1,"src":"Last's text","s":"The radial nerve (Last's):","o":[["It leaves the axilla through the triangular space",1,"With the profunda brachii vessels."],["The ulnar collateral nerve is the first branch to the medial head of triceps",1,"Last's."],["It pierces the medial intermuscular septum",0,"The lateral septum."],["The posterior interosseous nerve supplies extensor carpi radialis longus",0,"The radial nerve supplies ECRL before giving the PIN."]]},{"id":"ul-c3c6490d","r":"ul","t":"Radial nerve","y":1,"d":1,"src":"Last's text","s":"Radial nerve injury (Last's):","o":[["Sensory loss is usually a coin-shaped area over the first dorsal interosseous",1,"Last's."],["The posterior interosseous nerve passes between the two layers of supinator",1,"Last's."],["Sensory loss covers the whole dorsum of the radial 3.5 digits",0,"It is much smaller due to overlap."],["The PIN supplies brachioradialis",0,"The radial nerve does."]]},{"id":"ul-2898e32e","r":"ul","t":"Wrist","y":1,"d":1,"src":"Last's text","s":"The wrist region (Last's):","o":[["The flexor retinaculum attaches radially to the scaphoid tubercle and trapezium",1,"Last's."],["It attaches medially to the pisiform and hook of hamate",1,"Last's."],["EPL forms the radial boundary of the snuffbox",0,"EPL is the ulnar boundary; APL and EPB the radial."],["The cephalic vein pierces the clavipectoral fascia with the medial pectoral nerve",0,"With the lateral pectoral nerve."]]},{"id":"ul-b99f887d","r":"ul","t":"Thoracodorsal nerve","y":1,"d":1,"src":"Last's text","s":"Posterior cord branches (Last's):","o":[["The lower subscapular nerve supplies teres major",1,"Last's."],["The thoracodorsal nerve enters the deep surface of latissimus dorsi",1,"Last's."],["The thoracodorsal nerve lies behind the thoracodorsal artery as it descends",0,"It comes to lie in front of the artery."],["Latissimus dorsi developed in the flexor compartment",0,"In the extensor compartment."]]},{"id":"ul-48b83a31","r":"ul","t":"Cutaneous nerves","y":1,"d":1,"src":"Last's text","s":"Cutaneous nerves of the arm and forearm (Last's):","o":[["The medial cutaneous nerve of the arm runs with the axillary vein",1,"Last's."],["The medial cutaneous nerve of the forearm runs between axillary artery and vein",1,"Last's."],["The medial and lateral cutaneous nerves of the forearm overlap widely at the anterior axial line",0,"They meet without overlap."],["The posterior cutaneous nerve of the forearm arises from the ulnar nerve",0,"From the radial nerve."]]},{"id":"ul-1446dca2","r":"ul","t":"NSA sample question","y":2,"d":1,"src":"NSA sample","s":"The median nerve","o":[["is found immediately lateral to the biceps tendon in the cubital fossa",0,"From medial to lateral the fossa contains median nerve, brachial artery, biceps tendon. The nerve is medial to the artery, two structures medial to the tendon."],["contains fibres from cervical roots 5, 6, 7 and 8 and thoracic 1",1,"Last's: C5 to T1, from lateral (C5–7) and medial (C8, T1) roots."],["is responsible for flexion of the distal interphalangeal joint of the little finger",0,"The medial half of FDP (ring and little fingers) is supplied by the ulnar nerve."],["is easily exposed in the arm where it is adjacent to the brachial artery by an incision along the medial border of biceps",1,"It runs with the brachial artery along the medial bicipital groove, crossing from lateral to medial of it."]],"k":"B"},{"id":"ul-137793c6","r":"ul","t":"Brachial plexus","y":1,"d":1,"s":"Concerning the brachial plexus:","o":[["The divisions lie behind the clavicle at the outer border of the first rib",1,"Roots and trunks are supraclavicular, the cords infraclavicular."],["The cords are named by their relation to the second part of the axillary artery",1,"They enter above the first part, embrace the second, and give branches around the third."],["A prefixed plexus receives a major contribution from C4 and occurs in about 10%",1,"Last's: prefixed (C4 to C8) and postfixed (C6 to T2) each occur in about 10%."],["The lateral cord is formed by the anterior divisions of the middle and lower trunks",0,"The lateral cord is formed by the anterior divisions of the upper and middle trunks. The medial cord is the anterior division of the lower trunk."]]},{"id":"ul-3a6e1a3a","r":"ul","t":"Brachial plexus","y":2,"d":1,"s":"Branches arising from the roots of the brachial plexus include the:","o":[["Suprascapular nerve",0,"The suprascapular nerve arises from the upper trunk, the only trunk branch."],["Dorsal scapular nerve",1,"C5, passing behind the roots through scalenus medius."],["Lateral pectoral nerve",0,"It arises from the lateral cord."],["Long thoracic nerve",1,"C5, C6 and C7, passing behind the roots."]],"k":"B"},{"id":"ul-8479c5ac","r":"ul","t":"Brachial plexus","y":1,"d":1,"s":"Regarding the root values of branches of the brachial plexus:","o":[["Pectoralis major is the only muscle supplied by all five roots of the plexus",1,"Last's: C5 and C6 to the clavicular head, C7, C8 and T1 to the sternocostal part."],["The thoracodorsal nerve is C6, C7 and C8",1,"It arises from the posterior cord and supplies latissimus dorsi."],["The ulnar nerve receives its C7 fibres from the lateral cord in most people",1,"Last's: in over 95% these come from the lateral cord, otherwise from the middle trunk. They supply FCU."],["The axillary nerve is C7 and C8",0,"The axillary nerve is C5 and C6."]]},{"id":"ul-a7fe610b","r":"ul","t":"Long thoracic nerve","y":2,"d":1,"s":"The long thoracic nerve:","o":[["Is formed by C5 and C6 roots passing through scalenus medius, joined by C7 which descends in front of the muscle",1,"Last's description of its formation."],["Runs down behind the midaxillary line on the surface of serratus anterior",1,"So it lies behind the lateral cutaneous branches of the intercostal nerves and is safe from a midaxillary incision placed in front of it."],["Supplies serratus anterior segmentally, with C7 to the lowest four digitations",1,"C5 to the upper two, C6 to the next two, C7 to the lowest four."],["Passes in front of the roots of the brachial plexus",0,"The dorsal scapular and long thoracic nerves pass behind the roots. The nerve to subclavius passes in front of them."]],"k":"C"},{"id":"ul-6bd821a8","r":"ul","t":"Axilla","y":1,"d":1,"s":"Concerning the axillary artery:","o":[["It is divided into three parts by pectoralis minor",1,"First part above, second behind, third below."],["The superior thoracic artery arises from the first part",1,"One branch from the first part, two from the second, three from the third."],["The lateral thoracic artery arises from the third part",0,"The lateral thoracic and thoracoacromial arteries arise from the second part."],["It becomes the brachial artery at the lower border of teres major",1,"The axillary artery becomes the brachial artery at the lower border of teres major."]]},{"id":"ul-4ff7f731","r":"ul","t":"Axilla","y":2,"d":1,"s":"Structures piercing the clavipectoral fascia include the:","o":[["Cephalic vein",1,"Mnemonic CALL: cephalic vein, acromiothoracic (thoracoacromial) artery, lateral pectoral nerve, lymphatics."],["Medial pectoral nerve",0,"The medial pectoral nerve pierces pectoralis minor."],["Lateral thoracic artery",0,"It follows the lower border of pectoralis minor and does not pierce the clavipectoral fascia."],["Long thoracic nerve",0,"It runs on the surface of serratus anterior, nowhere near the fascia."]],"k":"A"},{"id":"ul-437dba35","r":"ul","t":"Quadrangular and triangular spaces","y":1,"d":1,"s":"Regarding the spaces of the posterior axillary wall:","o":[["The quadrangular space transmits the axillary nerve and posterior circumflex humeral vessels",1,"Bounded by teres minor above, teres major below, long head of triceps medially and the humerus laterally."],["In the quadrangular space the axillary nerve lies below the vessels",0,"Last's: the nerve lies above the vessels, in contact with the surgical neck just below the capsule."],["The triangular space (interval) transmits the radial nerve and profunda brachii vessels",1,"Bounded by teres major above, long head of triceps medially and the humerus laterally."],["The circumflex scapular artery passes through the space bounded by teres minor, teres major and the long head of triceps",1,"This is the upper triangular space, medial to the long head. The quadrangular space lies lateral to the long head."]]},{"id":"ul-b64c8160","r":"ul","t":"Axillary nerve","y":2,"d":1,"s":"The axillary nerve:","o":[["Supplies teres major",0,"Teres major is supplied by the lower subscapular nerve."],["Supplies teres minor through its posterior branch",1,"The posterior branch also supplies part of deltoid and becomes the upper lateral cutaneous nerve of the arm."],["Supplies the skin of the back of the arm down to the elbow",0,"That is the posterior cutaneous nerve of the arm (radial). The axillary nerve supplies skin over the lower half of deltoid."],["Supplies the shoulder joint",1,"It gives an articular branch."]],"k":"B"},{"id":"ul-7c84b68a","r":"ul","t":"Musculocutaneous nerve","y":1,"d":1,"s":"Concerning the musculocutaneous nerve:","o":[["It pierces coracobrachialis",1,"It then slopes down between biceps and brachialis."],["It supplies the lateral part of brachialis",0,"It supplies the main part of brachialis. The lateral part, developed in the extensor compartment, is supplied by the radial nerve."],["It becomes the lateral cutaneous nerve of the forearm lateral to the biceps tendon",1,"It pierces the deep fascia at the elbow flexure crease."],["Its root value is C5, C6 and C7",1,"From the lateral cord."]]},{"id":"ul-ab788847","r":"ul","t":"Cubital fossa","y":1,"d":1,"s":"Within the cubital fossa:","o":[["The median nerve lies medial to the brachial artery",1,"From medial to lateral: median nerve, brachial artery, biceps tendon."],["The ulnar nerve lies medial to the median nerve",0,"Last's: the ulnar nerve does not run in the cubital fossa. It passes behind the medial epicondyle."],["The bicipital aponeurosis separates the median cubital vein from the brachial artery",1,"It protects the artery and median nerve during venepuncture."],["The radial nerve lies in the floor on supinator",0,"The radial nerve lies just lateral to the fossa, in the slit between brachialis and brachioradialis."]]},{"id":"ul-e90ea5e8","r":"ul","t":"Median nerve","y":1,"d":1,"s":"Regarding the median nerve:","o":[["It gives no muscular branches in the arm",1,"Unless the branch to pronator teres arises unusually high."],["It enters the forearm between the two heads of pronator teres",1,"The ulnar head of pronator teres separates it from the ulnar artery."],["Its palmar cutaneous branch passes deep to the flexor retinaculum",0,"It arises just above the retinaculum and passes superficial to it, so it is spared in carpal tunnel syndrome."],["It divides into its branches within the carpal tunnel",1,"Last's: into lateral (with the muscular recurrent branch) and medial branches."]]},{"id":"ul-2f79fb29","r":"ul","t":"Median nerve","y":2,"d":1,"s":"The anterior interosseous nerve supplies:","o":[["Flexor pollicis longus",1,"Deep flexor compartment muscles: FPL, lateral half of FDP and pronator quadratus."],["The wrist and carpal joints",1,"Last's: also the interosseous membrane and periosteum."],["Pronator quadratus",1,"It ends in this muscle."],["The lateral half of flexor digitorum profundus",1,"The part to the index and middle fingers."]],"k":"E"},{"id":"ul-c4dd446e","r":"ul","t":"Carpal tunnel","y":1,"d":1,"s":"Concerning the flexor retinaculum and carpal tunnel:","o":[["The retinaculum is attached to the pisiform and hook of hamate medially",1,"And to the tubercle of scaphoid and ridge of trapezium laterally."],["The median nerve lies lateral to the tendons of FDS and medial to FCR",1,"It lies just beneath the retinaculum, above FPL and FDP."],["The ulnar nerve passes through the carpal tunnel",0,"The ulnar nerve and artery pass superficial to the retinaculum, lateral to the pisiform."],["Flexor pollicis brevis has the most variable nerve supply of any muscle",1,"Last's: median recurrent branch, deep ulnar, or both."]]},{"id":"ul-9833efcc","r":"ul","t":"Ulnar nerve","y":1,"d":1,"s":"Regarding the ulnar nerve:","o":[["It gives no branches in the arm",1,"Last's."],["It pierces the medial intermuscular septum in the lower third of the arm",1,"With the superior ulnar collateral artery and the radial nerve branch to medial head of triceps."],["It enters the forearm between the two heads of flexor carpi ulnaris",1,"Through the cubital tunnel."],["It divides into superficial and deep branches proximal to the wrist crease",0,"It divides on the flexor retinaculum, beside the pisiform. The dorsal branch arises proximal to the wrist."]]},{"id":"ul-7cf72fb0","r":"ul","t":"Ulnar nerve","y":2,"d":1,"s":"The deep branch of the ulnar nerve supplies:","o":[["Adductor pollicis",1,"It ends there."],["All the interossei",1,"Palmar and dorsal."],["The two medial lumbricals",1,"Third and fourth."],["The hypothenar muscles",1,"The deep branch passes between flexor and abductor digiti minimi, through opponens digiti minimi, supplying all three."]],"k":"E"},{"id":"ul-6fbe923a","r":"ul","t":"Radial nerve","y":1,"d":1,"s":"Concerning the radial nerve:","o":[["It gives a branch to the medial head of triceps in the axilla (the ulnar collateral nerve)",1,"This runs with the ulnar nerve."],["The posterior cutaneous nerve of the arm arises before the nerve enters the spiral groove",1,"It supplies the back of the arm."],["It enters the anterior compartment by piercing the lateral intermuscular septum",1,"Then it lies between brachialis and brachioradialis."],["It supplies extensor carpi radialis brevis before dividing",0,"Last's: it supplies brachioradialis and ECRL, then gives the posterior interosseous nerve, which supplies ECRB and supinator."]]},{"id":"ul-e0e331a4","r":"ul","t":"Radial nerve","y":2,"d":1,"s":"Following division of the superficial branch of the radial nerve at the wrist:","o":[["There is wrist drop",0,"The superficial branch is purely sensory."],["Sensory loss is often confined to a small area over the first dorsal interosseous",1,"Last's: much overlap from the median and ulnar nerves."],["There is weakness of extensor pollicis longus",0,"EPL is supplied by the posterior interosseous nerve."],["Sensory loss usually involves the anatomical snuffbox",1,"Cutaneous branches cross the snuffbox tendons."]],"k":"B"},{"id":"ul-c90fb5b3","r":"ul","t":"Anatomical snuffbox","y":1,"d":1,"s":"The anatomical snuffbox:","o":[["Is bounded medially by extensor pollicis longus",1,"And laterally by EPB and APL."],["Has the scaphoid and trapezium in its floor",1,"The radial styloid lies proximally."],["Contains the radial artery",1,"On the floor, deep to the tendons."],["Contains the posterior interosseous nerve",0,"The cephalic vein origin and branches of the superficial radial nerve lie here, not the PIN."]]},{"id":"ul-3275b515","r":"ul","t":"Rotator cuff","y":2,"d":1,"s":"Concerning the shoulder region muscles and nerves:","o":[["The suprascapular nerve passes below the superior transverse scapular ligament",1,"The suprascapular vessels pass above it."],["The suprascapular nerve supplies supraspinatus and infraspinatus",1,"C5 and C6 from the upper trunk."],["Subscapularis is supplied by the upper and lower subscapular nerves",1,"The lower also supplies teres major."],["Teres minor is supplied by the suprascapular nerve",0,"Teres minor is supplied by the axillary nerve."]],"k":"C"},{"id":"ul-c9028dfb","r":"ul","t":"Myotomes upper limb","y":1,"d":1,"s":"Regarding the segmental supply of upper limb movements:","o":[["Shoulder abduction and lateral rotation are C5",1,"Adduction and medial rotation are C6 to C8."],["Elbow flexion is C5 and C6",1,"Elbow extension is C7 and C8."],["Forearm pronation is C6",0,"Supination is C6. Pronation is C7 and C8."],["The intrinsic muscles of the hand are T1",1,"Abductor pollicis brevis is a key T1 test."]]},{"id":"ul-ab2b9183","r":"ul","t":"Dermatomes upper limb","y":2,"d":1,"s":"Regarding the upper limb dermatomes and axial lines:","o":[["The anterior axial line runs from the sternal angle down the front of the limb almost to the wrist",1,"Last's."],["C7 supplies the middle finger",1,"C6 the thumb (and probably index), C8 the ring and little fingers."],["The posterior axial line runs from the vertebra prominens t /* ---------- daily report ---------- */
function dayReport(day) {
  const entries = Object.entries((state.h || {})[day] || {}).filter(([id]) => QBYID[id]).sort((a, b) => a[1].t - b[1].t);
  const wrong = [];
  let total = 0;
  for (const [id, rec] of entries) {
    total += rec.s;
    if (rec.s === 1) continue;
    const q = QBYID[id];
    const lines = [];
    if (q.y === 1) {
      q.o.forEach((o, i) => {
        const yours = rec.a[i];
        const right = o[1] ? 'T' : 'F';
        if (yours !== right) lines.push({ label: T1_LABELS[i], text: o[0], answer: o[1] ? 'True' : 'False', yours: yours === '?' ? 'blank' : (yours === 'T' ? 'True' : 'False'), why: o[2] });
      });
    } else {
      lines.push({ label: 'Key', text: `You chose ${rec.a || 'nothing'}; answer ${q.k} (${KEY_TEXT[q.k]})`, answer: '', yours: '', why: '' });
      q.o.forEach((o, i) => lines.push({ label: String(i + 1), text: o[0], answer: o[1] ? 'True' : 'False', yours: '', why: o[2] }));
    }
    wrong.push({ q, score: rec.s, lines });

  let text = `NSA anatomy ${nice}: ${answered} answered, ${full} fully correct, average ${answered ? pct(total / answered) : '0%'}.`;
  if (wrong.length) {
    text += `\nMissed by region: ${Object.entries(byRegion).map(([r, n]) => `${r} ${n}`).join(', ')}.`;
    for (const w of wrong) {

}

/* ---------- Anki export ---------- */
function mistakesFor(days) {
  const byId = new Map();
  for (const day of days) {
    for (const [id, rec] of Object.entries((state.h || {})[day] || {})) {
      const q = QBYID[id];
      if (!q || rec.s === 1) continue;
      const m = byId.get(id) || { q, idx: new Set() };
      if (q.y === 1) q.o.forEach((o, i) => { if (rec.a[i] !== (o[1] ? 'T' : 'F')) m.idx.add(i); });
      byId.set(id, m);
    }
  }
  return [...byId.values()];
}
function ankiFile(mistakes) {
  const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/[\t\r\n]+/g, ' ');
  const tag = (t) => t.replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '');
  const rows = [];
  for (const { q, idx } of mistakes) {
    const tags = `NSA ${tag(REGION[q.r])} ${tag(q.t)}`;
    if (q.y === 1) {
      for (const i of [...idx].sort()) {
        const o = q.o[i];
        rows.push([`${esc(q.s)}<br><br><b>True or false?</b> ${esc(o[0])}`, `<b>${o[1] ? 'True' : 'False'}</b><br>${esc(o[2])}`, tags, `nsa-${q.id}-${i}`]);
      }
    } else {
      const front = `${esc(q.s)}<br>${q.o.map((o, i) => `${i + 1}. ${esc(o[0])}`).join('<br>')}<br><br><small>${Object.entries(KEY_TEXT).map(([k, v]) => `${k}: ${esc(v)}`).join('<br>')}</small>`;
      const back = `<b>${q.k}: ${esc(KEY_TEXT[q.k])}</b><br>${q.o.map((o, i) => `${i + 1}. ${o[1] ? 'True' : 'False'}: ${esc(o[2])}`).join('<br>')}`;
      rows.push([front, back, tags, `nsa-${q.id}`]);
    }
  }
  const head = ['#separator:tab', '#html:true', '#notetype:Basic', '#deck:NSA anatomy mistakes', '#tags column:3', '#guid column:4'];
  return { text: head.concat(rows.map((r) => r.join('\t'))).join('\n') + '\n', count: rows.length };
}
async function downloadAnki(days, label, statusEl) {
  const { text, count } = ankiFile(mistakesFor(days));
  if (!count) { statusEl.textContent = 'No mistakes to export yet.'; return; }
  const filename = `nsa-anki-${label}.txt`;
  const dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads').catch(() => null) : null;
  try {
    if (dl) await dl.save({ filename, data: text });
    else {
      const a = h('a', { href: URL.createObjectURL(new Blob([text], { type: 'text/plain' })), download: filename });
      document.body.append(a); a.click(); a.remove();
    }
    statusEl.textContent = `${count} cards saved as ${filename}.`;
  } catch (e) {
    statusEl.textContent = e && e.code === 'declined' ? 'Download cancelled.' : 'Download is not available here. Use the copy box instead.';
  }
}
function ankiPanel(day) {
  const status = h('p', { class: 'count', style: 'margin:8px 0 0', 'aria-live': 'polite' });
  const allDays = Object.keys(state.h || {});
  return h('div', { class: 'panel' },
    h('p', { class: 'label', text: 'Anki cards from your mistakes' }),
    h('p', { style: 'margin:0 0 10px', text: 'Each statement you got wrong becomes a card (Type 2 questions become one card with the key). Import the file in Anki with File → Import. Cards keep the same ID, so importing again updates them instead of making duplicates.' }),
    h('div', { class: 'row' },
      h('button', { class: 'btn small primary', text: 'This day\'s mistakes', onclick: () => downloadAnki([day], day, status) }),
      h('button', { class: 'btn small', text: 'All mistakes so far', onclick: () => downloadAnki(allDays, 'all', status) })),
    status);
}

/* ---------- progress ---------- */
let resetArmed = false;
function renderProgress() {
  const area = $('#progress-area');
  const rows = [];
  let seen = 0, totalScore = 0, attempted = 0;
  for (const r of DATA.regions) {
    const qs = DATA.questions.filter((q) => q.r === r.code);
    const tried = qs.filter((q) => state.q[q.id] && state.q[q.id].a);
    const ok = tried.filter((q) => state.q[q.id].l === 1).length;
    const avg = tried.length ? tried.reduce((a, q) => a + state.q[q.id].l, 0) / tried.length : 0;
    seen += tried.length; totalScore += tried.reduce((a, q) => a + state.q[q.id].l, 0); attempted += tried.length;
    rows.push(h('tr', {},
      h('td', { text: r.name }),
      h('td', { class: 'num', text: `${tried.length}/${qs.length}` }),
      h('td', { class: 'meter' }, h('div', { class: 'meterbar', title: `${ok} fully correct, ${tried.length - ok} not` },
        h('span', { class: 'm-ok', style: `width:${qs.length ? ok / qs.length * 100 : 0}%` }),
        h('span', { class: 'm-bad', style: `width:${qs.length ? (tried.length - ok) / qs.length * 100 : 0}%` }))),
      h('td', { class: 'num', text: tried.length ? pct(avg) : '–' })));
  }
  const learned = Object.values(state.c).filter((c) => c.b >= 3).length;
  const reviewed = Object.keys(state.c).length;
  const flagged = Object.values(state.q).filter((q) => q.f).length;
  const resetBox = resetArmed
    ? h('div', { class: 'confirm' }, h('span', { class: 'grow', text: 'Erase all question and flashcard progress on every device?' }),
      h('button', { class: 'btn small', text: 'Cancel', onclick: () => { resetArmed = false; renderProgress(); } }),
      h('button', { class: 'btn small primary', text: 'Erase', onclick: () => { resetArmed = false; state = { v: 1, r: Date.now(), q: {}, c: {}, h: {} }; changed(); } }))
    : h('button', { class: 'btn small ghost', text: 'Reset progress', onclick: () => { resetArmed = true; renderProgress(); } });
  area.replaceChildren(
    h('div', { class: 'panel' },
      h('p', { class: 'label', text: 'Overall' }),
      h('div', { class: 'row' }, h('span', { class: 'big', text: attempted ? pct(totalScore / attempted) : '–' }),
        h('span', { class: 'count', text: `average on your latest attempt at ${seen} of ${DATA.questions.length} questions · ${flagged} flagged` })),
      DATA.cards.length ? h('p', { class: 'count', style: 'margin:8px 0 0', text: `Flashcards: ${reviewed} of ${DATA.cards.length} studied, ${learned} well known (box 3 or higher)` }) : null),
    h('div', { class: 'panel' },
      h('p', { class: 'label', text: 'By region' }),
      h('div', { class: 'table-scroll' }, h('table', { class: 'stats' },
        h('tr', {}, h('th', { text: 'Region' }), h('th', { text: 'Tried' }), h('th', { text: 'Fully correct / not' }), h('th', { text: 'Avg' })), ...rows))),
    h('div', { class: 'panel' }, h('div', { class: 'row' }, h('span', { class: 'grow count', text: 'Progress is kept per person and merges between your laptop and phone when you open this page signed in.' }), resetBox)));
}

/* ---------- format ---------- */
function renderFormat() {
  const t2 = DATA.questions.filter((q) => q.y === 2).length;
  $('#format-area').replaceChildren(
    h('p', { class: 'label', text: 'Exam format' }),
    h('p', { text: 'The NSA Neurosurgery Anatomy Examination is a single paper of 60 multiple choice questions in 100 minutes, based on Last\'s Anatomy, Regional and Applied, 9th edition. The pass mark is 70%.' }),
    h('p', {}, h('b', { text: 'Type 1: ' }), 'a stem with four statements labelled A to D. Mark each statement true or false. Here each statement is worth a quarter of the question.'),
    h('p', {}, h('b', { text: 'Type 2: ' }), 'a stem with four numbered statements, answered with a single letter from the official NSA key below. The whole question is right or wrong.'),
    h('div', { class: 'key', style: 'margin:0 0 10px' }, h('table', {}, ...Object.entries(KEY_TEXT).map(([k, v]) => h('tr', {}, h('td', { text: k }), h('td', { text: v }))))),
    h('p', { class: 'count', text: 'This is the key printed in the NSA examination information document. The four official sample questions are in the bank, marked "Official NSA sample".' }),
    h('p', { class: 'label', style: 'margin-top:14px', text: 'This bank' }),
    h('p', { text: `${DATA.questions.length} questions (${DATA.questions.length - t2} Type 1, ${t2} Type 2) across ${DATA.regions.length} regions${DATA.cards.length ? `, plus ${DATA.cards.length} flashcards from your Last's Anki deck` : ''}. Explanations quote Last's where its wording differs from other textbooks. Questions marked Harder go beyond the NSA level using ABNS primary-exam neuroanatomy (thalamic and basal ganglia circuits, gaze centres, brainstem syndromes); some of that detail is not in Last's. Built ${DATA.built}.` }));
}

/* ---------- tabs & boot ---------- */
const VIEWS = { practice: renderPractice, exam: renderExam, cards: renderCards, today: renderToday, progress: renderProgress, format: renderFormat };
let currentView = 'practice';
function show(view) {
  if (view === 'practice') { renderPracticeFilters(); }
  currentView = view;
  for (const btn of document.querySelectorAll('nav.tabs button')) btn.setAttribute('aria-selected', String(btn.dataset.view === view));
  for (const v of Object.keys(VIEWS)) $(`#view-${v}`).hidden = v !== view;
  if (view !== 'exam') clearInterval(exam.timer);
  VIEWS[view]();
}
for (const btn of document.querySelectorAll('nav.tabs button')) btn.addEventListener('click', () => show(btn.dataset.view));
$('#practice-start').addEventListener('click', () => startPractice());
listeners.add(() => {
  if (currentView === 'practice') { renderPracticeFilters(); renderPractice(); }
  if (currentView === 'progress') renderProgress();
  if (currentView === 'today') renderToday();
});
function renderMeta() {
  const days = Math.ceil((EXAM_DATE - Date.now()) / 86400000);
  $('#meta').textContent = `Last's 9th ed · exam 19 Feb 2027${days > 0 ? ` · ${days} days to go` : ''}`;
}
loadLocal();
renderMeta();
renderPracticeFilters();
renderPractice();
startSync();
</script>
