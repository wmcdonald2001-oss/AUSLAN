nship is the basis of the trans-sphenoidal approach."],["The diaphragma sellae is pierced by the infundibulum",1,"The diaphragma sellae roofs the fossa and is pierced centrally by the pituitary stalk."],["The optic chiasma lies directly within the hypophysial fossa",0,"The chiasma lies above the diaphragma sellae, usually above and slightly behind the tuberculum sellae, not within the fossa."]]},{"id":"sk-ec5f80f7","r":"sk","t":"Orbital walls and fissures","y":1,"d":1,"s":"The inferior orbital fissure:","o":[["Lies between the greater wing of the sphenoid and the orbital surface of the maxilla",1,"It separates the lateral wall (greater wing) from the floor (maxilla and orbital process of palatine)."],["Transmits the zygomatic nerve",1,"The zygomatic branch of the maxillary nerve enters the orbit through the fissure."],["Transmits the infraorbital vessels and nerve",1,"The infraorbital nerve and vessels enter the infraorbital groove from the fissure."],["Transmits the superior ophthalmic vein",0,"The superior ophthalmic vein passes through the superior orbital fissure. Branches of the inferior ophthalmic vein may pass through the inferior fissure to the pterygoid plexus."]]},{"id":"sk-f70f1c18","r":"sk","t":"Medial orbital wall","y":2,"d":1,"s":"The medial wall of the orbit is formed by the:","o":[["Frontal process of the maxilla",1,"It forms the anterior part, including the anterior lacrimal crest."],["Lacrimal bone",1,"The lacrimal bone carries the posterior lacrimal crest."],["Orbital plate (lamina papyracea) of the ethmoid",1,"The paper-thin lamina papyracea forms most of the medial wall and is easily breached by ethmoid infection."],["Orbital surface of the zygomatic bone",0,"The zygomatic bone contributes to the lateral wall and floor, not the medial wall. The body of the sphenoid completes the medial wall posteriorly."]],"k":"C"},{"id":"sk-040a407b","r":"sk","t":"Middle ear walls","y":1,"d":1,"s":"Regarding the walls of the tympanic cavity:","o":[["The promontory on the medial wall is formed by the basal turn of the cochlea",1,"The promontory overlies the first turn of the cochlea and is covered by the tympanic plexus."],["The prominence of the facial canal lies above the oval window on the medial wall",1,"The facial canal runs backward above the oval window, then turns down in the posterior wall."],["The floor separates the cavity from the internal carotid artery",0,"The floor is a thin plate separating the cavity from the bulb of the internal jugular vein. The internal carotid artery is related to the anterior wall."],["The aditus to the mastoid antrum lies in the upper part of the posterior wall",1,"The aditus leads back from the epitympanic recess to the antrum."]]},{"id":"sk-24fa065c","r":"sk","t":"Cranial dura and venous sinuses","y":1,"d":1,"s":"Concerning the cavernous sinus:","o":[["The oculomotor and trochlear nerves lie in its lateral wall",1,"From above down the lateral wall contains III, IV, ophthalmic and maxillary nerves."],["The abducent nerve lies in the lateral wall below the ophthalmic nerve",0,"Last's: VI lies within the sinus, lateral to and then below the ICA. No nerve lies medial to the abducent, and no nerve lies lateral to the trigeminal branches."],["It drains into the superior and inferior petrosal sinuses",1,"It drains posteriorly into the superior petrosal sinus (to the transverse/sigmoid) and inferior petrosal sinus (to the internal jugular vein)."],["It receives the superficial middle cerebral vein",1,"Last's: the superficial middle cerebral vein crosses the subarachnoid space and pierces the roof of the cavernous sinus near the emerging ICA. This is how cavernous thrombosis can spread to the hemisphere."]]},{"id":"sk-37dbb949","r":"sk","t":"Cranial dura and venous sinuses","y":2,"d":1,"s":"The straight sinus:","o":[["Is formed by the union of the inferior sagittal sinus and the great cerebral vein",1,"These join at the anterior end of the junction of falx and tentorium."],["Runs in the line of attachment of the falx cerebri to the tentorium cerebelli",1,"It runs backward in this junction to the internal occipital protuberance."],["Usually becomes continuous with the left transverse sinus",1,"The superior sagittal sinus usually continues as the right transverse sinus, and the straight sinus as the left."],["Slopes gently, at much less than 45 degrees, from front to back",0,"Last's: the straight sinus slopes down steeply, at more than 45 degrees, in the intact dura. Last's also says it receives the inferior sagittal sinus, the great cerebral vein and both basal veins at its anterior end."]],"k":"C"},{"id":"sk-b2015144","r":"sk","t":"Nerve supply of the dura","y":1,"d":1,"s":"Regarding the sensory nerve supply of the cranial dura:","o":[["The upper surface of the tentorium cerebelli is supplied by tentorial branches of the ophthalmic nerve",1,"Last's: the tentorial nerves arise at the anterior end of the cavernous sinus and supply the falx, the vault dura and the upper surface of the tentorium. Its under surface is supplied by IX and X."],["The dura around the margin of the foramen magnum is supplied by the upper three cervical nerves",1,"Last's: the rest of the posterior fossa dura (and the under surface of the tentorium) is supplied by meningeal branches of IX and X. The ring around the foramen magnum is supplied by C1 to C3, which explains suboccipital pain."],["The dura of the middle cranial fossa is supplied mainly by the facial nerve",0,"Last's: the anterior half of the middle fossa dura is supplied by the middle meningeal nerve (V2) and the posterior half by the nervus spinosus (V3)."],["The dura of the anterior cranial fossa receives branches of the anterior ethmoidal nerve",1,"The anterior ethmoidal and other ophthalmic branches supply the anterior fossa dura."]]},{"id":"sk-ea9bba8f","r":"sk","t":"Emissary veins and diploe","y":1,"d":1,"s":"Concerning emissary veins:","o":[["The mastoid emissary vein connects the sigmoid sinus to the posterior auricular or occipital veins",1,"The mastoid emissary vein runs through the mastoid foramen."],["They contain valves that ensure flow is directed outward",0,"Emissary veins are valveless, so flow can occur in either direction. This lets infection spread from scalp to sinuses."],["The parietal emissary vein connects the superior sagittal sinus with veins of the scalp",1,"It passes through the parietal foramen."],["A vein through the hypoglossal canal connects the sigmoid sinus or basilar plexus with the internal jugular vein",1,"The venous plexus of the hypoglossal canal connects intracranial veins with the internal jugular vein."]]},{"id":"sk-c2fbf202","r":"sk","t":"Occipital bone","y":1,"d":1,"s":"Regarding the occipital bone:","o":[["The hypoglossal canal lies above the anterior part of the occipital condyle",1,"The canal pierces the bone above the anterior part of each condyle."],["The condylar canal, when present, transmits an emissary vein from the sigmoid sinus",1,"The posterior condylar canal in the condylar fossa transmits an emissary vein."],["The basiocciput gives attachment to the pharyngobasilar fascia at the pharyngeal tubercle",1,"The pharyngeal tubercle gives attachment to the median raphe of the superior constrictor."],["The alar ligaments attach to the anterior margin of the foramen magnum",0,"The apical ligament attaches to the anterior margin (basion). The alar ligaments attach to the medial sides of the occipital condyles."]]},{"id":"sk-c59cbef5","r":"sk","t":"Nasal cavity lateral wall","y":1,"d":1,"s":"Concerning the lateral wall of the nasal cavity:","o":[["The nasolacrimal duct opens into the inferior meatus",1,"The nasolacrimal duct opens into the anterior part of the inferior meatus, guarded by a mucosal fold (valve of Hasner)."],["The maxillary sinus opens into the hiatus semilunaris of the middle meatus",1,"The maxillary ostium is high on its medial wall, opening into the posterior part of the hiatus semilunaris. Hence poor gravitational drainage."],["The posterior ethmoidal air cells open into the middle meatus",0,"Posterior ethmoidal cells open into the superior meatus. Anterior and middle cells open into the middle meatus."],["The sphenoidal sinus opens into the sphenoethmoidal recess",1,"The sphenoidal sinus drains into the sphenoethmoidal recess above the superior concha."]]},{"id":"sk-5a9edbab","r":"sk","t":"Paranasal sinuses","y":2,"d":1,"s":"Regarding the paranasal sinuses:","o":[["The sphenoidal sinus is well developed at birth",0,"It is rudimentary at birth and develops mainly after puberty."],["The maxillary sinus opens into the inferior meatus",0,"It opens high on its medial wall into the posterior end of the hiatus semilunaris of the middle meatus."],["The posterior ethmoidal air cells open into the middle meatus",0,"They open into the superior meatus."],["The infraorbital nerve runs in the roof of the maxillary sinus",1,"In its groove and canal in the floor of the orbit."]],"k":"D"},{"id":"sp-619e1928","r":"sp","t":"NSA sample question","y":2,"d":1,"src":"NSA sample","s":"The spinal dura mater","o":[["has denticulate ligament attaching down to S2 level",0,"The denticulate ligament is pia mater. Its lowest denticulation is at the L1 root (Last's). It is the dural sac that ends at S2."],["is a prolongation of the inner layer of the dura mater of the posterior cranial fossa",1,"Last's: the outer (periosteal) layer does not continue below the foramen magnum."],["is attached to the spinal arachnoid by web-like processes which are well developed to form an anterior median septum",0,"The web-like strands run from arachnoid to pia, not dura, and they form an incomplete posterior median septum."],["is surrounded by a layer of fat in which lies the internal vertebral venous plexus",1,"The extradural (epidural) space contains fat and the internal vertebral plexus."]],"k":"B"},{"id":"sp-bc618ef1","r":"sp","t":"Atlas and axis","y":1,"d":1,"s":"Concerning the atlas:","o":[["It has no body",1,"Its body has fused with the axis to form the dens."],["The vertebral artery grooves the upper surface of its posterior arch",1,"The artery and the C1 nerve (suboccipital nerve) lie in the groove behind the lateral mass."],["Its transverse process is palpable between the mastoid process and the angle of the mandible",1,"The tip of the large transverse process of the atlas is palpable there."],["The transverse ligament attaches to the anterior tubercle",0,"The transverse ligament attaches to tubercles on the medial sides of the lateral masses, holding the dens against the anterior arch. The anterior tubercle gives attachment to longus colli."]]},{"id":"sp-e9096a50","r":"sp","t":"Craniovertebral ligaments","y":1,"d":1,"s":"Regarding the ligaments of the craniovertebral junction:","o":[["The apical ligament of the dens is a remnant of the notochord",1,"The apical ligament runs from the tip of the dens to the anterior margin of the foramen magnum."],["The alar ligaments attach the dens to the medial sides of the occipital condyles and limit rotation",1,"They are strong and check rotation and lateral flexion."],["The tectorial membrane is the upward continuation of the anterior longitudinal ligament",0,"The tectorial membrane continues the posterior longitudinal ligament up to the basiocciput. The anterior longitudinal ligament continues as the anterior atlanto-occipital membrane."],["The vertebral artery pierces the posterior atlanto-occipital membrane",1,"The artery and C1 nerve pass beneath the lower free border of the membrane, which may ossify to form a ponticulus posticus."]]},{"id":"sp-878d6ceb","r":"sp","t":"Craniovertebral joints","y":2,"d":1,"s":"Concerning movements of the craniovertebral joints:","o":[["Flexion and extension of the head occur mainly at the atlanto-occipital joints",1,"Last's: the atlanto-occipital joint allows nodding (flexion and extension) and some abduction, but no rotation, because the condyles form an egg-shaped ball."],["Rotation of the head occurs mainly at the atlanto-axial joints",1,"The atlas and skull rotate on the axis around the dens."],["The atlanto-axial joints comprise one median and two lateral synovial joints",1,"Median: dens with anterior arch and transverse ligament. Lateral: between the lateral masses."],["There is an intervertebral disc between the atlas and the axis",0,"There is no intervertebral disc between C1 and C2, or between the occiput and C1. The first disc is C2/3."]],"k":"C"},{"id":"sp-15af76c6","r":"sp","t":"Cervical vertebrae","y":1,"d":1,"s":"Regarding the cervical vertebrae:","o":[["The vertebral artery usually enters the foramen transversarium of C6",1,"The foramen of C7 usually transmits only the vertebral vein (and sometimes an accessory vein)."],["The anterior tubercle of the transverse process of C6 is the carotid tubercle",1,"The common carotid can be compressed against it. It is also a landmark for the stellate ganglion block and the inferior thyroid artery."],["Uncovertebral joints occur between C1 and C2",0,"Last's: the uncus on the upper surface of C3 to T1 bodies may appear to form a joint (of Luschka) because a small cavity develops. These are not true synovial joints but result from degenerative change in the disc."],["The spines of C3 to C6 are usually bifid",1,"C2 to C6 spines are usually bifid. C7 (vertebra prominens) has a long non-bifid spine."]]},{"id":"sp-f497a60e","r":"sp","t":"Thoracic vertebrae","y":2,"d":1,"s":"Concerning the costovertebral articulations:","o":[["The head of a typical rib articulates with the bodies of its own and the vertebra above",1,"Hence demifacets on typical thoracic vertebrae."],["The first rib articulates with T1 only",1,"T1 has a complete facet for rib 1 and a demifacet for rib 2."],["The tubercle of a typical rib articulates with the transverse process of the vertebra of the same number",1,"A typical rib, e.g. rib 6, articulates with T5 and T6 bodies and the T6 transverse process."],["The 11th and 12th ribs articulate with the transverse processes of their own vertebrae",0,"Ribs 11 and 12 have no tubercles and no costotransverse joints."]],"k":"C"},{"id":"sp-ff31576f","r":"sp","t":"Lumbar vertebrae and sacrum","y":1,"d":1,"s":"Regarding the lumbar vertebrae and sacrum:","o":[["The mammillary process is on the posterior border of the superior articular process",1,"Mammillary processes give attachment to multifidus. Accessory processes lie at the root of the transverse process."],["The iliolumbar ligament attaches to the transverse process of L5",1,"It runs from the tip of the L5 transverse process to the iliac crest."],["The sacral hiatus results from failure of fusion of the laminae of S5",1,"Sometimes S4 too. It is bounded by the sacral cornua and used for caudal epidural injection."],["The dural sac in the adult ends at the level of L5",0,"The dural and arachnoid sac ends at about S2."]]},{"id":"sp-0be7cf2e","r":"sp","t":"Intervertebral discs and ligaments","y":1,"d":1,"s":"Concerning the intervertebral discs and ligaments:","o":[["The nucleus pulposus is derived from the notochord",1,"The nucleus pulposus is a notochordal remnant. The annulus fibrosus is from sclerotome."],["A posterolateral L4/5 disc protrusion usually compresses the L5 nerve root",1,"Last's rule: a posterolateral herniation irritates the root one below the disc (L4 disc to L5 root, L5 disc to S1, C6 disc to C7). The root of the same number has already left, hugging its pedicle."],["The ligamentum flavum is composed mainly of collagen",0,"The ligamenta flava are composed mainly of yellow elastic tissue."],["The posterior longitudinal ligament is broad over the vertebral bodies and narrow over the discs",0,"It is the reverse. The PLL is narrow over the bodies (where basivertebral veins exit) and broad, denticulate and attached over the discs. Its weakness posterolaterally favours posterolateral herniation."]]},{"id":"sp-1bd7b4a8","r":"sp","t":"Spinal nerves and foramina","y":1,"d":1,"s":"Regarding the spinal nerves:","o":[["There are 31 pairs: 8 cervical, 12 thoracic, 5 lumbar, 5 sacral and 1 coccygeal",1,"Standard numbers."],["The C5 nerve emerges between C5 and C6 vertebrae",0,"Cervical nerves C1 to C7 emerge above their vertebrae, so C5 emerges between C4 and C5. C8 emerges between C7 and T1."],["The dorsal root ganglion lies in the intervertebral foramen",1,"Except in the sacral and coccygeal nerves, where the ganglia lie in the sacral canal."],["The dorsal root ganglion contains synapses between primary and secondary sensory neurones",0,"The ganglion contains pseudounipolar cell bodies. There are no synapses in it."]]},{"id":"sp-6f622088","r":"sp","t":"Dorsal rami","y":1,"d":1,"s":"Concerning the posterior (dorsal) rami of spinal nerves:","o":[["The dorsal ramus of C1 has no cutaneous branch",1,"The suboccipital nerve is purely motor to the suboccipital muscles."],["The dorsal rami of C7, C8, L4 and L5 usually do not reach the skin",1,"Last's principles of body wall innervation."],["Dorsal rami supply the skin of the posterior surface of the upper limb",0,"No dorsal ramus ever supplies the skin or muscle of a limb."],["In the upper half of the body the medial branch reaches the skin",1,"In the upper half the medial branches are cutaneous. In the lower half the lateral branches are."]]},{"id":"sp-4a170e6e","r":"sp","t":"Suboccipital region","y":1,"d":1,"s":"Concerning the suboccipital triangle:","o":[["It is bounded by rectus capitis posterior major, obliquus capitis superior and obliquus capitis inferior",1,"These form its three sides."],["Its floor is formed by the posterior atlanto-occipital membrane and posterior arch of atlas",1,"The vertebral artery lies on the posterior arch in the floor."],["The greater occipital nerve is the dorsal ramus of C1",0,"The greater occipital nerve is the medial branch of the dorsal ramus of C2. It winds around the lower border of obliquus inferior and pierces semispinalis capitis and trapezius."],["The suboccipital nerve supplies all the muscles bounding the triangle and rectus capitis posterior minor",1,"It also supplies semispinalis capitis in part."]]},{"id":"sp-8455e42f","r":"sp","t":"Muscles of the back","y":2,"d":1,"s":"The erector spinae:","o":[["Includes multifidus",0,"Multifidus belongs to the transversospinalis group, deep to erector spinae."],["Is supplied by anterior rami",0,"All the intrinsic back muscles are supplied by posterior (dorsal) rami."],["Has spinalis as its most lateral column",0,"Iliocostalis is lateral, longissimus intermediate, spinalis medial."],["Arises from a common origin on the sacrum, iliac crest and lumbar spines",1,"Last's: from a thick tendon deep to the lumbar fascia, diverging into iliocostalis and longissimus."]],"k":"D"},{"id":"sp-978e8d57","r":"sp","t":"Ligamentum nuchae and superficial back","y":1,"d":1,"s":"The ligamentum nuchae:","o":[["Extends from the external occipital protuberance to the spine of C7",1,"It is a median fibrous septum attached to the external occipital crest and the cervical spines."],["Gives origin to trapezius",1,"Also to splenius capitis, rhomboid minor and serratus posterior superior."],["Gives origin to levator scapulae",0,"Levator scapulae arises from the transverse processes of C1 to C4."],["Is homologous with the supraspinous ligament",1,"It continues the supraspinous ligament above C7."]]},{"id":"sp-08493ff7","r":"sp","t":"Vertebral venous plexus","y":2,"d":1,"s":"The internal vertebral venous plexus:","o":[["Lies in the extradural space",1,"It lies in the epidural fat between dura and bone."],["Is valveless",1,"Hence a route for metastasis, for example from prostate to vertebrae and skull."],["Communicates with the cranial dural venous sinuses through the foramen magnum",1,"It connects with the basilar plexus and occipital sinus."],["Receives the basivertebral veins from the vertebral bodies",1,"These emerge from the back of each body beneath the posterior longitudinal ligament."]],"k":"E"},{"id":"sp-7077dbcd","r":"sp","t":"Lumbar puncture","y":1,"d":1,"s":"In a lumbar puncture in an adult:","o":[["The line joining the highest points of the iliac crests usually crosses the L4 spine or the L4/5 interspace",1,"This intercristal (Tuffier's) line is the main landmark."],["The needle passes through the ligamentum flavum before the epidural space",1,"Skin, subcutaneous tissue, supraspinous ligament, interspinous ligament, ligamentum flavum, epidural space, dura, arachnoid."],["The needle must penetrate the pia mater to enter the subarachnoid space",0,"The pia invests the cord and roots. The subarachnoid space lies between arachnoid and pia."],["Puncture at L1/2 is safe because the cord ends at L3",0,"The adult cord usually ends at L1/2, so punctures are performed at L3/4 or L4/5. The L3 level applies at birth."]]},{"id":"sp-6d011f4c","r":"sp","t":"Dermatomes","y":1,"d":1,"s":"Concerning dermatomes:","o":[["C6 supplies the thumb",1,"C6 supplies the lateral forearm and thumb, C7 the middle finger, C8 the little finger."],["T10 supplies the umbilicus",1,"T4/5 nipple, T7 subcostal angle, T10 umbilicus."],["L4 supplies the medial side of the leg",1,"L4 supplies the medial leg and medial malleolus region."],["S1 supplies the skin over the medial malleolus",0,"S1 supplies the lateral ankle, lateral dorsum and sole of the foot and the little toe."]]},{"id":"sp-bfd6b553","r":"sp","t":"Dermatomes","y":2,"d":1,"s":"Regarding axial lines and dermatomes:","o":[["An axial line is a junction between dermatomes supplied from discontinuous spinal levels",1,"For example C5 and T1 on the front of the arm."],["There is no cutaneous area supplied by C1",1,"C1 has no cutaneous branch."],["The posterior two-thirds of the scrotum is supplied by S3",1,"The anterior third is supplied by L1, an example of an axial line in the perineum."],["Division of a single intercostal nerve produces a band of anaesthesia on the trunk",0,"Overlap between adjacent dermatomes means single-nerve division usually produces no anaesthesia, except across axial lines."]],"k":"C"},{"id":"sp-70b8ee05","r":"sp","t":"Myotomes and reflexes","y":1,"d":1,"s":"Regarding myotomes and tendon reflexes:","o":[["The biceps jerk is mediated by C5 and C6",1,"Biceps C5/6, triceps C7, knee L3/4, ankle S1."],["The knee jerk is mediated mainly by L3 and L4",1,"Via the femoral nerve to quadriceps."],["Extension of the great toe is a good test of the L5 myotome",1,"Extensor hallucis longus is a clean L5 test."],["The ankle jerk is mediated mainly by L4",0,"The ankle jerk is mediated by S1 (and S2)."]]},{"id":"sp-edd2de34","r":"sp","t":"Myotomes and reflexes","y":2,"d":1,"s":"Movements and their main segmental supply:","o":[["Shoulder abduction and lateral rotation, C5",1,"Deltoid, supraspinatus, infraspinatus and teres minor."],["Hip flexion, L4 and L5",0,"Hip flexion and adduction are L2 and L3. Hip extension and abduction are L4 and L5."],["Ankle plantarflexion, L4 and L5",0,"Plantarflexion is S1 and S2. Dorsiflexion is L4 and L5."],["Knee extension, L5 and S1",0,"Knee extension (quadriceps) is L3 and L4. Knee flexion is L5 and S1."]],"k":"A"},{"id":"sp-3e660f40","r":"sp","t":"Spinal meninges","y":1,"d":1,"s":"Concerning the spinal meninges:","o":[["The spinal dura is separated from the vertebral periosteum by an epidural space containing fat and veins",1,"Unlike the cranial dura, which is fused to the periosteum."],["The spinal dura is firmly attached to the margin of the foramen magnum",1,"It is also attached to the backs of C2 and C3 bodies and to the posterior longitudinal ligament."],["The dural sleeves of the spinal nerves end at the dorsal root ganglia, becoming continuous with the epineurium",1,"The dura fuses with the epineurium at the intervertebral foramen."],["The subarachnoid space ends at the conus medullaris",0,"It extends to S2, containing the cauda equina, which is the space sampled in lumbar puncture."]]},{"id":"sp-f0f14065","r":"sp","t":"Development of the vertebral column","y":2,"d":1,"s":"Concerning development and the vertebral column of the child:","o":[["The spinal cord ends at about L3 at birth",1,"It ascends relatively to L1/2 as the vertebral column grows faster than the cord."],["The cervical curvature becomes a secondary ventral convexity when the infant holds up its head",1,"The lumbar curvature develops when the infant starts to walk."],["The fetal vertebral column is C-shaped and concave ventrally",1,"The primary curvature is a ventral concavity, retained in the thoracic and sacral regions."],["The nucleus pulposus is derived from sclerotome",0,"The nucleus pulposus is notochordal. The vertebral bodies and annulus fibrosus come from sclerotome."]],"k":"C"},{"id":"th-61812534","r":"th","t":"Phrenic nerve","y":1,"d":1,"s":"Concerning the phrenic nerve:","o":[["It is C3, C4 and C5, mainly C4",1,"Muscle migrated from cervical myotomes into the septum transversum, carrying its nerve."],["It descends on scalenus anterior deep to the prevertebral fascia",1,"The transverse cervical and suprascapular arteries cross it anterior to the fascia."],["The right phrenic nerve passes through the oesophageal opening of the diaphragm",0,"The right nerve passes through the vena caval opening in the central tendon. The left pierces the muscle of the left dome."],["It is accompanied by the pericardiacophrenic artery because it has no regional artery in the mediastinum",1,"Last's."]]},{"id":"th-3f38371f","r":"th","t":"Phrenic nerve","y":2,"d":1,"s":"Sensory fibres of the phrenic nerve supply the:","o":[["Costal pleura",0,"Costal pleura is supplied by the intercostal nerves."],["Fibrous pericardium and parietal serous pericardium",1,"About a third of phrenic fibres are sensory."],["Visceral serous pericardium",0,"Last's: the visceral serous pericardium is insensitive."],["Central parts of the diaphragmatic pleura and peritoneum",1,"The periphery is supplied by the lower intercostal nerves."]],"k":"B"},{"id":"th-a7c05c7e","r":"th","t":"Vagus in thorax","y":1,"d":1,"s":"Regarding the vagi in the thorax:","o":[["The right vagus is in contact with the trachea",1,"Last's: the vagi try to reach the midline. On the left the great arteries hold the nerve away."],["The left vagus crosses the arch of the aorta deep to the left superior intercostal vein",1,"The phrenic lies anterior, the vein crossing between."],["Both vagi pass behind the lung roots",1,"They contribute to the posterior pulmonary plexuses."],["The anterior vagal trunk consists predominantly of right vagal fibres",0,"The anterior trunk is mainly left vagal fibres and the posterior trunk mainly right, reflecting gut rotation."]]},{"id":"th-ec8e6fc1","r":"th","t":"Cardiac plexus","y":2,"d":1,"s":"Concerning the cardiac plexus:","o":[["The superficial part lies in front of the ligamentum arteriosum",1,"The deep part lies to its right, in front of the left main bronchus."],["The superficial part receives the cardiac branch of the left superior cervical sympathetic ganglion",1,"And the inferior cervical cardiac branch of the left vagus."],["Both recurrent laryngeal nerves contribute to the deep part",1,"Last's."],["Cardiac pain fibres travel with the vagus",0,"Cardiac pain travels with sympathetic fibres (cell bodies in upper thoracic DRG). Vagal afferents mediate cardiovascular reflexes."]],"k":"C"},{"id":"th-104252de","r":"th","t":"Sympathetic trunk in thorax","y":1,"d":1,"s":"Regarding the thoracic sympathetic trunk:","o":[["It lies on the necks of the ribs, anterior to the intercostal vessels and nerves",1,"Lateral to the heads of the ribs."],["The greater splanchnic nerve arises from the fifth to ninth ganglia",1,"Lesser from T10 and T11, least from T12."],["It enters the abdomen behind the lateral arcuate ligament",0,"It passes behind the medial arcuate ligament on the front of psoas. The subcostal bundle passes behind the lateral arcuate ligament."],["The least splanchnic nerve relays in a renal ganglion",1,"Last's: an offshoot of the coeliac ganglion behind the renal artery."]]},{"id":"th-0f47c522","r":"th","t":"Sympathectomy","y":2,"d":1,"s":"Concerning sympathectomy:","o":[["White rami communicantes are found on all cervical nerves",0,"White rami exist only from T1 to L2. Every spinal nerve receives a grey ramus."],["Removal of the T1 ganglion risks Horner's syndrome",1,"Last's: never remove T1 in upper limb sympathectomy."],["Sympathetic fibres to the upper limb reach it mainly by running along the subclavian and axillary arteries",0,"Last's: limb vessels get their sympathetic fibres from adjacent peripheral nerves, not from fibres running long distances along the arteries."],["Removal of the L1 ganglion may compromise ejaculation",1,"Last's."]],"k":"B"},{"id":"th-56736349","r":"th","t":"Intercostal spaces","y":1,"d":1,"s":"Regarding the intercostal spaces:","o":[["The neurovascular bundle lies between the internal intercostal and innermost intercostal layers",1,"The plane between the middle and inner layers."],["From above down, the order in the costal groove is vein, artery, nerve",1,"The nerve lies lowest and nearest the skin."],["The first intercostal nerve gives a large lateral cutaneous branch",0,"Last's: the first intercostal nerve has no lateral or anterior cutaneous branch."],["Levatores costarum are supplied by posterior rami",1,"Last's: the only thoracic wall muscles supplied by posterior rami."]]},{"id":"th-65ff21f0","r":"th","t":"Intercostal spaces","y":2,"d":1,"s":"The posterior intercostal arteries of the first two spaces arise from the:","o":[["Superior intercostal artery",1,"A branch of the costocervical trunk (second part of the subclavian)."],["Internal thoracic artery",0,"It gives the anterior intercostal arteries of the upper six spaces."],["Musculophrenic branch of the internal thoracic artery",0,"The musculophrenic artery gives anterior intercostal branches to spaces 7 to 9."],["Descending thoracic aorta",0,"The aorta supplies the remaining nine spaces."]],"k":"A"},{"id":"th-03df8d4e","r":"th","t":"Ribs and joints","y":1,"d":1,"s":"Concerning the costovertebral joints:","o":[["The radiate ligament has three bands, the central one forming the hypochordal bow",1,"Last's: this explains the anterior arch of the atlas."],["The first rib articulates with C7 and T1",0,"Last's: the first rib articulates with T1 only, never with C7."],["The 11th and 12th ribs have no costotransverse synovial joints",1,"They have only ligamentous attachments."],["Every costochondral joint is a primary cartilaginous joint",1,"No movement occurs there."]]},{"id":"th-24ad443c","r":"th","t":"First rib","y":2,"d":1,"s":"Regarding the first rib:","o":[["The subclavian artery lies in the groove on the upper surface, in contact with the bone",0,"Last's: the lower trunk of the brachial plexus lies in the groove. The artery usually lies a little higher, touching only the outer border."],["Scalenus medius inserts into the scalene tubercle",0,"Scalenus anterior inserts into the scalene tubercle. Scalenus medius inserts between the groove and the tubercle of the rib."],["The first costal cartilage forms a synovial joint with the manubrium",0,"It forms a primary cartilaginous joint, so the first ribs and manubrium move as one."],["The subclavian vein lies in contact with the bone in front of the scalene tubercle",1,"In its own groove, in front of scalenus anterior."]],"k":"D"},{"id":"th-ae6d83f1","r":"th","t":"Diaphragm","y":1,"d":1,"s":"Concerning the openings in the diaphragm:","o":[["The aortic opening lies at T12 behind the median arcuate ligament",1,"It transmits the aorta, azygos vein and thoracic duct."],["The oesophageal opening at T10 transmits the vagal trunks",1,"And the oesophageal branches of the left gastric vessels."],["The vena caval opening lies in the left leaf of the central tendon",0,"It lies near the junction of the central and right leaves at T8."],["The splanchnic nerves pierce the crura",1,"Last's."]]},{"id":"th-5be2390a","r":"th","t":"Diaphragm development","y":2,"d":1,"s":"The diaphragm develops from the:","o":[["Septum transversum",1,"It forms the central tendon."],["Pleuroperitoneal membranes",1,"Their failure is the commonest cause of congenital diaphragmatic hernia."],["Third to fifth cervical myotomes",1,"Muscle cells bring the phrenic nerve with them."],["Dorsal mesentery of the oesophagus and body wall mesoderm",1,"Last's lists all four sources."]],"k":"E"},{"id":"th-84d89040","r":"th","t":"Pleura and lungs","y":1,"d":1,"s":"Regarding the nerve supply of the pleura and lungs:","o":[["The parietal pleura of the chest wall is supplied by the intercostal nerves",1,"It is pain-sensitive."],["The visceral pleura has only autonomic supply and is insensitive",1,"Last's."],["Sympathetic fibres to the lungs cause bronchoconstriction",0,"Sympathetic fibres (T2 to T6) are dilator to bronchi. Vagal parasympathetic fibres are constrictor."],["The cough reflex from the bronchi is mediated by vagal afferents",1,"Cell bodies in the inferior vagal ganglion."]]},{"id":"th-8cb54e6a","r":"th","t":"Superior mediastinum","y":2,"d":1,"s":"Concerning the veins of the superior mediastinum:","o":[["The arch of the azygos vein passes superficial to the right vagus and deep to the right phrenic nerve",1,"Last's: the same relationship as the left superior intercostal vein on the left."],["The left superior intercostal vein drains into the left brachiocephalic vein",1,"It drains the second to fourth left spaces."],["In the infant the left brachiocephalic vein may cross the trachea above the jugular notch",1,"Relevant to tracheostomy in children."],["The first intercostal space drains into the superior intercostal vein",0,"The first space drains into the highest (supreme) intercostal vein, which joins the brachiocephalic vein."]],"k":"C"},{"id":"th-4ba71ba5","r":"th","t":"Oesophagus","y":1,"d":1,"s":"Regarding the innervation of the oesophagus:","o":[["The upper striated part is supplied from the nucleus ambiguus",1,"Via the recurrent laryngeal nerves."],["The lower smooth muscle part is supplied from the dorsal motor nucleus of the vagus",1,"Via the oesophageal plexus."],["Its sympathetic supply in the upper part comes from the middle cervical ganglion with the inferior thyroid artery",1,"Last's."],["Pain from the oesophagus is carried only by the vagus",0,"Last's: pain travels with both vagus and sympathetics."]]},{"id":"th-846d2c3f","r":"th","t":"Thorax surface anatomy","y":2,"d":1,"s":"Vertebral levels of thoracic landmarks:","o":[["The jugular notch lies at the level of T3",1,"Last's: jugular notch T3, sternal angle T4 (the T4/5 disc), lower end of sternum T8."],["The sternal angle lies at the level of T4",1,"Last's gives T4 (at the T4/5 disc). It marks the lower limit of the superior mediastinum."],["The lower end of the sternum lies at T8",1,"Last's."],["The plane of the sternal angle marks the lower limit of the superior mediastinum",1,"It passes to the T4/5 disc behind."]],"k":"E"},{"id":"th-bba3683c","r":"th","t":"Development of the heart and great vessels","y":1,"d":1,"s":"Concerning the ductus arteriosus:","o":[["It is derived from the left sixth arch artery",1,"The right dorsal sixth arch disappears, so the right RLN hooks under the subclavian."],["It closes after birth by contraction of its muscular wall",1,"Stimulated by the rise in oxygen tension."],["It becomes the ligamentum venosum",0,"It becomes the ligamentum arteriosum. The ductus venosus becomes the ligamentum venosum."],["The left recurrent laryngeal nerve hooks around it",1,"Lying to its left."]]},{"id":"ul-1446dca2","r":"ul","t":"NSA sample question","y":2,"d":1,"src":"NSA sample","s":"The median nerve","o":[["is found immediately lateral to the biceps tendon in the cubital fossa",0,"From medial to lateral the fossa contains median nerve, brachial artery, biceps tendon. The nerve is medial to the artery, two structures medial to the tendon."],["contains fibres from cervical roots 5, 6, 7 and 8 and thoracic 1",1,"Last's: C5 to T1, from lateral (C5–7) and medial (C8, T1) roots."],["is responsible for flexion of the distal interphalangeal joint of the little finger",0,"The medial half of FDP (ring and little fingers) is supplied by the ulnar nerve."],["is easily exposed in the arm where it is adjacent to the brachial artery by an incision along the medial border of biceps",1,"It runs with the brachial artery along the medial bicipital groove, crossing from lateral to medial of it."]],"k":"B"},{"id":"ul-137793c6","r":"ul","t":"Brachial plexus","y":1,"d":1,"s":"Concerning the brachial plexus:","o":[["The divisions lie behind the clavicle at the outer border of the first rib",1,"Roots and trunks are supraclavicular, the cords infraclavicular."],["The cords are named by their relation to the second part of the axillary artery",1,"They enter above the first part, embrace the second, and give branches around the third."],["A prefixed plexus receives a major contribution from C4 and occurs in about 10%",1,"Last's: prefixed (C4 to C8) and postfixed (C6 to T2) each occur in about 10%."],["The lateral cord is formed by the anterior divisions of the middle and lower trunks",0,"The lateral cord is formed by the anterior divisions of the upper and middle trunks. The medial cord is the anterior division of the lower trunk."]]},{"id":"ul-3a6e1a3a","r":"ul","t":"Brachial plexus","y":2,"d":1,"s":"Branches arising from the roots of the brachial plexus include the:","o":[["Suprascapular nerve",0,"The suprascapular nerve arises from the upper trunk, the only trunk branch."],["Dorsal scapular nerve",1,"C5, passing behind the roots through scalenus medius."],["Lateral pectoral nerve",0,"It arises from the lateral cord."],["Long thoracic nerve",1,"C5, C6 and C7, passing behind the roots."]],"k":"B"},{"id":"ul-8479c5ac","r":"ul","t":"Brachial plexus","y":1,"d":1,"s":"Regarding the root values of branches of the brachial plexus:","o":[["Pectoralis major is the only muscle supplied by all five roots of the plexus",1,"Last's: C5 and C6 to the clavicular head, C7, C8 and T1 to the sternocostal part."],["The thoracodorsal nerve is C6, C7 and C8",1,"It arises from the posterior cord and supplies latissimus dorsi."],["The ulnar nerve receives its C7 fibres from the lateral cord in most people",1,"Last's: in over 95% these come from the lateral cord, otherwise from the middle trunk. They supply FCU."],["The axillary nerve is C7 and C8",0,"The axillary nerve is C5 and C6."]]},{"id":"ul-a7fe610b","r":"ul","t":"Long thoracic nerve","y":2,"d":1,"s":"The long thoracic nerve:","o":[["Is formed by C5 and C6 roots passing through scalenus medius, joined by C7 which descends in front of the muscle",1,"Last's description of its formation."],["Runs down behind the midaxillary line on the surface of serratus anterior",1,"So it lies behind the lateral cutaneous branches of the intercostal nerves and is safe from a midaxillary incision placed in front of it."],["Supplies serratus anterior segmentally, with C7 to the lowest four digitations",1,"C5 to the upper two, C6 to the next two, C7 to the lowest four."],["Passes in front of the roots of the brachial plexus",0,"The dorsal scapular and long thoracic nerves pass behind the roots. The nerve to subclavius passes in front of them."]],"k":"C"},{"id":"ul-6bd821a8","r":"ul","t":"Axilla","y":1,"d":1,"s":"Concerning the axillary artery:","o":[["It is divided into three parts by pectoralis minor",1,"First part above, second behind, third below."],["The superior thoracic artery arises from the first part",1,"One branch from the first part, two from the second, three from the third."],["The lateral thoracic artery arises from the third part",0,"The lateral thoracic and thoracoacromial arteries arise from the second part."],["It becomes the brachial artery at the lower border of teres major",1,"The axillary artery becomes the brachial artery at the lower border of teres major."]]},{"id":"ul-4ff7f731","r":"ul","t":"Axilla","y":2,"d":1,"s":"Structures piercing the clavipectoral fascia include the:","o":[["Cephalic vein",1,"Mnemonic CALL: cephalic vein, acromiothoracic (thoracoacromial) artery, lateral pectoral nerve, lymphatics."],["Medial pectoral nerve",0,"The medial pectoral nerve pierces pectoralis minor."],["Lateral thoracic artery",0,"It follows the lower border of pectoralis minor and does not pierce the clavipectoral fascia."],["Long thoracic nerve",0,"It runs on the surface of serratus anterior, nowhere near the fascia."]],"k":"A"},{"id":"ul-437dba35","r":"ul","t":"Quadrangular and triangular spaces","y":1,"d":1,"s":"Regarding the spaces of the posterior axillary wall:","o":[["The quadrangular space transmits the axillary nerve and posterior circumflex humeral vessels",1,"Bounded by teres minor above, teres major below, long head of triceps medially and the humerus laterally."],["In the quadrangular space the axillary nerve lies below the vessels",0,"Last's: the nerve lies above the vessels, in contact with the surgical neck just below the capsule."],["The triangular space (interval) transmits the radial nerve and profunda brachii vessels",1,"Bounded by teres major above, long head of triceps medially and the humerus laterally."],["The circumflex scapular artery passes through the space bounded by teres minor, teres major and the long head of triceps",1,"This is the upper triangular space, medial to the long head. The quadrangular space lies lateral to the long head."]]},{"id":"ul-b64c8160","r":"ul","t":"Axillary nerve","y":2,"d":1,"s":"The axillary nerve:","o":[["Supplies teres major",0,"Teres major is supplied by the lower subscapular nerve."],["Supplies teres minor through its posterior branch",1,"The posterior branch also supplies part of deltoid and becomes the upper lateral cutaneous nerve of the arm."],["Supplies the skin of the back of the arm down to the elbow",0,"That is the posterior cutaneous nerve of the arm (radial). The axillary nerve supplies skin over the lower half of deltoid."],["Supplies the shoulder joint",1,"It gives an articular branch."]],"k":"B"},{"id":"ul-7c84b68a","r":"ul","t":"Musculocutaneous nerve","y":1,"d":1,"s":"Concerning the musculocutaneous nerve:","o":[["It pierces coracobrachialis",1,"It then slopes down between biceps and brachialis."],["It supplies the lateral part of brachialis",0,"It supplies the main part of brachialis. The lateral part, developed in the extensor compartment, is supplied by the radial nerve."],["It becomes the lateral cutaneous nerve of the forearm lateral to the biceps tendon",1,"It pierces the deep fascia at the elbow flexure crease."],["Its root value is C5, C6 and C7",1,"From the lateral cord."]]},{"id":"ul-ab788847","r":"ul","t":"Cubital fossa","y":1,"d":1,"s":"Within the cubital fossa:","o":[["The median nerve lies medial to the brachial artery",1,"From medial to lateral: median nerve, brachial artery, biceps tendon."],["The ulnar nerve lies medial to the median nerve",0,"Last's: the ulnar nerve does not run in the cubital fossa. It passes behind the medial epicondyle."],["The bicipital aponeurosis separates the median cubital vein from the brachial artery",1,"It protects the artery and median nerve during venepuncture."],["The radial nerve lies in the floor on supinator",0,"The radial nerve lies just lateral to the fossa, in the slit between brachialis and brachioradialis."]]},{"id":"ul-e90ea5e8","r":"ul","t":"Median nerve","y":1,"d":1,"s":"Regarding the median nerve:","o":[["It gives no muscular branches in the arm",1,"Unless the branch to pronator teres arises unusually high."],["It enters the forearm between the two heads of pronator teres",1,"The ulnar head of pronator teres separates it from the ulnar artery."],["Its palmar cutaneous branch passes deep to the flexor retinaculum",0,"It arises just above the retinaculum and passes superficial to it, so it is spared in carpal tunnel syndrome."],["It divides into its branches within the carpal tunnel",1,"Last's: into lateral (with the muscular recurrent branch) and medial branches."]]},{"id":"ul-2f79fb29","r":"ul","t":"Median nerve","y":2,"d":1,"s":"The anterior interosseous nerve supplies:","o":[["Flexor pollicis longus",1,"Deep flexor compartment muscles: FPL, lateral half of FDP and pronator quadratus."],["The wrist and carpal joints",1,"Last's: also the interosseous membrane and periosteum."],["Pronator quadratus",1,"It ends in this muscle."],["The lateral half of flexor digitorum profundus",1,"The part to the index and middle fingers."]],"k":"E"},{"id":"ul-c4dd446e","r":"ul","t":"Carpal tunnel","y":1,"d":1,"s":"Concerning the flexor retinaculum and carpal tunnel:","o":[["The retinaculum is attached to the pisiform and hook of hamate medially",1,"And to the tubercle of scaphoid and ridge of trapezium laterally."],["The median nerve lies lateral to the tendons of FDS and medial to FCR",1,"It lies just beneath the retinaculum, above FPL and FDP."],["The ulnar nerve passes through the carpal tunnel",0,"The ulnar nerve and artery pass superficial to the retinaculum, lateral to the pisiform."],["Flexor pollicis brevis has the most variable nerve supply of any muscle",1,"Last's: median recurrent branch, deep ulnar, or both."]]},{"id":"ul-9833efcc","r":"ul","t":"Ulnar nerve","y":1,"d":1,"s":"Regarding the ulnar nerve:","o":[["It gives no branches in the arm",1,"Last's."],["It pierces the medial intermuscular septum in the lower third of the arm",1,"With the superior ulnar collateral artery and the radial nerve branch to medial head of triceps."],["It enters the forearm between the two heads of flexor carpi ulnaris",1,"Through the cubital tunnel."],["It divides into superficial and deep branches proximal to the wrist crease",0,"It divides on the flexor retinaculum, beside the pisiform. The dorsal branch arises proximal to the wrist."]]},{"id":"ul-7cf72fb0","r":"ul","t":"Ulnar nerve","y":2,"d":1,"s":"The deep branch of the ulnar nerve supplies:","o":[["Adductor pollicis",1,"It ends there."],["All the interossei",1,"Palmar and dorsal."],["The two medial lumbricals",1,"Third and fourth."],["The hypothenar muscles",1,"The deep branch passes between flexor and abductor digiti minimi, through opponens digiti minimi, supplying all three."]],"k":"E"},{"id":"ul-6fbe923a","r":"ul","t":"Radial nerve","y":1,"d":1,"s":"Concerning the radial nerve:","o":[["It gives a branch to the medial head of triceps in the axilla (the ulnar collateral nerve)",1,"This runs with the ulnar nerve."],["The posterior cutaneous nerve of the arm arises before the nerve enters the spiral groove",1,"It supplies the back of the arm."],["It enters the anterior compartment by piercing the lateral intermuscular septum",1,"Then it lies between brachialis and brachioradialis."],["It supplies extensor carpi radialis brevis before dividing",0,"Last's: it supplies brachioradialis and ECRL, then gives the posterior interosseous nerve, which supplies ECRB and supinator."]]},{"id":"ul-e0e331a4","r":"ul","t":"Radial nerve","y":2,"d":1,"s":"Following division of the superficial branch of the radial nerve at the wrist:","o":[["There is wrist drop",0,"The superficial branch is purely sensory."],["Sensory loss is often confined to a small area over the first dorsal interosseous",1,"Last's: much overlap from the median and ulnar nerves."],["There is weakness of extensor pollicis longus",0,"EPL is supplied by the posterior interosseous nerve."],["Sensory loss usually involves the anatomical snuffbox",1,"Cutaneous branches cross the snuffbox tendons."]],"k":"B"},{"id":"ul-c90fb5b3","r":"ul","t":"Anatomical snuffbox","y":1,"d":1,"s":"The anatomical snuffbox:","o":[["Is bounded medially by extensor pollicis longus",1,"And laterally by EPB and APL."],["Has the scaphoid and trapezium in its floor",1,"The radial styloid lies proximally."],["Contains the radial artery",1,"On the floor, deep to the tendons."],["Contains the posterior interosseous nerve",0,"The cephalic vein origin and branches of the superficial radial nerve lie here, not the PIN."]]},{"id":"ul-3275b515","r":"ul","t":"Rotator cuff","y":2,"d":1,"s":"Concerning the shoulder region muscles and nerves:","o":[["The suprascapular nerve passes below the superior transverse scapular ligament",1,"The suprascapular vessels pass above it."],["The suprascapular nerve supplies supraspinatus and infraspinatus",1,"C5 and C6 from the upper trunk."],["Subscapularis is supplied by the upper and lower subscapular nerves",1,"The lower also supplies teres major."],["Teres minor is supplied by the suprascapular nerve",0,"Teres minor is supplied by the axillary nerve."]],"k":"C"},{"id":"ul-c9028dfb","r":"ul","t":"Myotomes upper limb","y":1,"d":1,"s":"Regarding the segmental supply of upper limb movements:","o":[["Shoulder abduction and lateral rotation are C5",1,"Adduction and medial rotation are C6 to C8."],["Elbow flexion is C5 and C6",1,"Elbow extension is C7 and C8."],["Forearm pronation is C6",0,"Supination is C6. Pronation is C7 and C8."],["The intrinsic muscles of the hand are T1",1,"Abductor pollicis brevis is a key T1 test."]]},{"id":"ul-ab2b9183","r":"ul","t":"Dermatomes upper limb","y":2,"d":1,"s":"Regarding the upper limb dermatomes and axial lines:","o":[["The anterior axial line runs from the sternal angle down the front of the limb almost to the wrist",1,"Last's."],["C7 supplies the middle finger",1,"C6 the thumb (and probably index), C8 the ring and little fingers."],["The posterior axial line runs from the vertebra prominens to the insertion of deltoid",1,"Last's."],["T1 supplies the skin of the axilla",0,"Last's: T1 supplies the medial side of the elbow region, not the axilla. T2 supplies the axilla."]],"k":"C"},{"id":"ul-629c93db","r":"ul","t":"Brachial plexus injury","y":1,"d":1,"s":"Following an upper trunk (C5, C6) brachial plexus injury:","o":[["The arm hangs medially rotated at the side",1,"Loss of deltoid, supraspinatus, infraspinatus and teres minor gives the waiter's tip posture."],["Elbow flexion is weak",1,"Biceps, brachialis and brachioradialis are C5 and C6."],["There is a sensory deficit over the lateral arm and forearm",1,"C5 and C6 dermatomes."],["The biceps jerk is preserved",0,"The biceps jerk (C5, C6) is lost."]]},{"id":"ul-d680d25e","r":"ul","t":"Brachial plexus injury","y":2,"d":1,"s":"A lower trunk (C8, T1) lesion with avulsion of the T1 root would produce:","o":[["Ipsilateral Horner's syndrome",1,"Preganglionic sympathetic fibres to the head leave in the T1 root."],["Wasting of the intrinsic hand muscles",1,"T1 supplies the small muscles of the hand."],["Sensory loss on the medial forearm",1,"C8 and T1 territory."],["Paralysis of deltoid",0,"Deltoid is C5 and C6."]],"k":"C"},{"id":"ul-549b9382","r":"ul","t":"Scapular anastomosis and arteries","y":1,"d":1,"s":"Concerning arteries of the upper limb:","o":[["The subscapular artery continues as the thoracodorsal artery after giving the circumflex scapular",1,"It runs down the posterior axillary wall."],["The anterior and posterior circumflex humeral arteries arise from the third part of the axillary artery",1,"With the subscapular."],["The radial artery crosses the floor of the anatomical snuffbox",1,"It then passes between the heads of the first dorsal interosseous."],["The deep palmar arch is formed mainly by the ulnar artery",0,"The deep arch is formed mainly by the radial artery. The superficial arch is mainly ulnar."]]},{"id":"ul-c198da8a","r":"ul","t":"Ossification upper limb","y":2,"d":1,"s":"Regarding ossification in the upper limb:","o":[["The clavicle is the first bone in the body to ossify",1,"It ossifies in membrane from two centres in the fifth week."],["The capitate is the first carpal bone to ossify",1,"In the first year. Pisiform is last, at about 10 years."],["The medial epicondyle of the humerus fuses with the shaft separately at about 20 years",1,"The other three lower epiphyseal centres fuse together, then with the shaft at about 15 years."],["The upper end of the radius is the growing end",0,"The lower end is the growing end of the radius. In the upper limb the growing ends are at the shoulder and wrist."]],"k":"C"},{"id":"ul-6b453b25","r":"ul","t":"Elbow and forearm","y":1,"d":1,"s":"Concerning the posterior interosseous nerve:","o":[["It passes between the two layers of supinator",1,"Under the arcade of Frohse."],["It supplies all the muscles of the common extensor origin and the deep extensors",1,"Including EPL, EPB, APL and extensor indicis."],["It ends by supplying the wrist joint",1,"It runs on the interosseous membrane."],["It supplies brachioradialis",0,"Brachioradialis is supplied by the radial nerve before its division."]]},{"id":"ul-547a3137","r":"ul","t":"Hand","y":2,"d":1,"s":"The recurrent (muscular) branch of the median nerve usually supplies:","o":[["Adductor pollicis",0,"Adductor pollicis is supplied by the deep branch of the ulnar nerve."],["First dorsal interosseous",0,"All interossei are supplied by the deep branch of the ulnar nerve."],["Palmaris brevis",0,"Palmaris brevis is supplied by the superficial branch of the ulnar nerve."],["Abductor pollicis brevis",1,"The recurrent branch curves around the distal border of the retinaculum to the thenar muscles."]],"k":"D"},{"id":"ul-4f777499","r":"ul","t":"Hand","y":1,"d":1,"s":"Regarding the lumbricals and interossei:","o":[["The lumbricals arise from the tendons of flexor digitorum profundus",1,"And insert into the radial side of the extensor expansions."],["The lumbricals flex the metacarpophalangeal joints and extend the interphalangeal joints",1,"Hence the claw deformity when they are paralysed."],["The dorsal interossei adduct the fingers",0,"Dorsal interossei abduct (DAB). Palmar interossei adduct (PAD)."],["The first and second lumbricals are usually supplied by the median nerve",1,"The third and fourth by the deep ulnar nerve."]]}],"cards":[],"type2Key":{"TFFF":"A","FTFT":"B","TTTF":"C","FFFT":"D","TTTT":"E"},"built":"2026-10-24"};

  exam.ids.forEach((id, i) => { if (answered(QBYID[id], exam.ans[i])) recordQuestion(id, scores[i], exam.ans[i]); });
  const usedMs = exam.duration - Math.max(0, exam.ends - Date.now());
  exam.results = {
    scores, total: scores.reduce((a, b) => a + b, 0) / scores.length, full: scores.filter((s) => s === 1).length,
    used: `${Math.floor(usedMs / 60000)} min`,
  };
  exam.phase = 'done'; exam.cur = 0;
  changed();
  renderExam();
}

/* ---------- flashcards (simple Leitner boxes) ---------- */
const INTERVAL_DAYS = [0, 1, 3, 7, 16, 35, 70];
const cards = { regions: new Set(), queue: [], cur: null, flipped: false };
function cardPool() { return DATA.cards.filter((c) => !cards.regions.size || cards.regions.has(c.r)); }
function buildCardQueue() {
  const now = Date.now();
  const pool = cardPool();
  const due = pool.filter((c) => state.c[c.id] && state.c[c.id].d <= now).sort((a, b) => state.c[a.id].d - state.c[b.id].d);
  const fresh = pool.filter((c) => !state.c[c.id]);
  cards.queue = [...due.map((c) => c.id), ...fresh.map((c) => c.id)];
  cards.cur = cards.queue[0] || null; cards.flipped = false;
  return { due: due.length, fresh: fresh.length, total: pool.length };
}
function renderCards() {
  const counts = {};
  for (const c of DATA.cards) counts[c.r] = (counts[c.r] || 0) + 1;
  chipGroup($('#card-regions'), [{ value: '__all', label: 'All regions', count: DATA.cards.length }, ...DATA.regions.filter((r) => counts[r.code]).map((r) => ({ value: r.code, label: r.name, count: counts[r.code] }))],
    cards.regions.size ? cards.regions : new Set(['__all']), { onChange: (v) => {
      if (v === '__all') cards.regions.clear(); else cards.regions.has(v) ? cards.regions.delete(v) : cards.regions.add(v);
      renderCards();
    } });
  const area = $('#card-area');
  if (!DATA.cards.length) {
    area.replaceChildren(h('div', { class: 'panel empty' }, h('b', { text: 'No flashcards in this copy' }), 'Flashcards are built from your Anki export when the page is built.'));
    $('#card-count').textContent = '';
    return;
  }
  const info = buildCardQueue();
  $('#card-count').textContent = `${info.due} due for review · ${info.fresh} new · ${info.total} in selection`;
  drawCard();
}
function drawCard() {
  const area = $('#card-area');
  if (!cards.cur) {
    area.replaceChildren(h('div', { class: 'panel empty' }, h('b', { text: 'All caught up' }), 'No cards are due in this selection. Come back later or pick more regions.'));
    return;
  }
  const c = CBYID[cards.cur];
  const rec = state.c[c.id];
  const body = h('div', { class: 'card' },
    h('div', { class: 'q-head' }, h('span', { class: 'tag', text: REGION[c.r] }), h('span', { text: rec ? `Box ${rec.b}` : 'New card' }), h('span', { class: 'grow', style: 'text-align:right', text: `${cards.queue.length} left` })),
    h('div', { class: 'card-face', html: c.f }));
  if (cards.flipped) body.append(h('div', { class: 'card-face back', html: c.b }));
  const controls = cards.flipped
    ? h('div', { class: 'rate' },
      h('button', { class: 'btn', text: 'Again', onclick: () => rateCard(c.id, 0) }),
      h('button', { class: 'btn', text: 'Hard', onclick: () => rateCard(c.id, 1) }),
      h('button', { class: 'btn primary', text: 'Got it', onclick: () => rateCard(c.id, 2) }))
    : h('button', { class: 'btn primary', style: 'width:100%', text: 'Show answer', onclick: () => { cards.flipped = true; drawCard(); } });
  area.replaceChildren(body, controls);
}
function rateCard(id, grade) {
  const rec = state.c[id] || { b: 0, d: 0 };
  let b = rec.b;
  if (grade === 0) b = 0; else if (grade === 2) b = Math.min(INTERVAL_DAYS.length - 1, b + 1);
  const days = grade === 0 ? 0 : grade === 1 ? Math.max(0.5, INTERVAL_DAYS[b] / 2) : INTERVAL_DAYS[b];
  const due = grade === 0 ? Date.now() + 10 * 60000 : Date.now() + days * 86400000;
  state.c[id] = { b, d: due, t: Date.now() };
  changed();
  cards.queue = cards.queue.filter((x) => x !== id);
  if (grade === 0) cards.queue.push(id);
  cards.cur = cards.queue[0] || null; cards.flipped = false;
  $('#card-count').textContent = `${cards.queue.length} left in this session`;
  drawCard();
}

/* ---------- daily report ---------- */
function dayReport(day) {
  const entries = Object.entries((state.h || {})[day] || {}).filter(([id]) => QBYID[id]).sort((a, b) => a[1].t - b[1].t);
  const wrong = [];
  let total = 0;
  for (const [id, rec] of entries) {
    total += rec.s;
    if (rec.s === 1) continue;
    const q = QBYID[id];
    const lines = [];
    if (q.y === 1) {
      q.o.forEach((o, i) => {
        const yours = rec.a[i];
        const right = o[1] ? 'T' : 'F';
        if (yours !== right) lines.push({ label: T1_LABELS[i], text: o[0], answer: o[1] ? 'True' : 'False', yours: yours === '?' ? 'blank' : (yours === 'T' ? 'True' : 'False'), why: o[2] });
      });
    } else {
      lines.push({ label: 'Key', text: `You chose ${rec.a || 'nothing'}; answer ${q.k} (${KEY_TEXT[q.k]})`, answer: '', yours: '', why: '' });
      q.o.forEach((o, i) => lines.push({ label: String(i + 1), text: o[0], answer: o[1] ? 'True' : 'False', yours: '', why: o[2] }));
    }
    wrong.push({ q, score: rec.s, lines });
  }
  const answered = entries.length;
  const full = answered - wrong.length;
  const nice = new Date(`${day}T12:00:00`).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
  const byRegion = {};
  for (const w of wrong) byRegion[REGION[w.q.r]] = (byRegion[REGION[w.q.r]] || 0) + 1;
  let text = `NSA anatomy ${nice}: ${answered} answered, ${full} fully correct, average ${answered ? pct(total / answered) : '0%'}.`;
  if (wrong.length) {
    text += `\nMissed by region: ${Object.entries(byRegion).map(([r, n]) => `${r} ${n}`).join(', ')}.`;
    for (const w of wrong) {
      text += `\n\n${REGION[w.q.r]}: ${w.q.s}`;
      for (const l of w.lines) {
        if (w.q.y === 1) text += `\n ${l.label}. ${l.text} -> ${l.answer} (you: ${l.yours})`;
        else if (l.label === 'Key') text += `\n ${l.text}`;
        else text += `\n ${l.label}. ${l.text} -> ${l.answer}`;
      }
    }
  }
  return { day, nice, answered, full, avg: answered ? total / answered : 0, wrong, text };
}
let todayDay = null;
function renderToday() {
  const area = $('#today-area');
  const days = Object.keys(state.h || {}).filter((d) => Object.keys(state.h[d]).length).sort().reverse();
  const today = dayKey();
  if (!days.includes(today)) days.unshift(today);
  if (!todayDay || !days.includes(todayDay)) todayDay = today;
  const r = dayReport(todayDay);
  const dayChips = h('div', { class: 'chips' });
  chipGroup(dayChips, days.slice(0, 14).map((d) => ({ value: d, label: d === today ? 'Today' : new Date(`${d}T12:00:00`).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }) })), todayDay, {
    multi: false, onChange: (v) => { todayDay = v; renderToday(); },
  });
  const copyBox = h('textarea', { class: 'copy', id: 'report-text', readonly: true, 'aria-label': 'Report text' });
  copyBox.value = r.text;
  const copyBtn = h('button', { class: 'btn small', text: 'Copy as text', onclick: (e) => {
    const done = () => { e.target.textContent = 'Copied'; setTimeout(() => { e.target.textContent = 'Copy as text'; }, 1500); };
    try { navigator.clipboard.writeText(r.text).then(done, () => { copyBox.select(); }); } catch (err) { copyBox.select(); }
  } });
  const list = h('div', {});
  for (const w of r.wrong) {
    const ul = h('ul', {});
    for (const l of w.lines) {
      if (l.label === 'Key') { ul.append(h('li', {}, h('b', { text: l.text }))); continue; }
      ul.append(h('li', {}, h('b', { text: `${l.label}. ` }), l.text, ' ', h('b', { class: l.answer === 'True' ? 'pass' : 'fail', text: `→ ${l.answer}` }),
        l.yours ? ` (you said ${l.yours})` : '', h('div', { class: 'expl', text: l.why })));
    }
    list.append(h('div', { class: 'report-q' },
      h('div', { class: 'q-head', style: 'padding:0;border:0' }, h('span', { class: 'tag', text: REGION[w.q.r] }), h('span', { text: w.q.t }), scoreLabel(w.q, w.score)),
      h('div', { style: 'font-weight:700;margin-top:4px', text: w.q.s }), ul));
  }
  area.replaceChildren(
    h('div', { class: 'panel' }, h('p', { class: 'label', text: 'Daily breakdown' }), dayChips,
      h('div', { class: 'row', style: 'margin-top:12px' }, h('span', { class: 'big', text: r.answered ? pct(r.avg) : '–' }),
        h('span', { class: 'count', text: `${r.answered} answered on ${r.nice} · ${r.full} fully correct · ${r.wrong.length} with mistakes` }))),
    h('div', { class: 'panel' }, h('p', { class: 'label', text: r.wrong.length ? 'Questions you got wrong' : 'Nothing wrong yet' }),
      r.wrong.length ? list : h('p', { class: 'count', style: 'margin:0', text: r.answered ? 'Every question answered on this day was fully correct.' : 'Answer some questions in Practice or Exam and they will appear here.' }),
      r.wrong.length ? h('div', { class: 'row', style: 'margin-top:10px' }, h('button', { class: 'btn small primary', text: 'Practise these again', onclick: () => {
        practice.queue = shuffle(r.wrong.map((w) => w.q.id)); practice.idx = 0; practice.ans = null; practice.reveal = false; show('practice');
      } })) : null),
    h('div', { class: 'panel' }, h('div', { class: 'row' }, h('span', { class: 'label grow', style: 'margin:0', text: 'Text version' }), copyBtn), copyBox,
      h('p', { class: 'count', style: 'margin:8px 0 0', text: 'Each evening this summary is also saved to your account for the daily phone notification.' })));
}

/* ---------- progress ---------- */
let resetArmed = false;
function renderProgress() {
  const area = $('#progress-area');
  const rows = [];
  let seen = 0, totalScore = 0, attempted = 0;
  for (const r of DATA.regions) {
    const qs = DATA.questions.filter((q) => q.r === r.code);
    const tried = qs.filter((q) => state.q[q.id] && state.q[q.id].a);
    const ok = tried.filter((q) => state.q[q.id].l === 1).length;
    const avg = tried.length ? tried.reduce((a, q) => a + state.q[q.id].l, 0) / tried.length : 0;
    seen += tried.length; totalScore += tried.reduce((a, q) => a + state.q[q.id].l, 0); attempted += tried.length;
    rows.push(h('tr', {},
      h('td', { text: r.name }),
      h('td', { class: 'num', text: `${tried.length}/${qs.length}` }),
      h('td', { class: 'meter' }, h('div', { class: 'meterbar', title: `${ok} fully correct, ${tried.length - ok} not` },
        h('span', { class: 'm-ok', style: `width:${qs.length ? ok / qs.length * 100 : 0}%` }),
        h('span', { class: 'm-bad', style: `width:${qs.length ? (tried.length - ok) / qs.length * 100 : 0}%` }))),
      h('td', { class: 'num', text: tried.length ? pct(avg) : '–' })));
  }
  const learned = Object.values(state.c).filter((c) => c.b >= 3).length;
  const reviewed = Object.keys(state.c).length;
  const flagged = Object.values(state.q).filter((q) => q.f).length;
  const resetBox = resetArmed
    ? h('div', { class: 'confirm' }, h('span', { class: 'grow', text: 'Erase all question and flashcard progress on every device?' }),
      h('button', { class: 'btn small', text: 'Cancel', onclick: () => { resetArmed = false; renderProgress(); } }),
      h('button', { class: 'btn small primary', text: 'Erase', onclick: () => { resetArmed = false; state = { v: 1, r: Date.now(), q: {}, c: {}, h: {} }; changed(); } }))
    : h('button', { class: 'btn small ghost', text: 'Reset progress', onclick: () => { resetArmed = true; renderProgress(); } });
  area.replaceChildren(
    h('div', { class: 'panel' },
      h('p', { class: 'label', text: 'Overall' }),
      h('div', { class: 'row' }, h('span', { class: 'big', text: attempted ? pct(totalScore / attempted) : '–' }),
        h('span', { class: 'count', text: `average on your latest attempt at ${seen} of ${DATA.questions.length} questions · ${flagged} flagged` })),
      DATA.cards.length ? h('p', { class: 'count', style: 'margin:8px 0 0', text: `Flashcards: ${reviewed} of ${DATA.cards.length} studied, ${learned} well known (box 3 or higher)` }) : null),
    h('div', { class: 'panel' },
      h('p', { class: 'label', text: 'By region' }),
      h('div', { class: 'table-scroll' }, h('table', { class: 'stats' },
        h('tr', {}, h('th', { text: 'Region' }), h('th', { text: 'Tried' }), h('th', { text: 'Fully correct / not' }), h('th', { text: 'Avg' })), ...rows))),
    h('div', { class: 'panel' }, h('div', { class: 'row' }, h('span', { class: 'grow count', text: 'Progress is kept per person and merges between your laptop and phone when you open this page signed in.' }), resetBox)));
}

/* ---------- format ---------- */
function renderFormat() {
  const t2 = DATA.questions.filter((q) => q.y === 2).length;
  $('#format-area').replaceChildren(
    h('p', { class: 'label', text: 'Exam format' }),
    h('p', { text: 'The NSA Neurosurgery Anatomy Examination is a single paper of 60 multiple choice questions in 100 minutes, based on Last\'s Anatomy, Regional and Applied, 9th edition. The pass mark is 70%.' }),
    h('p', {}, h('b', { text: 'Type 1: ' }), 'a stem with four statements labelled A to D. Mark each statement true or false. Here each statement is worth a quarter of the question.'),
    h('p', {}, h('b', { text: 'Type 2: ' }), 'a stem with four numbered statements, answered with a single letter from the official NSA key below. The whole question is right or wrong.'),
    h('div', { class: 'key', style: 'margin:0 0 10px' }, h('table', {}, ...Object.entries(KEY_TEXT).map(([k, v]) => h('tr', {}, h('td', { text: k }), h('td', { text: v }))))),
    h('p', { class: 'count', text: 'This is the key printed in the NSA examination information document. The four official sample questions are in the bank, marked "Official NSA sample".' }),
    h('p', { class: 'label', style: 'margin-top:14px', text: 'This bank' }),
    h('p', { text: `${DATA.questions.length} questions (${DATA.questions.length - t2} Type 1, ${t2} Type 2) across ${DATA.regions.length} regions${DATA.cards.length ? `, plus ${DATA.cards.length} flashcards from your Last's Anki deck` : ''}. Explanations quote Last's where its wording differs from other textbooks. Questions marked Harder go beyond the NSA level using ABNS primary-exam neuroanatomy (thalamic and basal ganglia circuits, gaze centres, brainstem syndromes); some of that detail is not in Last's. Built ${DATA.built}.` }));
}

/* ---------- tabs & boot ---------- */
const VIEWS = { practice: renderPractice, exam: renderExam, cards: renderCards, today: renderToday, progress: renderProgress, format: renderFormat };
let currentView = 'practice';
function show(view) {

  currentView = view;
  for (const btn of document.querySelectorAll('nav.tabs button')) btn.setAttribute('aria-selected', String(btn.dataset.view === view));
  for (const v of Object.keys(VIEWS)) $(`#view-${v}`).hidden = v !== view;
  if (view !== 'exam') clearInterval(exam.timer);
  VIEWS[view]();
}
for (const btn of document.querySelectorAll('nav.tabs button')) btn.addEventListener('click', () => show(btn.dataset.view));
$('#practice-start').addEventListener('click', startPractice);

});

  $('#meta').textContent = `Last's 9th ed · exam 19 Feb 2027${days > 0 ? ` · ${days} days to go` : ''}`;

loadLocal();

startSync();
