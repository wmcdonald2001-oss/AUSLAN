h is a surgical guide."],["Its secretomotor fibres relay in the otic ganglion",1,"Inferior salivary nucleus, IX, tympanic branch, tympanic plexus, lesser petrosal nerve, otic ganglion, auriculotemporal nerve."],["Its fascia receives sensory fibres from the great auricular nerve",1,"The gland itself receives sensory fibres from the auriculotemporal nerve."],["The parotid duct pierces masseter to open opposite the upper second premolar",0,"The duct crosses masseter, turns around its anterior border and pierces buccinator to open opposite the upper second molar."]]},{"id":"hn-113d3da2","r":"hn","t":"Infratemporal fossa","y":1,"d":1,"s":"Regarding the maxillary artery:","o":[["It passes forward between the neck of the mandible and the sphenomandibular ligament",1,"The auriculotemporal nerve lies above it and the maxillary vein below."],["Its first-part branches all enter bony foramina",1,"Inferior alveolar, middle meningeal, accessory meningeal, deep auricular and anterior tympanic."],["The accessory meningeal artery is an important supply to the trigeminal ganglion",1,"Last's: it enters through foramen ovale and runs up the mandibular division to the ganglion."],["None of its branches pass through the petrotympanic fissure",0,"The anterior tympanic artery passes through the petrotympanic fissure to the middle ear. The deep auricular passes through the squamotympanic fissure region to the meatus."]]},{"id":"hn-a0e8ad3d","r":"hn","t":"Infratemporal fossa","y":2,"d":1,"s":"The sphenomandibular ligament:","o":[["Is attached to the spine of the sphenoid and the lingula",1,"It attaches to the lingula and inferior margin of the mandibular foramen."],["Is derived from the perichondrium of Meckel's cartilage",1,"First arch derivative."],["Is pierced by the nerve to mylohyoid",1,"The mylohyoid vessels groove the mandible here."],["Has the auriculotemporal nerve and maxillary artery passing between it and the neck of the mandible",1,"The inferior alveolar nerve and vessels pass between the ligament and the ramus."]],"k":"E"},{"id":"hn-0c5261f7","r":"hn","t":"Muscles of mastication","y":1,"d":1,"s":"Concerning the muscles of mastication:","o":[["The posterior fibres of temporalis are the only fibres that retract the mandible",1,"Last's: no other muscle retracts the condyle."],["The masseteric nerve passes through the mandibular notch above the lateral pterygoid",1,"It also supplies the TMJ (Hilton's law)."],["The buccal nerve is the only branch to pass between the two heads of lateral pterygoid",1,"It is sensory to the cheek. A middle deep temporal nerve may accompany it."],["Medial pterygoid is supplied by the anterior division of the mandibular nerve",0,"Medial pterygoid is supplied from the main trunk, which also gives the motor branch for the tensors."]]},{"id":"hn-27d44f21","r":"hn","t":"Temporomandibular joint","y":1,"d":1,"s":"Regarding the temporomandibular joint:","o":[["It is supplied by the auriculotemporal nerve and the nerve to masseter",1,"The auriculotemporal gives the major sensory supply (Hilton's law for masseter)."],["Its articular surfaces are covered with hyaline cartilage",0,"They are covered with fibrocartilage, because the mandible and squamous temporal ossify in membrane."],["The temporomandibular ligament is attached to the lateral surface of the articular tubercle",1,"It lies deep to the parotid fascia."],["It receives sensory branches from the facial nerve",0,"The facial nerve is motor here. Sensory supply is from V3 (auriculotemporal and masseteric)."]]},{"id":"hn-7876cfbd","r":"hn","t":"Pterygopalatine ganglion branches","y":1,"d":1,"s":"Regarding branches distributed through the pterygopalatine ganglion:","o":[["The nasopalatine nerve supplies the posteroinferior part of the nasal septum and the gum behind the incisors",1,"It passes through the sphenopalatine foramen, along the septum and through the incisive canal."],["The greater palatine nerve supplies the whole hard palate except the incisor gum",1,"It also supplies the posteroinferior lateral nasal wall."],["The lesser palatine nerves supply the soft palate and tonsil",1,"They emerge through the lesser palatine foramina."],["The pharyngeal branch passes through the vomerovaginal canal",0,"Last's: the pharyngeal nerve passes through the palatovaginal canal. The vomerovaginal canal transmits only a minute pharyngeal branch of the sphenopalatine artery."]]},{"id":"hn-4c773c31","r":"hn","t":"Nose","y":2,"d":1,"s":"The nerve supply of the lateral wall of the nasal cavity includes the:","o":[["Anterior ethmoidal nerve to the anterosuperior part",1,"It enters through the slit beside the crista galli."],["Anterior superior alveolar nerve to the anteroinferior part",1,"Last's: it reaches the anteroinferior quadrant, including the nasolacrimal duct."],["Lateral posterior superior nasal nerves to the posterosuperior part",1,"From the pterygopalatine ganglion through the sphenopalatine foramen."],["Nasociliary branches of the facial nerve to the vestibule",0,"The vestibule is supplied by branches of the infraorbital nerve that have crept in from the face."]],"k":"C"},{"id":"hn-04bc9cb2","r":"hn","t":"Pharynx","y":1,"d":1,"s":"Concerning the wall of the pharynx:","o":[["The pharyngobasilar fascia is attached to the pharyngeal tubercle and the petrous temporal bone in front of the carotid canal",1,"Then to the cartilaginous auditory tube and the medial pterygoid plate."],["The cartilaginous auditory tube enters the nasopharynx above the upper border of the superior constrictor",1,"It passes through the gap between the skull base and superior constrictor, with levator palati."],["Stylopharyngeus enters the pharynx between the middle and inferior constrictors",0,"Stylopharyngeus, IX and the lingual nerve pass through the gap between the superior and middle constrictors."],["The recurrent laryngeal nerve enters the larynx deep to the lower border of the inferior constrictor",1,"It passes just behind the cricothyroid joint with the inferior laryngeal vessels."]]},{"id":"hn-23208535","r":"hn","t":"Pharynx","y":2,"d":1,"s":"Muscles supplied by the pharyngeal plexus include:","o":[["Salpingopharyngeus",1,"All pharyngeal muscles except stylopharyngeus."],["Palatopharyngeus",1,"Motor fibres arise in the nucleus ambiguus and reach the vagus via the cranial accessory root."],["Levator veli palatini",1,"All palatal muscles except tensor veli palatini."],["The superior, middle and inferior constrictors",1,"Last's: cricopharyngeus may also receive fibres from the recurrent or external laryngeal nerve."]],"k":"E"},{"id":"hn-6d315014","r":"hn","t":"Palate","y":1,"d":1,"s":"Regarding tensor veli palatini:","o":[["It arises from the scaphoid fossa, the spine of the sphenoid and the cartilaginous auditory tube",1,"So it arises outside the pharynx, from bone at front and back and cartilage between."],["Its tendon turns around the pterygoid hamulus",1,"It passes above the fibrous origin of buccinator to become the palatine aponeurosis."],["It opens the auditory tube during swallowing",1,"Levator palati assists."],["It elevates the soft palate",0,"It tenses the aponeurosis so that other muscles can elevate (levator palati) or depress it."]]},{"id":"hn-73025515","r":"hn","t":"Tongue","y":1,"d":1,"s":"Concerning the development and innervation of the tongue:","o":[["Its muscles are derived from occipital myotomes, which explains the course of the hypoglossal nerve",1,"Their migration passes outside the carotids but deep to the jugular vein."],["The mucosa in front of the sulcus terminalis develops from the first arch",1,"Tuberculum impar and lateral lingual swellings, supplied by the lingual nerve and chorda tympani."],["The second arch contributes most of the posterior third",0,"Last's: the second arch is not represented. The third arch overgrows it, so IX supplies the posterior third, with a small fourth-arch area supplied by the internal laryngeal nerve near the vallecula."],["The foramen caecum marks the origin of the thyroglossal duct",1,"It lies at the apex of the sulcus terminalis."]]},{"id":"hn-5a6c1ae9","r":"hn","t":"Tongue","y":2,"d":1,"s":"Structures on the superficial (lateral) surface of hyoglossus include the:","o":[["Lingual nerve",1,"From above down on hyoglossus: lingual nerve, submandibular duct, hypoglossal nerve."],["Lingual artery",0,"The lingual artery lies deep to hyoglossus, with IX and the stylohyoid ligament."],["Stylohyoid ligament",0,"Last's: the stylohyoid ligament lies deep to hyoglossus, with IX and the lingual artery."],["Glossopharyngeal nerve",0,"IX passes deep to hyoglossus, at its posterior border."]],"k":"A"},{"id":"hn-58682e37","r":"hn","t":"Submandibular region","y":1,"d":1,"s":"Regarding the submandibular gland and duct:","o":[["The superficial and deep parts are continuous around the posterior border of mylohyoid",1,"The deep part lies between mylohyoid and hyoglossus."],["The facial artery grooves the posterior part of the superficial part",1,"It grooves the lateral surface, then hooks over the mandible in front of masseter."],["The duct is about 5 cm long and opens beside the frenulum",1,"It runs between mylohyoid and hyoglossus, then between the sublingual gland and genioglossus."],["The facial vein passes deep to the gland",0,"The facial vein, cervical branch of VII and (if low) the marginal mandibular branch cross the inferior (superficial) surface."]]},{"id":"hn-50d04d68","r":"hn","t":"Larynx","y":1,"d":1,"s":"Concerning the larynx:","o":[["Its mucosa above the vocal folds is supplied by the internal laryngeal nerve",1,"Below the folds it is the recurrent laryngeal nerve. Cell bodies of both are in the inferior vagal ganglion."],["The superior laryngeal artery is a branch of the superior thyroid artery",1,"It enters with the internal laryngeal nerve through the thyrohyoid membrane."],["Posterior cricoarytenoid is the only abductor of the vocal folds",1,"Supplied by the recurrent laryngeal nerve."],["The laryngeal cartilages derive from the second and third arches",0,"They derive from the fourth and sixth arches. Cricothyroid is from the fourth."]]},{"id":"hn-aaa9e621","r":"hn","t":"Larynx","y":2,"d":1,"s":"The recurrent laryngeal nerve:","o":[["Supplies all intrinsic laryngeal muscles except cricothyroid",1,"Cricothyroid is supplied by the external laryngeal nerve."],["Lies immediately behind the cricothyroid joint",1,"Last's: this is the joint with a nerve related to it."],["May divide into two branches before entering the larynx",1,"Last's: it is often double by the time it enters, having divided at about the upper border of the thyroid isthmus."],["Is non-recurrent on the right when there is an aberrant right subclavian artery",1,"With a retro-oesophageal right subclavian (1 to 2%), the right nerve passes directly to the larynx, a thyroidectomy hazard."]],"k":"E"},{"id":"hn-51da96b8","r":"hn","t":"Orbit","y":1,"d":1,"s":"Regarding the extraocular muscles:","o":[["Inferior oblique is the only extraocular muscle not arising from the back of the orbit",1,"It arises from the orbital floor, beside the nasolacrimal canal."],["The nerve to inferior oblique is the longest muscular nerve in the orbit",1,"It carries the parasympathetic root to the ciliary ganglion."],["Superior oblique turns the eye down and out",1,"It also intorts."],["Lateral rectus is supplied by the abducent nerve entering its orbital surface",0,"Last's: the nerves to the recti (and VI) enter the ocular surface of their muscles. Only the trochlear nerve enters its muscle from the orbital surface."]]},{"id":"hn-d65bff6f","r":"hn","t":"Orbit","y":2,"d":1,"s":"The ciliary ganglion:","o":[["Contains synapses of sympathetic fibres to the dilator pupillae",0,"Sympathetic fibres pass through without synapse, and dilator fibres travel mainly in the long ciliary nerves."],["Receives its parasympathetic root from the superior division of the oculomotor nerve",0,"The parasympathetic root comes from the nerve to inferior oblique (inferior division)."],["Sends sensory fibres to the conjunctiva",0,"Last's: its sensory fibres supply the eye, cornea, iris and ciliary body, but not the conjunctiva, which is supplied by the nerves of the overlying lid."],["Receives its sensory root from the nasociliary nerve",1,"These fibres pass through without relay."]],"k":"D"},{"id":"hn-e8e0b3ae","r":"hn","t":"Orbit","y":1,"d":1,"s":"Concerning the ophthalmic artery and veins:","o":[["The central retinal artery is the first and smallest branch of the ophthalmic artery",1,"Last's: it is also the most important. It is an end artery entering the inferomedial part of the nerve."],["The ophthalmic artery crosses above the optic nerve from lateral to medial",1,"It crosses with the nasociliary nerve and superior ophthalmic vein."],["The superior ophthalmic vein drains directly into the cavernous sinus",1,"It begins above the medial palpebral ligament, communicating with the angular vein."],["The inferior ophthalmic vein drains only into the cavernous sinus",0,"It drains much of its blood through the inferior orbital fissure into the pterygoid plexus."]]},{"id":"hn-4cf2c28a","r":"hn","t":"Ear","y":1,"d":1,"s":"Regarding the tympanic membrane:","o":[["It is set at about 55 degrees to the meatus, facing laterally, downwards and forwards",1,"The umbo is produced by the tip of the handle of malleus."],["Its outer surface is supplied by the auriculotemporal nerve and the auricular branch of the vagus",1,"Facial nerve fibres via the tympanic plexus may also reach it."],["Its inner surface is supplied by the tympanic branch of the glossopharyngeal nerve",1,"Via the tympanic plexus."],["The chorda tympani crosses lateral to the neck of the malleus",0,"The chorda crosses medial to the neck of the malleus, over the pars flaccida, under the mucous membrane."]]},{"id":"hn-3ec621a9","r":"hn","t":"Ear","y":2,"d":1,"s":"Concerning the auditory tube:","o":[["Its bony part is longer than its cartilaginous part",0,"The bony part is about 1 cm and the cartilaginous part about 2 cm, the reverse of the external acoustic meatus."],["The isthmus lies posteromedial to the spine of the sphenoid",1,"It is the narrowest part, at the junction of the bony and cartilaginous parts."],["It is derived from the second pharyngeal pouch",0,"It derives from the first pouch, with the middle ear and mastoid antrum."],["Its cartilaginous part is supplied by the meningeal branch of the mandibular nerve",1,"Last's: nervus spinosus to the cartilaginous part, tympanic plexus (IX) to the bony part, and the pharyngeal branch of the pterygopalatine ganglion at the ostium."]],"k":"B"},{"id":"hn-40f93f84","r":"hn","t":"Ear","y":1,"d":1,"s":"Regarding the mastoid antrum and suprameatal triangle:","o":[["The antrum lies about 15 mm deep to the suprameatal triangle",1,"The triangle is bounded by the suprameatal spine and upper and posterior tangents of the meatus."],["The antrum is present at birth",1,"The mastoid process and air cells develop later. Aeration begins in the second year."],["The lateral semicircular canal bulges into the medial wall of the aditus",1,"Just above the ridge of the facial canal."],["The roof of the antrum is formed by the squamous temporal bone",0,"The tegmen tympani of the petrous bone roofs the middle ear, antrum and canal for tensor tympani."]]},{"id":"hn-2f038176","r":"hn","t":"Scalp and face","y":1,"d":1,"s":"Concerning the scalp:","o":[["Its vessels and nerves run in the dense connective tissue layer",1,"Arteries are attached to the deep dermis, so wounds bleed freely."],["Occipitalis arises from the highest nuchal line",1,"Only occipitalis has a bony attachment. Frontalis arises from orbicularis oculi and skin."],["The greater occipital nerve is a branch of the anterior ramus of C2",0,"The greater occipital nerve is the posterior ramus of C2. The lesser occipital is the anterior ramus of C2."],["The supratrochlear and supraorbital arteries are branches of the internal carotid system",1,"They arise from the ophthalmic artery."]]},{"id":"hn-867f2326","r":"hn","t":"Scalp and face","y":1,"d":1,"s":"Regarding the sensory supply of the face:","o":[["The skin over the angle of the mandible is supplied by the great auricular nerve",1,"Last's: this is the only facial skin not supplied by the trigeminal nerve."],["The zygomaticofacial nerve supplies the hairless skin of the temple",0,"That is the zygomaticotemporal nerve. The zygomaticofacial supplies the skin over the zygomatic bone."],["The infraorbital nerve supplies the upper lip and labial gum to include the second premolar",1,"Midline to second premolar."],["The lower eyelid is supplied by the infratrochlear nerve",0,"The lower eyelid and its conjunctiva are supplied by the palpebral branches of the infraorbital nerve."]]},{"id":"hn-9c6655c5","r":"hn","t":"Face veins","y":1,"d":1,"s":"Concerning venous connections of the face with the cavernous sinus:","o":[["The angular vein connects via the superior ophthalmic vein",1,"One of the two routes bounding Last's danger area."],["The deep facial vein connects via the pterygoid plexus and emissary veins through foramen ovale",1,"And through the foramen of Vesalius if present."],["The danger area lies below the level of the deep facial vein",0,"Last's: the danger area (upper lip, nose and medial cheek) lies above the level of the deep facial vein, between the two communications."],["Retrograde thrombosis of the inferior petrosal sinus and medullary veins is usually fatal",1,"Last's: the ophthalmoplegia itself is not dangerous."]]},{"id":"hn-75f47b32","r":"hn","t":"Facial nerve branches","y":2,"d":1,"s":"Concerning the branches of the facial nerve to the face:","o":[["Division of the zygomatic branches crossing the zygomatic arch can endanger vision",1,"Inability to close the lids leads to corneal desiccation and ulceration."],["The marginal mandibular branch lies below the angle of the mandible in about 20%",1,"Relevant to submandibular incisions."],["The buccal branches supply buccinator",1,"Paralysis prevents emptying of the cheek pouch."],["The cervical branch supplies the posterior belly of digastric",0,"The cervical branch supplies platysma. The posterior belly of digastric is supplied by a branch given off just below the stylomastoid foramen."]],"k":"C"},{"id":"ll-889c9870","r":"ll","t":"Thigh nerves","y":1,"d":1,"src":"Last's text","s":"Cutaneous nerves of the thigh (Last's):","o":[["The lateral femoral cutaneous nerve is L2, 3",1,"Last's."],["The femoral branch of the genitofemoral nerve is L1",1,"The genital branch is L2."],["The posterior femoral cutaneous nerve is L5",0,"S2 (S1-3)."],["The infrapatellar branch of the saphenous nerve pierces sartorius near its origin",0,"Above its insertion; the intermediate cutaneous nerve pierces it near its origin."]]},{"id":"ll-e9c619ea","r":"ll","t":"Thigh muscles","y":1,"d":1,"src":"Last's text","s":"Muscles with dual innervation in the thigh (Last's):","o":[["Pectineus",1,"Femoral and obturator (or accessory obturator)."],["Adductor magnus",1,"Obturator and tibial part of sciatic."],["Biceps femoris",1,"Long head tibial, short head common peroneal."],["Gracilis",0,"Obturator only."]]},{"id":"ll-4d1c34e9","r":"ll","t":"Adductor canal","y":1,"d":1,"src":"Last's text","s":"The subsartorial (adductor) canal (Last's):","o":[["The femoral artery always lies between the saphenous nerve and femoral vein",1,"Last's."],["The femoral vein lies lateral to the artery at the adductor hiatus",1,"Medial at the femoral triangle."],["The femoral vein lies medial to the artery at the hiatus",0,"Lateral."],["The nerve to vastus medialis runs in the lower part of the canal",0,"In the upper part."]]},{"id":"ll-38cfa32d","r":"ll","t":"Popliteal fossa","y":1,"d":1,"src":"Last's text","s":"The popliteal fossa (Last's):","o":[["The tibial nerve is the most superficial of the main contents",1,"Last's."],["The popliteal vein lies between the artery and the nerve",1,"Last's."],["The common peroneal nerve runs lateral to the biceps tendon",0,"Medial to it, beneath the deep fascia."],["The floor from above down is popliteus, capsule, femur",0,"Femur, capsule, popliteus."]]},{"id":"ll-32ff8252","r":"ll","t":"Popliteal fossa","y":1,"d":1,"src":"Last's text","s":"Structures piercing the roof of the popliteal fossa (Last's):","o":[["The small saphenous vein",1,"Last's."],["The peroneal communicating nerve",1,"Last's."],["The lateral cutaneous nerve of the calf",1,"Last's."],["The sural nerve",0,"It pierces the deep fascia halfway down the leg."]]},{"id":"ll-8af4b148","r":"ll","t":"Knee","y":1,"d":1,"src":"Last's text","s":"Nerve supply of the knee joint (Last's):","o":[["The nerve to vastus medialis",1,"Femoral."],["The posterior division of the obturator nerve",1,"Accompanying the femoral artery through the hiatus."],["Genicular branches of the tibial nerve",1,"Last's."],["The saphenous nerve proper",0,"Not listed; its infrapatellar branch supplies skin."]]},{"id":"ll-910b8274","r":"ll","t":"Lumbar plexus","y":1,"d":1,"src":"Last's text","s":"The lumbar plexus (Last's):","o":[["The femoral nerve comes from posterior divisions of L2, 3, 4",1,"Last's."],["The obturator nerve comes from anterior divisions of L2, 3, 4",1,"Last's."],["The accessory obturator is present in about two-thirds",0,"In about one-third."],["The accessory obturator nerve supplies adductor longus",0,"It supplies pectineus."]]},{"id":"ll-03665b26","r":"ll","t":"Sacral plexus","y":1,"d":1,"src":"Last's text","s":"Branches of the sacral plexus (Last's):","o":[["The nerve to quadratus femoris is L4, 5, S1 from anterior divisions",1,"Last's."],["The inferior gluteal nerve is L5, S1, 2 from posterior divisions",1,"Last's."],["The superior gluteal nerve comes from anterior divisions",0,"From posterior divisions (extensor)."],["The nerve to obturator internus is L4, 5, S1",0,"L5, S1, 2."]]},{"id":"ll-4d720a48","r":"ll","t":"Lumbar plexus","y":1,"d":1,"src":"Last's text","s":"The iliohypogastric and ilioinguinal nerves (Last's):","o":[["The ilioinguinal is the collateral branch of the iliohypogastric",1,"Last's."],["The ilioinguinal supplies the anterior third of the scrotum",1,"And the root of the penis."],["The iliohypogastric pierces the external oblique aponeurosis 5 cm above the superficial ring",0,"About 2.5 cm above."],["The ilioinguinal enters the inguinal canal through the deep ring",0,"From the side."]]},{"id":"ll-df0f24ee","r":"ll","t":"Posterior rami","y":1,"d":1,"src":"Last's text","s":"Posterior rami (Last's):","o":[["C1, C7, C8, L4 and L5 posterior rami give no cutaneous supply",1,"Last's."],["Medial branches supply skin in the upper part of the trunk",1,"Lateral branches in the lower part."],["T12 is the dividing level between medial and lateral cutaneous branches",0,"About T6."],["All lumbar posterior rami supply skin",0,"L4 and L5 do not."]]},{"id":"ll-8648a89f","r":"ll","t":"Lateral femoral cutaneous","y":1,"d":1,"src":"Last's text","s":"The lateral femoral cutaneous nerve (Last's):","o":[["It may arise from the femoral nerve in the iliac fossa",1,"Last's."],["It lies in a tunnel about 1 cm medial to the ASIS",1,"Last's."],["Its anterior branch is L2",0,"The anterior branch is L3; the posterior branch L2."],["It supplies no peritoneum",0,"It supplies parietal peritoneum of the iliac fossa."]]},{"id":"ll-b6c86e0d","r":"ll","t":"Genitofemoral nerve","y":1,"d":1,"src":"Last's text","s":"The genitofemoral nerve (Last's):","o":[["It emerges from the anterior surface of psoas",1,"Last's."],["On the left it is crossed by the inferior mesenteric vein",1,"Last's."],["On the right it is crossed by the inferior mesenteric vein",0,"By the ileocolic artery."],["Its femoral branch supplies cremaster",0,"The genital branch supplies cremaster."]]},{"id":"ll-e337e523","r":"ll","t":"Femoral nerve","y":1,"d":1,"src":"Last's text","s":"The femoral nerve (Last's):","o":[["It lies lateral to the femoral sheath",1,"Separated from the artery."],["The nerve to vastus medialis is the largest deep branch",1,"Last's."],["The nerve to pectineus runs in front of the femoral sheath",0,"Behind it."],["The saphenous nerve emerges below the anterior border of sartorius",0,"Below the posterior border."]]},{"id":"ll-9c63e3fb","r":"ll","t":"Obturator nerve","y":1,"d":1,"src":"Last's text","s":"The obturator nerve (Last's):","o":[["It emerges from the medial border of psoas",1,"Lateral to the lumbosacral trunk."],["Its divisions straddle adductor brevis",1,"Last's."],["Its posterior division supplies adductor longus",0,"The anterior division does."],["Its anterior division pierces obturator externus",0,"The posterior division does."]]},{"id":"ll-88c269e0","r":"ll","t":"Gluteal nerves","y":1,"d":1,"src":"Last's text","s":"Gluteal region nerves (Last's):","o":[["The superior gluteal nerve leaves above piriformis",1,"Last's."],["The superior gluteal nerve ends in tensor fasciae latae",1,"Last's."],["The inferior gluteal nerve enters gluteus maximus near its insertion",0,"Near its origin (medial end)."],["The nerve to quadratus femoris lies superficial to the sciatic nerve",0,"Deep to it, against the ischium."]]},{"id":"ll-234fcbe3","r":"ll","t":"Posterior femoral cutaneous","y":1,"d":1,"src":"Last's text","s":"The posterior femoral cutaneous nerve (Last's):","o":[["It remains beneath the deep fascia below gluteus maximus",1,"Unique among cutaneous nerves."],["Its perineal branch supplies the lateral posterior scrotum",1,"Last's."],["It lies deep to the sciatic nerve",0,"Superficial."],["It ends at the popliteal fossa",0,"As far as the lower ends of gastrocnemius."]]},{"id":"ll-859108de","r":"ll","t":"Sciatic nerve","y":1,"d":1,"src":"Last's text","s":"The sciatic nerve (Last's):","o":[["It is supplied by the artery of the sciatic nerve from the inferior gluteal",1,"The remnant of the axial artery."],["It lies a fingerbreadth lateral to the semimembranosus tendon",1,"Last's."],["The tibial part supplies the short head of biceps",0,"The common peroneal part does."],["When it divides high, the tibial part pierces piriformis",0,"The peroneal part pierces piriformis."]]},{"id":"ll-08123ee7","r":"ll","t":"Common peroneal nerve","y":1,"d":1,"src":"Last's text","s":"The common peroneal nerve (Last's):","o":[["It has no muscular branches apart from a few fibres to tibialis anterior",1,"Via the recurrent genicular nerve."],["The recurrent genicular nerve supplies the superior tibiofibular joint",1,"Last's."],["It divides in the substance of peroneus brevis",0,"In peroneus longus."],["The lateral cutaneous nerve of the calf supplies the lower half of the peroneal compartment",0,"The upper half."]]},{"id":"ll-a8e5fb37","r":"ll","t":"Peroneal nerves","y":1,"d":1,"src":"Last's text","s":"The deep and superficial peroneal nerves (Last's):","o":[["The deep peroneal nerve supplies the skin of the first cleft",1,"Last's."],["The superficial peroneal nerve supplies both peronei",1,"Longus and brevis."],["The deep peroneal nerve lies medial to the dorsalis pedis artery",0,"Lateral; EHL tendon is medial to the artery."],["The superficial peroneal nerve pierces the fascia one-third down the leg",0,"Halfway down."]]},{"id":"ll-9ae86aa0","r":"ll","t":"Tibial nerve","y":1,"d":1,"src":"Last's text","s":"The tibial nerve (Last's):","o":[["It passes beneath the fibrous arch of soleus",1,"Last's."],["It divides behind the medial malleolus beneath the flexor retinaculum",1,"Last's."],["The sural nerve runs medial to the small saphenous vein at the ankle",0,"Lateral."],["The medial calcanean nerve supplies the lateral heel",0,"The weight-bearing skin of the heel."]]},{"id":"ll-922da760","r":"ll","t":"Plantar nerves","y":1,"d":1,"src":"Last's text","s":"The plantar nerves (Last's):","o":[["The medial plantar nerve supplies the first lumbrical",1,"Last's."],["The deep branch of the lateral plantar nerve supplies adductor hallucis",1,"Last's."],["The medial plantar artery lies lateral to the nerve",0,"Medial."],["The superficial branch of the lateral plantar nerve supplies the three lateral lumbricals",0,"The deep branch does."]]},{"id":"ll-569845fe","r":"ll","t":"Foot","y":1,"d":1,"src":"Last's text","s":"Concerning dorsalis pedis and some small nerves (Last's):","o":[["The anterior tibial becomes dorsalis pedis midway between the malleoli",1,"Last's."],["Dorsalis pedis lies between EHL tendon and the deep peroneal nerve",1,"Last's."],["The nerve to quadratus femoris supplies superior gemellus",0,"Inferior gemellus; obturator internus nerve supplies superior gemellus."],["The perineal branch of S4 supplies the external anal sphincter",0,"It supplies levator ani parts and coccygeus, and perianal skin."]]},{"id":"ll-9b432a06","r":"ll","t":"Lumbar plexus","y":1,"d":1,"s":"Concerning the lumbar plexus:","o":[["It forms within the substance of psoas major",1,"Most branches emerge laterally. The genitofemoral emerges anteriorly, and the obturator and lumbosacral trunk medially."],["The femoral nerve is formed from the posterior divisions of L2, L3 and L4",1,"The obturator nerve is from the anterior divisions."],["The accessory obturator nerve, when present, supplies pectineus",1,"Last's: from the posterior divisions of L3 and L4, present in about a third. It would better be called an accessory femoral nerve."],["The genitofemoral nerve emerges from the lateral border of psoas",0,"It emerges from the anterior surface of psoas and runs down on it, deep to the psoas fascia."]]},{"id":"ll-43cc75d2","r":"ll","t":"Lumbar plexus","y":2,"d":1,"s":"Regarding the genitofemoral nerve:","o":[["Its genital branch supplies cremaster",1,"It enters the coverings of the spermatic cord through the deep ring region."],["Its femoral branch supplies skin below the middle of the inguinal ligament",1,"It enters the femoral sheath in front of the femoral artery."],["It is crossed by the ureter and gonadal vessels",1,"On the left also by the left colic vessels and inferior mesenteric vein."],["It is motor to sartorius",0,"The femoral branch has no motor fibres. Sartorius is supplied by the femoral nerve."]],"k":"C"},{"id":"ll-ebeee22b","r":"ll","t":"Lateral femoral cutaneous nerve","y":1,"d":1,"s":"The lateral femoral cutaneous nerve:","o":[["Arises from the posterior divisions of L2 and L3 or from the femoral nerve",1,"Last's gives both possible origins."],["Enters the thigh about 1 cm medial to the anterior superior iliac spine",1,"In a tunnel behind or through the inguinal ligament."],["May be compressed to cause meralgia paraesthetica",1,"Also traction from transversus fibres arising from the iliac fascia."],["Supplies the skin of the medial thigh",0,"It supplies the anterolateral and lateral thigh."]]},{"id":"ll-da96e69e","r":"ll","t":"Femoral nerve","y":1,"d":1,"s":"Concerning the femoral nerve:","o":[["It enters the thigh lateral to the femoral sheath",1,"It lies in the gutter between psoas and iliacus, outside the sheath."],["It supplies iliacus within the abdomen",1,"By two or three branches."],["Its nerve to vastus medialis travels in the adductor canal and supplies the knee",1,"Hilton's law."],["The saphenous nerve crosses the femoral artery from medial to lateral in the adductor canal",0,"The saphenous nerve crosses the artery anteriorly from lateral to medial."]]},{"id":"ll-99602846","r":"ll","t":"Femoral triangle and adductor canal","y":2,"d":1,"s":"The adductor (subsartorial) canal contains the:","o":[["Femoral artery",1,"The artery always lies between the saphenous nerve and the femoral vein."],["Saphenous nerve",1,"It leaves the canal between sartorius and gracilis."],["Nerve to vastus medialis in its upper part",1,"Last's."],["Femoral vein",1,"Last's: the vein spirals from medial to the artery in the femoral triangle to lateral at the adductor hiatus."]],"k":"E"},{"id":"ll-0e3024a1","r":"ll","t":"Obturator nerve","y":1,"d":1,"s":"Regarding the obturator nerve:","o":[["It emerges from the medial border of psoas",1,"It crosses the pelvic brim medial to the sacroiliac joint."],["Its anterior division supplies adductor longus, brevis and gracilis",1,"And sometimes pectineus. It also supplies the hip joint."],["Its posterior division supplies the knee joint",1,"This explains referred knee pain in hip disease."],["Its posterior division supplies the ischial part of adductor magnus",0,"The posterior division supplies obturator externus and the adductor (pubic) part of adductor magnus. The ischial (hamstring) part is supplied by the tibial part of the sciatic nerve."]]},{"id":"ll-66e68740","r":"ll","t":"Sacral plexus","y":2,"d":1,"s":"Branches of the sacral plexus from posterior divisions include the:","o":[["Superior gluteal nerve",1,"L4, L5, S1."],["Nerve to quadratus femoris",0,"Last's: the nerve to quadratus femoris (L4, L5, S1) is from anterior divisions."],["Tibial part of the sciatic nerve",0,"The tibial part (L4 to S3) comes from anterior divisions."],["Pudendal nerve",0,"The pudendal nerve (S2 to S4) is from the anterior rami before division."]],"k":"A"},{"id":"ll-039b361e","r":"ll","t":"Gluteal region","y":1,"d":1,"s":"Concerning nerves of the gluteal region:","o":[["The superior gluteal nerve leaves the pelvis above piriformis",1,"It runs between gluteus medius and minimus and ends in tensor fasciae latae."],["The inferior gluteal nerve is L5, S1 and S2",1,"It supplies gluteus maximus."],["The nerve to obturator internus hooks around the base of the ischial spine",1,"Lateral to the pudendal vessels. It also supplies superior gemellus."],["The posterior femoral cutaneous nerve lies deep to the sciatic nerve",0,"Last's: the posterior femoral cutaneous nerve is superficial to the sciatic, and the nerve to quadratus femoris is deep to it."]]},{"id":"ll-6cd0fc91","r":"ll","t":"Sciatic nerve","y":1,"d":1,"s":"Regarding the sciatic nerve:","o":[["It emerges below piriformis, lateral to the inferior gluteal and pudendal bundles",1,"It lies on the ischium over the posterior part of the acetabulum."],["Its blood supply includes a branch of the inferior gluteal artery, a remnant of the axial artery",1,"Last's."],["The short head of biceps femoris is supplied by its tibial part",0,"The short head of biceps is supplied by the common peroneal part. All other hamstrings and the ischial part of adductor magnus are supplied by the tibial part."],["It may divide high, with the peroneal part piercing piriformis",1,"In this case the tibial part runs normally below the muscle."]]},{"id":"ll-a2f28210","r":"ll","t":"Common peroneal nerve","y":2,"d":1,"s":"The common peroneal nerve:","o":[["Divides behind the lateral femoral condyle",0,"It divides in the substance of peroneus longus, around the neck of the fibula."],["Gives rise to the sural nerve",0,"The sural nerve arises from the tibial nerve. The common peroneal gives the peroneal communicating nerve, which joins it."],["Supplies tibialis posterior",0,"Tibialis posterior is supplied by the tibial nerve."],["Gives the lateral cutaneous nerve of the calf",1,"It pierces the roof of the popliteal fossa over the lateral head of gastrocnemius."]],"k":"D"},{"id":"ll-b03a77c9","r":"ll","t":"Peroneal nerves","y":1,"d":1,"s":"Concerning the peroneal nerves:","o":[["The superficial peroneal nerve supplies peroneus longus and brevis",1,"It then perforates the deep fascia halfway down the leg."],["The deep peroneal nerve supplies extensor digitorum brevis",1,"And the skin of the first cleft."],["The deep peroneal nerve lies medial to the anterior tibial artery throughout the leg",0,"Last's: the deep peroneal nerve runs lateral to the anterior tibial vessels and lies lateral to dorsalis pedis on the foot."],["The superficial peroneal nerve supplies most of the dorsum of the foot",1,"Except the first cleft (deep peroneal) and the lateral border (sural)."]]},{"id":"ll-4663b88c","r":"ll","t":"Tibial nerve","y":1,"d":1,"s":"Regarding the tibial nerve:","o":[["It is the most superficial of the main structures in the popliteal fossa",1,"The popliteal vein always lies between the artery and the nerve."],["It supplies all the muscles arising in the popliteal fossa",1,"Including gastrocnemius, plantaris, soleus and popliteus."],["It divides into the medial and lateral plantar nerves deep to the flexor retinaculum",1,"Behind the medial malleolus."],["The medial calcanean nerve supplies the skin of the lateral border of the foot",0,"It supplies the weight-bearing skin of the heel. The sural nerve supplies the lateral border."]]},{"id":"ll-56bf0505","r":"ll","t":"Plantar nerves","y":2,"d":1,"s":"The medial plantar nerve supplies:","o":[["Adductor hallucis",0,"Adductor hallucis is supplied by the deep branch of the lateral plantar nerve."],["Flexor hallucis brevis",1,"Medial plantar: FDB, abductor hallucis, FHB and first lumbrical, like the median nerve in the hand."],["Flexor digiti minimi brevis",0,"Supplied by the superficial branch of the lateral plantar nerve."],["The first lumbrical",1,"The lateral three lumbricals are supplied by the deep branch of the lateral plantar nerve."]],"k":"B"},{"id":"ll-bcf39b50","r":"ll","t":"Popliteal fossa","y":2,"d":1,"s":"Structures piercing the roof of the popliteal fossa include the:","o":[["Tibial nerve",0,"The tibial nerve lies within the fossa, the most superficial of its main contents."],["Popliteal artery",0,"The artery is the deepest of the main contents, lying on the floor."],["Common peroneal nerve",0,"The common peroneal nerve runs along the lateral boundary medial to biceps. Its branches (lateral cutaneous nerve of the calf and peroneal communicating nerve) pierce the roof."],["Small saphenous vein",1,"Last's lists four structures piercing the roof: small saphenous vein, posterior femoral cutaneous nerve, peroneal communicating nerve and lateral cutaneous nerve of the calf."]],"k":"D"},{"id":"ll-58c42211","r":"ll","t":"Sural nerve","y":1,"d":1,"s":"The sural nerve:","o":[["Arises from the tibial nerve in the popliteal fossa",1,"It lies in the groove between the heads of gastrocnemius."],["Pierces the deep fascia halfway down the leg",1,"There it is joined by the peroneal communicating nerve."],["Lies medial to the small saphenous vein behind the medial malleolus",0,"It runs lateral to the small saphenous vein behind the lateral malleolus."],["Ends on the lateral side of the little toe",1,"It supplies the lateral border of the foot."]]},{"id":"ll-52e07ef4","r":"ll","t":"Lower limb myotomes","y":1,"d":1,"s":"Regarding the segmental supply of lower limb movements:","o":[["Hip flexion and adduction are L2 and L3",1,"Hip extension and abduction are L4 and L5."],["Knee extension is L3 and L4",1,"Knee flexion is L5 and S1."],["Ankle plantarflexion is S1 and S2",1,"Dorsiflexion is L4 and L5."],["Inversion of the foot is S1",0,"Inversion (tibialis anterior and posterior) is L4. Eversion is L5 and S1."]]},{"id":"ll-6fbc32db","r":"ll","t":"Lower limb myotomes","y":2,"d":1,"s":"Concerning nerve supply anomalies noted by Last:","o":[["Tibialis posterior is supplied by L4 although it is a plantarflexor",1,"It matches its inverting partner, tibialis anterior."],["Gluteus maximus and obturator internus are L5, S1 and S2",1,"Other buttock muscles are L4, L5 and S1."],["The short head of biceps femoris is supplied by the common peroneal part of the sciatic nerve",1,"It migrated from the extensor compartment."],["Pectineus may receive supply from both femoral and obturator nerves",1,"Pectineus, adductor magnus and biceps femoris all have dual supply."]],"k":"E"},{"id":"ll-b1975c74","r":"ll","t":"Lower limb dermatomes","y":1,"d":1,"s":"Regarding dermatomes of the lower limb:","o":[["L1 supplies the inguinal region and anterior scrotum",1,"Last's."],["L5 supplies the dorsum of the foot and great toe",1,"Also the lateral leg."],["S1 supplies the lateral border of the foot and sole",1,"And the lateral malleolus."],["S3 supplies the posterior thigh",0,"S2 supplies the posterior thigh and leg. S3 supplies the sitting area of the buttock and posterior scrotum."]]},{"id":"ll-ce556f1f","r":"ll","t":"Hip joint","y":1,"d":1,"s":"Concerning the hip joint:","o":[["The main blood supply to the femoral head in adults is from retinacular branches of the medial circumflex femoral artery",1,"The artery of the ligamentum teres is minor in adults."],["The iliofemoral ligament resists extension",1,"It is the strongest ligament in the body."],["It is supplied by the femoral, obturator and sciatic nerves",1,"Including the nerve to quadratus femoris."],["The neck of the femur ossifies from a separate epiphysis",0,"Last's: the neck is the upper end of the shaft and ossifies as part of it."]]},{"id":"ll-c4491357","r":"ll","t":"Knee joint","y":2,"d":1,"s":"The knee joint receives nerve supply from the:","o":[["Femoral nerve via the nerve to vastus medialis",1,"Last's (Hilton's law)."],["Genicular branches of the tibial and common peroneal nerves",1,"From the sciatic nerve."],["Posterior division of the obturator nerve",1,"Running with the femoral artery through the adductor hiatus."],["Saphenous nerve via its infrapatellar branch",1,"It supplies the front of the knee and patellar plexus."]],"k":"E"},{"id":"ll-78f83af9","r":"ll","t":"Ossification lower limb","y":1,"d":1,"s":"Regarding ossification in the lower limb:","o":[["The centre for the lower end of the femur appears at birth and is medicolegal evidence of maturity",1,"Last's."],["The fibula is exceptional in that its upper (growing) end ossifies later than its lower end",1,"Head at 4 years, lower end at 1 year."],["The cuboid ossifies at about 9 months of fetal life",1,"Its presence is also evidence of maturity."],["Most growth in length of the lower limb occurs at the hip",0,"Growth proceeds more rapidly at the knee than at the hip or ankle."]]},{"id":"ll-bdb6fe07","r":"ll","t":"Pelvic and lower limb vessels","y":2,"d":1,"s":"Concerning veins of the lower limb:","o":[["The great saphenous vein marks the preaxial border of the limb",1,"The small saphenous marks the postaxial border."],["The great saphenous vein passes in front of the medial malleolus with the saphenous nerve",1,"A site for venous cutdown."],["The femoral vein lies lateral to the femoral artery at the adductor hiatus",1,"Last's: it spirals from medial (in the triangle) to lateral (at the hiatus)."],["The small saphenous vein drains into the femoral vein",0,"It pierces the roof of the popliteal fossa to drain into the popliteal vein."]],"k":"C"},{"id":"sk-3631de35","r":"sk","t":"Skull base bones","y":1,"d":1,"src":"Last's text","s":"Concerning the sphenoid and palatine bones (Last's):","o":[["The lateral pterygoid plate attaches at the anterior pole of foramen ovale",1,"Last's. (Last's p. 653)"],["The pyramidal process of the palatine bone fills the pterygoid notch",1,"Last's. (Last's p. 653)"],["The lateral pterygoid plate extends back and medially into the nasopharynx",0,"It extends back and laterally into the infratemporal fossa. (Last's p. 653)"],["The perpendicular plate of the palatine bone forms the lateral wall of the pterygopalatine fossa",0,"With the medial pterygoid plate it forms the medial wall. (Last's p. 653)"]]},{"id":"sk-e0e603ee","r":"sk","t":"Anterior cranial fossa","y":1,"d":1,"src":"Last's text","s":"The anterior cranial fossa (Last's):","o":[["The anterior margin of the prechiasmatic groove divides anterior from middle fossae centrally",1,"Last's. (Last's p. 653)"],["The jugum joins the two lesser wings",1,"And articulates in front with the cribriform plate. (Last's p. 653)"],["The squamous part of the frontal bone is the largest contributor to its floor",0,"The orbital part is the largest contributor. (Last's p. 653)"],["The foramen caecum lies in front of the crista galli and above the frontal crest",0,"It lies behind the lower end of the frontal crest. (Last's p. 653)"]]},{"id":"sk-4f2009dc","r":"sk","t":"Middle cranial fossa","y":1,"d":1,"src":"Last's text","s":"Dural attachments around the sella (Last's):","o":[["A dural flange between middle and posterior clinoids separates cavernous sinus from pituitary fossa",1,"Last's. (Last's p. 653)"],["The anterior clinoid tip carries the ridge continuing as the free tentorial edge",1,"Last's. (Last's p. 653)"],["The free edge ridge passes medial to the posterior clinoid process",0,"It passes lateral to it. (Last's p. 653)"],["The spheno-occipital synchondrosis ossifies at about 15 years",0,"At the twenty-fifth year. (Last's p. 653)"]]},{"id":"sk-507b07f4","r":"sk","t":"Skull ossification","y":1,"d":1,"src":"Last's text","s":"Ossification and the ethmoid (Last's):","o":[["The floors of the middle and posterior fossae ossify in cartilage",1,"Last's. (Last's p. 653)"],["The vault and face ossify in membrane",1,"Last's. (Last's p. 653)"],["The lacrimal bone completes the ethmoid labyrinth posteriorly",0,"Anteriorly; the sphenoidal concha and orbital process of palatine complete it posteriorly. (Last's p. 653)"],["The roof of the ethmoid labyrinth is the cribriform plate",0,"It is the orbital part of the frontal bone. (Last's p. 653)"]]},{"id":"sk-175aaf2f","r":"sk","t":"Ethmoid","y":1,"d":1,"src":"Last's text","s":"The ethmoid labyrinth:","o":[["The infundibulum leads from the frontal sinus to the middle meatus",1,"Via the frontonasal duct. (Last's p. 653)"],["The superior and middle conchae arise from a common stem",1,"And diverge posteriorly. (Last's p. 653)"],["The superior concha is the larger of the two ethmoidal conchae",0,"The middle concha is larger. (Last's p. 653)"],["The middle concha articulates posteriorly with the perpendicular plate of the palatine just above the sphenopalatine foramen",0,"Just below the sphenopalatine foramen. (Last's p. 653)"]]},{"id":"sk-dadc3938","r":"sk","t":"Pia mater","y":1,"d":1,"src":"Last's text","s":"The pia mater (Last's):","o":[["Nothing intervenes between pia and the underlying nervous tissue",1,"Last's. (Last's p. 559)"],["It fuses with the epineurium of cranial and spinal nerves",1,"Last's. (Last's p. 559)"],["It is avascular",0,"It contains blood vessels, like periosteum. (Last's p. 559)"],["Cerebral arteries are tightly adherent to their pial sheaths",0,"They lie loose in pial sheaths in a CSF-containing space. (Last's p. 559)"]]},{"id":"sk-80101b3b","r":"sk","t":"Arachnoid","y":1,"d":1,"src":"Last's text","s":"The arachnoid mater and subdural space (Last's):","o":[["The subdural space contains only a thin film of tissue fluid",1,"Last's. (Last's p. 559)"],["Dura and arachnoid blend at the aqueduct of the cochlea",1,"The sole exception. (Last's p. 559)"],["Vessels run along between dura and arachnoid",0,"They pierce both at the same place, never running between them. (Last's p. 559)"],["Dura and arachnoid become continuous with each other like the pleurae",0,"Unlike the pleurae, they never become continuous. (Last's p. 559)"]]},{"id":"sk-e830bebc","r":"sk","t":"Arachnoid","y":1,"d":1,"src":"Last's text","s":"Arachnoid villi and granulations:","o":[["They are most numerous in the superior sagittal sinus and its lakes",1,"Last's. (Last's p. 559)"],["In children they are discrete",1,"Becoming aggregated into Pacchionian bodies with age. (Last's p. 559)"],["The spinal subarachnoid space ends at L2",0,"At S2. (Last's p. 559)"],["The spinal web-like strands form a complete anterior septum",0,"They form an incomplete posterior median septum. (Last's p. 559)"]]},{"id":"sk-78b072b0","r":"sk","t":"Cisterns","y":1,"d":1,"src":"Last's text","s":"The basal cisterns (Last's):","o":[["The cisterna magna is the largest cistern",1,"Last's. (Last's p. 559)"],["The cisterna magna contains the vertebral artery and PICA laterally",1,"Last's. (Last's p. 559)"],["The pontine cistern receives CSF from the median aperture",0,"From the lateral apertures; the median aperture opens to the cisterna magna. (Last's p. 559)"],["The pontine cistern contains the third and fourth cranial nerves",0,"Fifth to twelfth; III and IV are in the interpeduncular cistern. (Last's p. 559)"]]},{"id":"sk-384111c9","r":"sk","t":"Cisterns","y":1,"d":1,"src":"Last's text","s":"The interpeduncular and chiasmatic cisterns:","o":[["The interpeduncular cistern lies between dorsum sellae and cerebral peduncles",1,"Last's. (Last's p. 559)"],["It contains the pituitary stalk",1,"Last's. (Last's p. 559)"],["The chiasmatic cistern lies below the optic chiasma",0,"Above the chiasma, beneath the rostrum. (Last's p. 559)"],["The anterior communicating artery lies in the interpeduncular cistern",0,"In the chiasmatic cistern. (Last's p. 559)"]]},{"id":"sk-a04bfecd","r":"sk","t":"Dura mater","y":1,"d":1,"src":"Last's text","s":"The outer layer of the dura (Last's):","o":[["It is periosteum",1,"Last's. (Last's p. 560)"],["It is continuous with pericranium around every foramen",1,"Last's. (Last's p. 560)"],["It continues into the spinal dura",0,"It is not prolonged into the vertebral canal. (Last's p. 560)"],["It is invaginated by cranial nerves",0,"It is never invaginated by any cranial nerve. (Last's p. 560)"]]},{"id":"sk-8aeecf58","r":"sk","t":"Dura mater","y":1,"d":1,"src":"Last's text","s":"Concerning the dura mater:","o":[["Over the vault it strips easily from bone",1,"Over the base only with difficulty. (Last's p. 560)"],["Middle meningeal vessels are usually described as extradural",1,"Last's. (Last's p. 560)"],["The venous sinuses lie outside the outer layer",0,"Between the two layers. (Last's p. 560)"],["The inner layer leaves the outer at the jugular foramen to form spinal dura",0,"At the foramen magnum. (Last's p. 560)"]]},{"id":"sk-6294ba22","r":"sk","t":"Tentorium","y":1,"d":1,"src":"Last's text","s":"The tentorium cerebelli (Last's):","o":[["Its attached margin carries the transverse and superior petrosal sinuses",1,"Last's. (Last's p. 560)"],["Its free margin contains no venous sinus",1,"Last's. (Last's p. 560)"],["Its free margin lies lower than its bony attachment",0,"It lies at a higher level. (Last's p. 560)"],["The straight sinus slopes at less than 30 degrees in the intact dura",0,"More steeply than 45 degrees. (Last's p. 560)"]]},{"id":"sk-9be3837d","r":"sk","t":"Tentorium","y":1,"d":1,"src":"Last's text","s":"Regarding the free margin of the tentorium:","o":[["It is traceable forwards to the anterior clinoid process",1,"Last's. (Last's p. 560)"],["The roof medial to it is pierced by III and IV",1,"Last's. (Last's p. 560)"],["It is attached to the posterior clinoid processes",0,"The attached margin is fixed to the posterior clinoids; the free margin reaches the anterior clinoids. (Last's p. 560)"],["It falls down if the tentorium is divided",0,"The tentorium falls if the falx is divided. (Last's p. 560)"]]},{"id":"sk-c3a09658","r":"sk","t":"Falx","y":1,"d":1,"src":"Last's text","s":"The falx cerebri (Last's):","o":[["Its anterior end projects into the foramen caecum like an enlarged Sharpey's fibre",1,"Last's. (Last's p. 561)"],["Its free lower border contains the inferior sagittal sinus",1,"Lying just above the corpus callosum. (Last's p. 561)"],["The superior sagittal sinus begins at the crista galli",0,"A short distance above the foramen caecum. (Last's p. 561)"],["The superior sagittal sinus narrows as it passes back",0,"It becomes progressively broader. (Last's p. 561)"]]},{"id":"sk-5942c35d","r":"sk","t":"Falx","y":1,"d":1,"src":"Last's text","s":"The falx cerebelli and diaphragma sellae (Last's):","o":[["The falx cerebelli lodges the occipital sinus",1,"Last's. (Last's p. 561)"],["The diaphragma sellae is perforated for the pituitary stalk",1,"Last's. (Last's p. 561)"],["The falx cerebelli extends to the anterior margin of the foramen magnum",0,"To the posterior margin. (Last's p. 561)"],["The diaphragma sellae is formed from the outer dural layer",0,"From the inner layer. (Last's p. 561)"]]},{"id":"sk-cda6b4c6","r":"sk","t":"Dural arteries","y":1,"d":1,"src":"Last's text","s":"Arterial supply of the dura (Last's):","o":[["The accessory meningeal artery enters through foramen ovale",1,"A branch of the maxillary. (Last's p. 562)"],["Posterior fossa dura receives meningeal branches of the vertebral",1,"Entering at the foramen magnum. (Last's p. 562)"],["The inner dural layer has a rich blood supply",0,"It needs very little; the outer layer is richly supplied. (Last's p. 562)"],["The accessory meningeal artery supplies the anterior cranial fossa",0,"It supplies dura over the cavernous sinus. (Last's p. 562)"]]},{"id":"sk-6b6f36be","r":"sk","t":"Middle meningeal artery","y":1,"d":1,"src":"Last's text","s":"The middle meningeal artery (Last's):","o":[["Passes between the two roots of the auriculotemporal nerve",1,"Last's. (Last's p. 562)"],["Its veins lie between it and the bone",1,"The veins are responsible for the grooves. (Last's p. 562)"],["Its anterior branch lies over the postcentral gyrus",0,"Over the precentral gyrus, so haemorrhage presses on the motor area. (Last's p. 562)"],["Its posterior branch haemorrhage may cause ipsilateral deafness",0,"Contralateral deafness, pressure on the auditory area. (Last's p. 562)"]]},{"id":"sk-01b93205","r":"sk","t":"Middle meningeal artery","y":1,"d":1,"src":"Last's text","s":"Concerning the middle meningeal artery:","o":[["Near the pterion it often lies in a bony tunnel for a centimetre or more",1,"Last's. (Last's p. 562)"],["Its main purpose is to supply the vault bones",1,"It does not supply the brain. (Last's p. 562)"],["Scalping causes necrosis of the underlying bone",0,"Very little blood reaches the bones from scalp vessels. (Last's p. 562)"],["There are two frontal diploic veins on each side",0,"One frontal, two parietal and one occipital. (Last's p. 562)"]]},{"id":"sk-0b9dabbf","r":"sk","t":"Middle meningeal artery","y":1,"d":1,"src":"Last's text","s":"Surface markings (Last's):","o":[["The pterion lies 3 cm above the midpoint of the zygomatic arch",1,"Last's. (Last's p. 562)"],["Foramen spinosum lies just above the articular eminence",1,"Last's. (Last's p. 562)"],["Most middle meningeal veins drain to the pterygoid plexus",0,"Most join the sphenoparietal sinus. (Last's p. 562)"],["The posterior branch is exposed above the mastoid at the level of the lower orbital margin",0,"At the level of the upper margin of the orbit. (Last's p. 562)"]]},{"id":"sk-199ce67e","r":"sk","t":"Dural nerves","y":1,"d":1,"src":"Last's text","s":"Nerve supply of the dura (Last's):","o":[["The tentorial nerves supply the falx and upper surface of the tentorium",1,"Last's. (Last's p. 562)"],["The posterior fossa is supplied by IX and X",1,"Last's. (Last's p. 562)"],["The under surface of the tentorium is supplied by the tentorial nerves",0,"By IX and X. (Last's p. 562)"],["Dura around the foramen magnum is supplied by C4 to C6",0,"By the upper three cervical nerves. (Last's p. 562)"]]},{"id":"sk-4d24ad19","r":"sk","t":"Venous sinuses","y":1,"d":1,"src":"Last's text","s":"The dural venous sinuses (Last's):","o":[["The inferior sagittal and straight sinuses do not lie between the two dural layers",1,"They lie within folds of the inner layer. (Last's p. 563-4)"],["They contain no valves",1,"Last's. (Last's p. 563-4)"],["The superior sagittal sinus drains the frontal pole",0,"It does not drain the frontal pole. (Last's p. 563-4)"],["Superior cerebral veins enter with the bloodstream",0,"Obliquely against the flow. (Last's p. 563-4)"]]},{"id":"sk-2b30d67f","r":"sk","t":"Venous sinuses","y":1,"d":1,"src":"Last's text","s":"The sagittal and straight sinuses:","o":[["The superior sagittal usually turns to the right",1,"Last's. (Last's p. 563-4)"],["The straight sinus usually turns to the left",1,"Last's. (Last's p. 563-4)"],["The straight sinus receives the superior sagittal sinus",0,"It receives the inferior sagittal sinus, basal veins and great cerebral vein. (Last's p. 563-4)"],["The inferior sagittal sinus begins at the crista galli",0,"Some little distance above it. (Last's p. 563-4)"]]},{"id":"sk-1a223979","r":"sk","t":"Venous sinuses","y":1,"d":1,"src":"Last's text","s":"The transverse and sigmoid sinuses (Last's):","o":[["The transverse sinus grooves the mastoid angle of the parietal bone",1,"Last's. (Last's p. 563-4)"],["The transverse sinus is marked along the superior nuchal line",1,"Last's. (Last's p. 563-4)"],["The smaller transverse sinus receives the superior sagittal",0,"The larger one does, usually the right. (Last's p. 563-4)"],["The jugular bulb occupies the anterior compartment of the jugular foramen",0,"The posterior and largest compartment. (Last's p. 563-4)"]]},{"id":"sk-1945e740","r":"sk","t":"Venous sinuses","y":1,"d":1,"src":"Last's text","s":"Connections of the sigmoid and occipital sinuses:","o":[["The mastoid emissary vein joins the posterior auricular vein",1,"Last's. (Last's p. 563-4)"],["The occipital sinus drains the choroid plexus of the fourth ventricle",1,"Last's. (Last's p. 563-4)"],["The posterior condylar emissary vein joins the pterygoid plexus",0,"It joins the suboccipital plexus. (Last's p. 563-4)"],["Veins accompany the vertebral and basilar arteries intracranially",0,"No veins accompany them. (Last's p. 563-4)"]]},{"id":"sk-0b7b6d66","r":"sk","t":"Cavernous sinus","y":1,"d":1,"src":"Last's text","s":"The cavernous sinus (Last's):","o":[["It receives blood from three sources",1,"Orbit, vault bones and cerebral hemisphere. (Last's p. 564-6)"],["It drains by superior and inferior petrosal sinuses and a vein to the pterygoid plexus",1,"Last's. (Last's p. 564-6)"],["Its capacity is about 15 ml",0,"About 1.5 ml. (Last's p. 564-6)"],["It is free of septa",0,"It is intersected by numerous fibrous septa. (Last's p. 564-6)"]]},{"id":"sk-fb5f783e","r":"sk","t":"Cavernous sinus","y":1,"d":1,"src":"Last's text","s":"Walls of the cavernous sinus:","o":[["III, IV, V1 and V2 lie in the lateral wall",1,"Last's. (Last's p. 564-6)"],["The anterior wall plugs the medial end of the superior orbital fissure",1,"Last's. (Last's p. 564-6)"],["The lateral wall attaches lateral to foramen ovale",0,"Medial to foramen ovale and Meckel's cave. (Last's p. 564-6)"],["The medial wall is entirely inner dura",0,"Mostly endosteum of the sphenoid body, completed by inner dura beside the pituitary fossa. (Last's p. 564-6)"]]},{"id":"sk-03ebd6c8","r":"sk","t":"Cavernous sinus","y":1,"d":1,"src":"Last's text","s":"Relations of the cavernous sinus (Last's):","o":[["The trigeminal cave lies posteroinferiorly in the floor of the middle fossa",1,"Last's. (Last's p. 566)"],["The uncus lies further back and somewhat above the roof",1,"Last's. (Last's p. 566)"],["The sphenoidal air sinus lies behind the pituitary fossa at a higher level",0,"Towards the front of the fossa at a lower level, increasing posteriorly with age. (Last's p. 566)"],["The cerebral peduncle lies anteriorly",0,"Posteriorly; the orbital apex lies anteriorly. (Last's p. 566)"]]},{"id":"sk-408534d2","r":"sk","t":"Cavernous sinus","y":2,"d":1,"src":"Last's text","s":"Lying within the cavity of the cavernous sinus, rather than in its lateral wall, is/are:","o":[["The oculomotor nerve",0,"Lateral wall. (Last's p. 566)"],["The internal carotid artery",1,"Last's. (Last's p. 566)"],["The maxillary nerve",0,"Lateral wall. (Last's p. 566)"],["The abducent nerve",1,"Last's. (Last's p. 566)"]],"k":"B"},{"id":"sk-a5fdea2c","r":"sk","t":"Cavernous sinus","y":1,"d":1,"src":"Last's text","s":"The internal carotid artery in the cavernous sinus (Last's):","o":[["Enters the posterior part of the sinus from foramen lacerum",1,"Last's. (Last's p. 566)"],["Deeply grooves the medial wall of the sinus",1,"Last's. (Last's p. 566)"],["Pierces the roof lateral to the anterior clinoid process",0,"Medial to the anterior clinoid process. (Last's p. 566)"],["Carries a sympathetic plexus from the middle cervical ganglion",0,"From the superior cervical ganglion. (Last's p. 566)"]]},{"id":"sk-0fce4771","r":"sk","t":"Cavernous sinus","y":1,"d":1,"src":"Last's text","s":"Nerves in the cavernous sinus (Last's):","o":[["The abducent runs on the lateral side of the internal carotid",1,"Further forward it lies below the upturning artery. (Last's p. 567)"],["No nerve lies lateral to the trigeminal branches",1,"Last's. (Last's p. 567)"],["No nerve lies medial to the oculomotor",0,"No nerve lies medial to the abducent. (Last's p. 567)"],["The trochlear enters the superior orbital fissure below and medial to the oculomotor",0,"At a higher level and lateral. (Last's p. 567)"]]},{"id":"sk-a06d7362","r":"sk","t":"Cavernous sinus","y":1,"d":1,"src":"Last's text","s":"The ophthalmic division in the cavernous sinus:","o":[["Its lacrimal and frontal branches pass through the lateral part of the fissure",1,"Last's. (Last's p. 567)"],["Its nasociliary branch enters the fibrous ring",1,"Last's. (Last's p. 567)"],["All three branches are crossed laterally by the oculomotor nerve",0,"Crossed medially. (Last's p. 567)"],["It gives off tentorial branches at the posterior end of the sinus",0,"At the anterior end. (Last's p. 567)"]]},{"id":"sk-5d08e33f","r":"sk","t":"Cavernous sinus","y":1,"d":1,"src":"Last's text","s":"Veins entering the cavernous sinus (Last's):","o":[["The superior ophthalmic vein enters the anterior end directly",1,"Last's. (Last's p. 567)"],["The inferior ophthalmic veins drain partly to the pterygoid plexus",1,"Through the inferior orbital fissure. (Last's p. 567)"],["The superficial middle cerebral vein enters through the lateral wall",0,"It pierces the roof near the emerging carotid. (Last's p. 567)"],["Blood can only flow from front to back in the sinus",0,"It can flow in either direction. (Last's p. 567)"]]},{"id":"sk-bee8f71e","r":"sk","t":"Cavernous sinus","y":1,"d":1,"src":"Last's text","s":"Sinuses connected with the cavernous sinus:","o":[["The sphenoparietal sinus runs beneath the edge of the lesser wing",1,"Into the roof of the cavernous sinus. (Last's p. 567)"],["The inferior petrosal sinus empties the bulk of its blood",1,"Last's. (Last's p. 567)"],["The superior petrosal sinus is larger than the inferior",0,"The inferior petrosal is larger. (Last's p. 567)"],["The superior petrosal sinus drains into the jugular bulb",0,"Into the commencement of the sigmoid sinus. (Last's p. 567)"]]},{"id":"sk-3a64b19a","r":"sk","t":"Cavernous sinus","y":1,"d":1,"src":"Last's text","s":"The inferior petrosal sinus (Last's):","o":[["Leaves beneath the petroclinoid ligament",1,"Last's. (Last's p. 567)"],["Enters the anterior compartment of the jugular foramen medial to IX",1,"Last's. (Last's p. 567)"],["Is the lowest tributary of the internal jugular vein",0,"It is the first (highest) tributary. (Last's p. 567)"],["Runs along the petro-occipital suture outside the dura",0,"Between the two layers of dura. (Last's p. 567)"]]},{"id":"sk-7a728c37","r":"sk","t":"Cavernous sinus","y":1,"d":1,"src":"Last's text","s":"Other connections of the cavernous sinus:","o":[["An emissary vein usually passes through foramen ovale to the pterygoid plexus",1,"Last's. (Last's p. 567)"],["The foramen of Vesalius lies medial to foramen ovale",1,"Last's. (Last's p. 567)"],["The intercavernous sinuses lie in the diaphragma sellae only",0,"Mainly between the dural layers of the pituitary fossa, with a few in the diaphragma. (Last's p. 567)"],["The petroclinoid ligament joins the petrous apex to the anterior clinoid",0,"To the side of the dorsum sellae. (Last's p. 567)"]]},{"id":"sk-6db5f5ec","r":"sk","t":"Cavernous sinus thrombosis","y":1,"d":1,"src":"Last's text","s":"Cavernous sinus thrombosis (Last's):","o":[["The danger area of the face lies above the level of the deep facial vein",1,"Last's. (Last's p. 568)"],["It includes the upper lip, nose and medial cheek",1,"Last's. (Last's p. 568)"],["The ophthalmoplegia is usually fatal",0,"It is not dangerous; retrograde inferior petrosal and medullary thrombosis is usually fatal. (Last's p. 568)"],["The facial vein communicates directly with the sinus through foramen ovale",0,"The angular vein via the superior ophthalmic; the deep facial vein via the pterygoid plexus. (Last's p. 568)"]]},{"id":"sk-72c64871","r":"sk","t":"Extradural haemorrhage","y":1,"d":1,"src":"Last's text","s":"Extradural haemorrhage (Last's):","o":[["Usually involves the frontal branch of the middle meningeal",1,"Last's. (Last's p. 568)"],["May cause contralateral hemiparesis",1,"Pressure on the motor area. (Last's p. 568)"],["Causes pupil dilatation on the opposite side",0,"On the injured side, from III compression. (Last's p. 568)"],["Compression of the anterior cerebral artery gives occipital ischaemia",0,"The posterior cerebral artery. (Last's p. 568)"]]},{"id":"sk-f39b37f2","r":"sk","t":"Subdural haemorrhage","y":1,"d":1,"src":"Last's text","s":"Subdural haemorrhage (Last's):","o":[["Usually from a superior cerebral vein entering the superior sagittal sinus",1,"Last's. (Last's p. 568)"],["Symptoms develop more slowly than with extradural",1,"Venous blood. (Last's p. 568)"],["Blood collects between arachnoid and pia",0,"Between dura and arachnoid. (Last's p. 568)"],["Symptoms are typically more severe than extradural",0,"Less severe. (Last's p. 568)"]]},{"id":"sk-3eccffcc","r":"sk","t":"Anterior cranial fossa","y":1,"d":1,"src":"Last's text","s":"Contents of the anterior cranial fossa (Last's):","o":[["Up to 20 olfactory filaments pierce the meninges on each side",1,"Last's. (Last's p. 568)"],["The anterior ethmoidal nerve enters near the back of the cribriform plate",1,"Last's. (Last's p. 568)"],["A patent vein through the foramen caecum is present in about 50%",0,"In only 1%. (Last's p. 568)"],["The anterior ethmoidal nerve leaves through the foramen caecum",0,"Through a slit beside the front of the crista galli. (Last's p. 568)"]]},{"id":"sk-a75fe371","r":"sk","t":"Middle cranial fossa","y":1,"d":1,"src":"Last's text","s":"Contents of the middle cranial fossa (Last's):","o":[["The median part contains the pituitary and optic chiasma",1,"And intercavernous sinuses. (Last's p. 568-9)"],["The lateral parts contain the greater and lesser petrosal nerves",1,"Last's. (Last's p. 568-9)"],["The lateral parts contain the optic nerves",0,"Median part. (Last's p. 568-9)"],["The median part contains the cavernous sinuses",0,"Lateral parts. (Last's p. 568-9)"]]},{"id":"sk-56bdd98d","r":"sk","t":"Pituitary","y":1,"d":1,"src":"Last's text","s":"The pituitary gland (Last's):","o":[["The intercavernous sinuses lie below it",1,"Last's. (Last's p. 569)"],["Large sphenoid sinuses may extend back beneath the fossa",1,"Last's. (Last's p. 569)"],["Pia and arachnoid around it are usually fused with the dura of the fossa",0,"They lie against but not fused with the dura. (Last's p. 569)"],["The stalk slopes downwards and backwards to the diaphragma",0,"Downwards and forwards. (Last's p. 569)"]]},{"id":"sk-751cac0e","r":"sk","t":"Pituitary","y":1,"d":1,"src":"Last's text","s":"Pituitary development and lobes:","o":[["The adenohypophysis arises from Rathke's pouch",1,"Ectodermal. (Last's p. 569)"],["The neurohypophysis includes the median eminence",1,"With the pars nervosa and infundibular stalk. (Last's p. 569)"],["The pars intermedia belongs to the neurohypophysis",0,"To the adenohypophysis. (Last's p. 569)"],["The pars tuberalis is a downgrowth of the third ventricle floor",0,"It is part of the adenohypophysis. (Last's p. 569)"]]},{"id":"sk-3983eb1f","r":"sk","t":"Pituitary","y":1,"d":1,"src":"Last's text","s":"Pituitary histology (Last's):","o":[["The pars distalis is about 75% of the gland",1,"Last's. (Last's p. 569)"],["Acidophils secrete growth hormone and prolactin",1,"Last's. (Last's p. 569)"],["Basophils make up 35% of pars distalis cells",0,"15%; acidophils 35%, chromophobes 50%. (Last's p. 569)"],["The pars intermedia probably secretes ACTH",0,"Probably MSH. (Last's p. 569)"]]},{"id":"sk-2f708f80","r":"sk","t":"Pituitary","y":1,"d":1,"src":"Last's text","s":"The pars nervosa (Last's):","o":[["Contains about 100 000 unmyelinated axons",1,"Last's. (Last's p. 569)"],["Oxytocin comes mainly from paraventricular cells",1,"Last's. (Last's p. 569)"],["Vasopressin comes mainly from paraventricular cells",0,"From supraoptic cells. (Last's p. 569)"],["Pituicytes resemble oligodendrocytes",0,"They resemble astrocytes. (Last's p. 569)"]]},{"id":"sk-9a161498","r":"sk","t":"Pituitary","y":1,"d":1,"src":"Last's text","s":"Pituitary blood supply and approach:","o":[["Hypophyseal arteries arise from ICA, ACA and PCA",1,"Last's. (Last's p. 569-70)"],["Portal vessels carry hypophysiotropic hormones to the anterior lobe",1,"Last's. (Last's p. 569-70)"],["Posterior lobe hormones reach it by portal vessels",0,"They are stored in the axons that made them. (Last's p. 569-70)"],["The transsphenoidal approach enters the nasal cavity proper",0,"The nasal cavity itself is not entered (submucosal). (Last's p. 569-70)"]]},{"id":"sk-5e35d543","r":"sk","t":"ICA intracranial","y":1,"d":1,"src":"Last's text","s":"The supraclinoid internal carotid (Last's):","o":[["Curves immediately backwards on the roof of the sinus",1,"Then upwards lateral to the chiasma. (Last's p. 570)"],["Gives the ophthalmic artery immediately above the roof",1,"Last's. (Last's p. 570)"],["In the optic canal the artery lies above and medial to the nerve",0,"The artery is below and lateral. (Last's p. 570)"],["The carotid siphon is a U opening forwards",0,"Opening backwards. (Last's p. 570)"]]},{"id":"sk-88955211","r":"sk","t":"Oculomotor nerve","y":1,"d":1,"src":"Last's text","s":"The oculomotor nerve in the middle fossa (Last's):","o":[["Runs parallel to and just below the posterior communicating artery",1,"Aneurysms may damage it. (Last's p. 570)"],["Pupillary fibres lie on the outer part of the nerve",1,"Last's. (Last's p. 570)"],["Diabetic infarction typically affects the pupillary fibres first",0,"It may spare them. (Last's p. 570)"],["Pupillary fibres lie ventral at the brainstem then lateral",0,"First dorsal, then medial, then inferior. (Last's p. 570)"]]},{"id":"sk-dcf17d08","r":"sk","t":"Trochlear nerve","y":1,"d":1,"src":"Last's text","s":"The trochlear nerve in the middle fossa:","o":[["Curls round the peduncle below the posterior cerebral artery",1,"Above the superior cerebellar. (Last's p. 570)"],["Lies lateral to the oculomotor in the interpeduncular cistern",1,"Last's. (Last's p. 570)"],["Enters the middle fossa in front of the oculomotor nerve",0,"Just behind it. (Last's p. 570)"],["Runs above the free margin of the tentorium",0,"Just below it, in the posterior fossa. (Last's p. 570)"]]},{"id":"sk-20837f67","r":"sk","t":"Trigeminal ganglion","y":1,"d":1,"src":"Last's text","s":"The trigeminal ganglion (Last's):","o":[["The nerve leaves a groove about 5 mm wide on the petrous border",1,"Last's. (Last's p. 570)"],["It passes beneath the superior petrosal sinus",1,"Last's. (Last's p. 570)"],["The greater petrosal nerve lies above the cave",0,"Beneath the cave. (Last's p. 570)"],["The mouth of the cave opens forwards into the middle fossa",0,"Backwards into the posterior fossa. (Last's p. 570)"]]},{"id":"sk-418d1944","r":"sk","t":"Trigeminal ganglion","y":1,"d":1,"src":"Last's text","s":"Blood and nerve supply of the trigeminal ganglion:","o":[["The accessory meningeal artery brings appreciable blood",1,"Along the mandibular division. (Last's p. 571)"],["The nervus spinosus supplies its epineurium",1,"Last's. (Last's p. 571)"],["Its nerve supply is from the tentorial nerve",0,"From the nervus spinosus. (Last's p. 571)"],["The mandibular division touches the lateral wall of the cavernous sinus",0,"It never contacts it. (Last's p. 571)"]]},{"id":"sk-2b682de3","r":"sk","t":"Petrosal nerves","y":1,"d":1,"src":"Last's text","s":"The petrosal nerves (Last's):","o":[["The greater petrosal runs beneath the trigeminal ganglion",1,"Between the dural layers. (Last's p. 571)"],["The Vidian nerve enters the posterior end of the pterygoid canal",1,"In the foramen lacerum. (Last's p. 571)"],["The lesser petrosal comes from the facial nerve",0,"From the glossopharyngeal. (Last's p. 571)"],["The lesser petrosal nerve joins the pterygopalatine ganglion",0,"The otic ganglion. (Last's p. 571)"]]},{"id":"sk-58431e73","r":"sk","t":"Abducent nerve","y":1,"d":1,"src":"Last's text","s":"The abducent nerve in the posterior fossa (Last's):","o":[["Emerges near the ventral midline at the pontomedullary junction",1,"Last's. (Last's p. 571)"],["Its long intracranial course makes it vulnerable to raised pressure",1,"Last's. (Last's p. 571)"],["It pierces the dura on the clivus below its origin",0,"Some distance above. (Last's p. 571)"],["It enters the superior petrosal sinus",0,"The inferior petrosal sinus. (Last's p. 571)"]]},{"id":"sk-f40a1e33","r":"sk","t":"Internal acoustic meatus","y":1,"d":1,"src":"Last's text","s":"The internal acoustic meatus (Last's):","o":[["The cochlea lies in front of the vestibule",1,"Last's. (Last's p. 572)"],["The facial nerve pierces the front of the upper part",1,"Last's. (Last's p. 572)"],["The vestibular nerve pierces the front of the lower part",0,"The cochlear nerve does; the vestibular pierces posteriorly. (Last's p. 572)"],["Inner dura is separate from the meatal endosteum",0,"It is fused with it throughout. (Last's p. 572)"]]},{"id":"sk-f57ba8f8","r":"sk","t":"Petrous bone","y":1,"d":1,"src":"Last's text","s":"The posterior surface of the petrous bone:","o":[["The subarcuate fossa lodges the flocculus in the neonate",1,"Last's. (Last's p. 572)"],["The endolymphatic sac lies beneath the inner layer of dura",1,"Last's. (Last's p. 572)"],["The subarcuate fossa lies medial to the internal meatus",0,"Lateral. (Last's p. 572)"],["The vestibular aqueduct opens medial to the internal meatus",0,"Further laterally. (Last's p. 572)"]]},{"id":"sk-97a56f92","r":"sk","t":"Jugular foramen","y":1,"d":1,"src":"Last's text","s":"The jugular foramen (Last's):","o":[["It is divided by two dural septa that may ossify",1,"Last's. (Last's p. 572)"],["IX and X and XI pass laterally behind the jugular tubercle",1,"In that order. (Last's p. 572)"],["The vagus lies lateral to the accessory nerve",0,"The accessory lies lateral to the vagus. (Last's p. 572)"],["The inferior petrosal sinus groove enters ing overlies the squamous temporal; in the temporal fossa the squamous overlaps. (Last's p. 644-5)"],["The asterion is where coronal and squamosal sutures meet",0,"It is where parietal, temporal (mastoid) and occipital meet. (Last's p. 644-5)"]]},{"id":"sk-2f05002c","r":"sk","t":"Lateral skull","y":1,"d":1,"src":"Last's text","s":"The temporal fossa and lines:","o":[["Temporalis fascia attaches to the superior line and the strip between the lines",1,"Last's. (Last's p. 645)"],["The inferior temporal line runs into the suprameatal crest",1,"Last's. (Last's p. 645)"],["The infratemporal crest is level with the lower border of the zygomatic arch",0,"With the upper border. (Last's p. 645)"],["The anterior wall of the temporal fossa is perforated by the zygomaticofacial nerve",0,"By the zygomaticotemporal nerve. (Last's p. 645)"]]},{"id":"sk-265fc23f","r":"sk","t":"Zygomatic arch","y":1,"d":1,"src":"Last's text","s":"The zygomatic arch (Last's):","o":[["The temporal and zygomatic processes meet near the front of the arch",1,"Last's. (Last's p. 646)"],["The deep head of masseter arises from the medial surface of the arch",1,"Last's. (Last's p. 646)"],["The temporomandibular ligament attaches to the medial surface of the articular tubercle",0,"To the lateral surface. (Last's p. 646)"],["The auriculotemporal nerve crosses the arch in front of the zygomatic branches of VII",0,"It crosses just in front of the EAM, behind them. (Last's p. 646)"]]},{"id":"sk-48452e35","r":"sk","t":"Maxilla","y":1,"d":1,"src":"Last's text","s":"The lateral view of the maxilla and zygomatic bone:","o":[["Zygomaticus minor arises from the zygomaticomaxillary suture",1,"Last's. (Last's p. 647)"],["The pyramidal process of the palatine is wedged between maxilla and lateral pterygoid plate",1,"Last's. (Last's p. 647)"],["Buccinator arises from the alveolar margin of the maxilla",0,"From a line well above the alveolar bone. (Last's p. 647)"],["The pterygomaxillary ligament runs from the tuberosity to
