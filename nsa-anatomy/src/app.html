<meta charset="utf-8">
<title>NSA Anatomy Bank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: a single study column (max 46rem) under a sticky tab bar; panels swap in place. */
:root {
  --bg: #eef1f3;
  --surface: #ffffff;
  --sunk: #e4e9ec;
  --ink: #18212b;
  --muted: #56626e;
  --line: #d3dae0;
  --accent: #1d5c9e;
  --accent-ink: #ffffff;
  --true: #1b7543;
  --true-bg: #e2f2e8;
  --false: #b1271d;
  --false-bg: #f8e3e1;
  --flag: #a8660f;
  --fb-bg: #fcf3d4;
  --fb-ink: #3b3216;
  --part: #e8973a;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1318; --surface: #161d24; --sunk: #1d252e; --ink: #e5e9ed; --muted: #9ba6b2; --line: #2b3540;
    --accent: #6ea8f0; --accent-ink: #0b1622; --true: #5cc98d; --true-bg: #143223; --false: #ff8578; --false-bg: #3a1916; --flag: #e5ae4c; --fb-bg: #3a3218; --fb-ink: #f1e7c4; --part: #e5a14c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1318; --surface: #161d24; --sunk: #1d252e; --ink: #e5e9ed; --muted: #9ba6b2; --line: #2b3540;
  --accent: #6ea8f0; --accent-ink: #0b1622; --true: #5cc98d; --true-bg: #143223; --false: #ff8578; --false-bg: #3a1916; --flag: #e5ae4c; --fb-bg: #3a3218; --fb-ink: #f1e7c4; --part: #e5a14c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 46rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { padding-block: 14px 10px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 1.45rem; margin: 0; letter-spacing: 0.005em; text-wrap: balance; }
.meta { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.sync { margin-left: auto; font-size: 0.78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.on i { background: var(--true); }
.tally { display: inline-flex; align-items: center; justify-content: flex-end; gap: 6px; }
.arrow { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; min-width: 36px; min-height: 32px; font: inherit; font-size: 1.15rem; line-height: 1; cursor: pointer; }
.arrow:disabled { opacity: 0.35; cursor: default; }
.tree-wrap { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: center; }
.tree-wrap svg { width: 100%; height: auto; display: block; }
@media (max-width: 640px) { .tree-wrap { grid-template-columns: 1fr; } }
.stage { font-size: 1.35rem; font-weight: 800; margin: 0; }
.stats-mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.stats-mini div { border: 1px solid var(--line); border-radius: 10px; padding: 8px; text-align: center; }
.stats-mini b { display: block; font-size: 1.25rem; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.82rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
.theme-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 0.8rem; cursor: pointer; min-height: 32px; align-self: center; }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
nav.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { flex: 1 0 auto; background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 8px 9px; font: inherit; font-size: 0.95rem; color: var(--muted); cursor: pointer; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }
@media (max-width: 420px) { nav.tabs button { padding-inline: 5px; font-size: 0.88rem; } }
main .wrap { padding-block: 16px 64px; display: flex; flex-direction: column; gap: 14px; }
section[hidden] { display: none !important; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--sunk); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 0.88rem; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; }
.chip small { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] small { color: inherit; opacity: 0.85; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.grow { flex: 1 1 auto; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 10px 16px; font: inherit; font-weight: 700; cursor: pointer; min-height: 44px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.small { padding: 6px 12px; min-height: 36px; font-size: 0.88rem; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
select, input[type="number"] { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-height: 44px; }
.count { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
details.filters summary { cursor: pointer; font-weight: 700; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
details.filters summary::-webkit-details-marker { display: none; }
details.filters summary::after { content: "Filters ▾"; font-weight: 400; color: var(--muted); font-size: 0.9rem; }
details.filters[open] summary::after { content: "Hide ▴"; }
.filter-body { display: flex; flex-direction: column; gap: 14px; margin-top: 12px; }

.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.q-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 0.82rem; color: var(--muted); }
.tag { border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; font-weight: 700; color: var(--ink); background: var(--sunk); }
.q-head .flagged { color: var(--flag); font-weight: 700; }
.tag.hard { color: var(--false); border-color: currentColor; background: transparent; }
.tag.sample { color: var(--true); border-color: currentColor; background: transparent; }
.report-q { padding: 10px 0; border-top: 1px solid var(--line); }
.report-q:first-of-type { border-top: 0; }
.report-q ul { margin: 6px 0 0; padding-left: 1.1rem; }
.report-q li { margin: 4px 0; }
textarea.copy { width: 100%; min-height: 8rem; font: inherit; font-size: 0.85rem; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); color: var(--ink); padding: 8px; }
.stem { padding: 14px 16px 4px; font-size: 1.08rem; font-weight: 700; text-wrap: pretty; }
ol.opts { list-style: none; margin: 0; padding: 6px 0 4px; }
ol.opts li { padding: 10px 16px; border-top: 1px solid transparent; }
ol.opts li + li { border-top-color: var(--line); }
.opt-row { display: flex; gap: 12px; align-items: flex-start; }
.opt-n { flex: 0 0 auto; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 1px; }
.opt-text { flex: 1 1 auto; min-width: 0; }
.tf { display: flex; gap: 6px; flex: 0 0 auto; }
.tf button { min-width: 3rem; min-height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; }
.tf button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.tf button:disabled { cursor: default; }
li.ok { background: var(--true-bg); }
li.bad { background: var(--false-bg); }
.verdict { margin-top: 6px; font-size: 0.92rem; }
.verdict b.t { color: var(--true); }
.verdict b.f { color: var(--false); }
.expl { color: var(--ink); opacity: 0.88; font-size: 0.93rem; margin-top: 4px; }
.key { margin: 4px 16px 12px; padding: 10px 12px; background: var(--sunk); border-radius: 8px; font-size: 0.88rem; }
.key table { border-collapse: collapse; width: 100%; }
.key td { padding: 2px 6px; vertical-align: top; }
.key td:first-child { font-weight: 700; width: 1.5rem; }
.letters { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 4px 16px 14px; }
.letters button { min-height: 48px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-weight: 700; font-size: 1.1rem; cursor: pointer; }
.letters button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.letters button.right { background: var(--true); color: var(--surface); border-color: var(--true); }
.letters button.wrong { background: var(--false); color: var(--surface); border-color: var(--false); }
.q-head .tally { text-align: right; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.mq { padding: 4px 16px 8px; }
.mq-stem { padding: 14px 0 6px; font-size: 1.05rem; font-weight: 700; text-wrap: pretty; }
.mq-item { padding: 12px 0 14px; border-top: 1px solid var(--line); }
.mq-text { margin-bottom: 8px; text-wrap: pretty; }
.mq-text b { margin-right: 6px; }
.mq-opts { display: flex; flex-direction: column; gap: 2px; }
.mq-opt { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 2px 8px; border-radius: 6px; cursor: pointer; border: 0; background: none; color: var(--ink); font: inherit; text-align: left; width: 100%; }
.mq-opt:hover:not(:disabled) { background: var(--sunk); }
.mq-opt:disabled { cursor: default; }
.mq-radio { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; }
.mq-opt[aria-checked="true"] .mq-radio { border-color: var(--accent); background: var(--accent); }
.mq-opt[aria-checked="true"] .mq-radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-ink); }
.mq-mark { flex: 0 0 1.2rem; font-weight: 700; text-align: center; }
.mq-mark.yes { color: var(--true); }
.mq-mark.no { color: var(--false); }
.mq-list { margin: 0 0 6px; padding-left: 1.6rem; }
.mq-list li { margin: 6px 0; }
.mq-fb { display: flex; gap: 10px; margin-top: 10px; padding-left: 10px; border-left: 3px solid var(--line); }
.mq-fb > .mq-mark { padding-top: 10px; }
.mq-fb-box { flex: 1 1 auto; background: var(--fb-bg); color: var(--fb-ink); padding: 10px 14px; border-radius: 4px; font-size: 0.95rem; }
.mq-fb-box p { margin: 0 0 6px; }
.mq-fb-box p:last-child { margin: 0; }
.q-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--sunk); }
.score { font-weight: 700; font-variant-numeric: tabular-nums; }
.score.full { color: var(--true); }
.score.part { color: var(--flag); }
.score.none { color: var(--false); }
.empty { text-align: center; color: var(--muted); padding: 28px 16px; }
.empty b { color: var(--ink); display: block; font-size: 1.05rem; margin-bottom: 4px; }

.timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.1rem; }
.timer.low { color: var(--false); }
.trend { position: relative; margin-top: 8px; }
.trend svg { width: 100%; height: auto; display: block; overflow: visible; }
.trend .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 0.82rem; box-shadow: 0 2px 8px rgba(0,0,0,.15); white-space: nowrap; transform: translate(-50%, -110%); }
.trend .tip b { display: block; font-size: 0.95rem; }
.trend-table { font-size: 0.85rem; margin-top: 8px; }
.trend-table summary { cursor: pointer; color: var(--muted); }
.bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); }
.grid-nav { display: grid; grid-template-columns: repeat(auto-fill, minmax(2.4rem, 1fr)); gap: 4px; }
.grid-nav button { min-height: 36px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--muted); font: inherit; font-size: 0.82rem; font-variant-numeric: tabular-nums; cursor: pointer; }
.grid-nav button.done { background: var(--sunk); color: var(--ink); font-weight: 700; }
.grid-nav button.cur { outline: 2px solid var(--accent); outline-offset: -2px; color: var(--ink); }
.grid-nav button.ok { background: var(--true-bg); color: var(--true); }
.grid-nav button.bad { background: var(--false-bg); color: var(--false); }
.grid-nav.solid button { color: #fff; border-color: transparent; font-weight: 700; }
.grid-nav.solid button.ok { background: var(--true); }
.grid-nav.solid button.part { background: var(--part); }
.grid-nav.solid button.bad { background: var(--false); }
.grid-nav.solid button.todo { background: var(--surface); color: var(--muted); border-color: var(--line); font-weight: 400; }
.grid-nav.solid button.cur { outline: 3px solid var(--ink); outline-offset: 1px; }
.big { font-family: var(--font-display); font-size: 2.6rem; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.pass { color: var(--true); font-weight: 700; }
.fail { color: var(--false); font-weight: 700; }
table.stats { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
table.stats th { text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; padding: 6px 4px; border-bottom: 1px solid var(--line); }
table.stats td { padding: 8px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; font-variant-numeric: tabular-nums; }
table.stats td.num { text-align: right; white-space: nowrap; }
table.stats td.meter { width: 32%; }
.meterbar { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; display: flex; }
.meterbar span { display: block; height: 100%; }
.meterbar .m-ok { background: var(--true); }
.meterbar .m-bad { background: var(--false); opacity: 0.75; }
.table-scroll { overflow-x: auto; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-height: 14rem; display: flex; flex-direction: column; }
.card-face { padding: 18px 16px; font-size: 1.02rem; overflow-wrap: anywhere; }
.card-face.back { border-top: 1px dashed var(--line); background: var(--sunk); }
.cloze { color: var(--accent); font-weight: 700; }
.cloze-a { color: var(--accent); font-weight: 700; background: color-mix(in srgb, var(--accent) 14%, transparent); border-radius: 3px; padding: 0 2px; }
.fig { color: var(--muted); font-style: italic; font-size: 0.85em; }
.card hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.prose p { margin: 0 0 10px; }
.prose p:last-child { margin-bottom: 0; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border: 1px solid var(--false); border-radius: 8px; background: var(--false-bg); }
@media (max-width: 420px) {
  body { font-size: 16px; }
  .opt-row { flex-wrap: wrap; }
  .tf { width: 100%; justify-content: flex-end; }
  .tf button { flex: 0 0 4.2rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="wrap">
    <h1>NSA Anatomy Bank</h1>
    <span class="meta" id="meta"></span>
    <span class="sync" id="sync" title="Where your progress is saved"><i></i><span>Saved on this device</span></span>
    <button type="button" class="theme-btn" id="theme-btn" aria-label="Colour theme"></button>
  </div>
</header>
<nav class="tabs" aria-label="Sections">
  <div class="wrap" role="tablist">
    <button role="tab" id="tab-home" aria-selected="true" data-view="home">Home</button>
    <button role="tab" id="tab-practice" aria-selected="false" data-view="practice">Practice</button>
    <button role="tab" id="tab-exam" aria-selected="false" data-view="exam">Exam</button>
    <button role="tab" id="tab-cards" aria-selected="false" data-view="cards">Cards</button>
    <button role="tab" id="tab-today" aria-selected="false" data-view="today">Today</button>
    <button role="tab" id="tab-progress" aria-selected="false" data-view="progress">Progress</button>
    <button role="tab" id="tab-format" aria-selected="false" data-view="format">Help</button>
  </div>
</nav>

<main>
  <div class="wrap">
    <section id="view-home">
      <div id="home-area"></div>
    </section>

    <section id="view-practice" hidden>
      <details class="filters panel" id="practice-filters" open>
        <summary><span>Choose questions <span class="count" id="practice-count"></span></span></summary>
        <div class="filter-body">
          <div><p class="label">Region</p><div class="chips" id="practice-regions"></div></div>
          <div><p class="label">Question type</p><div class="chips" id="practice-types"></div></div>
          <div><p class="label">Difficulty</p><div class="chips" id="practice-diff"></div></div>
          <div><p class="label">Source</p><div class="chips" id="practice-source"></div></div>
          <div><p class="label">Block size</p><div class="chips" id="practice-size"></div></div>
          <div><p class="label">Show</p><div class="chips" id="practice-status"></div></div>
          <div class="row"><button class="btn primary" id="practice-start">Start practice</button><span class="count" id="practice-hint"></span></div>
        </div>
      </details>
      <div id="practice-area"></div>
    </section>

    <section id="view-exam" hidden>
      <div id="exam-area"></div>
    </section>

    <section id="view-cards" hidden>
      <div class="panel">
        <p class="label">Region</p>
        <div class="chips" id="card-regions"></div>
        <p class="count" id="card-count" style="margin:10px 0 0"></p>
      </div>
      <div id="card-area"></div>
    </section>

    <section id="view-today" hidden>
      <div id="today-area"></div>
    </section>

    <section id="view-progress" hidden>
      <div id="progress-area"></div>
    </section>

    <section id="view-format" hidden>
      <div class="panel prose" id="format-area"></div>
    </section>
  </div>
</main>

<script>
/* ---------- theme ---------- */
(function () {
  const order = ['auto', 'light', 'dark'];
  const labels = { auto: 'Theme: auto', light: 'Theme: light', dark: 'Theme: dark' };
  let mode = 'auto';
  try { mode = localStorage.getItem('nsa-theme') || 'auto'; } catch (e) { /* storage unavailable */ }
  const apply = () => {
    if (mode === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', mode);
    const btn = document.getElementById('theme-btn');
    if (btn) { btn.textContent = labels[mode]; btn.title = 'Switch between automatic, light and dark'; }
  };
  apply();
  document.addEventListener('click', (e) => {
    if (!e.target.closest || !e.target.closest('#theme-btn')) return;
    mode = order[(order.indexOf(mode) + 1) % order.length];
    try { localStorage.setItem('nsa-theme', mode); } catch (err) { /* ignore */ }
    apply();
  });
})();

const DATA = /*__DATA__*/null;
const EXAM_DATE = new Date('2027-02-19T09:00:00+11:00');
const STORE_KEY = 'nsa-anatomy-bank-v1';
const KEY_TEXT = { A: '1 is the only correct response', B: '2 and 4 are the only correct responses', C: '1, 2 and 3 are the only correct responses', D: '4 is the only correct response', E: 'All responses are correct' };
const T1_LABELS = ['A', 'B', 'C', 'D'];
const REGION = Object.fromEntries(DATA.regions.map((r) => [r.code, r.name]));
const QBYID = Object.fromEntries(DATA.questions.map((q) => [q.id, q]));
const CBYID = Object.fromEntries(DATA.cards.map((c) => [c.id, c]));

const $ = (sel, el = document) => el.querySelector(sel);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;

function dayReport(day) {

    const q = QBYID[id];

      q.o.forEach((o, i) => {
        const yours = rec.a[i];
        const right = o[1] ? 'T' : 'F';
        if (yours !== right) lines.push({ label: T1_LABELS[i], text: o[0], answer: o[1] ? 'True' : 'False', yours: yours === '?' ? 'blank' : (yours === 'T' ? 'True' : 'False'), why: plainWhy(o[2]) });

  if (wrong.length) {

/* ---------- Anki export ---------- */
function mistakesFor(days) {
  const byId = new Map();
  for (const day of days) {
    for (const [id, rec] of Object.entries((state.h || {})[day] || {})) {
      const q = QBYID[id];
      if (!q || rec.s === 1) continue;
      const m = byId.get(id) || { q, idx: new Set() };
      if (q.y === 1) q.o.forEach((o, i) => { if (rec.a[i] !== (o[1] ? 'T' : 'F')) m.idx.add(i); });
      byId.set(id, m);
    }
  }
  return [...byId.values()];
}
function ankiFile(mistakes) {

  const tag = (t) => t.replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '');
  const rows = [];
  for (const { q, idx } of mistakes) {
    const tags = `NSA ${tag(REGION[q.r])} ${tag(q.t)}`;
    if (q.y === 1) {
      for (const i of [...idx].sort()) {
        const o = q.o[i];
        rows.push([`${esc(q.s)}<br><br><b>True or false?</b> ${esc(o[0])}`, `<b>${o[1] ? 'True' : 'False'}</b><br>${esc(plainWhy(o[2]))}`, tags, `nsa-${q.id}-${i}`]);
      }
    } else {
      const front = `${esc(q.s)}<br>${q.o.map((o, i) => `${i + 1}. ${esc(o[0])}`).join('<br>')}<br><br><small>${Object.entries(KEY_TEXT).map(([k, v]) => `${k}: ${esc(v)}`).join('<br>')}</small>`;
      const back = `<b>${q.k}: ${esc(KEY_TEXT[q.k])}</b><br>${q.o.map((o, i) => `${i + 1}. ${o[1] ? 'True' : 'False'}: ${esc(plainWhy(o[2]))}`).join('<br>')}`;
      rows.push([front, back, tags, `nsa-${q.id}`]);
    }
  }
  const head = ['#separator:tab', '#html:true', '#notetype:Basic', '#deck:NSA anatomy mistakes', '#tags column:3', '#guid column:4'];

}
async function downloadAnki(days, label, statusEl) {

  const dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads').catch(() => null) : null;
  try {

}

    pts.forEach((p, i) => { if (Math.abs(x(i) - sx) < Math.abs(x(best) - sx)) best = i; });

  };

  svg.addEventListener('pointerdown', (e) => showAt(e.clientX));

  panel.append(
    h('p', { class: 'count', style: 'margin:6px 0 0', text: `Last 7 study days: ${pct(avg7)} on ${last7.reduce((a, p) => a + p.n, 0)} questions` }),

    h('details', { class: 'trend-table' }, h('summary', { text: 'Show as table' }),
      h('div', { class: 'table-scroll' }, h('table', { class: 'stats' }, h('tr', {}, h('th', { text: 'Day' }), h('th', { text: 'Questions' }), h('th', { text: 'Score' })),
        ...pts.slice().reverse().map((p) => h('tr', {}, h('td', { text: nice(p.day, true) }), h('td', { class: 'num', text: String(p.n) }), h('td', { class: 'num', text: pct(p.avg) })))))));

}

/* ---------- home: the tree ---------- */
// A fixed, seeded tree skeleton; how much of it shows depends on how many questions you have tried.
const treeDepth = (g) => 1 + 7.5 * Math.sqrt(g);
const TREE = (() => {
  let seed = 20270219;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const branches = [];
  const grow = (x, y, ang, len, w, d) => {
    const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
    branches.push({ x, y, x2, y2, w, d, ang });
    if (d >= 8) return;
    const kids = d >= 2 && d <= 5 && rnd() < 0.35 ? 3 : 2;
    for (let k = 0; k < kids; k++) {
      const spread = kids === 3 ? (k - 1) * 0.5 : (k ? 1 : -1) * (0.32 + rnd() * 0.22);
      grow(x2, y2, ang + spread + (rnd() - 0.5) * 0.25, len * (0.72 + rnd() * 0.1), Math.max(0.8, w * 0.68), d + 1);
    }
  };
  grow(200, 330, -Math.PI / 2, 68, 15, 0);
  const n = DATA.questions.length;
  const leaves = [];
  for (let i = 0; i < n; i++) {
    const top = Math.max(0, Math.floor(treeDepth((i + 1) / n)) - 1);
    const pool = branches.filter((b) => b.d <= top && b.d >= top - 1);
    const b = pool[Math.floor(rnd() * pool.length)] || branches[0];
    const u = 0.45 + rnd() * 0.55, off = (rnd() - 0.5) * 14;
    leaves.push({ x: b.x + (b.x2 - b.x) * u - Math.sin(b.ang) * off, y: b.y + (b.y2 - b.y) * u + Math.cos(b.ang) * off, rot: Math.round(rnd() * 180), s: 0.8 + rnd() * 0.5 });
  }
  return { branches, leaves };
})();
const STAGES = [[0, 'Seed'], [0.005, 'Sprout'], [0.05, 'Seedling'], [0.15, 'Sapling'], [0.3, 'Young tree'], [0.5, 'Growing tree'], [0.75, 'Mature tree'], [1, 'Ancient tree']];
function treeSvg(tried) {
  const n = DATA.questions.length, g = tried.length / n;
  const L = treeDepth(g);
  const parts = ['<ellipse cx="200" cy="334" rx="150" ry="14" fill="var(--true-bg)"/><path d="M60 334 Q200 318 340 334" fill="none" stroke="var(--true)" stroke-opacity=".35" stroke-width="2"/>'];
  if (!tried.length) parts.push('<ellipse cx="200" cy="326" rx="7" ry="5" fill="#8a5a33"/>');
  else {
    for (const b of TREE.branches) {
      if (b.d >= L) continue;
      const f = Math.min(1, L - b.d);
      parts.push(`<line x1="${b.x.toFixed(1)}" y1="${b.y.toFixed(1)}" x2="${(b.x + (b.x2 - b.x) * f).toFixed(1)}" y2="${(b.y + (b.y2 - b.y) * f).toFixed(1)}" stroke="#7a4f2c" stroke-width="${(b.w * (0.4 + 0.6 * Math.min(1, g * 2.5))).toFixed(1)}" stroke-linecap="round"/>`);
    }
    const colour = (s) => (s === 1 ? 'var(--true)' : s === 0 ? '#d9822b' : '#9bc23c');
    tried.forEach((t, i) => {
      const lf = TREE.leaves[i];
      parts.push(`<ellipse cx="${lf.x.toFixed(1)}" cy="${lf.y.toFixed(1)}" rx="${(4.6 * lf.s).toFixed(1)}" ry="${(2.6 * lf.s).toFixed(1)}" transform="rotate(${lf.rot} ${lf.x.toFixed(1)} ${lf.y.toFixed(1)})" fill="${colour(t.s)}" fill-opacity=".9"/>`);
    });
    const fruit = Math.floor(tried.filter((t) => t.s === 1).length / 50);
    for (let k = 0; k < fruit; k++) {
      const lf = TREE.leaves[(k * 97 + 13) % Math.max(1, tried.length)];
      parts.push(`<circle cx="${lf.x.toFixed(1)}" cy="${(lf.y + 4).toFixed(1)}" r="5" fill="#e0b324" stroke="#9a7410" stroke-width="1"/>`);
    }
  }

}
function studyStreak() {
  const days = new Set(Object.keys(state.h || {}).filter((d) => Object.keys(state.h[d]).length));
  let streak = 0;
  const d = new Date();
  if (!days.has(dayKey(d.getTime()))) d.setDate(d.getDate() - 1);
  while (days.has(dayKey(d.getTime()))) { streak++; d.setDate(d.getDate() - 1); }
  return streak;
}
function renderHome() {
  const n = DATA.questions.length;

  let stage = STAGES[0], next = null;

  const full = tried.filter((t) => t.s === 1).length;

    h('div', { class: 'tree-wrap' },

          h('span', {}, h('i', { style: 'background:#e0b324' }), `fruit: every 50 fully correct (${Math.floor(full / 50)})`)),
        h('p', { class: 'count', style: 'margin:8px 0 12px', text: 'Each new question you try adds a leaf, coloured by your first attempt. Repeats do not grow the tree.' }),
        h('div', { class: 'row' },

          h('button', { class: 'btn', text: 'Mock exam', onclick: () => show('exam') }))))));
}
